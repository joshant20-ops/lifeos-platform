services:
  finance:
    image: python:3.12-slim
    working_dir: /app
    command: python -m governor.personal_finance_web
    environment:
      LIFEOS_FINANCE_DB: /data/personal-finance.sqlite3
      PORT: "8080"
    volumes:
      - ../../:/app:ro
      - finance-data:/data
    ports:
      - "127.0.0.1:18080:8080"
    restart: unless-stopped
volumes:
  finance-data:
