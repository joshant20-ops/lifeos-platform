name: LifeOS Personal Information P2 Deterministic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'homelab/live/home/joshan/automation/lifeos_pip_deterministic.py'
      - '.github/workflows/lifeos-pip-p2-deterministic.yml'

permissions:
  contents: read

jobs:
  deterministic-read-only-sample:
    runs-on: [self-hosted, lifeos-pi5]
    timeout-minutes: 15
    steps:
      - name: Reconcile clean canonical checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          repo=/home/joshan/lifeos-platform
          git -C "$repo" fetch origin main
          test -z "$(git -C "$repo" status --porcelain)"
          test "$(git -C "$repo" rev-parse HEAD)" = "$(git -C "$repo" merge-base HEAD origin/main)"
          git -C "$repo" merge --ff-only origin/main
          echo 'CANONICAL_CHECKOUT=PASS'

      - name: Process representative Paperless sample read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          repo=/home/joshan/lifeos-platform
          LIFEOS_CANONICAL_REVISION="$(git -C "$repo" rev-parse HEAD)" \
            python3 "$repo/homelab/live/home/joshan/automation/lifeos_pip_deterministic.py" \
              --live --sample-size 96 | tee /tmp/lifeos-pip-p2.txt
          for marker in \
            'LOGICAL_RERUN_IDENTICAL=PASS' 'STAGING_PERSISTED=NONE' \
            'AI_USED=NONE' 'CLOUD_CONTENT_SENT=NONE' 'PAPERLESS_MUTATION=NONE' \
            'PRIVATE_FIELDS_EMITTED=NONE' 'PRIVACY_LOCAL_ONLY=PASS' 'RESULT=PASS'; do
            grep -qx "$marker" /tmp/lifeos-pip-p2.txt
          done

      - name: Verify clean canonical checkout
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(git -C /home/joshan/lifeos-platform status --porcelain)"
          rm -f /tmp/lifeos-pip-p2.txt
          echo 'CANONICAL_CLEAN=PASS'
