name: LifeOS P6-P10 Final Gated Acceptance
on:
  push:
    branches: [main]
    paths: ['scripts/lifeos-pip-p6-p10-final-acceptance.py']
  workflow_dispatch:
concurrency:
  group: lifeos-pip-final-acceptance
  cancel-in-progress: false
jobs:
  gated:
    runs-on: [self-hosted, lifeos-pi5]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile canonical checkout
        run: |
          repo=/home/joshan/lifeos-platform
          git -C "$repo" fetch origin main
          test -z "$(git -C "$repo" status --porcelain)"
          git -C "$repo" merge --ff-only origin/main
      - name: P6 through P10 sequential final acceptance
        run: python3 /home/joshan/lifeos-platform/scripts/lifeos-pip-p6-p10-final-acceptance.py
      - name: Canonical clean
        if: always()
        run: |
          test -z "$(git -C /home/joshan/lifeos-platform status --porcelain)"
          echo CANONICAL_CLEAN=PASS
