name: LifeOS #801 Temporary Acceptance
# rerun-after-live-governor-deploy: 8
on:
  push:
    branches: [main]
    paths:
      - 'scripts/lifeos-ots-purge-gated-runner.sh'
      - 'scripts/lifeos-semaphore-terminal-observer.sh'
      - 'governor/ha_issue_queue_bridge.py'
      - 'tests/test_bounded_deployment_broker.py'
      - 'tests/test_privileged_target_identity.py'
      - '.github/workflows/lifeos-801-temporary-acceptance.yml'
      - '.github/workflows/lifeos-ots-purge-gated-runner.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lifeos-801-temporary-acceptance
  cancel-in-progress: false
jobs:
  gated-audit:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 12
    steps:
      - name: Sync canonical checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git merge --ff-only origin/main
          test -z "$(git status --porcelain)"
          echo "ACCEPTANCE_CHECKOUT_HEAD=$(git rev-parse HEAD)"
      - name: Run every independent gate
        id: gates
        continue-on-error: true
        shell: bash
        run: |
          cd /home/joshan/lifeos-platform
          # Use the exact checkout already reconciled by the preceding step.
          # A second network fetch made acceptance depend on transient DNS and could
          # silently move the tested revision after the run had started.
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "ACCEPTANCE_GATE_HEAD=$(git rev-parse HEAD)"
          grep -q 'gate 801-06 ' scripts/lifeos-ots-purge-gated-runner.sh
          rm -rf /tmp/lifeos-ots-purge-gates
          bash scripts/lifeos-ots-purge-gated-runner.sh
      - name: Publish consolidated evidence
        if: always()
        shell: bash
        run: |
          set -u
          echo '### OTS purge gated audit' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f /tmp/lifeos-ots-purge-gates/summary.tsv ]]; then
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/lifeos-ots-purge-gates/summary.tsv >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "GATED_STEP_OUTCOME=${{ steps.gates.outcome }}" | tee -a "$GITHUB_STEP_SUMMARY"
          # The workflow itself stays green so faults do not halt the serial purge.
          # FINAL_ACCEPTANCE inside the evidence remains fail-closed.
          echo 'BATCH_CONTINUATION=ENABLED'
