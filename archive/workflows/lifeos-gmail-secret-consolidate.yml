name: LifeOS Gmail Secret Consolidation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-gmail-secret-consolidate.yml'
  workflow_run:
    workflows: ['LifeOS Finalize Validated 8192 Context']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consolidate:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 20
    steps:
      - name: Safely synchronize canonical Pi checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          repo=/home/joshan/lifeos-platform
          cd "$repo"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch --prune origin main
          current=$(git rev-parse HEAD)
          target=$(git rev-parse origin/main)
          git merge-base --is-ancestor "$current" "$target"
          git merge --ff-only origin/main
          test "$(git rev-parse HEAD)" = "$target"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'CANONICAL_SYNC=PASS'

      - name: Migrate existing Gmail IMAP credential locally
        shell: bash
        run: |
          set -Eeuo pipefail
          src=/home/joshan/automation/secrets/email_oauth/email_imap_accounts.env
          sudo -n test -f "$src"
          sudo -n python3 - <<'PY'
          import os, stat, tempfile
          from pathlib import Path
          src = Path('/home/joshan/automation/secrets/email_oauth/email_imap_accounts.env')
          dst = Path('/etc/lifeos/secrets')
          values = {}
          for raw in src.read_text(encoding='utf-8', errors='strict').splitlines():
              line = raw.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              values[key.strip()] = value.strip()
          user = values.get('EMAIL_1_ADDRESS', '')
          password = values.get('EMAIL_1_PASSWORD', '')
          if not user or not password or 'HERE' in user or 'HERE' in password:
              raise SystemExit('canonical source credential unavailable')
          dst.mkdir(parents=True, exist_ok=True)
          os.chmod(dst, 0o700)
          def write_secret(name, value):
              target = dst / name
              fd, temporary = tempfile.mkstemp(prefix='.' + name + '.', dir=dst)
              try:
                  os.write(fd, (value + '\n').encode())
                  os.fsync(fd)
              finally:
                  os.close(fd)
              os.chmod(temporary, 0o600)
              os.chown(temporary, 0, 0)
              os.replace(temporary, target)
          write_secret('gmail-imap-user', user)
          write_secret('gmail-imap-password', password)
          for name in ('gmail-imap-user', 'gmail-imap-password'):
              secret = dst / name
              metadata = secret.stat()
              assert stat.S_IMODE(metadata.st_mode) == 0o600
              assert metadata.st_uid == 0 and metadata.st_gid == 0
              assert secret.read_text().strip()
          print('CANONICAL_GMAIL_IMAP_SECRETS=PASS')
          print('SECRET_VALUES_EXPOSED=NO')
          PY

      - name: Ensure least-privilege Paperless adapter token
        shell: bash
        run: |
          set -Eeuo pipefail
          container=paperless-paperless-1
          output=$(mktemp)
          keyfile=$(mktemp)
          trap 'rm -f "$output" "$keyfile"' EXIT
          docker exec -i "$container" python3 manage.py shell <<'PY' >"$output"
          from django.contrib.auth import get_user_model
          from django.contrib.auth.models import Permission
          from rest_framework.authtoken.models import Token
          User = get_user_model()
          user, _ = User.objects.get_or_create(
              username='lifeos-pa-adapter',
              defaults={'is_active': True, 'is_staff': False, 'is_superuser': False},
          )
          user.is_active = True
          user.is_staff = False
          user.is_superuser = False
          user.set_unusable_password()
          user.save()
          permissions = Permission.objects.filter(
              content_type__app_label='documents',
              codename__in=['add_document', 'view_document', 'change_document', 'delete_document'],
          )
          assert permissions.count() == 4
          user.user_permissions.set(permissions)
          token, _ = Token.objects.get_or_create(user=user)
          print(token.key)
          PY
          tail -n 1 "$output" >"$keyfile"
          grep -Eq '^[0-9a-f]{40}$' "$keyfile"
          sudo -n install -m 0600 -o root -g root "$keyfile" /etc/lifeos/secrets/paperless-api-token
          sudo -n stat -c '%a %u %g' /etc/lifeos/secrets/paperless-api-token | grep -qx '600 0 0'
          echo 'PAPERLESS_ADAPTER_TOKEN=LEAST_PRIVILEGE_READY'
          echo 'SECRET_VALUES_EXPOSED=NO'

      - name: Prove canonical Wave B adapter credential path
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n test -s /etc/lifeos/secrets/gmail-imap-user
          sudo -n test -s /etc/lifeos/secrets/gmail-imap-password
          sudo -n test -s /etc/lifeos/secrets/paperless-api-token
          args=(
            --quiet --wait --pipe --collect
            --unit=lifeos-pa-selective-acceptance
            --property=User=joshan
            --property=WorkingDirectory=/home/joshan/lifeos-platform
            --property=LoadCredential=gmail-imap-user:/etc/lifeos/secrets/gmail-imap-user
            --property=LoadCredential=gmail-imap-password:/etc/lifeos/secrets/gmail-imap-password
            --property=LoadCredential=paperless-api-token:/etc/lifeos/secrets/paperless-api-token
          )
          sudo -n systemd-run "${args[@]}" /usr/bin/python3 /home/joshan/lifeos-platform/homelab/live/home/joshan/automation/lifeos_email_paperless_selective.py acceptance
          echo 'WAVE_B_CANONICAL_CREDENTIAL_ACCEPTANCE=PASS'

      - name: Resume Wave B mission after credential acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          /home/joshan/.local/bin/lifeos-pa-mission resume
          echo 'WAVE_B_MISSION_RESUME=PASS'

      - name: Verify repository and secret boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          test -z "$(git status --porcelain --untracked-files=all)"
          sudo -n stat -c '%a %u %g' /etc/lifeos/secrets/gmail-imap-user | grep -qx '600 0 0'
          sudo -n stat -c '%a %u %g' /etc/lifeos/secrets/gmail-imap-password | grep -qx '600 0 0'
          sudo -n stat -c '%a %u %g' /etc/lifeos/secrets/paperless-api-token | grep -qx '600 0 0'
          echo 'CONSOLIDATION_RESULT=PASS'

      - name: Surface sanitized mission bundle
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          state=/home/joshan/.local/state/lifeos-pa-autonomy
          if [[ -f "$state/WORK_BUNDLE.md" ]]; then
            echo '--- WORK_BUNDLE.md ---'
            cat "$state/WORK_BUNDLE.md"
          fi
          if [[ -f "$state/SUMMARY.md" ]]; then
            echo '--- SUMMARY.md ---'
            cat "$state/SUMMARY.md"
          fi
