name: LifeOS Email Final and Paperless AI Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-email-final-and-paperless-ai-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 8
    steps:
      - name: Inspect remaining email readers
        shell: bash
        run: |
          set -Eeuo pipefail
          present=0
          for f in \
            /home/joshan/automation/scripts/lifeos_email_phase1_daily_window_v1.py \
            /home/joshan/automation/scripts/lifeos_email_phase3_limited_body_extract_v1.py; do
            if test -f "$f"; then
              echo "EMAIL_READER_PRESENT=$(basename "$f")"
              present=1
            else
              echo "EMAIL_READER_ABSENT=$(basename "$f")"
            fi
          done
          test "$present" -eq 0
          echo 'LEGACY_PHASE1_PHASE3=RETIRED_OR_ABSENT'

      - name: Inspect Paperless to local AI integration
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== PAPERLESS AI SIDECARS ==='
          docker ps --format '{{.Names}}' | grep -Ei 'paperless.*(ai|gpt)|(?:ai|gpt).*paperless' || true

          echo '=== PAPERLESS DIRECT AI ENV ==='
          direct=$(docker inspect paperless-paperless-1 --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | cut -d= -f1 | grep -Ei 'OLLAMA|OPENAI|LLM|AI_MODEL|MODEL_PROVIDER' || true)
          if test -n "$direct"; then
            echo "$direct"
            echo 'PAPERLESS_DIRECT_LLM_CONFIG=FOUND'
          else
            echo 'PAPERLESS_DIRECT_LLM_CONFIG=ABSENT'
          fi

          echo '=== LIFEOS PAPERLESS READ PATH ==='
          test -f /home/joshan/automation/lifeos_ask/lifeos_local_paperless_lookup.py \
            && echo 'PAPERLESS_READ_ADAPTER=PRESENT'
          if grep -q 'LOCAL_OLLAMA = None' /home/joshan/automation/lifeos_ask/lifeos_ask_processor.py 2>/dev/null; then
            echo 'ASK_DIRECT_OLLAMA=PARKED'
          fi

          echo '=== GOVERNOR LOCAL AI SMOKE ==='
          cd /home/joshan/lifeos-platform
          timeout 210 python3 - <<'PY'
          import json
          from governor.ai_broker import _ollama, OLLAMA_MODEL
          out=_ollama('Return only JSON: {"status":"ok","purpose":"paperless-ai-audit"}', OLLAMA_MODEL)
          text=out if isinstance(out,str) else json.dumps(out)
          assert 'ok' in text.lower(), text[:200]
          print('LOCAL_AI_RESPONSE_RECEIVED=PASS')
          PY

          echo 'RESULT=PASS'
