name: LifeOS P5 Final Acceptance
on:
  push:
    branches: [main]
    paths: ['scripts/lifeos-pip-p5-final-acceptance.py']
  workflow_dispatch:
concurrency:
  group: lifeos-p5-state
  cancel-in-progress: false
jobs:
  accept:
    runs-on: [self-hosted, lifeos-pi5]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile canonical checkout
        run: |
          repo=/home/joshan/lifeos-platform
          git -C "$repo" fetch origin main
          test -z "$(git -C "$repo" status --porcelain)"
          git -C "$repo" merge --ff-only origin/main
      - name: Reconcile and accept P5
        run: python3 /home/joshan/lifeos-platform/scripts/lifeos-pip-p5-final-acceptance.py
      - name: Prove empty semantic rerun
        run: python3 /home/joshan/lifeos-platform/scripts/lifeos-pip-p5-semantic-batch.py --limit 50 --drain
      - name: Verify canonical clean
        if: always()
        run: |
          test -z "$(git -C /home/joshan/lifeos-platform status --porcelain)"
          echo CANONICAL_CLEAN=PASS
