name: LifeOS P3 Paperless Native Canary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/lifeos-pip-p3-paperless-canary.py'
      - 'scripts/lifeos-pip-p3-paperless-canary.sh'
      - 'tests/test_pip_p3_paperless_canary.py'
      - '.github/workflows/lifeos-pip-p3-paperless-canary.yml'

permissions:
  contents: read

jobs:
  p3-native-canary:
    runs-on: [self-hosted, lifeos-pi5]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Contract tests
        run: python3 -m pytest -q tests/test_pip_p3_paperless_canary.py tests/test_pip_p2_paperless_shadow.py
      - name: Reconcile canonical checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          repo=/home/joshan/lifeos-platform
          git -C "$repo" fetch origin main
          test -z "$(git -C "$repo" status --porcelain)"
          git -C "$repo" merge --ff-only origin/main
          test "$(git -C "$repo" rev-parse HEAD)" = "$(git -C "$repo" rev-parse origin/main)"
          echo CANONICAL_CHECKOUT=PASS
      - name: Reversible native Paperless canary
        run: bash /home/joshan/lifeos-platform/scripts/lifeos-pip-p3-paperless-canary.sh
      - name: Verify canonical clean
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(git -C /home/joshan/lifeos-platform status --porcelain)"
          echo CANONICAL_CLEAN=PASS
