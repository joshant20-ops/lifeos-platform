name: LifeOS P5 Native Backlog Inventory
on:
  push:
    branches: [main]
    paths:
      - 'scripts/lifeos-pip-p5-native-inventory.py'
      - 'scripts/lifeos-pip-p5-inventory-runner.py'
  workflow_dispatch:
concurrency:
  group: lifeos-p5-state
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: [self-hosted, lifeos-pi5]
    steps:
      - uses: actions/checkout@v4
      - name: P5 tests
        run: python3 -m pytest -q tests/test_pip_p5_backlog_state.py
      - name: Reconcile canonical checkout
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          repo=/home/joshan/lifeos-platform
          git -C "$repo" fetch origin main
          test -z "$(git -C "$repo" status --porcelain)"
          git -C "$repo" merge --ff-only origin/main
      - name: Progressive native inventory
        timeout-minutes: 20
        run: python3 /home/joshan/lifeos-platform/scripts/lifeos-pip-p5-inventory-runner.py
      - name: Verify canonical clean
        if: always()
        run: |
          test -z "$(git -C /home/joshan/lifeos-platform status --porcelain)"
          echo CANONICAL_CLEAN=PASS
