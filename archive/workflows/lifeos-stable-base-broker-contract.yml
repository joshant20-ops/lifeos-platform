name: LifeOS Stable Base Broker Contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install pytest
      - run: python3 -m pytest -q tests/test_stable_base_provider_contract.py tests/test_provider_router_private_only.py tests/test_stable_base_broker_contract.py
