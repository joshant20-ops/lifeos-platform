name: Full ledger live audit 20min
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lifeos-full-ledger-20min.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 20
    steps:
      - name: Align canonical
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          test -z "$(git status --porcelain --untracked-files=all)"
          git merge --ff-only origin/main
          echo "AUDIT_HEAD=$(git rev-parse HEAD)"
      - name: Full live estate
        run: |
          set -u
          echo '=== FAILED ==='; systemctl --failed --no-pager || true
          echo '=== LIFEOS SERVICES ==='; systemctl --type=service --all --no-pager | grep -E 'lifeos|actions.runner' || true
          echo '=== LIFEOS TIMERS ==='; systemctl list-timers --all --no-pager | grep -E 'lifeos|restic' || true
          echo '=== CONTAINERS ==='; docker ps --format '{{.Names}}|{{.Status}}' | sort
          echo '=== CANONICAL ==='
          cd /home/joshan/lifeos-platform
          git status --porcelain --untracked-files=all
          git rev-parse HEAD
          git rev-parse origin/main
          echo '=== RETIRED RUNTIME ==='
          systemctl list-unit-files --no-legend | grep -E 'lifeos-(pi-control|job-publisher)' || true
          echo '=== EXPORTERS ==='
          systemctl status lifeos-jobs-export.path lifeos-snapshots-export.timer --no-pager || true
          stat -c 'snapshot_mtime=%Y' /home/joshan/lifeos-snapshots/snapshots/Docker/latest.json || true
          echo '=== AI ==='
          command -v ollama || echo PI_OLLAMA_BINARY=ABSENT
          systemctl status lifeos-autonomous-agent.service lifeos-engineer.service lifeos-tower-control.service --no-pager || true
      - name: Complete repository regression
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          python3 -m unittest discover -s tests -p 'test_*.py' -q
          echo FULL_REGRESSION=PASS
      - name: Current acceptance workflows and scripts
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort
          find scripts governor/scripts -maxdepth 2 -type f \( -iname '*accept*' -o -iname '*audit*' -o -iname '*health*' -o -iname '*verify*' \) -printf '%p|%m\n' | sort
      - name: Final invariants
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain --untracked-files=all)"
          systemctl is-active --quiet lifeos-autonomous-agent.service
          systemctl is-active --quiet lifeos-engineer.service
          systemctl is-active --quiet lifeos-tower-control.service
          systemctl is-active --quiet lifeos-ha-issue-queue-bridge.service
          systemctl is-active --quiet lifeos-jobs-export.path
          systemctl is-active --quiet lifeos-snapshots-export.timer
          ! systemctl list-unit-files --no-legend | awk '{print $1}' | grep -Eq '^lifeos-(pi-control|job-publisher)\.(service|timer)$'
          docker ps --format '{{.Names}}' | grep -Fx homeassistant
          docker ps --format '{{.Names}}' | grep -Fx paperless-paperless-1
          echo FULL_LIVE_INVARIANTS=PASS
