name: LifeOS P1 Paperless Native Canary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/lifeos-pip-p1-paperless-native-canary.py'
      - 'scripts/lifeos-pip-p1-paperless-native-canary.sh'
      - '.github/workflows/lifeos-pip-p1-paperless-native.yml'

permissions:
  contents: read

concurrency:
  group: lifeos-pip-paperless-native-mutation
  cancel-in-progress: false

jobs:
  native-synthetic-canary:
    runs-on: [self-hosted, lifeos-pi5]
    timeout-minutes: 20
    steps:
      - name: Reconcile clean canonical checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          repo=/home/joshan/lifeos-platform
          git -C "$repo" fetch origin main
          test -z "$(git -C "$repo" status --porcelain)"
          test "$(git -C "$repo" rev-parse HEAD)" = "$(git -C "$repo" merge-base HEAD origin/main)"
          git -C "$repo" merge --ff-only origin/main
          echo 'CANONICAL_CHECKOUT=PASS'

      - name: Run reversible native Paperless canary
        shell: bash
        run: |
          set -Eeuo pipefail
          args=(--quiet --wait --pipe --collect
            --unit=lifeos-pip-p1-native-canary
            --property=User=joshan
            --property=WorkingDirectory=/home/joshan/lifeos-platform
            --property=LoadCredential=paperless-api-token:/etc/lifeos/secrets/paperless-api-token)
          sudo -n systemd-run "${args[@]}" \
            /home/joshan/lifeos-platform/scripts/lifeos-pip-p1-paperless-native-canary.sh \
            | tee /tmp/lifeos-pip-p1-native.txt
          for marker in \
            'AUTHENTICATED_REST_INGESTION=PASS' \
            'NATIVE_OCR=PASS' \
            'NATIVE_CORRESPONDENT_MATCHER=PASS' \
            'NATIVE_DOCUMENT_TYPE_MATCHER=PASS' \
            'NATIVE_TAG_MATCHER=PASS' \
            'NATIVE_WORKFLOW_CUSTOM_FIELD=PASS' \
            'NATIVE_FULL_TEXT_SEARCH=PASS' \
            'NATIVE_EXACT_DUPLICATE_BEHAVIOUR=MEASURED' \
            'SYNTHETIC_CLEANUP=PASS' \
            'PRIVATE_FIELDS_EMITTED=NONE' \
            'PRODUCTION_DOCUMENT_MUTATION=NONE' \
            'RESULT=PASS'; do
            grep -qx "$marker" /tmp/lifeos-pip-p1-native.txt
          done

      - name: Verify canonical checkout and remove sanitized output
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(git -C /home/joshan/lifeos-platform status --porcelain)"
          rm -f /tmp/lifeos-pip-p1-native.txt
          echo 'CANONICAL_CLEAN=PASS'
