services:
  lifeos-engineer-ui:
    image: ghcr.io/open-webui/open-webui:v0.11.1
    container_name: lifeos-engineer-ui
    restart: unless-stopped
    env_file:
      - /etc/lifeos/openwebui.env
    environment:
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: "http://host.docker.internal:8793/v1"
      OPENAI_API_KEY: "lifeos-local"
      WEBUI_NAME: "LifeOS Engineer"
    ports:
      - "8792:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - lifeos-engineer-openwebui:/app/backend/data
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=5).read()'
      interval: 15s
      timeout: 10s
      start_period: 300s
      retries: 3

volumes:
  lifeos-engineer-openwebui:
    external: true
    name: lifeos-engineer-openwebui
