services:
  predbat:
    image: nipar44/predbat_addon@sha256:1513803d4111d5db7b22ca461bb52ff57af3d59244ecfe9daf0bf3a2cbc82a71
    container_name: predbat
    restart: unless-stopped
    labels:
      # Managed by the LifeOS component-update workflow. Generic image
      # updaters must never bypass its review/regression/rollback gates.
      - "com.centurylinklabs.watchtower.enable=false"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - /mnt/docker-data/predbat/config:/config:rw
      - /etc/localtime:/etc/localtime:ro

    ports:
      - "127.0.0.1:5052:5052"

    environment:
      - TZ=Europe/London
