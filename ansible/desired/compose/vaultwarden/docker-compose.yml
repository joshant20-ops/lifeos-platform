services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    environment:
      ROCKET_PROFILE: release
      ROCKET_ADDRESS: 0.0.0.0
      ROCKET_PORT: 80
    volumes:
      - /opt/stacks/vaultwarden/data:/data
    ports:
      - "8081:80"
    restart: unless-stopped
    networks:
      - reverse_proxy

networks:
  reverse_proxy:
    external: true
