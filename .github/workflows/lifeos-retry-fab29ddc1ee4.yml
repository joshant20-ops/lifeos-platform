name: Retry blocked Engineer job fab29ddc1ee4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-retry-fab29ddc1ee4.yml'

permissions:
  contents: read

concurrency:
  group: lifeos-pi5-control
  cancel-in-progress: false

jobs:
  retry-and-follow:
    if: startsWith(github.event.head_commit.message, 'Run governed retry for fab29ddc1ee4')
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 75
    steps:
      - name: Synchronize canonical checkout
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Retry blocked job through Engineer interface and follow it
        run: |
          python3 - <<'PY'
          import json,re,time,urllib.error,urllib.request
          engineer='http://127.0.0.1:8793/v1/chat/completions'
          agent='http://127.0.0.1:8790'
          old='fab29ddc1ee4'
          payload={'model':'lifeos-engineer','messages':[{'role':'user','content':f'Retry job {old} and continue autonomously.'}],'stream':False}
          req=urllib.request.Request(engineer,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as response:
              answer=json.load(response)['choices'][0]['message']['content']
          match=re.search(r'\b([a-f0-9]{12})\b',answer)
          if not match or match.group(1)==old:
              raise SystemExit('RETRY_JOB_ID_MISSING: '+answer)
          job_id=match.group(1)
          print(f'RETRY_OF={old}')
          print(f'RETRY_JOB_ID={job_id}')
          terminal=None
          for attempt in range(120):
              try:
                  with urllib.request.urlopen(agent+'/jobs/'+job_id,timeout=10) as response:
                      job=json.load(response)
                  status=str(job.get('status') or 'UNKNOWN').upper()
                  stage=str(job.get('stage') or 'unknown')
                  print(f'RETRY_PROGRESS attempt={attempt} status={status} stage={stage}',flush=True)
                  if status in {'PASS','BLOCKED','FAIL','FAILED','ERROR'}:
                      terminal=job
                      break
              except (OSError,urllib.error.URLError) as exc:
                  print(f'RETRY_STATUS_TRANSIENT={type(exc).__name__}',flush=True)
              time.sleep(30)
          if terminal is None:
              raise SystemExit('RETRY_TERMINAL_TIMEOUT')
          print('RETRY_TERMINAL=' + json.dumps({
              'id': terminal.get('id'),
              'status': terminal.get('status'),
              'stage': terminal.get('stage'),
              'blocked_reason': terminal.get('blocked_reason'),
              'iterations': len(terminal.get('iterations') or []),
          },sort_keys=True))
          if str(terminal.get('status')).upper() != 'PASS':
              raise SystemExit('RETRY_JOB_DID_NOT_PASS')
          print('BLOCKED_JOB_RETRY=PASS')
          PY

      - name: Prove canonical checkout clean
        run: |
          cd /home/joshan/lifeos-platform
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
