name: LifeOS P4 Local AI Canary
on:
  push:
    branches: [main]
    paths:
      - 'scripts/lifeos-pip-p4-local-ai-canary.py'
      - 'homelab/live/home/joshan/automation/lifeos_paperless_local_ai.py'
  workflow_dispatch:
jobs:
  canary:
    runs-on: [self-hosted, lifeos-pi5]
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile canonical checkout
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          repo=/home/joshan/lifeos-platform
          git -C "$repo" fetch origin main
          test -z "$(git -C "$repo" status --porcelain)"
          git -C "$repo" merge --ff-only origin/main
      - name: Syntax and privacy guard
        run: |
          python3 -m py_compile scripts/lifeos-pip-p4-local-ai-canary.py homelab/live/home/joshan/automation/lifeos_paperless_local_ai.py
          ! grep -q '_ollama(prompt' homelab/live/home/joshan/automation/lifeos_paperless_local_ai.py
          grep -q 'privacy="local-only", force_provider="ollama"' homelab/live/home/joshan/automation/lifeos_paperless_local_ai.py
      - name: Bounded local-only semantic canary
        timeout-minutes: 12
        run: python3 /home/joshan/lifeos-platform/scripts/lifeos-pip-p4-local-ai-canary.py
      - name: Verify canonical clean
        if: always()
        run: |
          test -z "$(git -C /home/joshan/lifeos-platform status --porcelain)"
          echo CANONICAL_CLEAN=PASS
