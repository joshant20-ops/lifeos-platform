name: Isolated Mosquitto log reopen proof

on:
  push:
    branches: [audit/storage-retention-2074]
    paths:
      - .github/workflows/storage-mqtt-reopen-proof.yml
      - tests/prove-mqtt-log-reopen.sh
      - governor/adguard_nas_restore_drill.py
      - tests/test_adguard_nas_restore_drill.py
      - ansible/desired/compose/mosquitto/docker-compose.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Test pinned ARM64 broker with synthetic traffic
        run: bash tests/prove-mqtt-log-reopen.sh
      - name: Verify NAS restore logic against synthetic archives
        run: python3 -B -m unittest tests.test_adguard_nas_restore_drill
