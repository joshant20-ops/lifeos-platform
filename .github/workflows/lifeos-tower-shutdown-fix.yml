name: LifeOS Tower Shutdown Fix

on:
  push:
    branches: [main]
    paths:
      - governor/tower_control.py
      - scripts/lifeos-configure-tower-access-runtime.sh
      - scripts/lifeos-adapt-ha-tower-control.sh
      - scripts/lifeos-prove-tower-shutdown.sh
      - .github/workflows/lifeos-tower-shutdown-fix.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: lifeos-pi5-control
  cancel-in-progress: false

jobs:
  fix-and-prove:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 20
    steps:
      - name: Synchronize canonical checkout
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Ensure Tower is awake before deployment
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 60); do
            if timeout 2 bash -c '</dev/tcp/TowerPC.Tailor/22' 2>/dev/null; then
              echo TOWER_PREFLIGHT_ACCESS=PASS
              exit 0
            fi
            if (( attempt % 5 == 1 )); then
              wakeonlan 40:8d:5c:84:41:64 >/dev/null
            fi
            sleep 2
          done
          echo ERROR=tower_not_recovered_by_proven_wol_path
          exit 1
      - name: Deploy bounded Tower control
        run: sudo -n /usr/local/sbin/lifeos-deploy-gateway deploy-ha-control-bridge
      - name: Prove shutdown and Wake-on-LAN recovery
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          bash scripts/lifeos-prove-tower-shutdown.sh | tee "$RUNNER_TEMP/tower-shutdown-proof.log"
      - name: Verify clean canonical checkout
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo TOWER_SHUTDOWN_REPOSITORY=PASS
      - name: Record Tower correction result
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const fs = require('fs');
            const path = `${process.env.RUNNER_TEMP}/tower-shutdown-proof.log`;
            const raw = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'TOWER_SHUTDOWN_PROOF=NOT_REACHED';
            const markers = raw.split('\n').filter(line => /^TOWER_/.test(line));
            const result = '${{ job.status }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 122,
              body: `### Tower shutdown correction — **${result}**\n\n\`\`\`text\n${markers.join('\n')}\n\`\`\`\n\n[Governed run evidence](${runUrl})`,
            });
