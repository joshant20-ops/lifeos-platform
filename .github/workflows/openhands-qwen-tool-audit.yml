name: OpenHands Post-Fix Qwen Tool Audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/openhands-qwen-tool-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 5
    steps:
      - name: Inspect newest Qwen conversation safely
        shell: bash
        run: |
          set -Eeuo pipefail
          cid="1a677b90dd2e43c9beccf03a4210a6fe"
          test -n "$cid"
          echo "CONVERSATION_ID=$cid"
          docker exec -e CID="$cid" lifeos-agent-canvas python -c 'import json,os,pathlib; p=pathlib.Path("/home/openhands/.openhands/agent-canvas/conversations")/os.environ["CID"]/"base_state.json"; d=json.loads(p.read_text()); print("MODEL="+str(d.get("agent",{}).get("llm",{}).get("model",d.get("llm",{}).get("model","<unknown>")))); print("DEFAULT_TOOLS="+repr(d.get("agent",{}).get("include_default_tools",d.get("include_default_tools","<unknown>")))); print("CONFIGURED_TOOLS="+repr(d.get("agent",{}).get("tools",d.get("tools","<unknown>")))); print("NATIVE_TOOL_CALLING="+repr((d.get("agent",{}).get("llm",{}) or d.get("llm",{})).get("native_tool_calling","<unknown>"))); print("WORKING_DIR="+str((d.get("workspace") or {}).get("working_dir","<unknown>")))'
          echo ACCEPTANCE_FILE
          docker exec -e CID="$cid" lifeos-agent-canvas sh -c 'f="/home/openhands/workspace/project/$CID/qwen-acceptance.txt"; if test -f "$f"; then printf "exists=true bytes="; wc -c <"$f"; printf "content="; cat "$f"; echo; else echo "exists=false"; fi'
          echo SAFE_EVENT_SUMMARY
          docker exec -e CID="$cid" lifeos-agent-canvas python -c 'import json,os,pathlib; r=pathlib.Path("/home/openhands/.openhands/agent-canvas/conversations")/os.environ["CID"]/"events"; ev=[json.loads(p.read_text()) for p in sorted(r.glob("*.json"))]; print("event_count="+str(len(ev))); print("switch_llm_count="+str(sum(int("switchllmtool" in json.dumps(d).lower() or "\"switch_llm\"" in json.dumps(d).lower()) for d in ev))); print("execute_command_count="+str(sum(int("execute_command" in json.dumps(d).lower()) for d in ev))); print("terminal_mentions="+str(sum(int("terminal" in json.dumps(d).lower()) for d in ev))); print("file_editor_mentions="+str(sum(int("file_editor" in json.dumps(d).lower()) for d in ev))); print("security_risk_mentions="+str(sum(int("security_risk" in json.dumps(d).lower()) for d in ev))); print("validation_error_mentions="+str(sum(int("validation" in json.dumps(d).lower() and "error" in json.dumps(d).lower()) for d in ev))); print("agent_error_mentions="+str(sum(int("agenterror" in json.dumps(d).lower() or "agent error" in json.dumps(d).lower()) for d in ev)))'
