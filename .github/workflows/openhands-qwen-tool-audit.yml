name: OpenHands Post-Fix Qwen Tool Audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/openhands-qwen-tool-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 5
    steps:
      - name: Inspect newest Qwen conversation safely
        shell: bash
        run: |
          set -Eeuo pipefail
          cid="$(docker exec lifeos-agent-canvas python -c 'import pathlib; r=pathlib.Path("/home/openhands/.openhands/agent-canvas/conversations"); ds=[p for p in r.iterdir() if p.is_dir()]; print(max(ds,key=lambda p:p.stat().st_mtime).name)')"
          test -n "$cid"
          echo "CONVERSATION_ID=$cid"
          docker exec -e CID="$cid" lifeos-agent-canvas python -c 'import json,os,pathlib; p=pathlib.Path("/home/openhands/.openhands/agent-canvas/conversations")/os.environ["CID"]/"base_state.json"; d=json.loads(p.read_text()); print("MODEL="+str(d.get("agent",{}).get("llm",{}).get("model",d.get("llm",{}).get("model","<unknown>")))); print("DEFAULT_TOOLS="+repr(d.get("agent",{}).get("include_default_tools",d.get("include_default_tools","<unknown>")))); print("WORKING_DIR="+str((d.get("workspace") or {}).get("working_dir","<unknown>")))'
          echo ACCEPTANCE_FILE
          docker exec -e CID="$cid" lifeos-agent-canvas sh -c 'f="/home/openhands/workspace/project/$CID/qwen-acceptance.txt"; if test -f "$f"; then printf "exists=true bytes="; wc -c <"$f"; printf "content="; cat "$f"; echo; else echo "exists=false"; fi'
          echo SAFE_EVENT_SUMMARY
          docker exec -e CID="$cid" lifeos-agent-canvas python -c 'import json,os,pathlib; r=pathlib.Path("/home/openhands/.openhands/agent-canvas/conversations")/os.environ["CID"]/"events"; ev=[json.loads(p.read_text()) for p in sorted(r.glob("*.json"))]; print("event_count="+str(len(ev))); print("switch_llm_count="+str(sum(int("switchllmtool" in json.dumps(d).lower() or "\"switch_llm\"" in json.dumps(d).lower()) for d in ev))); print("execute_command_count="+str(sum(int("execute_command" in json.dumps(d).lower()) for d in ev)))'
