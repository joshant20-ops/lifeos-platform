name: LifeOS P9 Pre-Authorisation Acceptance
on:
  push:
    branches: [main]
    paths: ['scripts/lifeos-pip-p9-live-acceptance.py','governor/finance_assets_readonly.py','docs/architecture/wave-c-tax-evidence-semantics.md']
  workflow_dispatch:
jobs:
  acceptance:
    runs-on: [self-hosted, lifeos-pi5]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile canonical checkout
        run: |
          git -C /home/joshan/lifeos-platform fetch origin main
          test -z "$(git -C /home/joshan/lifeos-platform status --porcelain)"
          git -C /home/joshan/lifeos-platform merge --ff-only origin/main
      - name: Functional tax and evidence guards
        run: python3 -m pytest -q tests/test_pip_p6_p10_functional.py::test_p9_evidence_is_reference_not_ledger tests/test_pip_p6_p10_functional.py::test_p9_tax_related_does_not_imply_deductible tests/test_pip_p6_p10_functional.py::test_p9_deductibility_requires_positive_expense_and_allowed_purpose
      - name: Bounded live P9 pre-authorisation acceptance
        run: python3 /home/joshan/lifeos-platform/scripts/lifeos-pip-p9-live-acceptance.py
      - name: Runtime audit
        run: |
          test -f /home/joshan/.local/state/lifeos/pip/cross_system.sqlite3
          test "$(stat -c %a /home/joshan/.local/state/lifeos/pip/cross_system.sqlite3)" = 600
          echo P9_RUNTIME_AUDIT=PASS
      - name: Canonical clean
        if: always()
        run: test -z "$(git -C /home/joshan/lifeos-platform status --porcelain)"
