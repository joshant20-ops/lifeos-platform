name: LifeOS OTS Purge 797 Live Cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-ots-purge-797.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifeos-pi5-control
  cancel-in-progress: false

jobs:
  live-cutover:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 20
    steps:
      - name: Reconcile canonical checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git merge --ff-only origin/main
          test -z "$(git status --porcelain)"
          echo "PURGE797_CANONICAL_SYNC=PASS"
          git rev-parse HEAD

      - name: Live pre-cutover audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          bash scripts/lifeos-legacy-dispatcher-retirement-audit.sh | tee /tmp/purge797-pre.txt
          grep -qx 'LEGACY_DISPATCHER_RETIREMENT_READY=YES' /tmp/purge797-pre.txt
          grep -qx 'ONE_REAL_AUTHORITATIVE_SEMAPHORE_SUBMISSION=PROVEN' /tmp/purge797-pre.txt
          grep -qx 'ONE_REAL_TERMINAL_COMPLETION_HANDLING=PROVEN' /tmp/purge797-pre.txt
          grep -qx 'SEMAPHORE_API=PASS' /tmp/purge797-pre.txt
          echo "PURGE797_PRECUTOVER_LIVE_PROOF=PASS"

      - name: Confirm or perform bounded timer retirement
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          backlog_active=$(systemctl is-active lifeos-backlog-runner.timer 2>/dev/null || true)
          backlog_enabled=$(systemctl is-enabled lifeos-backlog-runner.timer 2>/dev/null || true)
          dispatcher_active=$(systemctl is-active lifeos-engineer-dispatcher.timer 2>/dev/null || true)
          dispatcher_enabled=$(systemctl is-enabled lifeos-engineer-dispatcher.timer 2>/dev/null || true)
          if [[ "$backlog_active" != active && "$backlog_enabled" == disabled && "$dispatcher_active" != active && "$dispatcher_enabled" =~ ^(disabled|not-found)$ ]]; then
            echo "PURGE797_CUTOVER=ALREADY_LIVE"
          else
            sudo -n bash scripts/lifeos-retire-superseded-dispatch-timers.sh | tee /tmp/purge797-cutover.txt
            grep -qx 'RESULT=PASS' /tmp/purge797-cutover.txt
            grep -qx 'BACKLOG_RUNNER_TIMER_DISABLED=YES' /tmp/purge797-cutover.txt
            grep -qx 'SEMAPHORE_API=PASS' /tmp/purge797-cutover.txt
            echo "PURGE797_CUTOVER=PASS"
          fi

      - name: Live post-cutover duplicate-dispatch and safety audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          test "$(systemctl is-active lifeos-backlog-runner.timer 2>/dev/null || true)" != active
          test "$(systemctl is-enabled lifeos-backlog-runner.timer 2>/dev/null || true)" = disabled
          test "$(systemctl is-active lifeos-backlog-runner.service 2>/dev/null || true)" != active
          test "$(systemctl is-active lifeos-engineer-dispatcher.timer 2>/dev/null || true)" != active
          for u in lifeos-control-job-submit.socket lifeos-root-broker.socket lifeos-autonomous-agent.service lifeos-engineer.service lifeos-ha-issue-queue-bridge.service; do
            test "$(systemctl is-active "$u" 2>/dev/null || true)" = active
            echo "PURGE797_PROTECTED_UNIT=PASS unit=$u"
          done
          echo "PURGE797_LEGACY_SERVICE_BEFORE=$(systemctl is-active lifeos-backlog-runner.service 2>/dev/null || true)"
          sleep 65
          test "$(systemctl is-active lifeos-backlog-runner.timer 2>/dev/null || true)" != active
          test "$(systemctl is-active lifeos-backlog-runner.service 2>/dev/null || true)" != active
          echo "PURGE797_LEGACY_SERVICE_AFTER=$(systemctl is-active lifeos-backlog-runner.service 2>/dev/null || true)"
          echo "PURGE797_NO_DUPLICATE_LEGACY_DISPATCH=PASS"
          echo "PURGE797_BOOT_PERSISTENCE=PASS backlog_timer_enabled=$(systemctl is-enabled lifeos-backlog-runner.timer 2>/dev/null || true)"
          bash scripts/lifeos-legacy-dispatcher-retirement-audit.sh | tee /tmp/purge797-post.txt
          grep -qx 'LEGACY_DISPATCHER_RETIREMENT_READY=YES' /tmp/purge797-post.txt
          echo "PURGE797_POSTCUTOVER_LIVE_AUDIT=PASS"
