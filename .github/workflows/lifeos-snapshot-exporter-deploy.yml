name: Deploy snapshot exporter scheduler
on:
  push:
    branches: [main]
    paths:
      - 'governor/systemd/lifeos-snapshots-export.*'
      - 'governor/scripts/snapshot-lifeos-observed-state.sh'
      - '.github/workflows/lifeos-snapshot-exporter-deploy.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 10
    steps:
      - name: Align
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          test -z "$(git status --porcelain --untracked-files=all)"
          git merge --ff-only origin/main
      - name: Install and prove
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          sudo -n install -o root -g root -m 0644 governor/systemd/lifeos-snapshots-export.service /etc/systemd/system/lifeos-snapshots-export.service
          sudo -n install -o root -g root -m 0644 governor/systemd/lifeos-snapshots-export.timer /etc/systemd/system/lifeos-snapshots-export.timer
          sudo -n systemctl daemon-reload
          sudo -n systemctl enable --now lifeos-snapshots-export.timer
          sudo -n systemctl start lifeos-snapshots-export.service
          test "$(systemctl show -p Result --value lifeos-snapshots-export.service)" = success
          systemctl is-active --quiet lifeos-snapshots-export.timer
          git -C /home/joshan/lifeos-snapshots fetch origin main
          test "$(git -C /home/joshan/lifeos-snapshots rev-parse HEAD)" = "$(git -C /home/joshan/lifeos-snapshots rev-parse origin/main)"
          age="$(( $(date +%s) - $(stat -c %Y /home/joshan/lifeos-snapshots/snapshots/Docker/latest.json) ))"
          test "$age" -lt 300
          echo SNAPSHOT_EXPORT=PASS
          echo SNAPSHOT_TIMER=ACTIVE
          echo SNAPSHOT_FRESHNESS=PASS
