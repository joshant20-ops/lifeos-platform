name: LifeOS Retire Engineer Cloud Secrets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-retire-engineer-cloud-secrets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retire:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 15
    steps:
      - name: Synchronize canonical Pi checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Prove Pi5 provider store and working routes
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          test -f "$HOME/.config/lifeos/provider-secrets.env"
          test ! -L "$HOME/.config/lifeos/provider-secrets.env"
          test "$(stat -c '%a' "$HOME/.config/lifeos/provider-secrets.env")" = 600
          python3 - <<'PY'
          import importlib.util,pathlib,re
          path=pathlib.Path('governor/ai_broker.py')
          spec=importlib.util.spec_from_file_location('b',path)
          b=importlib.util.module_from_spec(spec); spec.loader.exec_module(b)
          names=b.ROUTER.load_secret_names(b.SECRETS_PATH)
          required={'GEMINI_API_KEY','GROQ_API_KEY','OPENROUTER_API_KEY','CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID'}
          assert required <= names, required-names
          marker='LIFEOS_PI5_MIGRATION_FINAL_OK'
          for provider in ('gemini','openrouter','cloudflare'):
              r=b.generate('Reply with exactly '+marker,privacy='normal',task_class='normal',force_provider=provider)
              assert marker in str(r['text']), provider
              print(provider.upper()+'_PI5_INFERENCE=PASS')
          policy=b.ROUTER.load_policy(b.POLICY_PATH)
          groq=next(p for p in policy['providers'] if p['id']=='groq')
          secrets=b._strict_env(b.SECRETS_PATH)
          try:
              b._invoke(groq,'Reply with exactly '+marker,secrets)
          except Exception as exc:
              m=re.search(r'provider HTTP ([0-9]{3})',str(exc))
              assert m and m.group(1)=='403', type(exc).__name__
              print('GROQ_PI5_AUTHENTICATED_PERMISSION_BLOCK=HTTP_403')
          else:
              print('GROQ_PI5_INFERENCE=PASS')
          eligible,considered=b.candidates(privacy='local-only',task_class='normal')
          assert [p['id'] for p in eligible]==['ollama'], eligible
          assert all(x['status']=='PRIVACY_FORBIDDEN' for x in considered if x['provider'] in {'gemini','groq','openrouter','cloudflare','codex'}), considered
          print('PRIVATE_ROUTING_FAIL_CLOSED=PASS')
          PY

      - name: Retire duplicate provider credentials on Engineer
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=8 Engineer 'python3 - <<'"'"'PY'"'"'
          from pathlib import Path
          import os
          p=Path.home()/".config/lifeos/provider-secrets.env"
          if not p.exists():
              print("ENGINEER_PROVIDER_SECRET_STORE=ALREADY_ABSENT")
              raise SystemExit(0)
          if p.is_symlink() or not p.is_file() or (p.stat().st_mode & 0o777) != 0o600:
              raise SystemExit("ENGINEER_PROVIDER_SECRET_STORE=UNSAFE")
          remove={"GEMINI_API_KEY","GROQ_API_KEY","OPENROUTER_API_KEY","CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID"}
          kept=[]
          removed=set()
          for raw in p.read_text().splitlines():
              line=raw.strip()
              work=line[7:].lstrip() if line.startswith("export ") else line
              name,sep,_=work.partition("=")
              if sep and name in remove:
                  removed.add(name)
              else:
                  kept.append(raw)
          if kept:
              p.write_text("\n".join(kept)+"\n")
              os.chmod(p,0o600)
          else:
              p.unlink()
          print("ENGINEER_CLOUD_PROVIDER_SECRET_NAMES_REMOVED="+str(len(removed)))
          print("ENGINEER_CLOUD_PROVIDER_SECRETS=RETIRED")
          PY'

      - name: Verify Engineer no longer has cloud provider credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=8 Engineer 'python3 - <<'"'"'PY'"'"'
          from pathlib import Path
          p=Path.home()/".config/lifeos/provider-secrets.env"
          forbidden={"GEMINI_API_KEY","GROQ_API_KEY","OPENROUTER_API_KEY","CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID"}
          if p.exists():
              names=set()
              for raw in p.read_text().splitlines():
                  line=raw.strip(); work=line[7:].lstrip() if line.startswith("export ") else line
                  name,sep,_=work.partition("=")
                  if sep: names.add(name)
              assert not (forbidden & names), forbidden & names
          print("ENGINEER_CLOUD_PROVIDER_SECRET_ABSENCE=PASS")
          PY'
          echo 'PI5_SECRET_MIGRATION=PASS'
