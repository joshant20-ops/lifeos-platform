name: LifeOS Archived Job Reconciliation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/lifeos-archive-job-reconcile.py'
      - 'governor/job_records/**'
      - '.github/workflows/lifeos-archive-job-reconciliation.yml'
  workflow_dispatch:
jobs:
  reconcile:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Sync canonical Pi checkout
        run: |
          set -Eeuo pipefail
          repo=/home/joshan/lifeos-platform
          git -C "$repo" fetch origin main
          test -z "$(git -C "$repo" status --porcelain)"
          git -C "$repo" merge --ff-only origin/main
      - name: Reconcile archived records
        run: python3 /home/joshan/lifeos-platform/scripts/lifeos-archive-job-reconcile.py
      - name: Live Governor audit
        run: |
          set -Eeuo pipefail
          systemctl is-active --quiet lifeos-autonomous-agent.service
          systemctl is-active --quiet lifeos-tower-control.service
          curl -fsS http://127.0.0.1:8765/jobs >/dev/null
          echo ARCHIVE_LIVE_GOVERNOR=PASS
          echo ARCHIVE_LIVE_TOWER_CONTROL=PASS
          echo ARCHIVE_LIVE_JOBS_API=PASS
      - name: Canonical clean
        run: test -z "$(git -C /home/joshan/lifeos-platform status --porcelain)"
