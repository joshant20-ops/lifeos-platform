name: LifeOS Patch Governor Local Tool Smoke

on:
  push:
    branches:
      - fix/governor-deploy-local-tool-smoke

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/governor-deploy-local-tool-smoke
          fetch-depth: 0

      - name: Replace cloud-dependent broker smoke with local tool-call proof
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('governor/scripts/deploy-autonomous-agent-pi5.sh')
          s = p.read_text()
          start = s.index("BROKER_REQ=$(python3 - <<'PY'\n")
          end_marker = "PY\n\nprintf '\\n===== 6/8 — UI + PRIVACY FAIL-CLOSED =====\\n'"
          end = s.index(end_marker, start)
          old = s[start:end + 3]
          new = r'''BROKER_REQ=$(python3 - <<'PY'
import json
print(json.dumps({
    "model": "lifeos-engineering-normal",
    "messages": [{
        "role": "user",
        "content": "Call report_test_value with value GOVERNOR_LOCAL_TOOL_OK. Do not answer normally."
    }],
    "tools": [{
        "type": "function",
        "function": {
            "name": "report_test_value",
            "description": "Report a harmless deployment test value.",
            "parameters": {
                "type": "object",
                "properties": {"value": {"type": "string"}},
                "required": ["value"]
            }
        }
    }],
    "tool_choice": "required"
}))
PY
)
BROKER_OUT=$(curl -fsS --max-time 180 \
  -H 'Content-Type: application/json' \
  -H "Authorization: Bearer $(cat "$BROKER_TOKEN")" \
  -d "$BROKER_REQ" http://127.0.0.1:8790/v1/chat/completions)
python3 - "$BROKER_OUT" <<'PY'
import json,sys
j=json.loads(sys.argv[1])
assert j['lifeos_privacy']=='normal', j
assert j['lifeos_provider']=='ollama', j
choice=j['choices'][0]
assert choice['finish_reason']=='tool_calls', choice
calls=choice['message'].get('tool_calls') or []
match=None
for call in calls:
    fn=call.get('function') or {}
    if fn.get('name') != 'report_test_value':
        continue
    args=fn.get('arguments') or '{}'
    if isinstance(args,str):
        args=json.loads(args)
    if args.get('value') == 'GOVERNOR_LOCAL_TOOL_OK':
        match=call
        break
assert match is not None, calls
print('BROKER_AUTHENTICATED_LOCAL_TOOL_CALL=PASS')
print('BROKER_PROVIDER=ollama')
PY
'''
          p.write_text(s[:start] + new + s[end + 3:])
          PY

      - name: Validate
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n governor/scripts/deploy-autonomous-agent-pi5.sh
          git diff --check
          grep -q 'BROKER_AUTHENTICATED_LOCAL_TOOL_CALL=PASS' governor/scripts/deploy-autonomous-agent-pi5.sh
          grep -q "assert j\['lifeos_provider'\]=='ollama'" governor/scripts/deploy-autonomous-agent-pi5.sh
          ! grep -q "assert j\['lifeos_provider'\] in {'gemini','openrouter','cloudflare'}" governor/scripts/deploy-autonomous-agent-pi5.sh

      - name: Commit patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governor/scripts/deploy-autonomous-agent-pi5.sh
          git commit -m 'Prove local tool routing during Governor deploy'
          git push origin HEAD:fix/governor-deploy-local-tool-smoke
