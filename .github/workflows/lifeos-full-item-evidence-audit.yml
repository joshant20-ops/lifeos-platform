name: LifeOS Full Item Evidence Audit

on:
  push:
    branches: [main]
    paths: ['.github/workflows/lifeos-full-item-evidence-audit.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 30
    steps:
      - name: Align canonical source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          test -z "$(git status --porcelain --untracked-files=all)"
          git merge --ff-only origin/main
          echo "AUDIT_HEAD=$(git rev-parse HEAD)"
      - name: Current runtime estate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          echo '=== SYSTEMD ==='
          systemctl --no-pager --plain --type=service --all | grep -E 'lifeos|docker|mosquitto|restic|semaphore' || true
          echo '=== CONTAINERS ==='
          docker ps -a --format '{{.Names}}|{{.Status}}' | sort
          echo '=== TIMERS ==='
          systemctl --no-pager list-timers --all | grep -E 'lifeos|restic|backup|update' || true
          echo '=== PI LOCAL OLLAMA ==='
          command -v ollama || true
          systemctl list-unit-files --no-legend | grep '^ollama' || true
          echo '=== GIT ==='
          git status --porcelain --untracked-files=all
          git remote -v
      - name: Full repository regression suite
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          python3 -m unittest discover -s tests -p 'test_*.py' -q
      - name: Current acceptance probes
        if: always()
        shell: bash
        run: |
          set -u
          cd /home/joshan/lifeos-platform
          for s in             scripts/lifeos-verify-transaction-core.sh             scripts/lifeos-semaphore-postgres-health-audit.sh             scripts/powerdown-rest-endpoint-health.sh; do
            echo "=== PROBE:$s ==="
            if [[ -x "$s" ]]; then timeout 120 "$s"; echo "RC=$?"; else echo "NOT_EXECUTABLE_OR_ABSENT"; fi
          done
          echo '=== SNAPSHOT/JOB EXPORTERS ==='
          systemctl --no-pager --plain --type=service --all | grep -E 'snapshot|job.*export|export.*job' || true
          systemctl --no-pager list-timers --all | grep -E 'snapshot|job.*export|export.*job' || true
