name: Three Dashboard Role Deploy
on:
  push:
    branches: [main]
    paths:
      - 'scripts/deploy-three-dashboard-roles.py'
      - 'homeassistant/verify-lifeos-dashboard.py'
      - 'homelab/live/home/joshan/automation/lifeos_task_reconciler.py'
      - 'homelab/live/home/joshan/automation/scripts/lifeos_paperless_memory_index.py'
      - 'homelab/live/home/joshan/automation/scripts/lifeos_paperless_notes_reader.py'
      - 'homelab/live/home/joshan/automation/scripts/lifeos_evidence_link_proposals_refresh.py'
      - '.github/workflows/three-dashboard-role-deploy.yml'
permissions: {contents: read}
jobs:
  deploy-verify:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Deploy role-separated dashboards
        run: |
          sudo python3 scripts/deploy-three-dashboard-roles.py
          sudo docker restart homeassistant >/dev/null
          for i in $(seq 1 60); do
            if [ \"$(sudo docker inspect -f '{{.State.Status}}' homeassistant 2>/dev/null)\" = running ]; then sleep 8; break; fi
            sleep 2
          done
      - name: Verify live roles and House Status isolation
        run: |
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/opt/stacks/homeassistant/config/.storage')
          expected={
            'lovelace.dashboard_homelab':['overview','network','tower'],
            'lovelace.dashboard_lifeos':['overview','documents','lifeos-chat','important-information'],
            'lovelace.lifeos_control':['overview','autonomous-work','energy-ai','execution-safety'],
          }
          for name,paths in expected.items():
              d=json.loads((root/name).read_text()); got=[v.get('path') for v in d['data']['config']['views']]
              assert got==paths,(name,got)
              assert all(v.get('cards') for v in d['data']['config']['views']),(name,'empty view')
              blob=json.dumps(d)
              for stale in ('binary_sensor.tower_accessible','sensor.tower_lifecycle','switch.tower_power','sensor.lifeos_control_state'):
                  assert stale not in blob,(name,'stale',stale)
              print('VERIFY',name,got,[len(v.get('cards',[])) for v in d['data']['config']['views']])
          assert (root/'lovelace.dashboard_house_status').exists() or True
          print('RUNTIME_VERIFY=PASS')
          PY
      - name: Reconcile personal tasks from Gmail and Paperless
        run: |
          sudo install -m 0755 homelab/live/home/joshan/automation/lifeos_task_reconciler.py /home/joshan/automation/lifeos_task_reconciler.py
          sudo /home/joshan/automation/lifeos_run.sh python3 /home/joshan/automation/lifeos_task_reconciler.py
      - name: Verify personal LifeOS dashboard contract
        run: sudo python3 homeassistant/verify-lifeos-dashboard.py
