name: House Status Development Deploy
on:
  pull_request:
    paths:
      - 'homeassistant/www/house-status-dev/**'
      - 'homeassistant/verify-house-status-dev-dashboard.py'
      - 'scripts/lifeos-deploy-house-status-dev-dashboard.sh'
      - '.github/workflows/house-status-dev-deploy.yml'
      - 'scripts/lifeos-energy-history-live-acceptance.py'
      - 'scripts/lifeos-deploy-energy-opportunity-api.sh'
      - 'homelab/live/mnt/docker-data/automation/repos/LifeOS-Energy/app/services/octopus.py'
      - 'homelab/live/mnt/docker-data/automation/repos/LifeOS-Energy/app/services/history.py'
      - 'homelab/live/mnt/docker-data/automation/repos/LifeOS-Energy/app/routers/energy.py'
  push:
    branches: [main]
    paths:
      - 'homeassistant/www/house-status-dev/**'
      - 'homeassistant/verify-house-status-dev-dashboard.py'
      - 'scripts/lifeos-deploy-house-status-dev-dashboard.sh'
      - '.github/workflows/house-status-dev-deploy.yml'
      - 'homelab/live/mnt/docker-data/automation/repos/LifeOS-Energy/app/routers/energy.py'
      - 'homelab/live/mnt/docker-data/automation/repos/LifeOS-Energy/app/services/history.py'
      - 'homelab/live/mnt/docker-data/automation/repos/LifeOS-Energy/app/services/octopus.py'
      - 'scripts/lifeos-deploy-energy-opportunity-api.sh'
      - 'scripts/lifeos-energy-history-live-acceptance.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: house-status-panel-deploy
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate development dashboard bundle
        run: |
          set -Eeuo pipefail
          node --check homeassistant/www/house-status-dev/lifeos-house-status-dev.js
          node --check homeassistant/www/house-status-dev/lifeos-house-status-doorbell.js
          node --input-type=module --check < homeassistant/www/house-status-dev/lifeos-house-status-dev-loader.js
          TZ=Europe/London node homeassistant/www/house-status-dev/test-isolation.js
          bash -n scripts/lifeos-deploy-house-status-dev-dashboard.sh
          python3 -m py_compile homeassistant/verify-house-status-dev-dashboard.py
          python3 homeassistant/verify-house-status-dev-dashboard.py --source-only
  deploy:
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile canonical checkout to main
        run: git show HEAD:scripts/reconcile-canonical-checkout.py | python3 - /home/joshan/lifeos-platform
      - name: Verify live Enphase and Octopus history before dashboard mutation
        run: python3 scripts/lifeos-energy-history-live-acceptance.py --base-url http://127.0.0.1:8110 --week-start 2026-09-28
      - name: Deploy development panel only
        run: sudo -n bash /home/joshan/lifeos-platform/scripts/lifeos-deploy-house-status-dev-dashboard.sh
      - name: Verify live dashboard isolation
        run: |
          set -Eeuo pipefail
          curl -fsS --max-time 10 http://127.0.0.1:8123/local/house-status-dev/lifeos-house-status-dev-loader.js -o /tmp/house-status-dev-served.js
          grep -Fq 'House Status development panel' /tmp/house-status-dev-served.js
          curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "http://127.0.0.1:8123/local/house-status-dev/lifeos-house-status-dev.js?acceptance=${GITHUB_SHA}" -o /tmp/house-status-dev-served-bundle.js
          cmp -s homeassistant/www/house-status-dev/lifeos-house-status-dev.js /tmp/house-status-dev-served-bundle.js || { echo HOUSE_STATUS_DEV_SERVED_ASSET=FAIL; exit 1; }
          echo HOUSE_STATUS_DEV_SERVED_ASSET=PASS
          TZ=Europe/London HOUSE_STATUS_DEV_ASSET=/tmp/house-status-dev-served-bundle.js node homeassistant/www/house-status-dev/test-isolation.js
          sudo -n python3 /home/joshan/lifeos-platform/homeassistant/verify-house-status-dev-dashboard.py
          echo HOUSE_STATUS_DEV_LIVE_ACCEPTANCE=PASS

