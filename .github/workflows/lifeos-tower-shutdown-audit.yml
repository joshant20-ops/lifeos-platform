name: LifeOS Tower Shutdown Audit

on:
  push:
    branches: [main]
    paths:
      - scripts/audit-tower-shutdown-live.py
      - .github/workflows/lifeos-tower-shutdown-audit.yml

permissions:
  contents: read

concurrency:
  group: lifeos-pi5-diagnostics
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 10
    steps:
      - name: Sync canonical main
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Audit live tower shutdown path
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          python3 scripts/audit-tower-shutdown-live.py
      - name: Prove no repository mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          test -z "$(git status --porcelain --untracked-files=all)"
          echo TOWER_SHUTDOWN_REPO_FINAL=PASS
