name: LifeOS Tower Shutdown Audit

on:
  push:
    branches: [main]
    paths:
      - scripts/audit-tower-shutdown-live.py
      - .github/workflows/lifeos-tower-shutdown-audit.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: lifeos-pi5-diagnostics
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 10
    steps:
      - name: Sync canonical main
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Audit live tower shutdown path
        id: audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          python3 scripts/audit-tower-shutdown-live.py | tee "$RUNNER_TEMP/tower-shutdown-audit.log"
      - name: Prove no repository mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          test -z "$(git status --porcelain --untracked-files=all)"
          echo TOWER_SHUTDOWN_REPO_FINAL=PASS
      - name: Record Tower audit evidence
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const fs = require('fs');
            const path = `${process.env.RUNNER_TEMP}/tower-shutdown-audit.log`;
            const raw = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'AUDIT_OUTPUT=UNAVAILABLE';
            const markers = raw.split('\n').filter(line => /^(TOWER_SHUTDOWN_|TOWER_CONTROL_|TOWER_SERVICE_|TOWER_CONFIG_|MUTATION_PERFORMED=|SECRETS_REDACTED=)/.test(line));
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 122,
              body: `### Automated Tower shutdown audit — ${context.sha.slice(0, 12)}\n\n\`\`\`text\n${markers.join('\n') || 'AUDIT_MARKERS=UNAVAILABLE'}\n\`\`\`\n\n[Governed run evidence](${runUrl})`,
            });
