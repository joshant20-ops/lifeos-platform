name: Retire stale pi-control runtime

on:
  push:
    branches: [main]
    paths: ['.github/workflows/lifeos-retire-stale-pi-control-runtime.yml']

permissions:
  contents: read

jobs:
  retire:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 10
    steps:
      - name: Align canonical checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          test -z "$(git status --porcelain --untracked-files=all)"
          git merge --ff-only origin/main
          echo "HEAD=$(git rev-parse HEAD)"

      - name: Prove stale legacy ownership
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f /etc/systemd/system/lifeos-pi-control.service
          test -f /etc/systemd/system/lifeos-job-publisher.service
          systemctl cat lifeos-pi-control.service | grep -F 'WorkingDirectory=/home/joshan/lifeos-pi-control'
          systemctl cat lifeos-job-publisher.service | grep -F 'WorkingDirectory=/home/joshan/lifeos-pi-control'
          test -f /home/joshan/lifeos-platform/architecture/decisions/three-repository-authority.md
          grep -Eq 'lifeos-pi-control|three' /home/joshan/lifeos-platform/architecture/decisions/three-repository-authority.md
          echo STALE_LEGACY_OWNERSHIP=PASS

      - name: Retire obsolete units
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n systemctl disable --now lifeos-pi-control.timer lifeos-job-publisher.timer
          sudo -n systemctl disable --now lifeos-pi-control.service lifeos-job-publisher.service || true
          sudo -n rm -f             /etc/systemd/system/lifeos-pi-control.timer             /etc/systemd/system/lifeos-pi-control.service             /etc/systemd/system/lifeos-job-publisher.timer             /etc/systemd/system/lifeos-job-publisher.service
          sudo -n rm -rf             /etc/systemd/system/lifeos-pi-control.service.d             /etc/systemd/system/lifeos-job-publisher.service.d
          sudo -n systemctl daemon-reload
          sudo -n systemctl reset-failed lifeos-pi-control.service lifeos-job-publisher.service || true

      - name: Verify convergence
        shell: bash
        run: |
          set -Eeuo pipefail
          ! systemctl list-unit-files --no-legend | awk '{print $1}' | grep -Fx 'lifeos-pi-control.service'
          ! systemctl list-unit-files --no-legend | awk '{print $1}' | grep -Fx 'lifeos-pi-control.timer'
          ! systemctl list-unit-files --no-legend | awk '{print $1}' | grep -Fx 'lifeos-job-publisher.service'
          ! systemctl list-unit-files --no-legend | awk '{print $1}' | grep -Fx 'lifeos-job-publisher.timer'
          systemctl is-active --quiet lifeos-autonomous-agent.service
          systemctl is-active --quiet lifeos-engineer.service
          systemctl is-active --quiet lifeos-ha-issue-queue-bridge.service
          systemctl is-active --quiet lifeos-tower-control.service
          docker ps --format '{{.Names}}' | grep -Fx homeassistant
          docker ps --format '{{.Names}}' | grep -Fx paperless-paperless-1
          echo LEGACY_PI_CONTROL_RUNTIME=ABSENT
          echo CURRENT_CONTROL_PLANE=PASS
