name: LifeOS workspace runtime diagnostic

on:
  push:
    branches: [main, fix/lifeos-workspace-runtime]
    paths:
      - '.github/workflows/lifeos-workspace-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 12
    steps:
      - name: Synchronize diagnostic checkout
        uses: actions/checkout@v4

      - name: Wait for bounded Energy startup and report fixed status only
        shell: bash
        run: |
          set -Eeuo pipefail

          unit_value() {
            systemctl show "$1" --property="$2" --value 2>/dev/null || true
          }

          wait_for_settle() {
            local unit="$1"
            local limit_seconds="$2"
            local label="$3"
            local deadline=$((SECONDS + limit_seconds))
            local state=""
            local substate=""

            while :; do
              state="$(unit_value "$unit" ActiveState)"
              substate="$(unit_value "$unit" SubState)"

              if [[ "$state" == inactive || "$state" == failed ]] ||
                 { [[ "$state" == active ]] && [[ "$substate" == exited ]]; }; then
                echo "${label}_SETTLED=YES"
                return 0
              fi

              if (( SECONDS >= deadline )); then
                echo "${label}_SETTLED=NO"
                return 1
              fi

              sleep 10
            done
          }

          report_service() {
            local unit="$1"
            echo "UNIT=$unit"
            if systemctl show "$unit" --no-pager \
              --property=LoadState,ActiveState,SubState,UnitFileState,Result,ExecMainStatus,ExecMainStartTimestamp,ExecMainExitTimestamp; then
              :
            else
              echo "UNIT_QUERY=UNAVAILABLE"
            fi
          }

          report_timer() {
            local unit="$1"
            echo "UNIT=$unit"
            if systemctl show "$unit" --no-pager \
              --property=LoadState,ActiveState,SubState,UnitFileState,LastTriggerUSec,NextElapseUSecRealtime; then
              :
            else
              echo "UNIT_QUERY=UNAVAILABLE"
            fi
          }

          echo "DIAGNOSTIC_START=PASS"

          if wait_for_settle lifeos-energy-forecast.service 360 FORECAST; then
            :
          fi

          forecast_state="$(unit_value lifeos-energy-forecast.service ActiveState)"
          forecast_substate="$(unit_value lifeos-energy-forecast.service SubState)"
          forecast_result="$(unit_value lifeos-energy-forecast.service Result)"
          forecast_exit="$(unit_value lifeos-energy-forecast.service ExecMainStatus)"
          forecast_exit_mono="$(unit_value lifeos-energy-forecast.service ExecMainExitTimestampMonotonic)"

          forecast_settled="NO"
          if [[ "$forecast_state" == inactive || "$forecast_state" == failed ]] ||
             { [[ "$forecast_state" == active ]] && [[ "$forecast_substate" == exited ]]; }; then
            forecast_settled="YES"
          fi
          echo "FORECAST_SETTLED=$forecast_settled"

          shadow_started_after_forecast="UNKNOWN"
          if [[ "$forecast_settled" == YES && "$forecast_result" == success && "$forecast_exit" == 0 ]]; then
            if [[ "$forecast_exit_mono" =~ ^[0-9]+$ ]] && (( forecast_exit_mono > 0 )); then
              shadow_deadline=$((SECONDS + 60))
              shadow_start_mono="$(unit_value lifeos-energy-shadow-learning.service ExecMainStartTimestampMonotonic)"

              while ! [[ "$shadow_start_mono" =~ ^[0-9]+$ ]] ||
                    (( shadow_start_mono < forecast_exit_mono )); do
                if (( SECONDS >= shadow_deadline )); then
                  break
                fi
                sleep 5
                shadow_start_mono="$(unit_value lifeos-energy-shadow-learning.service ExecMainStartTimestampMonotonic)"
              done

              if [[ "$shadow_start_mono" =~ ^[0-9]+$ ]] &&
                 (( shadow_start_mono >= forecast_exit_mono )); then
                shadow_started_after_forecast="YES"
                if wait_for_settle lifeos-energy-shadow-learning.service 180 SHADOW; then
                  :
                fi
              else
                shadow_started_after_forecast="NO"
              fi
            fi
          fi
          echo "SHADOW_STARTED_AFTER_LATEST_FORECAST=$shadow_started_after_forecast"

          report_service lifeos-energy-forecast.service
          report_service lifeos-energy-shadow-learning.service
          report_service lifeos-predbat-sanity.service

          report_timer lifeos-energy-forecast.timer
          report_timer lifeos-energy-shadow-learning.timer
          report_timer lifeos-predbat-sanity.timer

          echo "DIAGNOSTIC_END=PASS"
