name: LifeOS workspace runtime diagnostic

on:
  push:
    branches: [main, fix/lifeos-workspace-runtime]
    paths:
      - '.github/workflows/lifeos-workspace-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 10
    steps:
      - name: Synchronize diagnostic checkout
        uses: actions/checkout@v4

      - name: Report fixed Energy runtime status only
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "DIAGNOSTIC_START=PASS"
          for unit in \
            lifeos-energy-forecast.service \
            lifeos-energy-forecast.timer \
            lifeos-energy-shadow-learning.service \
            lifeos-energy-shadow-learning.timer \
            lifeos-predbat-sanity.service \
            lifeos-predbat-sanity.timer; do
            echo "UNIT=$unit"
            if systemctl show "$unit" --no-pager \
              --property=LoadState,ActiveState,SubState,UnitFileState,Result,ExecMainStatus,LastTriggerUSec,NextElapseUSecRealtime; then
              :
            else
              echo "UNIT_QUERY=UNAVAILABLE"
            fi
          done
          echo "DIAGNOSTIC_END=PASS"
