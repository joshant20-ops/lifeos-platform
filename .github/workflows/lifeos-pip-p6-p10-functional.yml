name: LifeOS P6-P10 Functional Contracts
on:
  push:
    branches: [main]
    paths: ['scripts/lifeos-pip-p6-p10-core.py','tests/test_pip_p6_p10_functional.py']
  workflow_dispatch:
jobs:
  contracts:
    runs-on: [self-hosted, lifeos-pi5]
    steps:
      - uses: actions/checkout@v4
      - name: P6 Gmail disposition
        run: python3 -m pytest -q tests/test_pip_p6_p10_functional.py::test_p6_disposition_axes
      - name: P7 Continuous ingestion state
        run: python3 -m pytest -q tests/test_pip_p6_p10_functional.py::test_p7_idempotent_email_state
      - name: P8 Cross-system relationships
        run: python3 -m pytest -q tests/test_pip_p6_p10_functional.py::test_p8_relationship_idempotent
      - name: P9 Financial evidence reconciliation
        run: python3 -m pytest -q tests/test_pip_p6_p10_functional.py::test_p9_evidence_is_reference_not_ledger
      - name: P10 Continuous operation
        run: python3 -m pytest -q tests/test_pip_p6_p10_functional.py::test_p10_private_permissions_and_exception_queue
