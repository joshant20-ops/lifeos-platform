name: LifeOS Tower Current Work Diagnostic

on:
  push:
    branches: [diag/tower-current-work]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 5
    steps:
      - name: Trace recent broker workload history
        shell: bash
        run: |
          set -u
          echo '===== CURRENT TOWER STATE ====='
          timeout 5 mosquitto_sub -h 127.0.0.1 -C 1 -t lifeos/tower/state || true

          echo '===== RETAINED LEASES ====='
          timeout 4 mosquitto_sub -h 127.0.0.1 -v -W 3 -t 'lifeos/tower/lease/+' || true

          echo '===== RECENT GOVERNOR BROKER JOURNAL ====='
          journalctl -u lifeos-autonomous-agent.service \
            --since '2026-09-08 21:20:00' \
            --until '2026-09-08 21:45:00' \
            --no-pager -o short-iso | \
            grep -Ei 'BROKER|chat/completions|inference|ollama|tool|provider|request|failure' | tail -240 || true

          echo '===== RECENT ENGINEER JOURNAL ====='
          journalctl -u lifeos-engineer.service \
            --since '2026-09-08 21:20:00' \
            --until '2026-09-08 21:45:00' \
            --no-pager -o short-iso | tail -200 || true

          echo '===== RECENT AUTONOMOUS JOB JOURNAL ====='
          journalctl -u lifeos-autonomous-agent.service \
            --since '2026-09-08 21:20:00' \
            --until '2026-09-08 21:45:00' \
            --no-pager -o short-iso | tail -300 || true

          echo '===== PROCESS HISTORY HINTS ====='
          ps -eo user,pid,ppid,lstart,etimes,%cpu,%mem,cmd --sort=-%cpu | \
            grep -E 'lifeos|openhands|autonomous-agent|cloud-builder|ollama|qwen' | grep -v grep | head -80 || true

          echo 'TRACE_COMPLETE'
