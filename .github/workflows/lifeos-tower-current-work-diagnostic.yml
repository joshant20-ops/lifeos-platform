name: LifeOS Tower Current Work Diagnostic

on:
  push:
    branches: [diag/tower-current-work]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 5
    steps:
      - name: Inspect current Tower workload
        shell: bash
        run: |
          set -u
          TOWER=192.168.0.201
          SSH="ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8"

          echo '===== TOWER STATE ====='
          timeout 5 mosquitto_sub -h 127.0.0.1 -C 1 -t lifeos/tower/state || true

          echo '===== LEASE EVENTS ====='
          timeout 4 mosquitto_sub -h 127.0.0.1 -v -W 3 -t 'lifeos/tower/lease/+' | tee /tmp/lifeos-lease-snapshot.txt || true

          echo '===== ACTIVE BROKER OWNER(S) ON DOCKER ====='
          grep '"state":"active"' /tmp/lifeos-lease-snapshot.txt 2>/dev/null | sed -n 's#lifeos/tower/lease/\([0-9][0-9]*\).*#\1#p' | sort -u | while read -r pid; do
            echo "ACTIVE_BROKER_PID=$pid"
            ps -o user,pid,ppid,lstart,etimes,%cpu,%mem,cmd -p "$pid" || true
            ppid=$(ps -o ppid= -p "$pid" 2>/dev/null | tr -d ' ')
            [ -n "$ppid" ] && ps -o user,pid,ppid,lstart,etimes,%cpu,%mem,cmd -p "$ppid" || true
            ss -tpn 2>/dev/null | grep "pid=$pid," || true
          done

          echo '===== RELATED DOCKER PROCESSES ====='
          ps -eo user,pid,ppid,etimes,%cpu,%mem,cmd --sort=-%cpu | grep -E 'lifeos|openhands|autonomous-agent|cloud-builder|ollama|qwen' | grep -v grep | head -80 || true

          echo '===== OLLAMA API PS ====='
          curl -sS --max-time 10 "http://$TOWER:11434/api/ps" || true
          echo

          echo '===== TOWER SSH TEST ====='
          $SSH "$TOWER" 'hostname; id; uptime' || true

          echo '===== GPU PROCESS OWNER ====='
          $SSH "$TOWER" 'nvidia-smi --query-compute-apps=pid,process_name,used_memory --format=csv,noheader,nounits 2>/dev/null || nvidia-smi' || true

          echo '===== TOWER TOP PROCESSES ====='
          $SSH "$TOWER" 'ps -eo pid,ppid,etimes,%cpu,%mem,cmd --sort=-%cpu | head -50' || true

          echo '===== OLLAMA PROCESSES ====='
          $SSH "$TOWER" "pgrep -af 'ollama|qwen' || true" || true

          echo '===== RECENT OLLAMA LOG ====='
          $SSH "$TOWER" "journalctl -u ollama --since '-20 min' --no-pager -o short-iso 2>/dev/null | tail -120 || true" || true

          echo 'DIAGNOSTIC_COMPLETE'
