name: LifeOS PA Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-pa-deploy.yml'
      - 'governor/assistant_bridge.py'
      - 'governor/assistant_ui.html'
      - 'governor/pa_user_state.py'
      - 'homelab/live/home/joshan/automation/lifeos_task_reconciler.py'
      - 'homelab/live/opt/stacks/homeassistant/config/packages/lifeos_attention.yaml'
      - 'homelab/live/opt/stacks/homeassistant/config/packages/lifeos_actions.yaml'
      - 'homelab/live/opt/stacks/homeassistant/config/scripts/lifeos_pa_task_attention_sensor.py'
      - 'homelab/live/opt/stacks/homeassistant/config/scripts/lifeos_pa_user_action.py'
      - 'homeassistant/lifeos-dashboard.json'
      - 'homeassistant/deploy-lifeos-dashboard.py'
      - 'homeassistant/www/lifeos-pa-task-card.js'
      - 'governor/scripts/deploy-pa-task-reconciler.sh'
      - 'scripts/accept-pa-governed-actions.py'
      - 'tests/personal_admin/test_pa_user_state.py'
      - 'tests/personal_admin/test_assistant_pa_actions.py'
      - 'governor/scripts/deploy-ha-assistant.sh'
      - 'homelab/live/usr/local/sbin/lifeos-deploy-gateway'

permissions:
  contents: read

concurrency:
  group: lifeos-pa-deploy
  cancel-in-progress: false

jobs:
  deploy-and-accept:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Align canonical checkout
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain)"
      - name: Refresh fixed deployment gateway
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          sudo -n install -o root -g root -m 0755 homelab/live/usr/local/sbin/lifeos-deploy-gateway /usr/local/sbin/lifeos-deploy-gateway
          cmp -s homelab/live/usr/local/sbin/lifeos-deploy-gateway /usr/local/sbin/lifeos-deploy-gateway
      - name: Deploy and accept LifeOS PA
        run: |
          set -Eeuo pipefail
          sudo -n /usr/local/sbin/lifeos-deploy-gateway deploy-pa-task-reconciler
          sudo -n /usr/local/sbin/lifeos-deploy-gateway deploy-lifeos-assistant
          sudo -n python3 /home/joshan/lifeos-platform/scripts/accept-pa-governed-actions.py
