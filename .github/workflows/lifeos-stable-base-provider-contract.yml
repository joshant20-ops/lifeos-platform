name: LifeOS Stable Base Provider Contract

on:
  pull_request:
    paths:
      - 'governor/policy.json'
      - 'engineer/provider_router.py'
      - 'tests/test_stable_base_provider_contract.py'
      - '.github/workflows/lifeos-stable-base-provider-contract.yml'
  push:
    branches: [main]
    paths:
      - 'governor/policy.json'
      - 'engineer/provider_router.py'
      - 'tests/test_stable_base_provider_contract.py'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install pytest
      - name: Prove private-local and normal-Codex routing
        run: python3 -m pytest -q tests/test_stable_base_provider_contract.py
