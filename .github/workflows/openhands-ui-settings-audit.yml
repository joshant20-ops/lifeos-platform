name: OpenHands UI Settings Audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/openhands-ui-settings-audit.yml', '.github/workflows/openhands-native-ui-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 5
    steps:
      - name: Inspect effective UI configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -s <<'REMOTE'
          set -Eeuo pipefail
          echo SERVICE
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user show lifeos-openhands-ui.service -p ExecStart --no-pager
          echo RUNTIME_MODE
          execstart=$(systemctl --user show lifeos-openhands-ui.service -p ExecStart --value)
          if grep -q 'ghcr.io/openhands/agent-canvas:1.23.0' <<<"$execstart"; then
            docker inspect lifeos-agent-canvas --format '{{.Config.Image}}' | grep -qx 'ghcr.io/openhands/agent-canvas:1.23.0'
            curl -fsS http://127.0.0.1:8000/canvas/ >/dev/null
            echo OPENHANDS_AGENT_CANVAS_SETTINGS_AUDIT=PASS
          else
            echo PROCESS_ENV_KEYS
            pid=$(systemctl --user show -p MainPID --value lifeos-openhands-ui.service)
            tr '\0' '\n' <"/proc/$pid/environ" | grep -E '^(LLM_BASE_URL|LLM_API_KEY|LLM_MODEL)=' | sed -E 's/=.*/=<present>/'
          fi
          echo CANVAS_WORKSPACE_DIAGNOSTICS
          docker exec lifeos-agent-canvas sh -c 'echo "PWD=$(pwd)"; echo "WORKSPACE_TREE"; find /home/openhands/workspace -maxdepth 4 -printf "%y %p\n" 2>/dev/null | head -200; echo "CONVERSATION_METADATA"; grep -R -n -E "9a36222cb4d34973a8f54da325026c8c|canvas-acceptance|workspace" /home/openhands/.openhands/agent-canvas/conversations 2>/dev/null | head -120 || true' || true
          echo CANVAS_RUNTIME_BUNDLE_ANCHORS
          docker exec lifeos-agent-canvas sh -c 'grep -rhoE "conversationUrl:[A-Za-z_$][A-Za-z0-9_$]*,sessionApiKey:[A-Za-z_$][A-Za-z0-9_$]*" /opt/agent-canvas/frontend/assets/*.js 2>/dev/null | sort -u | head -30; grep -rhoE "new [A-Za-z_$][A-Za-z0-9_$]*\\([^)]*conversationUrl:[^)]{0,160}" /opt/agent-canvas/frontend/assets/*.js 2>/dev/null | head -30' || true
          echo CANVAS_RECENT_LOGS
          docker logs --tail 300 lifeos-agent-canvas 2>&1 | grep -E 'workspace|file|401|404|500|9a36222c' | tail -120 || true
          echo DISABLE_SWITCH_LLM_TOOL
          api_key="$(docker exec lifeos-agent-canvas sh -c 'cat /home/openhands/.openhands/agent-canvas/api-key.txt')"
          test -n "$api_key"
          curl -fsS -X PATCH -H "X-Session-API-Key: $api_key" -H 'Content-Type: application/json' --data '{"agent_settings_diff":{"enable_switch_llm_tool":false}}' http://127.0.0.1:18000/api/settings >/tmp/openhands-settings-patch.json
          python -c 'import json; o=json.load(open("/tmp/openhands-settings-patch.json")); assert o["agent_settings"]["enable_switch_llm_tool"] is False'
          docker exec lifeos-agent-canvas python -c 'import json,pathlib; o=json.loads(pathlib.Path("/home/openhands/.openhands/settings.json").read_text()); a=o.get("agent_settings") or {}; assert a.get("enable_switch_llm_tool") is False; print("OPENHANDS_SWITCH_LLM_DISABLED=PASS")'
          systemctl --user restart lifeos-openhands-ui.service
          for _ in $(seq 1 60); do curl -fsS --connect-timeout 2 http://127.0.0.1:18000/alive >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:18000/alive >/dev/null
          api_key="$(docker exec lifeos-agent-canvas sh -c 'cat /home/openhands/.openhands/agent-canvas/api-key.txt')"
          curl -fsS -H "X-Session-API-Key: $api_key" http://127.0.0.1:18000/api/settings >/tmp/openhands-settings-after-restart.json
          python -c 'import json; o=json.load(open("/tmp/openhands-settings-after-restart.json")); assert o["agent_settings"]["enable_switch_llm_tool"] is False; print("OPENHANDS_SWITCH_LLM_PERSISTENCE=PASS")'
          echo SWITCH_LLM_SUPPORTED_FIX
          docker exec lifeos-agent-canvas python -c 'import importlib.metadata as md; print("agent_server_version=" + md.version("openhands-agent-server"))'
          docker exec lifeos-agent-canvas python -c 'import json,pathlib; p=pathlib.Path("/home/openhands/.openhands/settings.json"); o=json.loads(p.read_text()); a=o.get("agent_settings") or o.get("agent") or {}; print("settings_enable_switch_llm_tool=" + repr(a.get("enable_switch_llm_tool","<absent>")))'
          docker exec lifeos-agent-canvas sh -c 'for p in /home/openhands/.openhands/agent-profiles/*.json; do test -f "$p" || continue; python -c '"'"'import json,sys,pathlib; p=pathlib.Path(sys.argv[1]); o=json.loads(p.read_text()); print("profile="+p.name+" enable_switch_llm_tool="+repr(o.get("enable_switch_llm_tool","<absent>")))'"'"' "$p"; done'
          echo STATE_FILES
          find "$HOME/.openhands" "$HOME/.config/openhands" -maxdepth 3 -type f -printf '%p\n' 2>/dev/null || true

          REMOTE
