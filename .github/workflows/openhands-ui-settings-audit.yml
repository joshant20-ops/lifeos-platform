name: OpenHands UI Settings Audit

on:
  workflow_run:
    workflows: ["OpenHands Native UI Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openhands-ui-settings-audit
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 10
    steps:
      - name: Prove deployed GPT-OSS profile is active and persistent
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname)" == "Docker" ]]

          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"

          systemctl --user is-active --quiet lifeos-openhands-ui.service
          systemctl --user is-active --quiet lifeos-openhands-tls.service
          docker inspect lifeos-agent-canvas --format '{{.Config.Image}}' |
            grep -qx 'ghcr.io/openhands/agent-canvas:1.23.0'
          curl -fsS http://127.0.0.1:18000/alive >/dev/null
          curl -kfsS https://127.0.0.1:8443/canvas/ >/dev/null
          echo "OPENHANDS_AGENT_CANVAS_AUDIT=PASS"

          verify_persisted_state() {
            local phase="$1"
            local api_key
            api_key="$(docker exec lifeos-agent-canvas               cat /home/openhands/.openhands/agent-canvas/api-key.txt)"
            test -n "$api_key"

            docker exec lifeos-agent-canvas python - <<'PY'
          import json
          from pathlib import Path

          profile_root = Path("/home/openhands/.openhands/profiles")
          accepted = profile_root / "gptoss20b.json"
          retired = profile_root / "qwen25coder7b-instruct.json"
          assert accepted.is_file(), accepted
          assert not retired.exists(), retired

          profile = json.loads(accepted.read_text())
          assert profile["model"] == "openai/gpt-oss:20b"
          assert profile["base_url"] == "http://127.0.0.1:18114/v1"
          assert profile["native_tool_calling"] is True

          settings = json.loads(
              Path("/home/openhands/.openhands/settings.json").read_text()
          )
          agent = settings["agent_settings"]
          llm = agent["llm"]
          assert llm["model"] == "openai/gpt-oss:20b"
          assert llm["base_url"] == "http://127.0.0.1:18114/v1"
          assert llm["native_tool_calling"] is True
          assert agent["enable_switch_llm_tool"] is False
          assert settings["conversation_settings"]["security_analyzer"] is None
          print("OPENHANDS_GPT_OSS_FILES_PERSISTED=PASS")
          PY

            python3 - "$api_key" <<'PY'
          import json
          import sys
          import urllib.request

          key = sys.argv[1]
          base = "http://127.0.0.1:18000"
          headers = {"X-Session-API-Key": key}

          def get(path):
              request = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None

          profiles = get("/api/profiles")
          names = [
              item.get("name") if isinstance(item, dict) else item
              for item in profiles.get("profiles", [])
          ]
          assert "gpt-oss-20b" in names, names
          assert profiles.get("active_profile") == "gpt-oss-20b", profiles

          settings = get("/api/settings")
          agent = settings["agent_settings"]
          llm = agent["llm"]
          assert llm["model"] == "openai/gpt-oss:20b"
          assert llm["base_url"] == "http://127.0.0.1:18114/v1"
          assert llm["native_tool_calling"] is True
          assert agent["enable_switch_llm_tool"] is False
          assert settings["conversation_settings"]["security_analyzer"] is None
          print("OPENHANDS_GPT_OSS_API_PROFILE_ACTIVE=PASS")
          PY
            echo "OPENHANDS_GPT_OSS_STATE_${phase}=PASS"
          }

          verify_persisted_state BEFORE_RESTART

          systemctl --user restart lifeos-openhands-ui.service
          for _ in $(seq 1 60); do
            curl -fsS --connect-timeout 2               http://127.0.0.1:18000/alive >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:18000/alive >/dev/null

          verify_persisted_state AFTER_RESTART

          docker exec lifeos-agent-canvas test -d /projects/lifeos-platform/.git
          docker exec lifeos-agent-canvas             git -C /projects/lifeos-platform remote get-url origin |
            grep -qx 'https://github.com/joshant20-ops/lifeos-platform.git'

          echo "OPENHANDS_GPT_OSS_ACTIVE_PROFILE=PASS"
          echo "OPENHANDS_GPT_OSS_PERSISTENCE=PASS"
          echo "OPENHANDS_SWITCH_LLM_DISABLED=PASS"
          echo "OPENHANDS_ACCEPTED_ARCHITECTURE_UNCHANGED=PASS"
          echo "OPENHANDS_UI_SETTINGS_AUDIT=PASS"
