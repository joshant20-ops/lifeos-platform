name: OpenHands UI Settings Audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/openhands-ui-settings-audit.yml', '.github/workflows/openhands-native-ui-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 5
    steps:
      - name: Inspect effective UI configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -s <<'REMOTE'
          set -Eeuo pipefail
          echo SERVICE
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user show lifeos-openhands-ui.service -p ExecStart --no-pager
          echo RUNTIME_MODE
          execstart=$(systemctl --user show lifeos-openhands-ui.service -p ExecStart --value)
          if grep -q 'ghcr.io/openhands/agent-canvas:1.23.0' <<<"$execstart"; then
            docker inspect lifeos-agent-canvas --format '{{.Config.Image}}' | grep -qx 'ghcr.io/openhands/agent-canvas:1.23.0'
            curl -fsS http://127.0.0.1:8000/canvas/ >/dev/null
            echo OPENHANDS_AGENT_CANVAS_SETTINGS_AUDIT=PASS
          else
            echo PROCESS_ENV_KEYS
            pid=$(systemctl --user show -p MainPID --value lifeos-openhands-ui.service)
            tr '\0' '\n' <"/proc/$pid/environ" | grep -E '^(LLM_BASE_URL|LLM_API_KEY|LLM_MODEL)=' | sed -E 's/=.*/=<present>/'
          fi
          echo CANVAS_WORKSPACE_DIAGNOSTICS
          docker exec lifeos-agent-canvas sh -c 'echo "PWD=$(pwd)"; echo "WORKSPACE_TREE"; find /home/openhands/workspace -maxdepth 4 -printf "%y %p\n" 2>/dev/null | head -200; echo "CONVERSATION_METADATA"; grep -R -n -E "9a36222cb4d34973a8f54da325026c8c|canvas-acceptance|workspace" /home/openhands/.openhands/agent-canvas/conversations 2>/dev/null | head -120 || true' || true
          echo CANVAS_RUNTIME_BUNDLE_ANCHORS
          docker exec lifeos-agent-canvas sh -c 'grep -rhoE "conversationUrl:[A-Za-z_$][A-Za-z0-9_$]*,sessionApiKey:[A-Za-z_$][A-Za-z0-9_$]*" /opt/agent-canvas/frontend/assets/*.js 2>/dev/null | sort -u | head -30; grep -rhoE "new [A-Za-z_$][A-Za-z0-9_$]*\\([^)]*conversationUrl:[^)]{0,160}" /opt/agent-canvas/frontend/assets/*.js 2>/dev/null | head -30' || true
          echo CANVAS_RECENT_LOGS
          docker logs --tail 300 lifeos-agent-canvas 2>&1 | grep -E 'workspace|file|401|404|500|9a36222c' | tail -120 || true
          echo STATE_FILES
          find "$HOME/.openhands" "$HOME/.config/openhands" -maxdepth 3 -type f -printf '%p\n' 2>/dev/null || true

          echo ENGINEER_AUTOMATION_SCHEMA
          ssh -o BatchMode=yes Engineer 'bash -s' <<'ENGINEER'
          set -Eeuo pipefail
          docker run --rm --user root -v "$HOME/.openhands:/src:ro" --entrypoint python ghcr.io/openhands/agent-canvas:1.23.0 -c '
import sqlite3
p="/src/automation/automations.db"
db=sqlite3.connect("file:"+p+"?mode=ro",uri=True)
for name,sql in db.execute("select name,sql from sqlite_master where type in (\"table\",\"index\") order by type,name"):
 print(name, sql)
for (name,) in db.execute("select name from sqlite_master where type=\"table\" and name not like \"sqlite_%\""):
 try: print("COUNT",name,db.execute("select count(*) from \""+name+"\"").fetchone()[0])
 except Exception as e: print("COUNT_ERROR",name,type(e).__name__)
'
          ENGINEER

          echo ENGINEER_MIGRATABLE_STATE_INVENTORY
          ssh -o BatchMode=yes Engineer 'bash -s' <<'ENGINEER'
          set -Eeuo pipefail
          docker run --rm --user root -v "$HOME/.openhands:/src:ro" --entrypoint /bin/sh ghcr.io/openhands/agent-canvas:1.23.0 -c '
            find /src -maxdepth 5 -type f -printf "%P|%s bytes\n" 2>/dev/null |
            grep -Ei "(automat|task|skill|setting|profile|preference|personal|prompt|instruction|mcp|integration)" |
            grep -Evi "(conversation|workspace|session|token|secret|credential|api.?key|auth)" |
            sort | head -400
          '
          ENGINEER

          echo ENGINEER_PROFILE_SHAPE_REDACTED
          ssh -o BatchMode=yes Engineer 'find "$HOME/.openhands" -type f \( -path "*/llm-profiles/*.json" -o -path "*/agent-profiles/*.json" \) -maxdepth 5 -print -exec sed -E "s/(api[_-]?key|token|secret|password|credential|auth)([\\" ]*[:=][\\" ]*)[^,\\\" ]+/\\1\\2<redacted>/Ig" {} \; 2>/dev/null || true'
          REMOTE
