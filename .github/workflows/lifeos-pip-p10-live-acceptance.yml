name: LifeOS P10 Live Continuous Acceptance
on:
  push:
    branches: [main]
    paths: ['scripts/lifeos-pip-p10-live-acceptance.py','scripts/lifeos-pip-p6-p10-core.py','governor/systemd/lifeos-pip-continuous.service','governor/systemd/lifeos-pip-continuous.timer']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  acceptance:
    runs-on: [self-hosted, lifeos-pi5]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile canonical checkout
        run: |
          git -C /home/joshan/lifeos-platform fetch origin main
          test -z "$(git -C /home/joshan/lifeos-platform status --porcelain)"
          git -C /home/joshan/lifeos-platform merge --ff-only origin/main
      - name: P5-P10 regression contracts
        run: python3 -m pytest -q tests/test_pip_p6_p10_functional.py tests/test_pip_p4_exception_semantics.py
      - name: Continuous runtime audit
        run: |
          systemctl is-enabled lifeos-pip-continuous.timer
          systemctl is-active lifeos-pip-continuous.timer
          systemctl cat lifeos-pip-continuous.service | grep -F 'lifeos-pip-cross-system-init.py'
          systemctl cat lifeos-pip-continuous.service | grep -F 'lifeos-pip-p5-inventory-runner.py'
          systemctl cat lifeos-pip-continuous.service | grep -F 'lifeos-pip-p5-semantic-batch.py --limit 50'
          echo P10_CONTINUOUS_TIMER=PASS
      - name: Live production-state canary
        run: python3 /home/joshan/lifeos-platform/scripts/lifeos-pip-p10-live-acceptance.py
      - name: Service execution and recovery audit
        run: |
          before=$(systemctl show lifeos-pip-continuous.service -p NRestarts --value)
          systemctl start lifeos-pip-continuous.service
          systemctl is-failed --quiet lifeos-pip-continuous.service && exit 1 || true
          systemctl show lifeos-pip-continuous.service -p Result --value | grep -Fx success
          after=$(systemctl show lifeos-pip-continuous.service -p NRestarts --value)
          test "$after" -ge "$before"
          echo P10_SERVICE_EXECUTION=PASS
      - name: Post-deploy audit
        run: |
          test "$(stat -c %a /home/joshan/.local/state/lifeos/pip)" = 700
          test "$(stat -c %a /home/joshan/.local/state/lifeos/pip/cross_system.sqlite3)" = 600
          test -z "$(git -C /home/joshan/lifeos-platform status --porcelain)"
          echo P10_POST_DEPLOY_AUDIT=PASS
          echo P10_FULL_ACCEPTANCE=PASS
