name: LifeOS Pi Automation Health

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-pi-auto-smoke.yml'
      - 'homelab/live/usr/local/sbin/lifeos-deploy-gateway'
      - 'scripts/lifeos-worker-dispatcher-split-audit.sh'
      - 'scripts/lifeos-install-github-runner-gateway.sh'
      - 'scripts/lifeos-bootstrap-github-runner.sh'
  issues:
    types: [opened]
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: lifeos-pi5-automation-health
  cancel-in-progress: false

jobs:
  health:
    if: github.event_name != 'issues' || github.event.issue.title == 'LifeOS Pi Auto Smoke Trigger' || github.event.issue.title == 'LifeOS Pi Health Trigger'
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronise canonical Pi checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          test "$RUNNER_ARCH" = ARM64
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "PLATFORM_HEAD=$(git rev-parse HEAD)"

      - name: Execute allow-listed post-retirement health audit
        id: health_audit
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/lifeos-evidence"
          set +e
          sudo -n /usr/local/sbin/lifeos-deploy-gateway audit-dispatcher-retirement \
            2>&1 | tee "$RUNNER_TEMP/lifeos-evidence/gateway.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E '^[A-Z0-9_]+=' "$RUNNER_TEMP/lifeos-evidence/gateway.log" \
            > "$RUNNER_TEMP/lifeos-evidence/result.env" || true
          echo "GATEWAY_RC=$rc" | tee -a "$RUNNER_TEMP/lifeos-evidence/result.env"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Publish machine-readable evidence to issue 29
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/lifeos-evidence"
          evidence="$RUNNER_TEMP/lifeos-evidence/result.env"
          if [[ ! -f "$evidence" ]]; then
            printf '%s\n' 'GATEWAY_RESULT=NO_EVIDENCE' 'GATEWAY_RC=unknown' > "$evidence"
          fi
          {
            echo '### LifeOS Pi automation health evidence'
            echo
            echo "- event: $GITHUB_EVENT_NAME"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- commit: $GITHUB_SHA"
            echo "- runner: $RUNNER_NAME"
            echo
            echo '```text'
            cat "$evidence"
            echo '```'
          } > "$RUNNER_TEMP/lifeos-evidence/issue-comment.md"
          gh issue comment 29 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/lifeos-evidence/issue-comment.md"

      - name: Escalate failed automation health
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          title='LifeOS automation health failure'
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1 || true)
          {
            echo 'The automatic Pi health gate failed.'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo
            echo 'Machine-readable evidence is also recorded in #29.'
          } > "$RUNNER_TEMP/lifeos-evidence/failure.md"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/lifeos-evidence/failure.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/lifeos-evidence/failure.md"
          fi

      - name: Close successful explicit health trigger
        if: success() && github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh issue close '${{ github.event.issue.number }}' --repo "$GITHUB_REPOSITORY" \
            --comment "Automatic Pi health gate passed in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upload health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-pi-automation-health-${{ github.run_id }}
          path: ${{ runner.temp }}/lifeos-evidence/
          if-no-files-found: warn
          retention-days: 30
