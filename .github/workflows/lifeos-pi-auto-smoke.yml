name: LifeOS Pi Auto Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-pi-auto-smoke.yml'
      - 'homelab/live/usr/local/sbin/lifeos-deploy-gateway'
      - 'scripts/lifeos-install-github-runner-gateway.sh'
      - 'scripts/lifeos-bootstrap-github-runner.sh'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: lifeos-pi5-auto-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name != 'issues' || github.event.issue.title == 'LifeOS Pi Auto Smoke Trigger'
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronise canonical Pi checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          test "$RUNNER_ARCH" = ARM64
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "PLATFORM_HEAD=$(git rev-parse HEAD)"

      - name: Execute read-only deployment-gateway smoke audit
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/lifeos-evidence"
          set +e
          sudo -n /usr/local/sbin/lifeos-deploy-gateway audit-dispatcher-retirement \
            2>&1 | tee "$RUNNER_TEMP/lifeos-evidence/gateway.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E '^[A-Z0-9_]+=' "$RUNNER_TEMP/lifeos-evidence/gateway.log" \
            > "$RUNNER_TEMP/lifeos-evidence/result.env" || true
          echo "GATEWAY_RC=$rc" | tee -a "$RUNNER_TEMP/lifeos-evidence/result.env"
          exit "$rc"

      - name: Publish machine-readable evidence to issue 29
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/lifeos-evidence"
          evidence="$RUNNER_TEMP/lifeos-evidence/result.env"
          if [[ ! -f "$evidence" ]]; then
            printf '%s\n' 'GATEWAY_RESULT=NO_EVIDENCE' 'GATEWAY_RC=unknown' > "$evidence"
          fi
          {
            echo '### LifeOS Pi automatic smoke evidence'
            echo
            echo "- event: $GITHUB_EVENT_NAME"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- commit: $GITHUB_SHA"
            echo "- runner: $RUNNER_NAME"
            echo
            echo '```text'
            cat "$evidence"
            echo '```'
          } > "$RUNNER_TEMP/lifeos-evidence/issue-comment.md"
          gh issue comment 29 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/lifeos-evidence/issue-comment.md"

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-pi-auto-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/lifeos-evidence/
          if-no-files-found: warn
          retention-days: 30
