name: LifeOS Reconcile Canonical Checkout

on:
  push:
    branches:
      - ops/cleanup-canonical-paste-artifacts

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 5
    steps:
      - name: Fast-forward clean canonical checkout only
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main

          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo 'CANONICAL_RECONCILE=BLOCKED_DIRTY'
            git status --short
            exit 20
          fi

          head="$(git rev-parse HEAD)"
          origin="$(git rev-parse origin/main)"
          echo "HEAD_BEFORE=$head"
          echo "ORIGIN_MAIN=$origin"

          if [[ "$head" != "$origin" ]]; then
            git merge-base --is-ancestor "$head" "$origin" || {
              echo 'CANONICAL_RECONCILE=BLOCKED_NON_FAST_FORWARD'
              exit 20
            }
            git merge --ff-only origin/main
          fi

          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "PLATFORM_HEAD=$(git rev-parse HEAD)"
          echo 'CANONICAL_RECONCILE=PASS'
