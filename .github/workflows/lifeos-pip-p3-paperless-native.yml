name: LifeOS P3 Paperless Native Configuration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/lifeos-pip-p3-paperless-native-config.py', 'scripts/lifeos-pip-p3-paperless-native-config.sh', '.github/workflows/lifeos-pip-p3-paperless-native.yml']
permissions:
  contents: read
jobs:
  native-configuration:
    runs-on: [self-hosted, lifeos-pi5]
    timeout-minutes: 20
    steps:
      - name: Reconcile clean canonical checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          repo=/home/joshan/lifeos-platform
          git -C "$repo" fetch origin main
          test -z "$(git -C "$repo" status --porcelain)"
          test "$(git -C "$repo" rev-parse HEAD)" = "$(git -C "$repo" merge-base HEAD origin/main)"
          git -C "$repo" merge --ff-only origin/main
          echo 'CANONICAL_CHECKOUT=PASS'
      - name: Activate bounded native Paperless matchers
        shell: bash
        run: |
          set -Eeuo pipefail
          output=/tmp/lifeos-pip-p3-paperless-native.txt
          bash /home/joshan/lifeos-platform/scripts/lifeos-pip-p3-paperless-native-config.sh | tee "$output"
          for marker in 'DOCUMENT_TYPE_AMBIGUOUS_DOCUMENTS=0' 'DOCUMENT_TYPE_CONFLICTING_DOCUMENTS=0' 'PRODUCTION_DOCUMENT_MUTATION=NONE' 'TOWER_AI_USED=NO' 'LIFEOS_CLASSIFIER_BUILT=NO' 'PRIVATE_FIELDS_EMITTED=NONE' 'PRIVACY_LOCAL_ONLY=PASS' 'NATIVE_CONFIGURATION_IDEMPOTENT=PASS' 'REVERSIBLE_TRANSACTION_GUARD=PASS' 'P3_SCOPE=PAPERLESS_NATIVE_CONFIGURATION_ONLY' 'RESULT=PASS'; do grep -qx "$marker" "$output"; done
      - name: Verify clean canonical checkout
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(git -C /home/joshan/lifeos-platform status --porcelain)"
          rm -f /tmp/lifeos-pip-p3-paperless-native.txt
          echo 'CANONICAL_CLEAN=PASS'
