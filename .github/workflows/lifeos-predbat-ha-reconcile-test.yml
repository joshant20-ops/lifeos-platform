name: LifeOS Predbat HA Reconcile Test
on:
  push:
    branches: [main]
    paths:
      - 'deploy-triggers/predbat-ha-reconcile-test'
jobs:
  reconcile:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 10
    steps:
      - name: Synchronize canonical checkout
        run: |
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain)"
      - name: Refresh gateway
        run: sudo -n /home/joshan/lifeos-platform/scripts/lifeos-install-github-runner-gateway.sh
      - name: Restart HA and test reconciliation
        run: sudo -n /usr/local/sbin/lifeos-deploy-gateway predbat-ha-reconcile-test
