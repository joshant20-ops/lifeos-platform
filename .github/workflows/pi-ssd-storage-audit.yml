name: Pi SSD Targeted Storage Audit

on:
  push:
    branches:
      - ops/ssd-storage-audit-20261016
    paths:
      - .github/workflows/pi-ssd-storage-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 30
    steps:
      - name: Prove storage usage and candidate inactivity
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee "$RUNNER_TEMP/pi-storage-audit.log") 2>&1
          SSD=/mnt/docker-data
          CANDIDATES=(/mnt/docker-data/pre_day7_backup /mnt/docker-data/host-data/opt-stacks)
          echo '=== PI_STORAGE_AUDIT_BEGIN ==='
          date -u '+UTC=%Y-%m-%dT%H:%M:%SZ'
          echo '--- filesystems and SSD identity ---'
          df -hT / /opt /home /var/lib /var/log /var/mail "$SSD" 2>&1 || true
          findmnt -no SOURCE,TARGET,FSTYPE,OPTIONS -T "$SSD" || true
          sudo blkid -o full /dev/sda1 || true
          sudo findmnt -R "$SSD" || true
          echo '--- fstab mount policy ---'
          sudo grep -nE '^[[:space:]]*[^#].*(a53fd6a0-c498-4b76-a496-0e5d9233447f|docker-data|opt/stacks)' /etc/fstab || true
          sudo systemctl status mnt-docker\\x2ddata.mount --no-pager || true
          sudo systemctl show mnt-docker\\x2ddata.mount -p Id -p ActiveState -p FragmentPath -p Requires -p After -p Before -p What -p Where -p Options || true
          sudo systemctl cat mnt-docker\\x2ddata.mount docker.service containerd.service actions.runner.joshant20-ops-lifeos-platform.lifeos-pi5.service 2>&1 || true
          echo '--- runner workspace location ---'
          for p in /opt/actions-runner-lifeos /opt/actions-runner-lifeos/_work /home/joshan/actions-runner/_work; do
            [[ -e "$p" ]] || continue
            echo "RUNNER_PATH=$p REAL=$(readlink -f "$p")"
            findmnt -no SOURCE,TARGET,FSTYPE,OPTIONS -T "$p" || true
            df -hT "$p" || true
            sudo du -shx "$p" 2>/dev/null || true
          done
          sudo systemctl show actions.runner.joshant20-ops-lifeos-platform.lifeos-pi5.service -p User -p Group -p WorkingDirectory -p ExecStart -p Environment -p FragmentPath -p DropInPaths 2>&1 || true
          echo '--- candidate mount and metadata ---'
          for p in "${CANDIDATES[@]}"; do
            echo "PATH=$p"
            if [[ -e "$p" ]]; then
              sudo stat -c 'TYPE=%F DEV=%d INODE=%i SIZE=%s MTIME=%y CTIME=%z' "$p"
              sudo findmnt -no SOURCE,TARGET,FSTYPE,OPTIONS -T "$p" || true
              sudo du -shx "$p"
              sudo find "$p" -xdev -mindepth 1 -maxdepth 2 -printf '%y %s %T@ %p\\n' 2>/dev/null | sort -nr | sed -n '1,80p'
            else
              echo MISSING
            fi
          done
          echo '--- Docker and containerd configured roots ---'
          sudo docker info --format 'DockerRootDir={{.DockerRootDir}} Driver={{.Driver}}' || true
          sudo systemctl show docker.service containerd.service -p Id -p ActiveState -p FragmentPath -p DropInPaths
          sudo rg -n -o --no-heading '(/mnt/docker-data/pre_day7_backup|/mnt/docker-data/host-data/opt-stacks|/mnt/docker-data/containerd|/var/lib/containerd|/var/lib/docker)' /etc/docker /etc/containerd /etc/systemd/system /usr/lib/systemd/system /lib/systemd/system 2>/dev/null || true
          echo '--- active container states and mount sources ---'
          ids=$(sudo docker ps -aq)
          if [[ -n "$ids" ]]; then
            sudo docker inspect $ids | python3 -c 'import json,sys; xs=json.load(sys.stdin); [print("CONTAINER",x.get("Name","").lstrip("/"),"STATE",x.get("State",{}).get("Status"),"IMAGE",x.get("Config",{}).get("Image"),"MOUNTS",json.dumps([{"source":m.get("Source"),"destination":m.get("Destination"),"type":m.get("Type")} for m in x.get("Mounts",[])],sort_keys=True)) for x in xs]'
          else
            echo NO_CONTAINERS
          fi
          echo '--- active processes with open descriptors under candidate paths ---'
          sudo python3 - "${CANDIDATES[@]}" <<'PY'
          import glob, os, sys
          targets=[os.path.realpath(x) for x in sys.argv[1:]]
          found=0
          for proc in glob.glob('/proc/[0-9]*'):
              pid=proc.rsplit('/',1)[-1]
              try:
                  name=open(proc+'/comm',encoding='utf-8',errors='replace').read().strip()
              except OSError:
                  continue
              for fd in glob.glob(proc+'/fd/*'):
                  try: link=os.readlink(fd)
                  except OSError: continue
                  if any(link == t or link.startswith(t+'/') for t in targets):
                      print(f'OPEN_FD pid={pid} comm={name} fd={fd.rsplit("/",1)[-1]} path={link}')
                      found+=1
                      if found>=200: break
              if found>=200: break
          print('OPEN_FD_MATCH_COUNT_AT_LEAST='+str(found))
          PY
          echo '--- systemd, Docker, compose, and LifeOS repository path references ---'
          for root in /etc/systemd /etc/docker /etc/containerd /opt/stacks /home/joshan/lifeos-platform /home/joshan/automation /home/joshan/opt; do
            [[ -e "$root" ]] || continue
            echo "SCAN_ROOT=$root"
            sudo rg -n -o --hidden --no-ignore --glob '!**/.git/**' --glob '!**/node_modules/**' --glob '!**/venv/**' --glob '!**/cache/**' --glob '!**/logs/**' --glob '!**/*.log' --glob '!**/*.sqlite*' --glob '!**/*.db*' '(/mnt/docker-data/pre_day7_backup|/mnt/docker-data/host-data/opt-stacks|pre_day7_backup|host-data/opt-stacks)' "$root" 2>/dev/null || true
          done
          echo '--- persistent data still on SD: bounded inventory ---'
          for p in /opt /home/joshan /var/lib /var/log /var/mail; do
            [[ -e "$p" ]] || continue
            echo "DU_ROOT=$p"
            sudo du -xhd2 "$p" 2>/dev/null | sort -h | tail -60 || true
          done
          echo '--- automation retention data layout ---'
          for p in /mnt/docker-data/automation/backups /mnt/docker-data/automation/repair_lifecycle/snapshots /mnt/docker-data/automation/queues /mnt/docker-data/automation/logs; do
            [[ -e "$p" ]] || continue
            echo "SSD_DATA_PATH=$p"
            sudo du -shx "$p" || true
            sudo find "$p" -xdev -mindepth 1 -maxdepth 2 -printf '%y %s %TY-%Tm-%TdT%TH:%TM:%TS %p\\n' 2>/dev/null | sort -k4 | tail -120 || true
          done
          echo '--- SD application and state locations ---'
          for p in /home/joshan/.local/share /home/joshan/paperless /home/joshan/docker/matter-server /home/joshan/opt /home/joshan/automation_sd_backup /var/mail/joshan /var/swap; do
            [[ -e "$p" ]] || continue
            echo "SD_STATE_PATH=$p REAL=$(readlink -f "$p")"
            findmnt -no SOURCE,TARGET,FSTYPE,OPTIONS -T "$p" || true
            sudo du -shx "$p" 2>/dev/null || true
            sudo find "$p" -xdev -mindepth 1 -maxdepth 2 -printf '%y %s %TY-%Tm-%TdT%TH:%TM:%TS %p\\n' 2>/dev/null | sort -nr -k2 | head -80 || true
          done
          sudo swapon --show --bytes || true
          sudo grep -nE 'swap|docker-data|a53fd6a0-c498-4b76-a496-0e5d9233447f' /etc/fstab || true
          echo '--- related storage topology and services ---'
          sudo systemctl list-units --all --type=mount --no-legend --no-pager
          sudo systemctl list-units --state=running --type=service --no-legend --no-pager | sed -n '1,160p'
          echo '=== PI_STORAGE_AUDIT_COMPLETE ==='
      - name: Upload read-only audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-storage-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/pi-storage-audit.log
          if-no-files-found: ignore
          retention-days: 30
