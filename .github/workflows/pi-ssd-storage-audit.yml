name: Pi SSD Targeted Storage Audit

on:
  push:
    branches:
      - ops/ssd-storage-audit-20261016
    paths:
      - .github/workflows/pi-ssd-storage-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 15
    steps:
      - name: Targeted SSD audit
        shell: bash
        run: |
          set -uo pipefail
          SSD=/mnt/docker-data
          echo '=== TARGETED_STORAGE_AUDIT_BEGIN ==='
          df -hT / "$SSD"

          for d in automation pre_day7_backup host-data; do
            P="$SSD/$d"
            echo
            echo "=== $P ==="
            if [[ -d "$P" ]]; then
              echo '--- level 1 ---'
              sudo du -xhd1 "$P" 2>/dev/null | sort -h | tail -40
              echo '--- level 2 largest ---'
              sudo du -xhd2 "$P" 2>/dev/null | sort -h | tail -50
              echo '--- files over 500 MiB ---'
              sudo find "$P" -xdev -type f -size +500M -printf '%s %p\n' 2>/dev/null |
                sort -nr | awk '{s=$1;$1="";printf "%.2f GB %s\n",s/1073741824,$0}' | head -40
            else
              echo MISSING
            fi
          done

          echo
          echo '=== HOST-DATA MIGRATION COPY CHECK ==='
          if [[ -d "$SSD/host-data/opt-stacks" ]]; then
            sudo du -sh "$SSD/host-data/opt-stacks"
            echo 'Top-level source vs candidate:'
            sudo du -sh /opt/stacks "$SSD/host-data/opt-stacks" 2>/dev/null || true
            echo 'Candidate newest files:'
            sudo find "$SSD/host-data/opt-stacks" -xdev -type f -printf '%T@ %s %p\n' 2>/dev/null |
              sort -nr | head -20 | cut -d' ' -f2-
          else
            echo 'No opt-stacks candidate present.'
          fi

          echo
          echo '=== DOCKER RECLAIMABLE SUMMARY ==='
          sudo docker system df || true
          echo '=== TARGETED_STORAGE_AUDIT_PASS ==='
