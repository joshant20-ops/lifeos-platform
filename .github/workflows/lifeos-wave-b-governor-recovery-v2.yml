name: LifeOS Wave B Governor Recovery v2

on:
  push:
    branches:
      - fix/wave-b-governor-local-tool-routing

permissions:
  contents: write

concurrency:
  group: lifeos-wave-b-governor-recovery-v2
  cancel-in-progress: false

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: fix/wave-b-governor-local-tool-routing
          fetch-depth: 0

      - name: Apply recovery patch from reviewed workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/lifeos-wave-b-governor-recovery.yml')
          lines = path.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end]) + '\n'
          exec(compile(code, str(path) + ':recovery', 'exec'), {})
          PY

      - name: Validate with stdlib only
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile governor/ai_broker.py governor/autonomous_agent.py
          git diff --check
          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          from unittest import mock

          path = Path('governor/ai_broker.py')
          spec = importlib.util.spec_from_file_location('lifeos_ai_broker_recovery_test', path)
          broker = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(broker)

          with mock.patch.object(broker.ROUTER, 'load_policy', return_value={'providers': []}), \
               mock.patch.object(broker.ROUTER, 'load_secret_names', return_value=set()), \
               mock.patch.object(broker.ROUTER, 'eligible_providers', return_value=([], [])) as eligible:
              broker.candidates(privacy='normal', task_class='normal')
          assert eligible.call_args.kwargs['available_adapters'] == {'local-builder', 'direct-cloud'}

          tools = [{'type': 'function', 'function': {'name': 'report_test_value'}}]
          call = broker._ollama_tool_call_from_content(
              json.dumps({'name': 'report_test_value', 'arguments': {'value': 'OK'}}), tools
          )
          assert call['function']['name'] == 'report_test_value'
          assert json.loads(call['function']['arguments']) == {'value': 'OK'}
          assert broker._ollama_tool_call_from_content(
              json.dumps({'name': 'undeclared', 'arguments': {}}), tools
          ) is None

          provider = {'id': 'ollama', 'api_model': 'qwen2.5-coder:7b-instruct'}
          response = {
              'message': {'role': 'assistant', 'content': None, 'tool_calls': [{
                  'id': 'call_test', 'type': 'function',
                  'function': {'name': 'x', 'arguments': '{}'},
              }]},
              'finish_reason': 'tool_calls',
          }
          with mock.patch.object(broker, 'candidates', return_value=([provider], [])), \
               mock.patch.object(broker, '_strict_env', return_value={}), \
               mock.patch.object(broker, '_ollama_chat', return_value=response) as local:
              result = broker.chat(
                  [{'role': 'user', 'content': 'call x'}],
                  tools=[{'type': 'function', 'function': {'name': 'x'}}],
              )
          local.assert_called_once()
          assert result['provider'] == 'ollama'
          assert result['finish_reason'] == 'tool_calls'

          agent = Path('governor/autonomous_agent.py').read_text()
          assert '_AI_BROKER.chat(' in agent
          assert 'tools = body.get("tools") or []' in agent
          print('RECOVERY_VALIDATION=PASS')
          PY

      - name: Commit validated recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo 'RECOVERY_ALREADY_APPLIED=PASS'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governor/ai_broker.py governor/autonomous_agent.py
          git commit -m 'Restore local tool-capable Governor routing'
          git push origin HEAD:fix/wave-b-governor-local-tool-routing
