name: LifeOS P5 Semantic Batch
on:
  push:
    branches: [main]
    paths:
      - 'scripts/lifeos-pip-p5-semantic-batch.py'
      - 'scripts/lifeos-pip-p5-backlog-state.py'
  workflow_dispatch:
jobs:
  batch:
    runs-on: [self-hosted, lifeos-pi5]
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile canonical checkout
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          repo=/home/joshan/lifeos-platform
          git -C "$repo" fetch origin main
          test -z "$(git -C "$repo" status --porcelain)"
          git -C "$repo" merge --ff-only origin/main
      - name: Bounded semantic backlog batch
        timeout-minutes: 20
        run: python3 /home/joshan/lifeos-platform/scripts/lifeos-pip-p5-semantic-batch.py --limit 25
      - name: Verify canonical clean
        if: always()
        run: |
          test -z "$(git -C /home/joshan/lifeos-platform status --porcelain)"
          echo CANONICAL_CLEAN=PASS
