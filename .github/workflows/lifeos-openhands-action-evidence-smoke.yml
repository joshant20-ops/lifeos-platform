name: LifeOS OpenHands Action Evidence Smoke

on:
  push:
    branches: [test/openhands-action-evidence]
    paths:
      - '.github/workflows/lifeos-openhands-action-evidence-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifeos-pi5-control
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 15
    steps:
      - name: Verify canonical controller checkout
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo 'CANONICAL_CONTROLLER=PASS'

      - name: Wake Engineer
        run: |
          set -Eeuo pipefail
          if ! ssh -o BatchMode=yes -o ConnectTimeout=4 Engineer true 2>/dev/null; then
            mosquitto_pub -h 127.0.0.1 -t lifeos/tower/power/set -m ON
            ready=0
            for _ in $(seq 1 120); do
              if ssh -o BatchMode=yes -o ConnectTimeout=4 Engineer true 2>/dev/null; then ready=1; break; fi
              sleep 5
            done
            test "$ready" -eq 1
          fi
          echo 'ENGINEER_READY=PASS'

      - name: Prove OpenHands filesystem action evidence
        run: |
          set -Eeuo pipefail
          marker="OPENHANDS_ACTION_EVIDENCE_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          ssh -o BatchMode=yes -o ConnectTimeout=8 Engineer bash -s -- "$marker" <<'REMOTE'
          set -Eeuo pipefail
          marker=${1:?marker required}
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          cfg="$HOME/.config/lifeos/governor-broker.env"
          repo="$HOME/workspace/lifeos-platform"
          test -f "$cfg" && test ! -L "$cfg" && test "$(stat -c '%a' "$cfg")" = 600
          test -d "$repo/.git"
          url=$(sed -n 's/^LIFEOS_GOVERNOR_BROKER_URL=//p' "$cfg" | tail -1)
          token=$(sed -n 's/^LIFEOS_GOVERNOR_BROKER_TOKEN=//p' "$cfg" | tail -1)
          test -n "$url" && test -n "$token"
          export LLM_BASE_URL="${url%/}"
          export LLM_API_KEY="$token"
          export LLM_MODEL="openai/lifeos-engineering-normal"
          export LIFEOS_PROVIDER=governor-broker

          work="$HOME/.local/share/lifeos-agent/worktrees/smoke-${marker}"
          git -C "$repo" worktree remove --force "$work" >/dev/null 2>&1 || true
          rm -rf "$work"
          git -C "$repo" worktree add --detach "$work" origin/main >/dev/null
          log=$(mktemp)
          cleanup() {
            rm -f "$log"
            git -C "$repo" worktree remove --force "$work" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cd "$work"
          target_rel="governor/runtime_jobs/openhands-action-evidence-${marker}.txt"
          target="$work/$target_rel"
          prompt="Use an actual shell or file-writing tool now. In the current disposable Git worktree create exactly one file at $target_rel whose complete contents are exactly: $marker followed by one newline. Then use a shell tool to read that file back. Do not merely describe or echo commands in prose. Do not commit, push, fetch, or access GitHub."
          set +e
          openhands --headless --override-with-envs -t "$prompt" </dev/null >"$log" 2>&1
          rc=$?
          set -e
          echo "OPENHANDS_RC=$rc"
          if [[ "$rc" -ne 0 || ! -f "$target" ]]; then
            echo 'OPENHANDS_FAILURE_LOG_BEGIN'
            tail -120 "$log" || true
            echo 'OPENHANDS_FAILURE_LOG_END'
          fi
          test "$rc" -eq 0
          test -f "$target"
          test "$(cat "$target")" = "$marker"
          test "$(wc -l < "$target")" -eq 1
          echo 'OPENHANDS_FILESYSTEM_ACTION_EVIDENCE=PASS'
          echo 'OPENHANDS_HARMLESS_TOOL_EXECUTION=PASS'
          REMOTE

      - name: Capture Governor inference diagnostics
        if: failure()
        run: |
          set +e
          echo 'TOWER_STATE_DIAGNOSTIC'
          timeout 5 mosquitto_sub -h 127.0.0.1 -C 1 -t lifeos/tower/state
          echo 'GOVERNOR_BROKER_FAILURES'
          journalctl -u lifeos-autonomous-agent.service --since '5 minutes ago' --no-pager -o cat | grep -E 'BROKER_FAILURE|BROKER_RUNTIME_FAILURE' | tail -40 || true

      - name: Release Tower
        if: always()
        run: |
          set +e
          mosquitto_pub -h 127.0.0.1 -t lifeos/tower/power/set -m OFF
          echo 'TOWER_RELEASE_REQUESTED=PASS'
