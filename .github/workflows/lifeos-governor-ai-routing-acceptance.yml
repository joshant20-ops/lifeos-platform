name: LifeOS Governor AI Routing Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-governor-ai-routing-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifeos-pi5-control
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 10
    steps:
      - name: Synchronize canonical Pi checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Prove live runtime and installed routing artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          systemctl is-active --quiet lifeos-autonomous-agent.service
          curl -fsS --max-time 5 http://127.0.0.1:8790/health | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"]=="ok"'
          test "$(sha256sum governor/scripts/lifeos-cloud-builder | awk '{print $1}')" = "$(sha256sum /usr/local/libexec/lifeos-cloud-builder | awk '{print $1}')"
          test "$(stat -c '%U:%G:%a' /usr/local/libexec/lifeos-cloud-builder)" = 'root:root:755'
          echo 'GOVERNOR_RUNTIME=PASS'
          echo 'INSTALLED_ROUTER_ARTIFACT=PASS'

      - name: Discover Engineer capability without exposing secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          secret_file=/home/joshan/.config/lifeos/provider-secrets.env
          ssh -o BatchMode=yes -o ConnectTimeout=8 Engineer 'bash -s' -- "$secret_file" <<'REMOTE' > /tmp/lifeos-provider-capabilities
          set -Eeuo pipefail
          secret_file=$1
          adapters=()
          if command -v openhands >/dev/null 2>&1 || test -x "$HOME/.local/bin/openhands"; then adapters+=(openhands); fi
          if command -v codex >/dev/null 2>&1 || test -x "$HOME/.local/bin/codex"; then adapters+=(codex); fi
          echo "ADAPTERS=$(IFS=,; echo "${adapters[*]}")"
          if test -e "$secret_file"; then
            if test -f "$secret_file" && ! test -L "$secret_file" && test "$(stat -c '%a' "$secret_file")" = 600; then
              python3 - "$secret_file" <<'PY'
          import pathlib,re,sys
          names=[]
          for raw in pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines():
              line=raw.strip()
              if not line or line.startswith('#'): continue
              if line.startswith('export '): line=line[7:].lstrip()
              name,sep,value=line.partition('=')
              if sep and value and re.fullmatch(r'[A-Za-z][A-Za-z0-9_]*',name): names.append(name)
          print('CREDENTIAL_NAMES='+','.join(sorted(set(names))))
          print('CREDENTIAL_FILE=valid')
          PY
            else
              echo 'CREDENTIAL_NAMES='
              echo 'CREDENTIAL_FILE=invalid'
            fi
          else
            echo 'CREDENTIAL_NAMES='
            echo 'CREDENTIAL_FILE=absent'
          fi
          REMOTE
          cat /tmp/lifeos-provider-capabilities
          grep -q 'openhands' /tmp/lifeos-provider-capabilities
          grep -q 'codex' /tmp/lifeos-provider-capabilities
          ! grep -Eiq '(key|token|secret)=[^[:space:]]+' /tmp/lifeos-provider-capabilities
          echo 'ENGINEER_ADAPTERS=PASS'

      - name: Prove actual cloud-builder policy selection
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          adapters=$(sed -n 's/^ADAPTERS=//p' /tmp/lifeos-provider-capabilities | tail -1)
          credentials=$(sed -n 's/^CREDENTIAL_NAMES=//p' /tmp/lifeos-provider-capabilities | tail -1)
          ADAPTERS="$adapters" CREDENTIAL_NAMES="$credentials" python3 - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,'engineer')
          from provider_router import eligible_providers,load_policy
          p=load_policy(Path('governor/policy.json'))
          adapters={x for x in os.environ['ADAPTERS'].split(',') if x}
          creds={x for x in os.environ['CREDENTIAL_NAMES'].split(',') if x}
          providers,considered=eligible_providers(p,'normal',creds,privacy='normal',available_adapters=adapters)
          assert providers, considered
          selected=providers[0]['id']
          assert selected in {'gemini','groq','openrouter','cloudflare','codex'}, selected
          print('CLOUD_BUILDER_SELECTED='+selected)
          print('FREE_PROVIDER_READY='+('YES' if selected != 'codex' else 'NO_CREDENTIALS'))
          private,_=eligible_providers(p,'normal',creds,privacy='local-only',available_adapters=adapters)
          assert not private, private
          print('CLOUD_BUILDER_LOCAL_ONLY=NO_ELIGIBLE_CLOUD_PROVIDER')
          print('ROUTING_POLICY_ACCEPTANCE=PASS')
          PY

      - name: Prove Watchman is retired from runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          units=$(systemctl list-unit-files --no-legend --no-pager | awk 'tolower($1) ~ /watchman/ {n++} END {print n+0}')
          processes=$(pgrep -af '[Ww]atchman' 2>/dev/null | wc -l)
          test "$units" -eq 0
          test "$processes" -eq 0
          systemctl is-active --quiet lifeos-root-broker.socket
          test -x /usr/local/sbin/lifeos-transaction-controller
          test -x /usr/local/sbin/lifeos-rollback
          echo 'WATCHMAN_RUNTIME=RETIRED'
          echo 'PRIVILEGED_BOUNDARY=root-broker+transaction-controller+rollback'

      - name: Final regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          python3 -m pytest -q tests/test_openhands_integration.py tests/test_privacy_classifier.py
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo 'GOVERNOR_AI_ROUTING_ACCEPTANCE=PASS'
          echo 'REPOSITORY_FINAL=PASS'
