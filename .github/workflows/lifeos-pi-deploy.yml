name: LifeOS Pi Deploy

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Allow-listed LifeOS deployment operation
        required: true
        type: choice
        options:
          - deploy-ha-control-bridge
          - deploy-house-status-dashboard
          - deploy-tower-metrics
          - deploy-snapshot-exporter
          - deploy-governor-managed-engineer
          - deploy-energy-opportunity-api
          - capability-stage3-systemd-cleanup
          - verify-transaction-core
  push:
    branches: [main]
    paths:
      - 'homelab/live/mnt/docker-data/automation/repos/LifeOS-Energy/app/main.py'
      - 'homelab/live/mnt/docker-data/automation/repos/LifeOS-Energy/app/routers/opportunities.py'
      - 'homelab/live/mnt/docker-data/automation/repos/LifeOS-Energy/app/services/opportunities.py'
      - 'homelab/live/opt/stacks/homeassistant/config/packages/lifeos_energy_attention.yaml'
      - 'homelab/live/opt/stacks/homeassistant/config/scripts/lifeos_energy_attention_sensor.py'
      - 'scripts/lifeos-deploy-energy-opportunity-api.sh'
      - 'tests/test_energy_opportunity_service.py'
      - 'deploy-triggers/ha-control-bridge'
      - 'deploy-triggers/house-status-dashboard'
      - 'deploy-triggers/tower-metrics'
      - 'governor/systemd/lifeos-snapshots-export.service'
      - 'governor/systemd/lifeos-snapshots-export.timer'
      - 'governor/scripts/snapshot-lifeos-observed-state.sh'
      - 'scripts/lifeos-deploy-snapshot-exporter.sh'
      - 'governor/autonomous_agent.py'
      - 'governor/privacy-domain-policy.json'
      - 'governor/systemd/lifeos-autonomous-agent.service'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: lifeos-pi5-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'issues' && (
        github.event.issue.title == 'LifeOS Deploy: deploy-ha-control-bridge' ||
        github.event.issue.title == 'LifeOS Deploy: deploy-house-status-dashboard' ||
        github.event.issue.title == 'LifeOS Deploy: deploy-tower-metrics' ||
        github.event.issue.title == 'LifeOS Deploy: deploy-snapshot-exporter' ||
        github.event.issue.title == 'LifeOS Deploy: deploy-governor-managed-engineer' ||
        github.event.issue.title == 'LifeOS Deploy: deploy-energy-opportunity-api' ||
        github.event.issue.title == 'LifeOS Deploy: capability-stage3-systemd-cleanup' ||
        github.event.issue.title == 'LifeOS Deploy: verify-transaction-core'
      ))
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 30
    env:
      # Use a block scalar because the issue titles contain ': '. Keeping the
      # expression as a plain YAML scalar makes the workflow invalid before
      # any job can be created.
      LIFEOS_OPERATION: >-
        ${{ github.event_name == 'push' && (github.event.head_commit.modified && contains(github.event.head_commit.modified, 'deploy-triggers/house-status-dashboard') && 'deploy-house-status-dashboard' || github.event.head_commit.added && contains(github.event.head_commit.added, 'deploy-triggers/house-status-dashboard') && 'deploy-house-status-dashboard' || github.event.head_commit.modified && contains(github.event.head_commit.modified, 'deploy-triggers/ha-control-bridge') && 'deploy-ha-control-bridge' || github.event.head_commit.added && contains(github.event.head_commit.added, 'deploy-triggers/ha-control-bridge') && 'deploy-ha-control-bridge' || github.event.head_commit.modified && contains(github.event.head_commit.modified, 'deploy-triggers/tower-metrics') && 'deploy-tower-metrics' || github.event.head_commit.added && contains(github.event.head_commit.added, 'deploy-triggers/tower-metrics') && 'deploy-tower-metrics' || github.event.head_commit.modified && contains(github.event.head_commit.modified, 'governor/privacy-domain-policy.json') && 'deploy-governor-managed-engineer' || github.event.head_commit.added && contains(github.event.head_commit.added, 'governor/privacy-domain-policy.json') && 'deploy-governor-managed-engineer' || 'deploy-energy-opportunity-api') || github.event_name == 'issues' &&
        (github.event.issue.title == 'LifeOS Deploy: capability-stage3-systemd-cleanup' && 'capability-stage3-systemd-cleanup' ||
        github.event.issue.title == 'LifeOS Deploy: deploy-house-status-dashboard' && 'deploy-house-status-dashboard' ||
        github.event.issue.title == 'LifeOS Deploy: deploy-tower-metrics' && 'deploy-tower-metrics' ||
        github.event.issue.title == 'LifeOS Deploy: deploy-snapshot-exporter' && 'deploy-snapshot-exporter' ||
        github.event.issue.title == 'LifeOS Deploy: deploy-governor-managed-engineer' && 'deploy-governor-managed-engineer' ||
        github.event.issue.title == 'LifeOS Deploy: deploy-energy-opportunity-api' && 'deploy-energy-opportunity-api' ||
        github.event.issue.title == 'LifeOS Deploy: verify-transaction-core' && 'verify-transaction-core' ||
        'deploy-ha-control-bridge') || inputs.operation }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify runner identity and canonical checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          test "$RUNNER_ARCH" = ARM64
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "PLATFORM_HEAD=$(git rev-parse HEAD)"
          echo "OPERATION=$LIFEOS_OPERATION"

      - name: Execute allow-listed deployment gateway
        id: gateway
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/lifeos-evidence"
          set +e
          sudo -n /usr/local/sbin/lifeos-deploy-gateway "$LIFEOS_OPERATION" \
            2>&1 | tee "$RUNNER_TEMP/lifeos-evidence/gateway.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "gateway_rc=$rc" >> "$GITHUB_OUTPUT"
          grep -E '^[A-Z0-9_]+=' "$RUNNER_TEMP/lifeos-evidence/gateway.log" \
            > "$RUNNER_TEMP/lifeos-evidence/result.env" || true
          exit "$rc"

      - name: Run Energy Opportunity live acceptance
        if: env.LIFEOS_OPERATION == 'deploy-energy-opportunity-api' && steps.gateway.outputs.gateway_rc == '0'
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          python3 archive/closed-gates/scripts/audit-wave-a-live-acceptance.py
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo ENERGY_OPPORTUNITY_LIVE_ACCEPTANCE=PASS

      - name: Run Governor privacy live acceptance
        if: env.LIFEOS_OPERATION == 'deploy-governor-managed-engineer' && steps.gateway.outputs.gateway_rc == '0'
        shell: bash
        run: |
          set -Eeuo pipefail
          HEALTH=$(curl -fsS --max-time 5 http://127.0.0.1:8790/health)
          python3 - "$HEALTH" <<'PY'
          import json, sys
          health = json.loads(sys.argv[1])
          assert health['service'] == 'lifeos-autonomous-agent'
          assert health['status'] == 'ok'
          assert health['privacy_domain_policy'] == '/usr/local/libexec/privacy-domain-policy.json'
          print('LIVE_HEALTH=PASS')
          print('LIVE_POLICY_PATH=' + health['privacy_domain_policy'])
          PY
          python3 - <<'PY'
          import importlib.machinery, os, tempfile
          os.environ['LIFEOS_AGENT_STATE'] = tempfile.mkdtemp(prefix='lifeos-privacy-acceptance-')
          os.environ['LIFEOS_PRIVACY_DOMAIN_POLICY'] = '/usr/local/libexec/privacy-domain-policy.json'
          agent = importlib.machinery.SourceFileLoader('lifeos_live_privacy_acceptance', '/usr/local/libexec/lifeos-autonomous-agent').load_module()
          checks = {
              'EXPLICIT_PA': agent.classify_privacy('Summarize upcoming appointments', domain='personal-administration'),
              'INFERRED_PA': agent.classify_privacy('Summarize my calendar for tomorrow'),
              'EXPLICIT_FINANCE': agent.classify_privacy('Prepare the monthly overview', domain='finance-assets'),
              'INFERRED_FINANCE': agent.classify_privacy('Review my vehicle costs this month'),
              'UNKNOWN_DOMAIN': agent.classify_privacy('Handle this', domain='unknown-private-domain'),
              'PUBLIC_GENERAL': agent.classify_privacy('Explain Python decorators'),
          }
          assert all(checks[k] == 'local-only' for k in ('EXPLICIT_PA','INFERRED_PA','EXPLICIT_FINANCE','INFERRED_FINANCE','UNKNOWN_DOMAIN'))
          assert checks['PUBLIC_GENERAL'] == 'normal'
          private = agent.new_job('Check my bank statements', dispatch_builder='normal')
          assert private['privacy'] == 'local-only'
          assert agent.builder_route(private)[0] == 'local'
          print('NORMAL_DISPATCH_DOWNGRADE=BLOCKED')
          print('PRIVATE_ROUTE=local')
          print('LIVE_PRIVACY_ACCEPTANCE=PASS')
          PY
          cd /home/joshan/lifeos-platform
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-${{ env.LIFEOS_OPERATION }}-${{ github.run_id }}
          path: ${{ runner.temp }}/lifeos-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Report issue-triggered result
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const gatewayOk = '${{ steps.gateway.outputs.gateway_rc }}' === '0';
            const jobOk = '${{ job.status }}' === 'success';
            const ok = gatewayOk && jobOk;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `LifeOS automatic deployment ${ok ? 'PASS' : 'FAIL'}\n\nOperation: \`${process.env.LIFEOS_OPERATION}\`\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (ok) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }
