name: LifeOS Pi Deploy

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Allow-listed LifeOS deployment operation
        required: true
        type: choice
        options:
          - audit-dispatcher-retirement
          - retire-engineer-dispatcher
          - deploy-ha-control-bridge
          - capability-stage3-systemd-cleanup
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - deploy-triggers/ha-control-bridge

permissions:
  contents: read
  issues: write

concurrency:
  group: lifeos-pi5-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'issues' && (
        github.event.issue.title == 'LifeOS Deploy: deploy-ha-control-bridge' ||
        github.event.issue.title == 'LifeOS Deploy: capability-stage3-systemd-cleanup'
      ))
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 30
    env:
      LIFEOS_OPERATION: ${{ github.event_name == 'push' && 'deploy-ha-control-bridge' || github.event_name == 'issues' && (github.event.issue.title == 'LifeOS Deploy: capability-stage3-systemd-cleanup' && 'capability-stage3-systemd-cleanup' || 'deploy-ha-control-bridge') || inputs.operation }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify runner identity and canonical checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          test "$RUNNER_ARCH" = ARM64
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "PLATFORM_HEAD=$(git rev-parse HEAD)"
          echo "OPERATION=$LIFEOS_OPERATION"

      - name: Execute allow-listed deployment gateway
        id: gateway
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/lifeos-evidence"
          set +e
          sudo -n /usr/local/sbin/lifeos-deploy-gateway "$LIFEOS_OPERATION" \
            2>&1 | tee "$RUNNER_TEMP/lifeos-evidence/gateway.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "gateway_rc=$rc" >> "$GITHUB_OUTPUT"
          grep -E '^[A-Z0-9_]+=' "$RUNNER_TEMP/lifeos-evidence/gateway.log" \
            > "$RUNNER_TEMP/lifeos-evidence/result.env" || true
          exit "$rc"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-${{ env.LIFEOS_OPERATION }}-${{ github.run_id }}
          path: ${{ runner.temp }}/lifeos-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Report issue-triggered result
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ steps.gateway.outputs.gateway_rc }}' === '0';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `LifeOS automatic deployment ${ok ? 'PASS' : 'FAIL'}\n\nOperation: \`${process.env.LIFEOS_OPERATION}\`\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (ok) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }
