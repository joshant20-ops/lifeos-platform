name: LifeOS Core Requirement Validity Audit

on:
  push:
    branches: [main]
    paths: ['.github/workflows/lifeos-core-requirement-validity-audit.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 20
    steps:
      - name: Align
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          test -z "$(git status --porcelain --untracked-files=all)"
          git merge --ff-only origin/main
          echo "HEAD=$(git rev-parse HEAD)"
      - name: Requirement-owner evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          echo '=== LIVE UNITS ==='
          systemctl --no-pager --plain --type=service --all | grep -E 'lifeos|actions.runner' || true
          echo '=== LIVE TIMERS ==='
          systemctl --no-pager list-timers --all | grep -E 'lifeos|restic' || true
          echo '=== CONTAINERS ==='
          docker ps --format '{{.Names}}|{{.Status}}' | sort
          echo '=== LEGACY CONTROL REFERENCES ==='
          systemctl cat lifeos-pi-control.service 2>/dev/null || true
          systemctl cat lifeos-job-publisher.service 2>/dev/null || true
          echo '=== CURRENT AUTHORITY FILES ==='
          test -f architecture/decisions/three-repository-authority.md && echo THREE_REPO_AUTHORITY=PRESENT
          test -f docs/architecture/system-simplification-map.md && echo SIMPLIFICATION_MAP=PRESENT
          test -f docs/architecture/GOVERNOR_AI_ROUTING.md && echo AI_ROUTING=PRESENT
          test -f docs/architecture/personal-information-processing-paperless-first.md && echo PAPERLESS_FIRST=PRESENT
          test -f docs/architecture/wave-c-finance-assets-discovery.md && echo FINANCE_WAVE_C=PRESENT
          echo '=== CURRENT FEATURE WORKFLOWS ==='
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort
