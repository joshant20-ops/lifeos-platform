name: House Status Frontend Check
on:
  push:
    paths:
      - 'homeassistant/www/house-status/lifeos-house-status-card.js'
      - 'homeassistant/www/house-status/lifeos-house-status-v27.js'
      - 'homeassistant/www/house-status/lifeos-house-status-doorbell.js'
      - 'homeassistant/www/house-status/test-doorbell-handoff.js'
      - 'homeassistant/releases/house-status/live/**'
      - 'homeassistant/releases/house-status/test-doorbell-panel-bootstrap.js'
      - 'homeassistant/www/house-status-dev/**'
      - 'scripts/lifeos-deploy-house-status-dashboard.sh'
      - 'scripts/lifeos-deploy-house-status-dev-dashboard.sh'
      - 'homeassistant/deploy-house-status-dashboard.py'
      - '.github/workflows/house-status-live-deploy.yml'
      - '.github/workflows/house-status-dev-deploy.yml'
      - '.github/workflows/house-status-frontend-check.yml'
  pull_request:
    paths:
      - 'homeassistant/www/house-status/lifeos-house-status-card.js'
      - 'homeassistant/www/house-status/lifeos-house-status-v27.js'
      - 'homeassistant/www/house-status/lifeos-house-status-doorbell.js'
      - 'homeassistant/www/house-status/test-doorbell-handoff.js'
      - 'homeassistant/releases/house-status/live/**'
      - 'homeassistant/releases/house-status/test-doorbell-panel-bootstrap.js'
      - 'homeassistant/www/house-status-dev/**'
      - 'scripts/lifeos-deploy-house-status-dashboard.sh'
      - 'scripts/lifeos-deploy-house-status-dev-dashboard.sh'
      - 'homeassistant/deploy-house-status-dashboard.py'
      - '.github/workflows/house-status-live-deploy.yml'
      - '.github/workflows/house-status-dev-deploy.yml'
      - '.github/workflows/house-status-frontend-check.yml'
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check homeassistant/www/house-status/lifeos-house-status-card.js
      - run: node --check homeassistant/www/house-status/lifeos-house-status-v27.js
      - run: node --check homeassistant/www/house-status/lifeos-house-status-doorbell.js
      - run: node --check homeassistant/releases/house-status/live/lifeos-house-status-v28.js
      - run: node --check homeassistant/releases/house-status/live/lifeos-house-status-v27.js
      - run: node --check homeassistant/releases/house-status/live/lifeos-house-status-doorbell.js
      - run: node --check homeassistant/releases/house-status/live/lifeos-house-status-doorbell-v28.js
      - run: bash -n scripts/lifeos-deploy-house-status-dashboard.sh
      - run: node --check homeassistant/www/house-status-dev/lifeos-house-status-dev.js
      - run: node --check homeassistant/www/house-status-dev/lifeos-house-status-doorbell.js
      - name: House Status development isolation
        run: node homeassistant/www/house-status-dev/test-isolation.js
      - name: Doorbell handoff behaviour
        run: node homeassistant/www/house-status/test-doorbell-handoff.js
      - name: V28 panel Lovelace card helper bootstrap
        run: node homeassistant/releases/house-status/test-doorbell-panel-bootstrap.js
      - name: Execute registration
        run: |
          node <<'NODE'
          global.HTMLElement=class {};
          global.document={createElement:()=>({})};
          const r=new Map();
          global.customElements={get:n=>r.get(n),define:(n,c)=>r.set(n,c)};
          global.window={};
          require('./homeassistant/www/house-status/lifeos-house-status-card.js');
          if(!customElements.get('lifeos-house-status-v28')) throw new Error('lifeos-house-status-v28 not registered');
          if(!customElements.get('lifeos-house-status-editor')) throw new Error('editor not registered');
          console.log('HOUSE_STATUS_FRONTEND_EXECUTION=PASS');
          NODE
