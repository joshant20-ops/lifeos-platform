name: LifeOS Tower Ollama GPU Default

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'homelab/tower/ollama/10-lifeos-gpu.conf'
      - '.github/workflows/lifeos-tower-ollama-gpu-default.yml'

permissions:
  contents: read

concurrency:
  group: lifeos-pi5-control
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 12
    steps:
      - name: Synchronize canonical Pi checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Inspect Tower Ollama and NVIDIA runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=8 TowerPC.Tailor 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          hostname
          systemctl is-active --quiet ollama.service
          command -v nvidia-smi >/dev/null
          nvidia-smi --query-gpu=index,name,driver_version,memory.total --format=csv,noheader
          command -v ollama >/dev/null
          ollama --version
          systemctl show ollama.service -p FragmentPath -p DropInPaths -p Environment
          echo 'TOWER_OLLAMA_PREFLIGHT=PASS'
          REMOTE

      - name: Deploy machine-level GPU policy with rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          cfg=homelab/tower/ollama/10-lifeos-gpu.conf
          base64 -w0 "$cfg" >/tmp/lifeos-ollama-gpu-conf.b64
          payload=$(cat /tmp/lifeos-ollama-gpu-conf.b64)
          ssh -o BatchMode=yes -o ConnectTimeout=8 TowerPC.Tailor 'bash -s' -- "$payload" <<'REMOTE'
          set -Eeuo pipefail
          payload=$1
          target=/etc/systemd/system/ollama.service.d/10-lifeos-gpu.conf
          backup=$(mktemp)
          existed=0
          if sudo -n test -f "$target"; then
            sudo -n cat "$target" >"$backup"
            existed=1
          fi
          rollback() {
            set +e
            if [[ "$existed" == 1 ]]; then
              sudo -n install -d -m 0755 "$(dirname "$target")"
              sudo -n install -m 0644 "$backup" "$target"
            else
              sudo -n rm -f "$target"
            fi
            sudo -n systemctl daemon-reload
            sudo -n systemctl restart ollama.service
          }
          trap rollback ERR
          tmp=$(mktemp)
          printf '%s' "$payload" | base64 -d >"$tmp"
          grep -q '^Environment="CUDA_VISIBLE_DEVICES=0"$' "$tmp"
          sudo -n install -d -m 0755 "$(dirname "$target")"
          sudo -n install -m 0644 "$tmp" "$target"
          rm -f "$tmp"
          sudo -n systemctl daemon-reload
          sudo -n systemctl restart ollama.service
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 1
          done
          systemctl is-active --quiet ollama.service
          env_line=$(systemctl show ollama.service -p Environment --value)
          grep -q 'CUDA_VISIBLE_DEVICES=0' <<<"$env_line"
          trap - ERR
          rm -f "$backup"
          echo 'TOWER_OLLAMA_GPU_POLICY_DEPLOY=PASS'
          REMOTE

      - name: Prove default GPU inference without request GPU flags
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=8 TowerPC.Tailor 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          model=qwen2.5-coder:7b-instruct
          curl -fsS --max-time 5 http://127.0.0.1:11434/api/tags | python3 - "$model" <<'PY'
          import json,sys
          model=sys.argv[1]
          j=json.load(sys.stdin)
          assert any(m.get('name')==model for m in j.get('models',[])), j
          print('MODEL_PRESENT=PASS')
          PY
          python3 - "$model" >/tmp/lifeos-gpu-default-request.json <<'PY'
          import json,sys
          # Deliberately no options.num_gpu or CUDA fields. GPU use must come
          # solely from the Tower Ollama service configuration.
          print(json.dumps({'model':sys.argv[1],'prompt':'Reply with exactly GPU_DEFAULT_OK','stream':False,'keep_alive':'5m'}))
          PY
          curl -fsS --max-time 120 -H 'Content-Type: application/json' --data-binary @/tmp/lifeos-gpu-default-request.json http://127.0.0.1:11434/api/generate >/tmp/lifeos-gpu-default-response.json
          python3 - /tmp/lifeos-gpu-default-response.json <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          assert 'GPU_DEFAULT_OK' in j.get('response',''), j
          print('DEFAULT_GPU_INFERENCE=PASS')
          PY
          curl -fsS --max-time 5 http://127.0.0.1:11434/api/ps >/tmp/lifeos-gpu-default-ps.json
          python3 - /tmp/lifeos-gpu-default-ps.json "$model" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1])); model=sys.argv[2]
          row=next((x for x in j.get('models',[]) if x.get('name')==model or x.get('model')==model), None)
          assert row, j
          size=int(row.get('size') or 0); vram=int(row.get('size_vram') or 0)
          print('MODEL_SIZE_BYTES='+str(size))
          print('MODEL_VRAM_BYTES='+str(vram))
          assert vram > 0, row
          if size > 0:
            ratio=vram/size
            print('GPU_OFFLOAD_RATIO='+f'{ratio:.3f}')
            assert ratio >= 0.95, row
          print('TOWER_OLLAMA_GPU_DEFAULT=PASS')
          PY
          REMOTE

      - name: Final regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          curl -fsS --max-time 5 http://192.168.0.201:11434/api/tags >/dev/null
          curl -fsS --max-time 5 http://127.0.0.1:8790/health | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"]=="ok"'
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo 'TOWER_GPU_DEFAULT_ACCEPTANCE=PASS'
          echo 'REPOSITORY_FINAL=PASS'
