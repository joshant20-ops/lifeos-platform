name: LifeOS Tower Ollama GPU Default

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'homelab/tower/ollama/40-lifeos-nvidia-only.conf'
      - '.github/workflows/lifeos-tower-ollama-gpu-default.yml'

permissions:
  contents: read

concurrency:
  group: lifeos-pi5-control
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 12
    steps:
      - name: Sync canonical Pi checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Consolidate Tower Ollama policy with rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          payload=$(base64 -w0 homelab/tower/ollama/40-lifeos-nvidia-only.conf)
          ssh -o BatchMode=yes -o ConnectTimeout=8 TowerPC.Tailor 'bash -s' -- "$payload" <<'REMOTE'
          set -Eeuo pipefail
          payload=$1
          dir=/etc/systemd/system/ollama.service.d
          target=$dir/40-lifeos-nvidia-only.conf
          backup=$(mktemp -d)
          for f in 10-lifeos-gpu.conf 20-lifeos-gpu-worker.conf 30-lifeos-shared-gpu.conf 40-lifeos-nvidia-only.conf; do
            if sudo -n test -f "$dir/$f"; then sudo -n cat "$dir/$f" >"$backup/$f"; fi
          done
          rollback(){
            set +e
            sudo -n rm -f "$dir"/10-lifeos-gpu.conf "$dir"/20-lifeos-gpu-worker.conf "$dir"/30-lifeos-shared-gpu.conf "$dir"/40-lifeos-nvidia-only.conf
            for f in "$backup"/*; do [[ -f "$f" ]] && sudo -n install -m 0644 "$f" "$dir/$(basename "$f")"; done
            sudo -n systemctl daemon-reload
            sudo -n systemctl restart ollama.service
          }
          trap rollback ERR
          tmp=$(mktemp)
          printf '%s' "$payload" | base64 -d >"$tmp"
          grep -q 'CUDA_VISIBLE_DEVICES=0' "$tmp"
          grep -q 'OLLAMA_VULKAN=0' "$tmp"
          sudo -n install -d -m 0755 "$dir"
          sudo -n install -m 0644 "$tmp" "$target"
          sudo -n rm -f "$dir/10-lifeos-gpu.conf" "$dir/20-lifeos-gpu-worker.conf" "$dir/30-lifeos-shared-gpu.conf"
          rm -f "$tmp"
          sudo -n systemctl daemon-reload
          sudo -n systemctl restart ollama.service
          for i in $(seq 1 30); do curl -fsS --max-time 2 http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break; sleep 1; done
          systemctl is-active --quiet ollama.service
          paths=$(systemctl show ollama.service -p DropInPaths --value)
          [[ "$paths" == "$target" ]]
          envs=$(systemctl show ollama.service -p Environment --value)
          grep -q 'CUDA_VISIBLE_DEVICES=0' <<<"$envs"
          grep -q 'OLLAMA_VULKAN=0' <<<"$envs"
          grep -q 'OLLAMA_HOST=0.0.0.0:11434' <<<"$envs"
          trap - ERR
          rm -rf "$backup"
          echo 'OLLAMA_POLICY_CONSOLIDATED=PASS'
          REMOTE

      - name: Prove GPU is default without request flags
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=8 TowerPC.Tailor 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          model=qwen2.5-coder:7b-instruct
          python3 - "$model" >/tmp/gpu-default.json <<'PY'
          import json,sys
          print(json.dumps({'model':sys.argv[1],'prompt':'Reply with exactly GPU_DEFAULT_OK','stream':False,'keep_alive':'5m'}))
          PY
          curl -fsS --max-time 120 -H 'Content-Type: application/json' --data-binary @/tmp/gpu-default.json http://127.0.0.1:11434/api/generate >/tmp/gpu-default-response.json
          python3 - /tmp/gpu-default-response.json <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1])); assert 'GPU_DEFAULT_OK' in j.get('response',''), j
          print('DEFAULT_GPU_INFERENCE=PASS')
          PY
          curl -fsS --max-time 5 http://127.0.0.1:11434/api/ps >/tmp/gpu-ps.json
          python3 - /tmp/gpu-ps.json "$model" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1])); model=sys.argv[2]
          row=next(x for x in j['models'] if x.get('name')==model or x.get('model')==model)
          size=int(row.get('size') or 0); vram=int(row.get('size_vram') or 0)
          print('MODEL_SIZE_BYTES='+str(size)); print('MODEL_VRAM_BYTES='+str(vram))
          assert size > 0 and vram/size >= .95, row
          print('GPU_OFFLOAD_RATIO='+f'{vram/size:.3f}')
          print('TOWER_OLLAMA_GPU_DEFAULT=PASS')
          PY
          REMOTE

      - name: Final regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          curl -fsS --max-time 5 http://192.168.0.201:11434/api/tags >/dev/null
          curl -fsS --max-time 5 http://127.0.0.1:8790/health | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"]=="ok"'
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo 'TOWER_GPU_DEFAULT_ACCEPTANCE=PASS'
          echo 'REPOSITORY_FINAL=PASS'
