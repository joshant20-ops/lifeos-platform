name: LifeOS Governor AI Routing Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-governor-ai-routing-deploy.yml'
      - 'governor/scripts/lifeos-cloud-builder'
      - 'governor/scripts/lifeos-local-builder'
      - 'governor/policy.json'
      - 'engineer/provider_router.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifeos-pi5-control
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 10
    steps:
      - name: Synchronize canonical Pi checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Transactionally deploy provider-aware builder
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          source=/home/joshan/lifeos-platform/governor/scripts/lifeos-cloud-builder
          destination=/usr/local/libexec/lifeos-cloud-builder
          expected=$(sha256sum "$source" | awk '{print $1}')
          tx="governor-ai-routing-${GITHUB_RUN_ID}"
          proposal=$(mktemp)
          trap 'rm -f "$proposal"' EXIT
          python3 - "$source" "$destination" "$expected" >"$proposal" <<'PY'
          import json, sys
          source, destination, expected = sys.argv[1:]
          print(json.dumps({
              "operation": "replace_file",
              "risk": "LOW",
              "component": "governor-ai-routing-builder",
              "source": source,
              "destination": destination,
              "sha256": expected,
              "checks": [
                  {"type": "file_sha256", "path": destination, "expected": expected},
                  {"type": "service_active", "unit": "lifeos-autonomous-agent.service"}
              ]
          }))
          PY

          sudo -n /usr/local/sbin/lifeos-transaction-controller begin "$tx" "$proposal"
          sudo -n /usr/local/sbin/lifeos-transaction-controller apply "$tx"
          sudo -n /usr/local/sbin/lifeos-transaction-controller verify "$tx"
          sudo -n /usr/local/sbin/lifeos-transaction-controller commit "$tx"

          test "$(sha256sum "$destination" | awk '{print $1}')" = "$expected"
          systemctl is-active --quiet lifeos-autonomous-agent.service
          curl -fsS --max-time 5 http://127.0.0.1:8790/health >/dev/null
          echo "TRANSACTION_ID=$tx"
          echo 'GOVERNOR_AI_ROUTING_DEPLOY=PASS'

      - name: Live route contract smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'engineer')
          from provider_router import load_policy, route
          p=load_policy(Path('governor/policy.json'))
          normal=route(p, 'normal', set(), available_adapters={'openhands','codex','local-builder'})
          private=route(p, 'normal', set(), privacy='local-only', available_adapters={'openhands','codex','local-builder'})
          assert normal['selected_provider'] == 'codex', normal
          assert private['selected_provider'] == 'ollama', private
          assert next(x for x in normal['considered'] if x['provider']=='ollama')['status']=='PRIVACY_FORBIDDEN', normal
          assert next(x for x in private['considered'] if x['provider']=='codex')['status']=='PRIVACY_FORBIDDEN', private
          print('NORMAL_SANITIZED_ROUTE=' + normal['selected_provider'])
          print('LOCAL_ONLY_ROUTE=' + private['selected_provider'])
          print('PRIVACY_FAIL_CLOSED=PASS')
          PY
          test "$(sha256sum governor/scripts/lifeos-cloud-builder | awk '{print $1}')" = "$(sha256sum /usr/local/libexec/lifeos-cloud-builder | awk '{print $1}')"
          echo 'DEPLOYED_HASH_MATCH=PASS'

      - name: M6 cloud fallback and privacy acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          cloud=/usr/local/libexec/lifeos-cloud-builder
          local=/usr/local/libexec/lifeos-local-builder
          test -x "$cloud"
          test -x "$local"
          grep -q 'CLOUD_AGENTS_EXHAUSTED=YES' "$cloud"
          grep -q 'FALLBACK_ROUTE=Tower_Ollama' "$cloud"
          grep -q 'LIFEOS_JOB_PRIVACY=local-only' "$cloud"
          grep -q 'cloud_builder_forbidden_for_local_only_job' "$cloud"
          grep -q 'LOCAL_BUILDER_CLOUD_FALLBACK=DISABLED' "$local"
          echo 'SANITIZED_CLOUD_ROUTE=codex'
          echo 'CLOUD_EXHAUSTION_FALLBACK_CONTRACT=Tower_Ollama'
          echo 'LOCAL_ONLY_CLOUD_ESCAPE=FORBIDDEN'
          echo 'M6_STATIC_BOUNDARY=PASS'
          set +e
          out="$(LIFEOS_JOB_PRIVACY=local-only LIFEOS_JOB_ID=878-m6-local-escape "$cloud" 'M6 local-only cloud escape probe' 1 2>&1)"
          rc=$?
          set -e
          printf '%s\\n' "$out"
          test "$rc" = 42
          grep -q 'RESULT=BLOCKED' <<<"$out"
          grep -q 'REASON=cloud_builder_forbidden_for_local_only_job' <<<"$out"
          echo 'LOCAL_ONLY_CLOUD_ESCAPE_LIVE=PASS'
          td="$(mktemp -d)"
          trap 'rm -rf "$td"' EXIT
          printf '%s\\n' '#!/usr/bin/env bash' 'if [[ "$*" == *"bash -s"* ]]; then cat >/dev/null; printf "%s\\n" "OPENHANDS=present" "CODEX=absent" "GOVERNOR_BROKER=present"; exit 0; fi' 'exec /usr/bin/ssh "$@"' >"$td/ssh"
          chmod 700 "$td/ssh"
          set +e
          out="$(PATH="$td:$PATH" LIFEOS_JOB_PRIVACY=normal LIFEOS_JOB_ID=878-m6-fallback "$cloud" 'Create runtime_jobs/878-m6-fallback.sh with exactly three lines: shebang, set -euo pipefail, and printf M6_FALLBACK_PASS; execute and verify it.' 1 2>&1)"
          rc=$?
          set -e
          printf '%s\\n' "$out"
          grep -q 'CLOUD_AGENTS_EXHAUSTED=YES' <<<"$out"
          grep -q 'FALLBACK_ROUTE=Tower_Ollama' <<<"$out"
          grep -q 'LOCAL_BUILDER_ROUTE=Pi5_Governor_to_Tower_Ollama' <<<"$out"
          grep -q 'LOCAL_BUILDER_CLOUD_FALLBACK=DISABLED' <<<"$out"
          grep -q 'AGENT_RESULT=openhands PASS' <<<"$out"
          grep -q 'FALLBACK_RESULT=local_builder PASS' <<<"$out"
          test "$rc" = 0
          echo 'CLOUD_EXHAUSTION_LOCAL_FALLBACK_LIVE=PASS'
          echo 'M6_LIVE_ACCEPTANCE=PASS'

      - name: Prove repository clean
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo 'REPOSITORY_FINAL=PASS'
