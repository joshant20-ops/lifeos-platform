name: OpenHands Canvas Conversation State Repair

on:
  push:
    branches: [main]
    paths: ['.github/workflows/openhands-canvas-state-repair.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-and-accept:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 10
    steps:
      - name: Repair stale conversation state and verify persistence
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes Engineer 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cid="9a36222cb4d34973a8f54da325026c8c"
          expected='Agent Canvas functional acceptance PASS'
          container='lifeos-agent-canvas'
          api_key="$(docker exec "$container" cat /home/openhands/.openhands/agent-canvas/api-key.txt)"

          check_conversation() {
            docker exec -i -e CID="$cid" -e SESSION_API_KEY="$api_key" "$container" python - <<'PY'
          import json, os, urllib.request
          cid=os.environ['CID']; key=os.environ['SESSION_API_KEY']
          req=urllib.request.Request(
              f'http://127.0.0.1:18000/api/conversations/{cid}',
              headers={'X-Session-API-Key': key},
          )
          with urllib.request.urlopen(req, timeout=5) as response:
              data=json.load(response)
          assert data['workspace']['working_dir'] == f'/home/openhands/workspace/project/{cid}'
          assert data['runtime_info']['runtime_status'] == 'available'
          assert data['runtime_info']['can_resume'] is True
          print('CONVERSATION_STATUS='+data['execution_status'])
          print('CONVERSATION_WORKSPACE='+data['workspace']['working_dir'])
          PY
          }

          echo '=== PRE-REPAIR STATE ==='
          check_conversation
          test "$(docker exec "$container" cat "/home/openhands/workspace/project/$cid/canvas-acceptance.txt")" = "$expected"

          echo '=== GUARDED PERSISTED-STATE REPAIR ==='
          docker exec -i -e CID="$cid" "$container" python - <<'PY'
          import json, os
          from pathlib import Path

          cid=os.environ['CID']
          roots=[Path('/home/openhands/.openhands')]
          candidates=[]
          for root in roots:
              for path in root.rglob('base_state.json'):
                  compact=str(path).replace('-', '')
                  if cid in compact:
                      candidates.append(path)
          assert len(candidates) == 1, f'expected one persisted state, found {len(candidates)}'
          path=candidates[0]
          state=json.loads(path.read_text())
          assert state.get('execution_status') == 'error', state.get('execution_status')
          workspace=state.get('workspace') or {}
          assert workspace.get('working_dir') == f'/home/openhands/workspace/project/{cid}'
          backup=path.with_name('base_state.before-canvas-files-repair.json')
          if not backup.exists():
              backup.write_text(json.dumps(state, indent=2, sort_keys=True)+'\n')
          state['execution_status']='finished'
          temporary=path.with_suffix('.json.tmp')
          temporary.write_text(json.dumps(state, separators=(',', ':')))
          os.replace(temporary, path)
          print('PERSISTED_STATE_PATH='+str(path))
          print('PERSISTED_STATE_BACKUP='+str(backup))
          print('STALE_EXECUTION_STATUS_REPAIRED=PASS')
          PY

          for _ in $(seq 1 20); do
            status="$(check_conversation | sed -n 's/^CONVERSATION_STATUS=//p')"
            test "$status" = finished && break
            sleep 1
          done
          test "$status" = finished

          verify_files_pane_contract() {
            payload="$(python3 - <<PY
          import json
          print(json.dumps({
              'command': "find . \\( -name '.git' -prune -o -type f -print \\) 2>/dev/null | sort | head -n 2000",
              'cwd': '/home/openhands/workspace/project/$cid',
              'timeout': 30,
          }))
          PY
          )"
            code=$(curl -sS -o /tmp/canvas-list.json -w '%{http_code}' -X POST \
              -H "X-Session-API-Key: $api_key" -H 'Content-Type: application/json' \
              --data "$payload" http://127.0.0.1:18000/api/bash/execute_bash_command)
            test "$code" = 200
            python3 - <<'PY'
          import json
          data=json.load(open('/tmp/canvas-list.json'))
          assert data['exit_code'] == 0, data
          files={line.removeprefix('./') for line in data['stdout'].splitlines()}
          assert 'canvas-acceptance.txt' in files, files
          print('FILES_PANE_LIST=PASS')
          PY

            curl -ksS -c /tmp/canvas-cookies -o /dev/null -X POST \
              -H 'Host: 192.168.0.204:8443' -H 'Origin: https://192.168.0.204:8443' \
              -H "X-Session-API-Key: $api_key" \
              https://127.0.0.1:8443/api/auth/workspace-session
            code=$(curl -ksS -b /tmp/canvas-cookies -o /tmp/canvas-open -w '%{http_code}' \
              -H 'Host: 192.168.0.204:8443' \
              "https://127.0.0.1:8443/api/conversations/$cid/workspace/canvas-acceptance.txt")
            test "$code" = 200
            test "$(cat /tmp/canvas-open)" = "$expected"
            echo FILES_PANE_OPEN_EXACT_CONTENT=PASS
          }

          echo '=== ACCEPTANCE BEFORE RESTART ==='
          verify_files_pane_contract

          echo '=== SINGLE PERSISTENCE RESTART ==='
          systemctl --user restart lifeos-openhands-ui.service
          for _ in $(seq 1 60); do
            curl -fsS --connect-timeout 2 http://127.0.0.1:18000/alive >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:18000/alive >/dev/null
          api_key="$(docker exec "$container" cat /home/openhands/.openhands/agent-canvas/api-key.txt)"
          status="$(check_conversation | sed -n 's/^CONVERSATION_STATUS=//p')"
          test "$status" = finished
          verify_files_pane_contract
          echo CANVAS_EXISTING_CONVERSATION_PERSISTENCE=PASS
          REMOTE
