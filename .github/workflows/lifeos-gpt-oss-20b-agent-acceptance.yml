name: LifeOS Devstral 24B Agent Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/lifeos-gpt-oss-20b-agent-acceptance.yml']

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 120
    steps:
      - name: Benchmark GPT-OSS 20B on Tower
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          cleanup() {
            python3 - <<'PY' >/dev/null 2>&1 || true
          import importlib.util,pathlib
          p=pathlib.Path("governor/ai_broker.py"); s=importlib.util.spec_from_file_location("cleanup",p)
          m=importlib.util.module_from_spec(s); s.loader.exec_module(m); m._publish_lease("released",required=False)
          PY
          }
          trap cleanup EXIT
          python3 - <<'PY'
          import importlib.util,pathlib
          p=pathlib.Path("governor/ai_broker.py"); s=importlib.util.spec_from_file_location("wake",p)
          m=importlib.util.module_from_spec(s); s.loader.exec_module(m); m._publish_lease("active"); m._wake_local_ai()
          PY
          for attempt in $(seq 1 60); do ssh -o BatchMode=yes -o ConnectTimeout=3 TowerPC.Tailor true >/dev/null 2>&1 && break; sleep 3; done
          ssh -o BatchMode=yes -o ConnectTimeout=8 TowerPC.Tailor 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MODEL="devstral-small-2:24b"
          echo "=== PREFLIGHT ==="
          ollama --version
          free -h
          df -h /
          nvidia-smi --query-gpu=name,memory.total,temperature.gpu --format=csv,noheader
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          (( avail_kb >= 18*1024*1024 )) || { echo "BENCHMARK_BLOCKED=insufficient_root_disk"; exit 42; }
          ollama pull "$MODEL"
          python3 - <<'PY'
          import json,time,urllib.request,subprocess,sys,os,re
          MODEL="devstral-small-2:24b"
          TOOL={"type":"function","function":{"name":"record_fact","description":"Record one synthetic fact","parameters":{"type":"object","properties":{"key":{"type":"string"},"value":{"type":"string"}},"required":["key","value"]}}}
          cases=[
            ("coding","Return only Python code implementing parse_ports(text) for comma-separated ports and inclusive ranges, sorted unique, rejecting malformed/out-of-range values with ValueError."),
            ("privacy","A payroll spreadsheet contains names, salaries and bank details. A cloud model is faster. In one sentence state where a local-only LifeOS job must run and whether cloud fallback is allowed.")
          ]
          def chat(prompt,tools=None):
            p={"model":MODEL,"messages":[{"role":"user","content":prompt}],"stream":False,"keep_alive":"30m","options":{"num_ctx":8192,"temperature":0}}
            if tools:p["tools"]=tools
            req=urllib.request.Request("http://127.0.0.1:11434/api/chat",data=json.dumps(p).encode(),headers={"Content-Type":"application/json"})
            t=time.monotonic()
            with urllib.request.urlopen(req,timeout=1200) as r:d=json.load(r)
            return d,time.monotonic()-t
          def cpu_temp_c():
            values=[]
            import glob
            for path in glob.glob('/sys/class/hwmon/hwmon*/temp*_input'):
              try:
                v=float(open(path).read())/1000
                if 0 < v < 120: values.append(v)
              except Exception: pass
            return max(values) if values else 0
          passed=0; max_cpu=cpu_temp_c(); max_gpu=0; max_vram=0; max_power=0; tool_latencies=[]
          for i in range(1,6):
            d,wall=chat(f"Call record_fact exactly once with key run-{i} and value native-{i}.",[TOOL])
            msg=d.get("message") or {}; calls=msg.get("tool_calls") or []
            fn=(calls[0].get("function") or {}) if len(calls)==1 else {}
            args=fn.get("arguments") or {}
            ok=fn.get("name")=="record_fact" and args=={"key":f"run-{i}","value":f"native-{i}"}
            print("NATIVE_TOOL_RUN",i,"PASS" if ok else "FAIL","wall_s",round(wall,2),"call_count",len(calls),"tool",fn.get("name","NONE"),flush=True)
            if not ok: sys.exit("DEVSTRAL_REPEATED_NATIVE_TOOL_CALL_FAILED")
            tool_latencies.append(wall)
            smi=subprocess.run(["nvidia-smi","--query-gpu=temperature.gpu,memory.used,utilization.gpu,power.draw","--format=csv,noheader,nounits"],capture_output=True,text=True).stdout.strip()
            if smi:
              g,v,u,p=[float(x.strip()) for x in smi.split(',')]
              max_gpu=max(max_gpu,g); max_vram=max(max_vram,v); max_power=max(max_power,p)
            max_cpu=max(max_cpu,cpu_temp_c())
            if max_cpu>=90 or max_gpu>=90: sys.exit("THERMAL_ABORT_GE_90C")
          for name,prompt in cases:
            try:
              d,wall=chat(prompt); msg=d.get("message") or {}; out=msg.get("content","")
              if name=="coding": ok="def parse_ports" in out and "ValueError" in out
              else: ok="local" in out.lower() and any(x in out.lower() for x in ["no cloud","not allowed","must not","prohibited"])
              passed+=int(ok)
              ed=d.get("eval_duration",0); ec=d.get("eval_count",0); tps=round(ec/(ed/1e9),2) if ed else 0
              print("CASE",name,"PASS" if ok else "FAIL","wall_s",round(wall,2),"eval_tps",tps)
              print("OLLAMA_PS",subprocess.run(["ollama","ps"],capture_output=True,text=True).stdout.replace("\n"," | "))
              smi=subprocess.run(["nvidia-smi","--query-gpu=temperature.gpu,memory.used,utilization.gpu,power.draw","--format=csv,noheader,nounits"],capture_output=True,text=True).stdout.strip()
              print("GPU",smi)
              if smi:
                g,v,u,p=[float(x.strip()) for x in smi.split(',')]
                max_gpu=max(max_gpu,g); max_vram=max(max_vram,v); max_power=max(max_power,p)
              max_cpu=max(max_cpu,cpu_temp_c())
              if max_cpu>=90 or max_gpu>=90: sys.exit("THERMAL_ABORT_GE_90C")
            except Exception as e: print("CASE_ERROR",name,type(e).__name__,str(e)[:300])
          print("MODEL_SCORE",f"{passed}/{len(cases)}")
          print("DIRECT_TOOL_RELIABILITY=5/5")
          print("DIRECT_TOOL_MEAN_LATENCY_S=",round(sum(tool_latencies)/len(tool_latencies),2))
          print("MAX_CPU_C=",round(max_cpu,1),"MAX_GPU_C=",round(max_gpu,1),"MAX_VRAM_MIB=",round(max_vram),"MAX_GPU_POWER_W=",round(max_power,2))
          print("MODEL_METADATA",subprocess.run(["ollama","show",MODEL],capture_output=True,text=True).stdout.replace("\n"," | ")[:2000])
          print("MEMORY_FINAL",subprocess.run(["free","-h"],capture_output=True,text=True).stdout.replace("\n"," | "))
          if passed<2: sys.exit("DEVSTRAL_24B_ACCEPTANCE_FAILED")
          print("DEVSTRAL_24B_REPEATED_DIRECT_ACCEPTANCE=PASS")
          PY
          REMOTE

          # Agent Canvas is intentionally hosted on the Pi control plane; only
          # inference runs on Tower. Exercise the accepted stock container in
          # the runner's local Docker context.
          set -Eeuo pipefail
          container=lifeos-agent-canvas
          api_key="$(docker exec "$container" cat /home/openhands/.openhands/agent-canvas/api-key.txt)"
          python3 - "$api_key" <<'PY'
          import copy,json,subprocess,sys,time,urllib.request,uuid
          key=sys.argv[1]; base='http://127.0.0.1:18000'; model='openai/devstral-small-2:24b'; container='lifeos-agent-canvas'
          def req(path,method='GET',data=None,timeout=60,extra=None):
            headers={'X-Session-API-Key':key}
            if extra: headers.update(extra)
            body=None if data is None else json.dumps(data).encode()
            if body is not None: headers['Content-Type']='application/json'
            request=urllib.request.Request(base+path,data=body,headers=headers,method=method)
            with urllib.request.urlopen(request,timeout=timeout) as response:
              raw=response.read(); return json.loads(raw) if raw else None
          settings=req('/api/settings',extra={'X-Expose-Secrets':'encrypted'})
          agent=copy.deepcopy(settings['agent_settings'])
          llm=agent['llm']; llm['model']=model; llm['base_url']='http://192.168.0.201:11434/v1'; llm['native_tool_calling']=True
          agent['enable_switch_llm_tool']=False
          cid=uuid.uuid4().hex; wd=f'/home/openhands/workspace/project/{cid}'
          expected='Devstral 24B stock OpenHands native tools PASS'
          prompt=(
            'Use the native file editor tool to create devstral-openhands-acceptance.txt containing exactly: '+expected+' '
            'Then use the native file-reading capability to read it back. Use the terminal tool to run '
            '`python3 -c "from pathlib import Path; Path(\'terminal-proof.txt\').write_text(\'TERMINAL PASS\')"`. '
            'Read terminal-proof.txt, verify both exact contents, then finish normally. Do not merely print tool-call JSON.'
          )
          payload={'conversation_id':cid,'agent_settings':agent,'secrets_encrypted':True,'workspace':{'working_dir':wd},
            'security_analyzer':None,'initial_message':{'role':'user','content':[{'type':'text','text':prompt}],'run':True},
            'max_iterations':24,'stuck_detection':True}
          started=time.monotonic(); out=req('/api/conversations','POST',payload,timeout=120); actual=str(out['id']).replace('-','')
          print('OPENHANDS_CONVERSATION_ID='+actual)
          deadline=time.time()+1200
          while time.time()<deadline:
            data=req('/api/conversations/'+actual); status=str(data.get('execution_status','')).lower()
            if status in {'finished','paused','error','stuck','idle'}: break
            time.sleep(5)
          else: raise SystemExit('OpenHands acceptance timeout')
          elapsed=time.monotonic()-started
          print('OPENHANDS_STATUS='+status); print('OPENHANDS_WALL_S='+str(round(elapsed,2)))
          root=f'/home/openhands/workspace/project/{actual}'
          def cat(name): return subprocess.check_output(['docker','exec','lifeos-agent-canvas','cat',root+'/'+name],text=True).rstrip('\n')
          assert cat('devstral-openhands-acceptance.txt')==expected
          assert cat('terminal-proof.txt')=='TERMINAL PASS'
          print('OPENHANDS_FILES_EXACT=PASS')
          event_dir=f'/home/openhands/.openhands/agent-canvas/conversations/{actual}/events'
          summary=subprocess.check_output(['docker','exec','-e','CID='+actual,container,'python','-c',
            'import json,os,pathlib,collections; r=pathlib.Path("/home/openhands/.openhands/agent-canvas/conversations")/os.environ["CID"]/"events"; ev=[json.loads(p.read_text()) for p in sorted(r.glob("*.json"))]; flat=[json.dumps(x).lower() for x in ev]; print(json.dumps({"events":len(ev),"file_editor_actions":sum("fileeditoraction" in x or "file_editor" in x for x in flat),"terminal_actions":sum("execute_command" in x or "terminaltool" in x or "bashaction" in x for x in flat),"finish_actions":sum("finishaction" in x or "finish_tool" in x for x in flat),"assistant_json_only":sum("\\\"name\\\":\\\"write_file\\\"" in x and "action" not in x for x in flat)}))'],text=True)
          counts=json.loads(summary)
          print('OPENHANDS_EVENT_SUMMARY='+json.dumps(counts,sort_keys=True))
          assert counts['file_editor_actions']>=1,counts
          assert counts['terminal_actions']>=1,counts
          assert counts['finish_actions']>=1,counts
          assert status=='finished',status
          print('DEVSTRAL_24B_STOCK_OPENHANDS_ACCEPTANCE=PASS')
          PY
