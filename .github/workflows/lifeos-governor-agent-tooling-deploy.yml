name: LifeOS Governor Agent Tooling Deploy
# Deploy bounded OpenHands continuation
# Deploy final OpenHands-owned engineering plane

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-governor-agent-tooling-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifeos-engineer-tooling
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 20
    steps:
      - name: Synchronize canonical Pi checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Ensure Engineer available for tooling deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          # Tooling deployment runs independently of the Governor deploy workflow.
          # Run 35533555748 failed with SSH connection refused before provisioning,
          # so establish the existing Tower/Engineer prerequisite here explicitly.
          if ssh -o BatchMode=yes -o ConnectTimeout=4 Engineer true 2>/dev/null; then
            echo 'ENGINEER_TOOLING_ALREADY_READY=PASS'
            exit 0
          fi
          wol_helper=''
          for candidate in /usr/local/sbin/lifeos-engineer-wake /usr/local/sbin/lifeos-tower-wake /usr/local/bin/lifeos-engineer-wake; do
            if test -x "$candidate"; then wol_helper="$candidate"; break; fi
          done
          wake_engineer() {
            if test -n "$wol_helper"; then
              "$wol_helper"
            else
              command -v wakeonlan >/dev/null
              wakeonlan 40:8d:5c:84:41:64 >/dev/null
            fi
          }
          wake_engineer
          mosquitto_pub -h 127.0.0.1 -t lifeos/tower/power/set -m ON
          echo "ENGINEER_TOOLING_WAKE_PATH=${wol_helper:-direct-wol}"
          ready=0
          deadline=$((SECONDS + 600))
          attempt=0
          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            if ssh -o BatchMode=yes -o ConnectTimeout=4 Engineer true 2>/dev/null; then ready=1; break; fi
            if (( attempt % 6 == 0 )); then
              wake_engineer
              echo "ENGINEER_TOOLING_WAKE_RETRY=$attempt"
            fi
            sleep 5
          done
          test "$ready" -eq 1
          echo 'ENGINEER_TOOLING_READINESS=PASS'

      - name: Provision OpenHands headless on Engineer
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=8 Engineer 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          before_uv=absent
          before_openhands=absent
          command -v uv >/dev/null 2>&1 && before_uv=$(uv --version | head -1)
          command -v openhands >/dev/null 2>&1 && before_openhands=$(openhands --version 2>/dev/null | head -1 || echo present)
          echo "BEFORE_UV=$before_uv"
          echo "BEFORE_OPENHANDS=$before_openhands"

          free_kb=$(df -Pk "$HOME" | awk 'NR==2 {print $4}')
          (( free_kb >= 2097152 )) || { echo 'RESULT=BLOCKED'; echo 'REASON=engineer_home_free_space_under_2GiB'; exit 20; }
          python3 -m pip --version >/dev/null

          if ! command -v uv >/dev/null 2>&1; then
            python3 -m pip install --user --disable-pip-version-check uv
          fi
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv --version

          # #759 controlled attempt 3 proved the broker and required tool-call
          # contract PASS, while the installed OpenHands SDK v1.21.0 emitted
          # invoke_skill(bash-runner) and exited without executing it. The PyPI CLI currently tops out at v1.16.0; keep that package pin explicit
          # rather than confusing it with newer monorepo/SDK release lines. Before adding custom
          # LifeOS execution machinery.
          if command -v openhands >/dev/null 2>&1; then
            current=$(python3 -c "import importlib.metadata; print(importlib.metadata.version('openhands'))" 2>/dev/null || echo unknown)
            if [[ "$current" != 1.16.0 ]]; then
              uv tool install --force 'openhands==1.16.0' --python 3.12
            fi
          else
            uv tool install 'openhands==1.16.0' --python 3.12
          fi
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          command -v openhands
          tool_python="$(dirname "$(readlink -f "$(command -v openhands)")")/python"
          test -x "$tool_python"
          installed=$("$tool_python" -c "import importlib.metadata; print(importlib.metadata.version('openhands'))")
          [[ "$installed" == 1.16.0 ]]
          sdk=$("$tool_python" -c "import importlib.metadata; print(importlib.metadata.version('openhands-sdk'))")
          "$tool_python" -c 'from openhands.sdk import LLM,Conversation; from openhands_cli.utils import get_default_cli_agent'
          echo "OPENHANDS_PINNED_VERSION=$installed"
          echo "OPENHANDS_SDK_VERSION=$sdk"
          echo 'OPENHANDS_SDK_CAPABILITY=PASS'
          echo 'ENGINEER_AGENT_TOOLING_DEPLOY=PASS'
          REMOTE

      - name: Verify Codex remains available
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=8 Engineer '
            test -x "$HOME/.local/bin/codex" || command -v codex >/dev/null
            echo CODEX_REGRESSION=PASS
          '

      - name: Prove Pi repository clean
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo 'REPOSITORY_FINAL=PASS'
