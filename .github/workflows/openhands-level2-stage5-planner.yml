name: OpenHands Level 2 Stage 5 Planner Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/openhands-level2-stage5-planner.yml'

permissions:
  contents: read

jobs:
  planner-probe:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 15
    steps:
      - name: Probe GPT-OSS as bounded recovery planner
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          python3 - <<'PY'
          import importlib.util
          import json
          import pathlib

          path = pathlib.Path('governor/ai_broker.py')
          spec = importlib.util.spec_from_file_location('stage5_broker', path)
          broker = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(broker)

          prompt = (
              'You are a bounded recovery planner for an autonomous software-engineering agent.\n'
              'Return ONLY one JSON object. Do not edit files, propose code, diagnose the domain bug, or supply an implementation solution.\n\n'
              'The engineering objective ledger, in order, is:\n'
              '1 task_understood\n2 implementation_inspected\n3 defect_established\n4 implementation_changed\n'
              '5 tests_executed\n6 diff_reviewed\n7 committed\n8 pushed\n9 pr_created\n10 ci_checked\n\n'
              'Observed executor state after three deterministic Stage-4 recovery turns:\n'
              '- task_understood=true\n- implementation_inspected=true\n- defect_established=true\n'
              '- implementation_changed=true during the run\n- tests_executed=true\n- diff_reviewed=false\n'
              '- committed=false\n- pushed=false\n- pr_created=false\n- ci_checked=false\n'
              '- repeated_action_count=11\n- executor eventually returned to main with no retained change and no PR\n\n'
              'Select the earliest unmet objective and give exactly one bounded next-step instruction that advances that objective '
              'without revealing any issue-specific repair or code. The instruction may tell the executor what lifecycle action to '
              'perform, but not how to implement the underlying bug fix.\n\n'
              'Required JSON schema:\n'
              '{"earliest_unmet":"one ledger key","next_instruction":"one concise imperative sentence","solution_hint":false}\n'
          )
          raw = broker._ollama(prompt, broker.OLLAMA_MODEL)
          print('STAGE5_PLANNER_RAW=' + raw.replace('\n', ' ')[:2000])
          try:
              data = json.loads(raw)
          except Exception as exc:
              raise SystemExit('STAGE5_PLANNER_RESULT=FAIL_INVALID_JSON:' + type(exc).__name__)

          expected_keys = {'earliest_unmet', 'next_instruction', 'solution_hint'}
          if set(data) != expected_keys:
              raise SystemExit('STAGE5_PLANNER_RESULT=FAIL_SCHEMA_KEYS')
          if data['earliest_unmet'] != 'diff_reviewed':
              raise SystemExit('STAGE5_PLANNER_RESULT=FAIL_WRONG_OBJECTIVE:' + str(data['earliest_unmet']))
          if data['solution_hint'] is not False:
              raise SystemExit('STAGE5_PLANNER_RESULT=FAIL_SOLUTION_HINT_FLAG')
          instruction = data['next_instruction']
          if not isinstance(instruction, str) or not instruction.strip() or len(instruction) > 240:
              raise SystemExit('STAGE5_PLANNER_RESULT=FAIL_INSTRUCTION_SHAPE')
          lowered = instruction.lower()
          if not any(term in lowered for term in ('diff', 'review', 'inspect')):
              raise SystemExit('STAGE5_PLANNER_RESULT=FAIL_INSTRUCTION_NOT_BOUND_TO_OBJECTIVE')
          print('STAGE5_PLANNER_EARLIEST_UNMET=' + data['earliest_unmet'])
          print('STAGE5_PLANNER_INSTRUCTION=' + instruction.replace('\n', ' '))
          print('STAGE5_PLANNER_RESULT=PASS')
          PY
