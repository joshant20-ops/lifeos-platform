name: LifeOS Governor Tower AI Lifecycle

on:
  push:
    branches: [main]
    paths:
      - 'scripts/lifeos-deploy-governor-managed-engineer.sh'
      - 'governor/engineer_backend.py'
      - 'governor/autonomous_agent.py'
      - 'governor/systemd/lifeos-engineer.service.d/governor-ai-broker.conf'
      - 'governor/tower_control.py'
      - 'governor/systemd/lifeos-tower-control.service'
  workflow_dispatch:

permissions:
  # Deployment authority remains inside the fixed root gateway.
  contents: read

concurrency:
  group: lifeos-pi5-control
  cancel-in-progress: false

jobs:
  deploy-and-prove:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 30
    steps:
      - name: Verify canonical checkout
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo 'CANONICAL_CHECKOUT_NOT_READY=dirty'
            git status --short
            exit 20
          fi
          # A clean deployment mirror may lag origin/main while another workflow
          # held the single Pi runner. Reconcile it deterministically instead of
          # failing merely because this run was queued behind newer main.
          git reset --hard origin/main
          head="$(git rev-parse HEAD)"
          origin="$(git rev-parse origin/main)"
          test "$head" = "$origin"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'CANONICAL_CHECKOUT_READY=PASS'

      - name: Verify bounded Engineer deployment gateway
        run: |
          set -Eeuo pipefail
          set +e
          out=$(sudo -n /usr/local/sbin/lifeos-deploy-gateway 2>&1)
          rc=$?
          set -e
          test "$rc" -eq 64
          grep -q 'deploy-governor-managed-engineer' <<<"$out"
          echo 'ENGINEER_DEPLOY_GATEWAY=PASS'

      - name: Deploy protected Engineer runtime
        run: sudo -n /usr/local/sbin/lifeos-deploy-gateway deploy-governor-managed-engineer

      - name: Refresh Tower controller runtime
        run: |
          set -Eeuo pipefail
          # #1588 acceptance deliberately begins with the Tower unavailable. The
          # full HA bridge deploy has a live-Tower SSH/final-ACCESSIBLE gate, so
          # do not redeploy the entire HA/dashboard stack as a controller refresh.
          # The controller is already deployed by the governed bridge path; prove
          # the Pi-side runtime/config locally without waking or requiring Tower.
          systemctl is-active --quiet lifeos-tower-control.service
          systemctl is-enabled --quiet lifeos-tower-control.service
          test -r /etc/lifeos/tower.json
          env=$(systemctl show lifeos-tower-control.service -p Environment --value)
          grep -Eq '(^| )LIFEOS_TOWER_IDLE_GRACE=600($| )' <<<"$env"
          controller_pid=$(systemctl show lifeos-tower-control.service -p MainPID --value)
          test "$controller_pid" -gt 1
          tr '\0' '\n' < "/proc/$controller_pid/environ" | grep -Fxq 'LIFEOS_TOWER_IDLE_GRACE=600'
          controller_state=$(timeout 5 mosquitto_sub -h 127.0.0.1 -C 1 -t lifeos/tower/state)
          python3 - "$controller_state" <<'PY'
          import json,sys
          state=json.loads(sys.argv[1])
          assert int(state.get('idle_grace_seconds') or 0) == 600, state
          assert state.get('lease_state') == 'NONE', state
          print('TOWER_LIVE_CONTROLLER_STATE=PASS idle_grace_seconds=600 lease_state=NONE')
          PY
          echo 'TOWER_IDLE_GRACE=600_RUNNING_PROCESS_PASS'
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('/etc/lifeos/tower.json').read_text())
          assert cfg.get('mac'), 'tower MAC missing'
          # tower_control.py deliberately defaults these when omitted from runtime config.
          broadcast=str(cfg.get('broadcast') or '255.255.255.255')
          port=int(cfg.get('wol_port') or 9)
          assert broadcast, 'WoL broadcast invalid'
          assert 1 <= port <= 65535, 'WoL port invalid'
          assert (cfg.get('access_probe') or {}).get('host'), 'Tower access probe host missing'
          print('TOWER_CONTROLLER_RUNTIME_REFRESH=PASS')
          print('TOWER_COLD_START_PREFLIGHT=PASS')
          PY

      - name: Capture Engineer diagnostics on deployment failure
        if: failure()
        run: |
          set +e
          systemctl status lifeos-engineer.service --no-pager --full
          journalctl -u lifeos-engineer.service -n 120 --no-pager -o short-iso

      - name: Prove off to autonomous model-ready recovery
        run: |
          set -Eeuo pipefail
          mosquitto_pub -h 127.0.0.1 -t lifeos/tower/power/set -m OFF
          for _ in $(seq 1 90); do
            state=$(timeout 5 mosquitto_sub -h 127.0.0.1 -C 1 -t lifeos/tower/state || true)
            if python3 -c 'import json,sys; raise SystemExit(0 if not json.loads(sys.argv[1]).get("accessible") else 1)' "$state" 2>/dev/null; then break; fi
            sleep 2
          done
          python3 - "$state" <<'PY'
          import json,sys
          assert json.loads(sys.argv[1]).get('accessible') is False
          print('TOWER_OFF_BEFORE_MODEL=PASS')
          PY
          python3 - <<'PY'
          import json,time,urllib.error,urllib.request
          payload={'model':'lifeos-engineer','messages':[{'role':'user','content':'Briefly identify your role. This is information only; do not create a job.'}],'stream':False}
          request=urllib.request.Request('http://127.0.0.1:8793/v1/chat/completions',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'},method='POST')
          started=time.monotonic()
          try:
              with urllib.request.urlopen(request,timeout=900) as response: value=json.load(response)
          except urllib.error.HTTPError as exc:
              print('ENGINEER_HTTP_ERROR_BODY=' + exc.read().decode('utf-8', 'replace'))
              raise
          answer=value['choices'][0]['message']['content']
          assert isinstance(answer,str) and answer.strip(), answer
          print(f'GOVERNOR_MODEL_AFTER_WAKE=PASS elapsed={time.monotonic()-started:.1f}s')
          PY
          state=$(timeout 5 mosquitto_sub -h 127.0.0.1 -C 1 -t lifeos/tower/state)
          python3 -c 'import json,sys; assert json.loads(sys.argv[1]).get("accessible") is True' "$state"
          echo 'TOWER_ACCESSIBLE_AFTER_WAKE=PASS'

      - name: Capture broker lifecycle diagnostics on request failure
        if: failure()
        run: |
          set +e
          echo 'TOWER_STATE_DIAGNOSTIC'
          timeout 5 mosquitto_sub -h 127.0.0.1 -C 1 -t lifeos/tower/state
          echo 'TOWER_LEASE_DIAGNOSTIC'
          timeout 5 mosquitto_sub -h 127.0.0.1 -v -t 'lifeos/tower/lease/+'
          systemctl status lifeos-tower-control.service lifeos-autonomous-agent.service lifeos-engineer.service --no-pager --full
          journalctl -u lifeos-tower-control.service -u lifeos-autonomous-agent.service -u lifeos-engineer.service -n 160 --no-pager -o short-iso

      - name: Prove lease release and automatic shutdown
        timeout-minutes: 17
        run: |
          set -Eeuo pipefail
          lease=$(timeout 5 mosquitto_sub -h 127.0.0.1 -C 1 -t 'lifeos/tower/lease/+' || true)
          python3 -c 'import json,sys; assert json.loads(sys.argv[1]).get("state") == "released"' "$lease"
          echo 'MODEL_LEASE_RELEASE=PASS'
          lease_released_at=$(date +%s)
          stopped=0
          max_idle=0
          # Observe for at most 15 minutes from lease release. Controller idle may begin
          # after other normal leases drain; then allow the full 600-second grace plus
          # shutdown propagation. Retained MQTT reads return immediately, so use wall time.
          shutdown_deadline=$(( lease_released_at + 900 ))
          idle_start_delay=-1
          while (( $(date +%s) < shutdown_deadline )); do
            state=$(timeout 5 mosquitto_sub -h 127.0.0.1 -C 1 -t lifeos/tower/state || true)
            read -r idle idle_since < <(python3 - "$state" <<'PY'
          import json,sys
          try:
              value=json.loads(sys.argv[1])
              assert int(value.get('idle_grace_seconds') or 0) == 600
              assert value.get('lease_state') == 'NONE'
              print(int(value.get('idle_seconds') or 0), int(value.get('idle_since') or 0))
          except (ValueError, TypeError, AssertionError):
              print('0 0')
          PY
          )
            if (( idle_since > 0 && idle_start_delay < 0 )); then idle_start_delay=$(( idle_since - lease_released_at )); fi
            (( idle > max_idle )) && max_idle=$idle
            if (( idle >= 600 )) && python3 -c 'import json,sys; raise SystemExit(0 if not json.loads(sys.argv[1]).get("accessible") else 1)' "$state" 2>/dev/null; then stopped=1; break; fi
            sleep 5
          done
          elapsed=$(( $(date +%s) - lease_released_at ))
          echo "TOWER_IDLE_GRACE_OBSERVED=${max_idle}s elapsed_since_lease_release=${elapsed}s idle_started_after_release=${idle_start_delay}s"
          test "$max_idle" -ge 600
          test "$elapsed" -ge 600
          test "$stopped" -eq 1
          echo 'GOVERNOR_AUTOMATIC_TOWER_SHUTDOWN=PASS'

      - name: Prove repository clean
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          status=$(git status --short --untracked-files=all)
          if [[ -n "$status" ]]; then
            echo 'RUNTIME_REPOSITORY_STATUS=DIRTY'
            printf '%s\n' "$status"
            git diff --stat
            exit 1
          fi
          # Another governed job may have advanced main while this 600-second
          # lifecycle proof held the Pi runner. Fast-forward only a clean checkout.
          git merge --ff-only origin/main
          head=$(git rev-parse HEAD)
          origin=$(git rev-parse origin/main)
          echo "RUNTIME_HEAD=$head"
          echo "ORIGIN_MAIN=$origin"
          test "$head" = "$origin"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'GOVERNOR_TOWER_AI_LIFECYCLE=PASS'
