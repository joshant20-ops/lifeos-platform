name: Encrypted backup pair archive pilot
on:
  pull_request:
    paths:
      - .github/workflows/storage-backup-pair-archive-pilot.yml
      - governor/backup_pair_archive_pilot.py
      - tests/test_backup_pair_archive_pilot.py
      - scripts/lifeos-backup-pair-archive-pilot.sh
      - scripts/lifeos_storage_backup_profile.py
  push:
    branches: [main]
    paths:
      - .github/workflows/storage-backup-pair-archive-pilot.yml

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          set -Eeuo pipefail
          if [[ ! -x /usr/bin/restic ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends restic
          fi
          bash -n scripts/lifeos-backup-pair-archive-pilot.sh
          python3 -B -m unittest -v tests.test_backup_pair_archive_pilot tests.test_storage_backup_profile
          python3 -B -c 'from tests.test_lifeos_deploy_gateway import gateway; assert gateway.parse_request(["storage-backup-pair-archive-pilot"]) == ("storage-backup-pair-archive-pilot", [])'

  pilot:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'joshant20-ops/lifeos-platform' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    concurrency:
      group: lifeos-pi5-control
      cancel-in-progress: false
    timeout-minutes: 8
    steps:
      - name: Archive and restore one bounded backup pair
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch --prune origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git merge --ff-only origin/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          sudo -n install -o root -g root -m 0755 homelab/live/usr/local/sbin/lifeos-deploy-gateway /usr/local/sbin/lifeos-deploy-gateway
          cmp -s homelab/live/usr/local/sbin/lifeos-deploy-gateway /usr/local/sbin/lifeos-deploy-gateway
          sudo -n /usr/local/sbin/lifeos-deploy-gateway storage-backup-pair-archive-pilot
