name: LifeOS Restore Rehearsal
on:
  push:
    branches: [main]
    paths:
      - 'scripts/lifeos-restic-restore-rehearsal.sh'
      - 'homelab/live/usr/local/sbin/lifeos-deploy-gateway'
      - '.github/workflows/lifeos-restore-rehearsal.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: lifeos-pi5-control
  cancel-in-progress: false
jobs:
  rehearse:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 30
    steps:
      - name: Synchronize canonical Pi checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Refresh reviewed gateway and run restore rehearsal
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          sudo -n install -o root -g root -m 0755 homelab/live/usr/local/sbin/lifeos-deploy-gateway /usr/local/sbin/lifeos-deploy-gateway
          sudo -n /usr/local/sbin/lifeos-deploy-gateway restore-rehearsal
      - name: Verify durable evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n cat /root/.local/state/lifeos/restore-rehearsal/latest.json | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['result']=='PASS' and d['repository_check']=='PASS' and d['actual_restore']=='PASS' and d['restored_file_count']>0 and not d['production_overwrite'] and not d['secrets_emitted']; print('DURABLE_RESTORE_EVIDENCE=PASS')"
      - name: Prove repository non-mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo 'RESTORE_REHEARSAL_REPOSITORY=PASS'
