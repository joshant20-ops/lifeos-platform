name: LifeOS AI Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-ai-smoke-test.yml'

permissions:
  contents: read

concurrency:
  group: lifeos-pi5-control
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 15
    steps:
      - name: Synchronize canonical Pi checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Confirm Engineer PC and VM, wake if required
        shell: bash
        run: |
          set -Eeuo pipefail
          if ssh -o BatchMode=yes -o ConnectTimeout=4 Engineer 'true' 2>/dev/null; then
            echo 'ENGINEER_VM_INITIAL=ONLINE'
          else
            echo 'ENGINEER_VM_INITIAL=OFFLINE'
            wol_helper=''
            for c in /usr/local/sbin/lifeos-engineer-wake /usr/local/sbin/lifeos-tower-wake /usr/local/bin/lifeos-engineer-wake; do
              if test -x "$c"; then wol_helper="$c"; break; fi
            done
            if test -n "$wol_helper"; then
              "$wol_helper"
              echo "WAKE_PATH=$wol_helper"
            elif systemctl list-unit-files --no-legend --no-pager | awk '{print $1}' | grep -Eq '^(lifeos-.*(engineer|tower).*(wake|wol)|.*(wake|wol).*(engineer|tower).*)\.service$'; then
              unit=$(systemctl list-unit-files --no-legend --no-pager | awk '{print $1}' | grep -E '^(lifeos-.*(engineer|tower).*(wake|wol)|.*(wake|wol).*(engineer|tower).*)\.service$' | head -1)
              sudo -n systemctl start "$unit"
              echo "WAKE_PATH=systemd:$unit"
            else
              echo 'WAKE_PATH=NOT_DISCOVERED'
              echo 'LOCAL_AI_SMOKE=BLOCKED_NO_GOVERNED_WAKE_PATH'
              exit 20
            fi
            for i in $(seq 1 36); do
              if ssh -o BatchMode=yes -o ConnectTimeout=4 Engineer 'true' 2>/dev/null; then
                echo "ENGINEER_VM_WAKE=PASS attempt=$i"
                break
              fi
              sleep 5
            done
            ssh -o BatchMode=yes -o ConnectTimeout=4 Engineer 'true'
          fi
          echo 'ENGINEER_VM_REACHABLE=PASS'

      - name: Prove Tower local AI and GPU path
        shell: bash
        run: |
          set -Eeuo pipefail
          AI=http://192.168.0.201:11434
          curl -fsS --max-time 5 "$AI/api/tags" >/tmp/lifeos-ai-tags.json
          python3 - /tmp/lifeos-ai-tags.json <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          names=[m.get('name','') for m in j.get('models',[])]
          assert names, j
          preferred='qwen2.5-coder:7b-instruct'
          model=preferred if preferred in names else names[0]
          print('LOCAL_AI_MODEL='+model)
          open('/tmp/lifeos-ai-model','w').write(model)
          PY
          model=$(cat /tmp/lifeos-ai-model)
          python3 - "$model" >/tmp/lifeos-ai-request.json <<'PY'
          import json,sys
          print(json.dumps({'model':sys.argv[1],'prompt':'Reply with exactly LOCAL_AI_SMOKE_OK','stream':False,'keep_alive':'5m'}))
          PY
          curl -fsS --max-time 120 -H 'Content-Type: application/json' --data-binary @/tmp/lifeos-ai-request.json "$AI/api/generate" >/tmp/lifeos-ai-response.json
          python3 - /tmp/lifeos-ai-response.json <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          r=j.get('response','')
          print('LOCAL_AI_RESPONSE='+r.strip().replace('\n',' ')[:200])
          assert 'LOCAL_AI_SMOKE_OK' in r, j
          print('LOCAL_AI_INFERENCE=PASS')
          PY
          curl -fsS --max-time 5 "$AI/api/ps" >/tmp/lifeos-ai-ps.json
          python3 - /tmp/lifeos-ai-ps.json "$model" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1])); model=sys.argv[2]
          rows=j.get('models',[])
          assert rows, j
          row=next((x for x in rows if x.get('name')==model or x.get('model')==model), rows[0])
          vram=int(row.get('size_vram') or 0)
          size=int(row.get('size') or 0)
          print('LOCAL_AI_SIZE_BYTES='+str(size))
          print('LOCAL_AI_VRAM_BYTES='+str(vram))
          assert vram > 0, row
          print('LOCAL_AI_GPU_OFFLOAD=PASS')
          PY

      - name: Prove Codex with production invocation
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=8 Engineer 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          if command -v codex >/dev/null 2>&1; then c=$(command -v codex); elif test -x "$HOME/.local/bin/codex"; then c="$HOME/.local/bin/codex"; else echo 'CODEX_MISSING'; exit 21; fi
          "$c" --version
          repo=/home/joshan/workspace/lifeos-platform
          test -d "$repo/.git"
          git -C "$repo" fetch origin main >/dev/null
          root="$HOME/.local/share/lifeos-agent/smoke"
          out="$HOME/.local/share/lifeos-agent/codex-smoke.out"
          rm -rf "$root"
          rm -f "$out"
          git -C "$repo" worktree add --detach "$root" origin/main >/dev/null
          cleanup(){ git -C "$repo" worktree remove --force "$root" >/dev/null 2>&1 || true; rm -f "$out"; }
          trap cleanup EXIT
          cd "$root"
          help=$($c exec --help 2>&1 || true)
          set +e
          if grep -q -- '--full-auto' <<<"$help"; then
            timeout 180s "$c" exec --full-auto 'Reply with exactly CODEX_SMOKE_OK and make no file changes.' </dev/null >"$out" 2>&1
          else
            timeout 180s "$c" exec 'Reply with exactly CODEX_SMOKE_OK and make no file changes.' </dev/null >"$out" 2>&1
          fi
          rc=$?
          set -e
          sed -n '1,160p' "$out"
          echo "CODEX_RC=$rc"
          test "$rc" -eq 0
          grep -q 'CODEX_SMOKE_OK' "$out"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'CODEX_INFERENCE=PASS'
          REMOTE

      - name: Final regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          curl -fsS --max-time 5 http://127.0.0.1:8790/health | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"]=="ok"'
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo 'CODEX_LOCAL_AI_SMOKE=PASS'
          echo 'REPOSITORY_FINAL=PASS'
