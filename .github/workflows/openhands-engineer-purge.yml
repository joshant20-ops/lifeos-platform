name: Purge Retired Engineer OpenHands State

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/openhands-engineer-purge.yml']

permissions:
  contents: read

jobs:
  purge:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 5
    steps:
      - name: Purge retired Engineer OpenHands files
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes Engineer 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user disable --now lifeos-openhands-ui.service lifeos-openhands-tls.service 2>/dev/null || true
          docker rm -f lifeos-agent-canvas lifeos-agent-canvas-tls 2>/dev/null || true
          image="ghcr.io/openhands/agent-canvas:1.23.0"
          docker run --rm --user root -v "$HOME:/host-home" --entrypoint /bin/sh "$image" -c '
            rm -rf /host-home/.openhands /host-home/workspace /host-home/lifeos-projects /host-home/lifeos-canvas-tls
            rm -f /host-home/.config/systemd/user/lifeos-openhands-ui.service /host-home/.config/systemd/user/lifeos-openhands-tls.service
          '
          systemctl --user daemon-reload
          test ! -e "$HOME/.openhands"
          test ! -e "$HOME/workspace"
          test ! -e "$HOME/lifeos-projects"
          test ! -e "$HOME/lifeos-canvas-tls"
          test ! -e "$HOME/.config/systemd/user/lifeos-openhands-ui.service"
          test ! -e "$HOME/.config/systemd/user/lifeos-openhands-tls.service"
          echo OPENHANDS_ENGINEER_STATE_PURGED=PASS
          REMOTE
