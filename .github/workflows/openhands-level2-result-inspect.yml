name: Inspect OpenHands Level 2 Result

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/openhands-level2-result-inspect.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 8
    steps:
      - name: Inspect persisted Level 2 result
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cid=0c1e5acf80984e64b7001c08f5c6ed57
          docker exec -e CID="$cid" lifeos-agent-canvas python - <<'PY'
          import json
          import os
          import pathlib

          root = pathlib.Path(
              "/home/openhands/.openhands/agent-canvas/conversations"
          ) / os.environ["CID"]
          events = [json.loads(path.read_text()) for path in sorted((root / "events").glob("*.json"))]
          seen_user = False
          first_turn_agent = None
          rows = []
          for index, event in enumerate(events):
              source = event.get("source")
              kind = str(event.get("kind", ""))
              if source == "user":
                  seen_user = True
              elif seen_user and source == "agent" and first_turn_agent is None:
                  first_turn_agent = event
              action = event.get("action")
              message = event.get("llm_message") or {}
              text = ""
              for item in message.get("content") or []:
                  if isinstance(item, dict) and item.get("type") == "text":
                      text += str(item.get("text") or "")
              rows.append({
                  "seq": index,
                  "source": source,
                  "kind": kind,
                  "action_kind": (
                      str(action.get("kind") or action.get("type") or "")
                      if isinstance(action, dict) else ""
                  ),
                  "text_prefix": text[:240],
              })
          print("OPENHANDS_LEVEL2_EVENT_ROWS=" + json.dumps(rows, sort_keys=True))
          assert first_turn_agent is not None
          first_kind = str(first_turn_agent.get("kind", ""))
          first_action = first_turn_agent.get("action")
          first_is_action = (
              "action" in first_kind.lower() or isinstance(first_action, dict)
          )
          print("OPENHANDS_LEVEL2_FIRST_TURN_AGENT_KIND=" + first_kind)
          print("OPENHANDS_LEVEL2_FIRST_TURN_AGENT_ACTION=" + str(first_is_action).upper())
          base = json.loads((root / "base_state.json").read_text())
          print("OPENHANDS_LEVEL2_PERSISTED_STATUS=" + str(base.get("execution_status")))
          PY

          echo "OPENHANDS_LEVEL2_REPO_BRANCH=$(docker exec lifeos-agent-canvas git -C /projects/lifeos-platform branch --show-current)"
          echo "OPENHANDS_LEVEL2_REPO_HEAD=$(docker exec lifeos-agent-canvas git -C /projects/lifeos-platform rev-parse HEAD)"
          docker exec lifeos-agent-canvas git -C /projects/lifeos-platform status --short
          docker exec lifeos-agent-canvas git -C /projects/lifeos-platform log -5 --oneline --decorate
          branch="$(docker exec lifeos-agent-canvas git -C /projects/lifeos-platform branch --show-current)"
          curl -fsS -H "Authorization: Bearer $GH_READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/joshant20-ops/lifeos-platform/pulls?state=all&head=joshant20-ops:$branch" |
            python3 -c 'import json,sys; p=json.load(sys.stdin); print("OPENHANDS_LEVEL2_MATCHING_PRS="+json.dumps([{"number":x["number"],"state":x["state"],"url":x["html_url"],"sha":x["head"]["sha"]} for x in p],sort_keys=True))'
          echo OPENHANDS_LEVEL2_RESULT_INSPECTION=PASS
