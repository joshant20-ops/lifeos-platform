name: LifeOS OTS Purge 801 Terminal Observer Proof
on:
  push:
    branches: [main]
    paths:
      - 'scripts/lifeos-semaphore-terminal-observer.sh'
      - '.github/workflows/lifeos-ots-purge-801-terminal-observer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lifeos-pi5-control
  cancel-in-progress: false
jobs:
  live-proof:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 8
    steps:
      - name: Sync
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git merge --ff-only origin/main
          test -z "$(git status --porcelain)"
      - name: Prove observer has no retired state dependency
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          ! grep -q '/var/lib/lifeos-backlog-runner/state.json' scripts/lifeos-semaphore-terminal-observer.sh
          echo 'PURGE801_TERMINAL_OBSERVER_LEGACY_STATE=ABSENT'
      - name: Live terminal observation
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          TIMEOUT_SECONDS=60 POLL_SECONDS=2 bash scripts/lifeos-semaphore-terminal-observer.sh 11618ff914ce 28 | tee /tmp/purge801-terminal.txt
          grep -qx 'RESULT=PASS' /tmp/purge801-terminal.txt
          grep -qx 'TERMINAL_AUTHORITY=GOVERNOR_PLUS_GITHUB' /tmp/purge801-terminal.txt
          grep -qx 'LEGACY_BACKLOG_STATE_DEPENDENCY=ABSENT' /tmp/purge801-terminal.txt
          grep -qx 'ISSUE_TERMINAL_CHECKPOINT=yes' /tmp/purge801-terminal.txt
          echo 'PURGE801_TERMINAL_OBSERVER_LIVE_PROOF=PASS'
