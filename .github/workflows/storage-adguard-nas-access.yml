name: AdGuard NAS access preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/storage-adguard-nas-access.yml
      - governor/adguard_nas_access.py
      - tests/test_adguard_nas_access.py

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -B -m unittest tests.test_adguard_nas_access

  access:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'joshant20-ops/lifeos-platform' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    concurrency:
      group: lifeos-pi5-control
      cancel-in-progress: false
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check private NAS staging access
        run: timeout 60s ionice -c3 nice -n 15 python3 -B -m governor.adguard_nas_access
