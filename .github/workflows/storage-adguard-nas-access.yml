name: AdGuard NAS access preflight
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifeos-pi5-control
  cancel-in-progress: false

jobs:
  access:
    # Candidate for review. Activate only after the existing Pi control
    # authority approves this exact unprivileged operation.
    if: ${{ false }}
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check private NAS staging access
        run: timeout 60s ionice -c3 nice -n 15 python3 -B -m governor.adguard_nas_restore_drill --check-access
