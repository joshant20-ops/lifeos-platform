name: LifeOS Pi5 Cloud Provider Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-pi5-cloud-provider-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 10
    steps:
      - name: Synchronize canonical Pi checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Diagnose direct cloud providers
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          python3 - <<'PY'
          import importlib.util, pathlib, re
          path=pathlib.Path('governor/ai_broker.py')
          spec=importlib.util.spec_from_file_location('lifeos_ai_broker', path)
          b=importlib.util.module_from_spec(spec); spec.loader.exec_module(b)
          policy=b.ROUTER.load_policy(b.POLICY_PATH)
          providers={p['id']:p for p in policy['providers']}
          secrets=b._strict_env(b.SECRETS_PATH)
          marker='LIFEOS_PI5_PROVIDER_DIAGNOSTIC_OK'
          failures=[]
          for provider_id in ('gemini','groq','openrouter','cloudflare'):
              try:
                  text=b._invoke(providers[provider_id], 'Reply with exactly '+marker, secrets)
                  if marker not in str(text):
                      reason='SEMANTIC_MARKER'
                      print(provider_id.upper()+'_DIAGNOSTIC=FAIL reason='+reason)
                      failures.append(provider_id+':'+reason)
                  else:
                      print(provider_id.upper()+'_DIAGNOSTIC=PASS')
              except Exception as exc:
                  message=str(exc)
                  match=re.search(r'provider HTTP ([0-9]{3})', message)
                  if match:
                      reason='HTTP_'+match.group(1)
                  elif 'empty response' in message.lower():
                      reason='EMPTY_RESPONSE'
                  else:
                      reason=type(exc).__name__
                  print(provider_id.upper()+'_DIAGNOSTIC=FAIL reason='+reason)
                  failures.append(provider_id+':'+reason)
          if failures:
              print('PI5_CLOUD_PROVIDER_DIAGNOSTIC=FAIL '+','.join(failures))
              raise SystemExit(1)
          print('PI5_CLOUD_PROVIDER_DIAGNOSTIC=PASS')
          PY
