name: LifeOS Email Paperless Pipeline Trace

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-email-paperless-pipeline-trace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 4
    steps:
      - name: Identify existing IMAP credential interface without values
        shell: bash
        run: |
          set -Eeuo pipefail
          ENV=/home/joshan/automation/secrets/email_oauth/email_imap_accounts.env
          SCRIPT=/home/joshan/automation/scripts/lifeos_email_phase1_daily_window_v1.py
          echo "IMAP_ENV_EXISTS=$(test -f "$ENV" && echo yes || echo no)"
          if test -f "$ENV"; then
            echo '-- env variable names only --'
            sudo -n awk -F= '/^[A-Za-z_][A-Za-z0-9_]*=/{print $1}' "$ENV" | sort
          fi
          echo '-- phase1 credential-loading source, values redacted --'
          if test -f "$SCRIPT"; then
            sed -n '1,115p' "$SCRIPT" \
              | sed -E 's/(password|secret|token)([^=]*=).*/\1\2<REDACTED>/Ig'
          fi
          echo '-- existing pipeline auth proof --'
          set +e
          timeout 60 /usr/bin/python3 "$SCRIPT" >/tmp/lifeos-email-auth-proof.out 2>&1
          rc=$?
          set -e
          echo "PHASE1_EXIT=$rc"
          grep -Ei 'status|connected_accounts|source_errors|candidate_messages_seen|new_messages_added' /tmp/lifeos-email-auth-proof.out \
            | sed -E 's/([A-Za-z0-9._%+-]+)@([A-Za-z0-9.-]+)/<REDACTED_EMAIL>/g' | tail -20 || true
          rm -f /tmp/lifeos-email-auth-proof.out
