name: LifeOS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  syntax:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        shell: bash
        run: |
          set -Eeuo pipefail

          while IFS= read -r -d '' f; do
              bash -n "$f"
          done < <(
              find homelab/live/usr/local \
                  -type f \
                  -name '*.sh' \
                  -print0 2>/dev/null
          )

      - name: Validate Renovate JSON
        run: python3 -m json.tool renovate.json >/dev/null
