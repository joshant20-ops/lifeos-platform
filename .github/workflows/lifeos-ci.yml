name: LifeOS CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: lifeos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          python3 -m pip install \
            'ansible-core>=2.19,<2.20' \
            PyYAML

      - name: Control-plane regression tests
        run: |
          python3 -m unittest -v \
            tests.test_job_publisher_fifo \
            tests.test_github_sync_protection \
            tests.test_snapshot_protected_drift \
            tests.test_control_runtime_ownership_migration \
            tests.test_historical_stale_activation_wrapper \
            tests.test_current_engineer_activation \
            tests.test_engineer_source_safety_diagnostic \
            tests.test_engineer_runtime_health_diagnostic \
            tests.test_engineer_runtime_contracts \
            tests.test_canonical_checkout_reconcile \
            tests.test_engineer_terminal_policy \
            tests.test_step11_live_terminal_policy_diagnostic \
            tests.test_step11_live_closure \
            tests.test_tower_metrics

      - name: Install focused Python contract dependency
        run: python3 -m pip install pytest

      - name: Validate stable-base broker contracts
        run: |
          python3 -m pytest -q \
            tests/test_stable_base_provider_contract.py \
            tests/test_provider_router_private_only.py \
            tests/test_stable_base_broker_contract.py

      - name: Validate Governor AI routing contracts
        run: |
          python3 -m py_compile \
            engineer/provider_router.py \
            governor/ai_broker.py \
            governor/assistant_bridge.py \
            governor/autonomous_agent.py \
            governor/autonomous_agent_server.py
          python3 -m json.tool governor/policy.json >/dev/null
          python3 -m json.tool governor/privacy-domain-policy.json >/dev/null
          python3 -m pytest -q \
            tests/test_ai_broker.py \
            tests/test_openhands_integration.py \
            tests/test_privacy_classifier.py \
            tests/test_private_domain_policy.py

      - name: Validate Wave C read-only contracts
        run: |
          python3 -m pytest -q \
            tests/test_finance_assets_discovery_contract.py \
            tests/test_finance_assets_readonly.py

      - name: Validate P6-P10 functional contracts
        run: |
          python3 -m pytest -q tests/test_pip_p6_p10_functional.py

      - name: Validate automation file contracts
        run: |
          BASE="$GITHUB_WORKSPACE/homelab/live/home/joshan/automation"
          VALIDATOR="$BASE/contracts/lifeos_file_contract_validator.py"
          CI_VALIDATOR="$RUNNER_TEMP/lifeos_file_contract_validator_ci.py"
          test -f "$VALIDATOR"
          sed "s|BASE = Path(\"/home/joshan/automation\")|BASE = Path(\"$BASE\")|" "$VALIDATOR" > "$CI_VALIDATOR"
          python3 "$CI_VALIDATOR"

      - name: Validate PA executor syntax
        run: |
          python3 -m py_compile governor/scripts/lifeos-pa-execute homelab/live/home/joshan/automation/lifeos_email_paperless_selective.py
          python3 -m unittest -v tests.test_pa_email_paperless_policy

      - name: Validate Tower metrics deployment boundary
        run: |
          bash -n scripts/lifeos-deploy-tower-metrics.sh
          bash -n scripts/lifeos-deploy-tower-metrics-wrapper.sh
          python3 -m py_compile \
            governor/tower_metrics.py \
            homelab/live/usr/local/sbin/lifeos-deploy-gateway
          grep -F "'deploy-tower-metrics'" \
            homelab/live/usr/local/sbin/lifeos-deploy-gateway >/dev/null
          grep -F "scripts/lifeos-deploy-tower-metrics-wrapper.sh" \
            homelab/live/usr/local/sbin/lifeos-deploy-gateway >/dev/null
          grep -F 'PACKAGE=mosquitto-clients' \
            scripts/lifeos-deploy-tower-metrics-wrapper.sh >/dev/null
          grep -F "apt-get install -y --no-install-recommends" \
            scripts/lifeos-deploy-tower-metrics-wrapper.sh >/dev/null
          grep -F "deploy-tower-metrics" \
            .github/workflows/lifeos-pi-deploy.yml >/dev/null
          grep -F "deploy-triggers/ha-control-bridge" .github/workflows/lifeos-pi-deploy.yml >/dev/null
          grep -F "deploy-triggers/tower-metrics" .github/workflows/lifeos-pi-deploy.yml >/dev/null
          grep -F "Run Governor privacy live acceptance" .github/workflows/lifeos-pi-deploy.yml >/dev/null
          grep -F "LIVE_PRIVACY_ACCEPTANCE=PASS" .github/workflows/lifeos-pi-deploy.yml >/dev/null

      - name: Validate specialist Energy Opportunity integration
        run: |
          python3 tests/test_energy_opportunity_service.py
          python3 -m py_compile \
            homelab/live/mnt/docker-data/automation/repos/LifeOS-Energy/app/main.py \
            homelab/live/mnt/docker-data/automation/repos/LifeOS-Energy/app/routers/opportunities.py \
            homelab/live/mnt/docker-data/automation/repos/LifeOS-Energy/app/services/opportunities.py \
            archive/closed-gates/scripts/audit-wave-a-live-acceptance.py \
            homelab/live/opt/stacks/homeassistant/config/scripts/lifeos_energy_attention_sensor.py
          bash -n scripts/lifeos-deploy-energy-opportunity-api.sh
          grep -F "'deploy-energy-opportunity-api'" \
            homelab/live/usr/local/sbin/lifeos-deploy-gateway >/dev/null
          grep -F 'deploy-energy-opportunity-api' \
            .github/workflows/lifeos-pi-deploy.yml >/dev/null
          grep -F 'archive/closed-gates/scripts/audit-wave-a-live-acceptance.py' \
            .github/workflows/lifeos-pi-deploy.yml >/dev/null
          grep -F 'const jobOk =' .github/workflows/lifeos-pi-deploy.yml | grep -F 'job.status' >/dev/null

      - name: Validate bounded Tower shutdown integration
        run: |
          python3 tests/test_tower_control_shutdown.py
          python3 -m py_compile governor/tower_control.py
          bash -n scripts/lifeos-configure-tower-access-runtime.sh
          bash -n scripts/lifeos-prove-tower-shutdown.sh

      - name: Validate desired Compose YAML
        run: |
          python3 - <<'PY'
          import pathlib
          import yaml

          files = (
              list(pathlib.Path(
                  "ansible/desired/compose"
              ).rglob("*.yml"))
              +
              list(pathlib.Path(
                  "ansible/desired/compose"
              ).rglob("*.yaml"))
          )

          if not files:
              raise SystemExit(
                  "No desired Compose files found"
              )

          for file in files:
              data=yaml.safe_load(file.read_text())

              if not isinstance(data,dict):
                  raise SystemExit(
                      f"{file}: invalid YAML root"
                  )

              if "services" not in data:
                  raise SystemExit(
                      f"{file}: services missing"
                  )

          print(
              f"Validated {len(files)} Compose files"
          )
          PY

      - name: Validate Compose inventory consistency
        run: |
          python3 scripts/validate-compose-inventory.py

      - name: Ansible syntax
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/site.yml \
            --syntax-check

          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/adopt_all.yml \
            --syntax-check

      - name: Validate JSON
        run: |
          python3 -m json.tool \
            ansible/vars/adopt_files.json >/dev/null

          python3 -m json.tool \
            ansible/vars/compose_projects.json >/dev/null

          python3 -m json.tool \
            renovate.json >/dev/null

  workspace-runtime-diagnostic:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 5
    steps:
      - name: Compare active homelab dashboard safely
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('/opt/stacks/homeassistant/config/.storage')
          paths=[root/'lovelace.dashboard_homelab']
          paths += sorted((root/'.lifeos-backups').glob('lovelace.dashboard_homelab*.json'))[-8:]
          for p in paths:
              if not p.is_file(): continue
              try: d=json.loads(p.read_text())
              except Exception as e:
                  print(f'DASHBOARD path={p} parse={type(e).__name__}')
                  continue
              cfg=d.get('data',{}).get('config',{})
              views=cfg.get('views',[]) if isinstance(cfg,dict) else []
              titles=[]; card_types=[]
              def walk(x):
                  if isinstance(x,dict):
                      if x.get('title'): titles.append(str(x['title']))
                      if x.get('type'): card_types.append(str(x['type']))
                      for v in x.values(): walk(v)
                  elif isinstance(x,list):
                      for v in x: walk(v)
              walk(views)
              digest=hashlib.sha256(p.read_bytes()).hexdigest()
              print(f'DASHBOARD path={p} sha256={digest} views={len(views)}')
              print('TITLES='+' | '.join(titles[:80]))
              print('CARD_TYPES='+','.join(sorted(set(card_types))))
          PY
          python3 - <<'PY'
import json, pathlib, re
p=pathlib.Path('/opt/stacks/homeassistant/config/.storage/lovelace.dashboard_homelab')
d=json.loads(p.read_text()); views=d['data']['config']['views']
for v in views:
    if v.get('path') not in ('overview','chat','documents') and not any(x in str(v.get('title','')) for x in ('P01','P04','P07')): continue
    for card in v.get('cards',[]):
        blob=json.dumps(card)
        refs=sorted(set(re.findall(r'(?:/local/|https?://)[^" ]+',blob)))
        ents=sorted(set(re.findall(r'(?:sensor|binary_sensor|input_text|input_boolean)\\.[a-zA-Z0-9_]+',blob)))
        if refs or ents:
            print('CARD_REF title=%r refs=%r entities=%r' % (card.get('title'),refs,ents))
            for ref in refs:
                if ref.startswith('/local/'):
                    fs=pathlib.Path('/opt/stacks/homeassistant/config/www')/ref.removeprefix('/local/')
                    print(f'LOCAL_REF path={fs} exists={fs.exists()} size={fs.stat().st_size if fs.exists() else 0}')
PY
          systemctl is-enabled lifeos-pa-dashboard-refresh.timer || true
          systemctl is-active lifeos-pa-dashboard-refresh.timer || true
          systemctl status lifeos-pa-dashboard-refresh.service --no-pager -n 10 2>/dev/null | sed -E 's/(token|key|secret|password)=[^ ]+/\1=<redacted>/Ig' || true
