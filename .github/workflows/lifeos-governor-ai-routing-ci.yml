name: LifeOS Governor AI Routing CI

on:
  push:
    branches: [main]
    paths:
      - 'engineer/provider_router.py'
      - 'engineer/openhands_worker.py'
      - 'governor/ai_broker.py'
      - 'governor/assistant_bridge.py'
      - 'governor/autonomous_agent.py'
      - 'governor/autonomous_agent_server.py'
      - 'governor/policy.json'
      - 'governor/privacy-domain-policy.json'
      - 'governor/scripts/deploy-autonomous-agent-pi5.sh'
      - 'governor/scripts/lifeos-cloud-builder'
      - 'governor/scripts/lifeos-remote-agent-builder'
      - 'tests/test_ai_broker.py'
      - 'tests/test_openhands_integration.py'
      - 'tests/test_privacy_classifier.py'
      - 'tests/test_private_domain_policy.py'
      - '.github/workflows/lifeos-governor-ai-routing-ci.yml'
      - '.github/workflows/lifeos-pi5-ai-broker-migrate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'engineer/provider_router.py'
      - 'engineer/openhands_worker.py'
      - 'governor/ai_broker.py'
      - 'governor/assistant_bridge.py'
      - 'governor/autonomous_agent.py'
      - 'governor/autonomous_agent_server.py'
      - 'governor/policy.json'
      - 'governor/privacy-domain-policy.json'
      - 'governor/scripts/deploy-autonomous-agent-pi5.sh'
      - 'governor/scripts/lifeos-cloud-builder'
      - 'governor/scripts/lifeos-remote-agent-builder'
      - 'tests/test_ai_broker.py'
      - 'tests/test_openhands_integration.py'
      - 'tests/test_privacy_classifier.py'
      - 'tests/test_private_domain_policy.py'
      - '.github/workflows/lifeos-governor-ai-routing-ci.yml'
      - '.github/workflows/lifeos-pi5-ai-broker-migrate.yml'

permissions:
  contents: read

jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install focused test dependency
        run: python3 -m pip install pytest

      - name: Static validation
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            engineer/provider_router.py \
            engineer/openhands_worker.py \
            governor/ai_broker.py \
            governor/assistant_bridge.py \
            governor/autonomous_agent.py \
            governor/autonomous_agent_server.py
          python3 -m json.tool governor/policy.json >/dev/null
          python3 -m json.tool governor/privacy-domain-policy.json >/dev/null
          bash -n governor/scripts/deploy-autonomous-agent-pi5.sh
          bash -n governor/scripts/lifeos-cloud-builder
          bash -n governor/scripts/lifeos-remote-agent-builder
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('.github/workflows/lifeos-pi5-ai-broker-migrate.yml')
          text=p.read_text()
          assert 'PI5_DIRECT_CLOUD_INFERENCE=PASS' in text
          assert 'ENGINEER_SECRET_RETIREMENT=PASS' in text
          print('MIGRATION_WORKFLOW_STATIC=PASS')
          PY

      - name: Provider routing regressions
        run: |
          set -Eeuo pipefail
          python3 -m pytest -q \
            tests/test_ai_broker.py \
            tests/test_openhands_integration.py \
            tests/test_privacy_classifier.py \
            tests/test_private_domain_policy.py

      - name: Safety contract assertions
        run: |
          set -Eeuo pipefail
          grep -F 'cloud_builder_forbidden_for_local_only_job' governor/scripts/lifeos-cloud-builder >/dev/null
          grep -F 'available_adapters' engineer/provider_router.py >/dev/null
          grep -F 'PRIVACY_FORBIDDEN' engineer/provider_router.py >/dev/null
          grep -F 'direct-cloud' governor/policy.json >/dev/null
          grep -F 'governor-broker' engineer/openhands_worker.py >/dev/null
          grep -F 'GOVERNOR_BROKER' governor/scripts/lifeos-remote-agent-builder >/dev/null
          grep -F 'LIFEOS_PRIVACY_DOMAIN_POLICY' governor/autonomous_agent.py >/dev/null
          grep -F '/v1/chat/completions' governor/autonomous_agent_server.py >/dev/null
          grep -F 'broker_capability_required' governor/autonomous_agent_server.py >/dev/null
          grep -F 'lifeos-autonomous-agent-core' governor/scripts/deploy-autonomous-agent-pi5.sh >/dev/null
          grep -F 'CLOUD_INFERENCE_REQUIRES_ENGINEER=NO' governor/scripts/deploy-autonomous-agent-pi5.sh >/dev/null
          grep -F 'CLOUDFLARE_ACCOUNT_ID' .github/workflows/lifeos-pi5-ai-broker-migrate.yml >/dev/null
          echo 'GOVERNOR_AI_ROUTING_CI=PASS'
