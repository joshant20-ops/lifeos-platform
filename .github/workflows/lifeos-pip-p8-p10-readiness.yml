name: LifeOS P8-P10 Readiness Audit
on:
  push:
    branches: [main]
    paths: ['scripts/lifeos-pip-p8-p10-readiness.py']
  workflow_dispatch:
jobs:
  audit:
    runs-on: [self-hosted, lifeos-pi5]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile canonical checkout
        run: |
          git -C /home/joshan/lifeos-platform fetch origin main
          test -z "$(git -C /home/joshan/lifeos-platform status --porcelain)"
          git -C /home/joshan/lifeos-platform merge --ff-only origin/main
      - name: Audit P8-P10 readiness
        run: python3 /home/joshan/lifeos-platform/scripts/lifeos-pip-p8-p10-readiness.py
      - name: Canonical clean
        if: always()
        run: test -z "$(git -C /home/joshan/lifeos-platform status --porcelain)"
