name: LifeOS Governor Broker Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-governor-broker-deploy.yml'
      - 'governor/autonomous_agent_server.py'
      - 'governor/autonomous_agent.py'
      - 'governor/ai_broker.py'
      - 'governor/openai_compat.py'
      - 'governor/job_records.py'
      - 'governor/policy.json'
      - 'governor/privacy-domain-policy.json'
      - 'governor/scripts/deploy-autonomous-agent-pi5.sh'
      - 'governor/scripts/lifeos-cloud-builder'
      - 'governor/scripts/lifeos-remote-agent-builder'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifeos-pi5-control
  cancel-in-progress: false

jobs:
  deploy-and-prove:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 30
    steps:
      - name: Reconcile and verify canonical Pi checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo 'CANONICAL_CHECKOUT_NOT_READY=dirty'
            git status --short
            exit 20
          fi
          head="$(git rev-parse HEAD)"
          origin="$(git rev-parse origin/main)"
          if [[ "$head" != "$origin" ]]; then
            git merge-base --is-ancestor "$head" "$origin" || {
              echo 'CANONICAL_CHECKOUT_NOT_READY=non_fast_forward'
              echo "PLATFORM_HEAD=$head"
              echo "ORIGIN_MAIN=$origin"
              exit 20
            }
            git merge --ff-only origin/main
          fi
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "PLATFORM_HEAD=$(git rev-parse HEAD)"
          echo 'CANONICAL_CHECKOUT_READY=PASS'
          echo 'DEPLOY_CHECKPOINT=checkout-verified'

      - name: Ensure Engineer available for deploy preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          if ssh -o BatchMode=yes -o ConnectTimeout=4 Engineer true 2>/dev/null; then
            echo 'ENGINEER_PREFLIGHT_ALREADY_READY=PASS'
            exit 0
          fi
          mosquitto_pub -h 127.0.0.1 -t lifeos/tower/power/set -m ON
          ready=0
          for _ in $(seq 1 120); do
            if ssh -o BatchMode=yes -o ConnectTimeout=4 Engineer true 2>/dev/null; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" -eq 1
          echo 'ENGINEER_PREFLIGHT_WAKE=PASS'

      - name: Deploy Governor with live phase checkpoints
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          LOG=$(mktemp)
          cleanup() { rm -f "$LOG"; }
          trap cleanup EXIT

          bash governor/scripts/deploy-autonomous-agent-pi5.sh > >(tee "$LOG") 2>&1 &
          DEPLOY_PID=$!
          LAST_PHASE=''
          LAST_JOB_STATE=''

          phase_checkpoint() {
            local value=$1
            if [[ "$value" != "$LAST_PHASE" ]]; then
              printf 'DEPLOY_CHECKPOINT=phase:%s\n' "$value"
              LAST_PHASE=$value
            fi
          }

          job_checkpoint() {
            local value=$1
            if [[ "$value" != "$LAST_JOB_STATE" ]]; then
              printf 'DEPLOY_CHECKPOINT=%s\n' "$value"
              LAST_JOB_STATE=$value
            fi
          }

          while kill -0 "$DEPLOY_PID" 2>/dev/null; do
            PHASE=$(grep -E '^===== [0-9]+/8 — ' "$LOG" | tail -1 | sed -E 's/^===== ([0-9]+\/8 — [^=]+) =====$/\1/' || true)
            [[ -n "$PHASE" ]] && phase_checkpoint "$PHASE"

            if grep -q '^===== 7/8 — TRUE END-TO-END AUTONOMOUS SMOKE =====$' "$LOG"; then
              JOB_STATE=$(curl -fsS --max-time 3 http://127.0.0.1:8790/jobs 2>/dev/null | python3 -c '
          import json,sys
          try:
              jobs=json.load(sys.stdin).get("jobs", [])
              if jobs:
                  j=max(jobs, key=lambda x: str(x.get("created_at") or ""))
                  print("e2e-job:%s:%s" % (j.get("status") or "unknown", j.get("stage") or "unknown"))
          except Exception:
              pass
          ' || true)
              [[ -n "$JOB_STATE" ]] && job_checkpoint "$JOB_STATE"
            fi
            sleep 15
          done

          set +e
          wait "$DEPLOY_PID"
          RC=$?
          set -e
          printf 'DEPLOY_CHECKPOINT=deploy-process-exit:%s\n' "$RC"
          exit "$RC"

      - name: Capture sanitized Governor diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo '===== GOVERNOR SERVICE STATUS ====='
          systemctl status lifeos-autonomous-agent.service --no-pager --full || true
          echo '===== GOVERNOR SERVICE JOURNAL ====='
          journalctl -u lifeos-autonomous-agent.service -n 120 --no-pager -o short-iso || true

      - name: Prove single-process broker contract
        shell: bash
        run: |
          set -Eeuo pipefail
          systemctl is-active --quiet lifeos-autonomous-agent.service
          HEALTH=$(curl -fsS --max-time 5 http://127.0.0.1:8790/health)
          python3 - "$HEALTH" <<'PY'
          import json,sys
          j=json.loads(sys.argv[1])
          assert j['status']=='ok', j
          assert j['runtime_controller']=='pi5', j
          print('GOVERNOR_HEALTH=PASS')
          PY
          code=$(curl -sS -o /tmp/lifeos-broker-unauth.json -w '%{http_code}' --max-time 5 \
            -H 'Content-Type: application/json' \
            -d '{"model":"lifeos-normal","messages":[{"role":"user","content":"ping"}]}' \
            http://127.0.0.1:8790/v1/chat/completions)
          test "$code" = 401
          rm -f /tmp/lifeos-broker-unauth.json
          echo 'BROKER_UNAUTHENTICATED_REJECTION=PASS'
          test -f "$HOME/.config/lifeos/ai-broker.token"
          test ! -L "$HOME/.config/lifeos/ai-broker.token"
          test "$(stat -c '%a' "$HOME/.config/lifeos/ai-broker.token")" = 600
          echo 'BROKER_CAPABILITY_PROTECTION=PASS'
          echo 'DEPLOY_CHECKPOINT=broker-contract-proven'

      - name: Prove genuine OpenHands tool action
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          job_id="openhands-action-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          marker="OPENHANDS_ACTION_EVIDENCE_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          runtime_path="governor/runtime_jobs/${job_id}.sh"
          request="This is a disposable smoke test. You must use an actual file-writing or shell tool in your Engineer worktree to create ${runtime_path}. Its exact contents must be: line 1 #!/usr/bin/env bash ; line 2 set -euo pipefail ; line 3 printf '%s\\n' '${marker}'. Do not alter any other file. Run the created script once as a harmless test. Do not commit, push, or access GitHub. End with RESULT=PASS, TESTS=created-and-ran-marker-script, NEXT_RUNTIME_CHECK=none."
          log=$(mktemp)
          runtime=$(mktemp)
          cleanup() { rm -f "$log" "$runtime"; }
          trap cleanup EXIT
          set +e
          LIFEOS_JOB_ID="$job_id" LIFEOS_JOB_TASK_CLASS=normal LIFEOS_JOB_PRIVACY=normal \
            /usr/local/libexec/lifeos-cloud-builder "$request" 1 '' | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -eq 0
          grep -q '^AGENT_RESULT=openhands PASS$' "$log"
          ! grep -q '^AGENT_RESULT=codex PASS$' "$log"
          b64=$(sed -n 's/^HANDOFF_RUNTIME_B64=//p' "$log" | tail -1)
          test -n "$b64"
          printf '%s' "$b64" | base64 -d >"$runtime"
          expected=$(printf '#!/usr/bin/env bash\nset -euo pipefail\nprintf '\''%%s\\n'\'' '\''%s'\''\n' "$marker")
          actual=$(cat "$runtime")
          test "$actual" = "$expected"
          chmod 700 "$runtime"
          output=$("$runtime")
          test "$output" = "$marker"
          echo 'OPENHANDS_ADAPTER=PASS'
          echo 'OPENHANDS_FILESYSTEM_ACTION_EVIDENCE=PASS'
          echo 'OPENHANDS_HARMLESS_TOOL_ARTIFACT_EXECUTION=PASS'

      - name: Prove repository clean
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo 'GOVERNOR_BROKER_DEPLOY=PASS'
          echo 'REPOSITORY_FINAL=PASS'
          echo 'DEPLOY_CHECKPOINT=complete'

      - name: Release deploy-time Tower power
        if: always()
        shell: bash
        run: |
          set +e
          mosquitto_pub -h 127.0.0.1 -t lifeos/tower/power/set -m OFF
          echo 'DEPLOY_TOWER_RELEASE_REQUESTED=PASS'
