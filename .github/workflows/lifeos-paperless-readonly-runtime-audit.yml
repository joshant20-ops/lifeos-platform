name: LifeOS Paperless Read-only Runtime Audit

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: lifeos-pi5-deploy
  cancel-in-progress: false

jobs:
  audit:
    if: github.event.issue.title == 'LifeOS Deploy: audit-paperless-runtime'
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 10
    steps:
      - name: Checkout the canonical audit code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify read-only diagnostic contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f governor/paperless_runtime_diagnostic.py
          grep -Fq 'PAPERLESS_AUDIT_MUTATIONS=NONE' governor/paperless_runtime_diagnostic.py
          echo "AUDIT_SCRIPT_SHA256=$(sha256sum governor/paperless_runtime_diagnostic.py | cut -d' ' -f1)"
          echo "AUDIT_SOURCE_SHA=$(git rev-parse HEAD)"

      - name: Run bounded Paperless runtime audit
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n python3 "$GITHUB_WORKSPACE/governor/paperless_runtime_diagnostic.py" | tee "$RUNNER_TEMP/paperless-runtime-audit.log"
          grep -Fxq 'PAPERLESS_AUDIT_MUTATIONS=NONE' "$RUNNER_TEMP/paperless-runtime-audit.log"
          grep -E '^PAPERLESS_[A-Z0-9_]+=(YES|NO|UNKNOWN|MISSING|PRESENT|EMPTY|SYMLINK|NOT_DIRECTORY|UNMOUNTED|MOUNTED|VALID|INVALID|BLOCKED|REACHABLE|UNREACHABLE|000|[1-5][0-9]{2}|[0-9]+)$' "$RUNNER_TEMP/paperless-runtime-audit.log" > "$RUNNER_TEMP/paperless-runtime-audit.env"

      - name: Retain sanitized audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paperless-runtime-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/paperless-runtime-audit.env
          if-no-files-found: warn
          retention-days: 30

      - name: Report audit completion
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const outcome = '${{ job.status }}';
            const body = [
              'Paperless fixed-field runtime audit ' + outcome + '.',
              '',
              'This reports audit execution only; it does not start or change Paperless or its mounts.',
              'Run: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              'Inspect the sanitized paperless-runtime-audit-' + context.runId + ' artifact for results.'
            ].join('\\n');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body
            });
