name: LifeOS Personal Information P0 Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paperless-read-only-baseline:
    runs-on: [self-hosted, lifeos-pi5]
    timeout-minutes: 15
    steps:
      - name: Reconcile canonical checkout safely
        shell: bash
        run: |
          set -Eeuo pipefail
          repo=/home/joshan/lifeos-platform
          git -C "$repo" fetch origin main
          test -z "$(git -C "$repo" status --porcelain)"
          test "$(git -C "$repo" rev-parse HEAD)" = "$(git -C "$repo" merge-base HEAD origin/main)"
          git -C "$repo" merge --ff-only origin/main
          echo "CANONICAL_SHA=$(git -C "$repo" rev-parse HEAD)"
          echo 'CANONICAL_CHECKOUT=PASS'

      - name: Run sanitized read-only Paperless inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          /home/joshan/lifeos-platform/scripts/lifeos-pip-p0-paperless-inventory.sh | tee /tmp/lifeos-pip-p0-baseline.txt
          grep -qx 'PAPERLESS_MUTATION=NONE' /tmp/lifeos-pip-p0-baseline.txt
          grep -qx 'PRIVATE_FIELDS_EMITTED=NONE' /tmp/lifeos-pip-p0-baseline.txt
          grep -qx 'PRIVACY_LOCAL_ONLY=PASS' /tmp/lifeos-pip-p0-baseline.txt
          grep -qx 'RESULT=PASS' /tmp/lifeos-pip-p0-baseline.txt

      - name: Verify canonical checkout remains clean
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          repo=/home/joshan/lifeos-platform
          test -z "$(git -C "$repo" status --porcelain)"
          echo 'CANONICAL_CLEAN=PASS'
          rm -f /tmp/lifeos-pip-p0-baseline.txt
