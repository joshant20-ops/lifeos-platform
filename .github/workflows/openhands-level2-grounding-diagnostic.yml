name: Diagnose OpenHands Level 2 Grounding Failure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/openhands-level2-grounding-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 8
    steps:
      - name: Inspect failed conversation without exposing secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname)" == "Docker" ]]
          docker inspect lifeos-agent-canvas --format '{{.State.Status}} {{.Config.Image}}'

          echo REPOSITORY_CONTEXT
          docker exec lifeos-agent-canvas sh -c '
            set -eu
            test -d /projects/lifeos-platform/.git
            git -C /projects/lifeos-platform rev-parse HEAD
            git -C /projects/lifeos-platform remote get-url origin
            git -C /projects/lifeos-platform status --short
            test -r /projects/lifeos-platform/AGENTS.md
            test -w /projects/lifeos-platform
            echo OPENHANDS_LEVEL2_REPOSITORY_CONTEXT=PASS
          '

          echo SKILL_INVENTORY
          docker exec lifeos-agent-canvas sh -c '
            find /home/openhands/.openhands /opt/agent-canvas -maxdepth 5               -type f \( -iname "*skill*" -o -iname "*github*" -o -name "SKILL.md" \)               -printf "%p\n" 2>/dev/null | sort | head -200
          '

          echo FAILED_CONVERSATION_REDACTED
          docker exec -i lifeos-agent-canvas python - <<'PY'
          import hashlib
          import json
          import pathlib
          import re

          root = pathlib.Path(
              "/home/openhands/.openhands/agent-canvas/conversations"
          )
          needles = (
              "Level 2 acceptance issue #935",
              "Autonomous Fix for Issue #935",
          )
          sensitive = re.compile(
              r"(api.?key|token|secret|password|authorization|credential|cookie)",
              re.I,
          )
          inline_secret = re.compile(
              r"(?i)(bearer\s+)[A-Za-z0-9._~+/=-]+|"
              r"((?:api.?key|token|secret|password)\s*[:=]\s*)\S+"
          )

          def clean(text, limit=800):
              text = inline_secret.sub(
                  lambda m: (m.group(1) or m.group(2)) + "<redacted>",
                  str(text),
              )
              return text[:limit].replace("\x00", "")

          def walk(value, path="$"):
              if isinstance(value, dict):
                  for key, item in value.items():
                      child = f"{path}.{key}"
                      if sensitive.search(str(key)):
                          yield child, "<redacted>"
                      else:
                          yield from walk(item, child)
              elif isinstance(value, list):
                  for index, item in enumerate(value):
                      yield from walk(item, f"{path}[{index}]")
              elif isinstance(value, str):
                  yield path, value

          matches = []
          for directory in root.iterdir():
              if not directory.is_dir():
                  continue
              hit = False
              newest = 0
              for path in directory.rglob("*.json"):
                  newest = max(newest, path.stat().st_mtime)
                  try:
                      raw = path.read_text(errors="replace")
                  except OSError:
                      continue
                  if any(needle in raw for needle in needles):
                      hit = True
              if hit:
                  matches.append((newest, directory))

          assert matches, "No persisted #935 Level-2 conversation found"
          matches.sort(reverse=True)
          directory = matches[0][1]
          print("OPENHANDS_LEVEL2_CONVERSATION_ID=" + directory.name)
          print("OPENHANDS_LEVEL2_MATCH_COUNT=" + str(len(matches)))

          files = sorted(p for p in directory.rglob("*") if p.is_file())
          print("OPENHANDS_LEVEL2_PERSISTED_FILE_COUNT=" + str(len(files)))
          for path in files:
              print(
                  "CONVERSATION_FILE="
                  + str(path.relative_to(directory))
                  + " bytes="
                  + str(path.stat().st_size)
              )

          action_names = []
          roles = []
          instruction_rows = []
          event_rows = []
          for path in sorted(directory.rglob("*.json")):
              try:
                  value = json.loads(path.read_text())
              except Exception as exc:
                  print(
                      "JSON_PARSE="
                      + str(path.relative_to(directory))
                      + " "
                      + type(exc).__name__
                  )
                  continue
              strings = list(walk(value))
              flat = json.dumps(value, sort_keys=True).lower()
              for key in (
                  "action",
                  "tool_name",
                  "name",
                  "event_type",
                  "type",
                  "kind",
                  "role",
                  "source",
              ):
                  if isinstance(value, dict) and key in value:
                      event_rows.append(
                          (
                              str(path.relative_to(directory)),
                              key,
                              clean(value[key], 160),
                          )
                      )
              for item_path, item in strings:
                  lower_path = item_path.lower()
                  lower_item = item.lower()
                  if lower_path.endswith(
                      (".tool_name", ".function.name", ".action", ".action_name")
                  ):
                      action_names.append(clean(item, 160))
                  if lower_path.endswith(".role"):
                      roles.append(clean(item, 80))
                  if (
                      any(
                          word in lower_path
                          for word in (
                              "system",
                              "developer",
                              "instruction",
                              "prompt",
                              "skill",
                              "tool",
                              "message",
                              "content",
                              "workspace",
                              "repository",
                          )
                      )
                      and item.strip()
                  ):
                      instruction_rows.append(
                          (
                              str(path.relative_to(directory)),
                              item_path,
                              clean(item),
                          )
                      )

          print("OPENHANDS_LEVEL2_ACTION_NAMES=" + ",".join(sorted(set(action_names))))
          print("OPENHANDS_LEVEL2_ROLES=" + ",".join(sorted(set(roles))))
          print("OPENHANDS_LEVEL2_EVENT_ROWS_BEGIN")
          for row in event_rows[:200]:
              print("|".join(row))
          print("OPENHANDS_LEVEL2_EVENT_ROWS_END")
          print("OPENHANDS_LEVEL2_CONTEXT_ROWS_BEGIN")
          seen = set()
          for row in instruction_rows:
              signature = hashlib.sha256(
                  (row[1] + "\n" + row[2]).encode()
              ).hexdigest()[:12]
              if signature in seen:
                  continue
              seen.add(signature)
              print("|".join(row) + "|sha=" + signature)
              if len(seen) >= 240:
                  break
          print("OPENHANDS_LEVEL2_CONTEXT_ROWS_END")

          joined = "\n".join(row[2] for row in instruction_rows).lower()
          has_issue = "issue #935" in joined
          has_changelog = "changelog.md" in joined
          native_action_markers = sum(
              marker in "\n".join(row[2] for row in instruction_rows).lower()
              for marker in (
                  "fileeditoraction",
                  "execute_command",
                  "terminaltool",
                  "bashaction",
                  "finishaction",
              )
          )
          print("OPENHANDS_LEVEL2_ISSUE_IN_CONTEXT=" + ("YES" if has_issue else "NO"))
          print(
              "OPENHANDS_LEVEL2_CHANGELOG_IN_CONTEXT="
              + ("YES" if has_changelog else "NO")
          )
          print(
              "OPENHANDS_LEVEL2_NATIVE_ACTION_MARKERS="
              + str(native_action_markers)
          )
          print("OPENHANDS_LEVEL2_REDACTED_DIAGNOSTIC=PASS")
          PY

          echo PACKAGE_SOURCE_ANCHORS
          docker exec lifeos-agent-canvas sh -c '
            python - <<"PY"
          import importlib.metadata
          import pathlib

          for package in (
              "openhands-agent-server",
              "openhands-sdk",
              "openhands-tools",
          ):
              try:
                  dist = importlib.metadata.distribution(package)
              except importlib.metadata.PackageNotFoundError:
                  continue
              print("PACKAGE=" + package + " VERSION=" + dist.version)
              print("ROOT=" + str(pathlib.Path(dist.locate_file(""))))
          PY
          '

          echo TARGETED_EVENT_SHAPE
          docker exec -i lifeos-agent-canvas python - <<'PY'
          import json, pathlib
          root = pathlib.Path("/home/openhands/.openhands/agent-canvas/conversations/3ca801e5b31941e38bf1b7611f3ac44d")
          for path in sorted((root / "events").glob("*.json")):
              value = json.loads(path.read_text())
              print("TARGET_EVENT=" + path.name)
              print("TOP_KEYS=" + ",".join(value.keys()))
              def walk(v, p="$"):
                  if isinstance(v, dict):
                      for k, x in v.items():
                          if any(w in k.lower() for w in ("token","secret","password","cookie","authorization","api_key")):
                              continue
                          yield from walk(x, p+"."+k)
                  elif isinstance(v, list):
                      for i, x in enumerate(v):
                          yield from walk(x, p+f"[{i}]")
                  elif isinstance(v, str) and p.lower().endswith((".role",".source",".kind",".type",".text",".content",".name",".action")):
                      yield p, v
              for p, v in walk(value):
                  if len(v) <= 8000:
                      print("TARGET_SCALAR=" + path.name + "|" + p + "|" + v.replace("\\n","\\n"))
          base = json.loads((root / "base_state.json").read_text())
          print("TARGET_WORKDIR=" + str(base.get("workspace",{}).get("working_dir")))
          print("TARGET_ACTIVATED_SKILLS=" + ",".join(base.get("activated_knowledge_skills",[])))
          suffix = base.get("agent",{}).get("agent_context",{}).get("system_message_suffix","")
          print("TARGET_SYSTEM_SUFFIX=" + suffix.replace("\\n","\\n")[:12000])
          PY

          echo PACKAGE_PHRASE_SEARCH
          docker exec lifeos-agent-canvas sh -c '
            grep -R -n -I -E "quick one-step workflow|minimal CHANGELOG|Autonomous Fix for Issue|CHANGELOG.md" /build/node_modules/@openhands /usr/local/lib/python3.*/site-packages/openhands* 2>/dev/null | head -100 || true
          '

          echo OPENHANDS_LEVEL2_DIAGNOSTIC=PASS
