name: Three Dashboard Runtime Inventory
on:
  workflow_dispatch:
    # Manual reruns remain available; push-path changes also provide acceptance evidence.
  push:
    branches: [main]
    paths: ['.github/workflows/three-dashboard-runtime-inventory.yml']
permissions:
  contents: read
  issues: write
jobs:
  inspect:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 5
    steps:
      - name: Inventory Homelab, LifeOS and LifeOS Control
        shell: bash
        run: |
          sudo python3 - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('/opt/stacks/homeassistant/config/.storage')
          reg=json.loads((root/'lovelace_dashboards').read_text()).get('data',{}).get('items',[])
          print('REGISTRY='+repr([(x.get('title'),x.get('url_path'),x.get('mode'),x.get('show_in_sidebar')) for x in reg]))
          for name in ('lovelace.dashboard_homelab','lovelace.dashboard_lifeos','lovelace.lifeos_control'):
              p=root/name
              print('\nDASHBOARD',name,'exists='+str(p.exists()))
              if not p.exists(): continue
              d=json.loads(p.read_text()); views=d.get('data',{}).get('config',{}).get('views',[])
              for v in views:
                  cards=v.get('cards',[]) if isinstance(v.get('cards'),list) else []
                  print('VIEW',repr(v.get('title')),repr(v.get('path')),'cards='+str(len(cards)))
                  for i,c in enumerate(cards):
                      if not isinstance(c,dict): continue
                      ents=sorted(set(re.findall(r'(?:sensor|binary_sensor|switch|button|input_text|input_boolean)\.[A-Za-z0-9_]+',json.dumps(c))))
                      label=c.get('title') or c.get('heading') or c.get('type')
                      print(' CARD',i,repr(label),'type='+str(c.get('type')),'entities='+repr(ents[:20]))
          PY
      - name: Gate A — live reconciler runtime inventory
        id: gate_a
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git show origin/main:scripts/reconcile-canonical-checkout.py | python3 - /home/joshan/lifeos-platform
          sudo -n python3 -u - <<'PY'
          import hashlib, imaplib, json, os, pathlib, re, ssl, subprocess, sys, time
          from collections import Counter

          repo=pathlib.Path('/home/joshan/lifeos-platform')
          automation=pathlib.Path('/home/joshan/automation')
          state_path=automation/'state/lifeos_personal_tasks.json'
          published=pathlib.Path('/opt/stacks/homeassistant/config/www/lifeos_tasks.json')
          checks=[]
          sys.path.insert(0,str(repo))
          sys.path.insert(0,str(automation))
          sys.path.append(str(repo/'homelab/live/home/joshan/automation'))
          from lifeos_email_paperless_selective import imap_credentials, paperless

          def check(name, ok):
              checks.append((name, bool(ok)))
              print(name+'='+('PASS' if ok else 'FAIL'))

          def output(args):
              cp=subprocess.run(args,text=True,capture_output=True,check=False,timeout=20)
              return cp.stdout.strip(),cp.returncode

          host=subprocess.check_output(['hostname'],text=True).strip()
          head=output(['git','-C',str(repo),'rev-parse','HEAD'])[0]
          origin=output(['git','-C',str(repo),'rev-parse','origin/main'])[0]
          dirty=output(['git','-C',str(repo),'status','--porcelain','--untracked-files=all'])[0]
          print('RUNTIME_HOST='+host)
          print('CANONICAL_HEAD='+head)
          print('CANONICAL_ORIGIN_MAIN='+origin)
          check('CANONICAL_CHECKOUT_IDENTITY',host=='Docker' and bool(head) and head==origin and not dirty)

          unit_files,_=output(['systemctl','list-unit-files','--no-legend','--no-pager'])
          loaded_services,_=output(['systemctl','list-units','--all','--type=service','--no-legend','--no-pager'])
          loaded_timers,_=output(['systemctl','list-units','--all','--type=timer','--no-legend','--no-pager'])
          unit_names=set()
          for line in unit_files.splitlines():
              if line.split(): unit_names.add(line.split()[0])
          service_names=set()
          for line in loaded_services.splitlines():
              if line.split(): service_names.add(line.split()[0])
          timer_names=set()
          for line in loaded_timers.splitlines():
              if line.split(): timer_names.add(line.split()[0])
          pattern=re.compile(r'(?i)(?=.*(?:task|personal))(?=.*reconcil)')
          task_services=sorted(x for x in unit_names|service_names if x.endswith('.service') and pattern.search(x))
          task_timers=sorted(x for x in unit_names|timer_names if x.endswith('.timer') and pattern.search(x))
          print('TASK_SERVICE_UNITS='+','.join(task_services))
          print('TASK_TIMER_UNITS='+','.join(task_timers))
          check('ONE_TASK_RECONCILER_SERVICE',len(task_services)==1 and task_services[0]=='lifeos-task-reconciler.service')
          check('ONE_TASK_RECONCILER_TIMER',len(task_timers)==1 and task_timers[0]=='lifeos-task-reconciler.timer')

          service_props={}
          for unit in task_services:
              raw,_=output(['systemctl','show',unit,'-p','ActiveState','-p','SubState','-p','Result','-p','ExecMainStatus','-p','UnitFileState'])
              props=dict(line.split('=',1) for line in raw.splitlines() if '=' in line)
              service_props[unit]=props
              print('TASK_SERVICE_STATE='+unit+':'+','.join(k+'='+v for k,v in sorted(props.items())))
              if props.get('Result') not in {'success',''}:
                  journal,_=output(['journalctl','-u',unit,'-n','80','--no-pager','-o','cat'])
                  categories=set(re.findall(r'([A-Za-z][A-Za-z0-9_]*(?:Error|Exception))',journal))
                  if 'No such file or directory' in journal: categories.add('MissingPath')
                  if 'Connection refused' in journal: categories.add('ConnectionRefused')
                  if 'timed out' in journal.lower(): categories.add('Timeout')
                  print('TASK_SERVICE_FAILURE_CATEGORIES='+(','.join(sorted(categories)) if categories else 'UNCLASSIFIED'))
          timer_props={}
          for unit in task_timers:
              raw,_=output(['systemctl','show',unit,'-p','ActiveState','-p','UnitFileState','-p','LastTriggerUSec','-p','NextElapseUSecRealtime','-p','OnUnitActiveUSec','-p','RandomizedDelayUSec'])
              props=dict(line.split('=',1) for line in raw.splitlines() if '=' in line)
              timer_props[unit]=props
              print('TASK_TIMER_STATE='+unit+':'+','.join(k+'='+v for k,v in sorted(props.items())))
          check('TASK_TIMER_ACTIVE',len(timer_props)==1 and timer_props.get('lifeos-task-reconciler.timer',{}).get('ActiveState')=='active')
          check('TASK_TIMER_ENABLED',len(timer_props)==1 and timer_props.get('lifeos-task-reconciler.timer',{}).get('UnitFileState')=='enabled')
          if service_props:
              p=service_props.get('lifeos-task-reconciler.service',{})
              check('LAST_TASK_RUN_SUCCESS',p.get('Result')=='success' and p.get('ExecMainStatus')=='0')

          related=sorted(x for x in unit_names|service_names if re.search(r'(?i)(lifeos.*(?:assistant|task|paperless|pa)|paperless|homeassistant)',x))
          print('RELATED_SYSTEMD_UNITS='+','.join(related))
          containers,container_rc=output(['docker','ps','--all','--format','{{.Names}}|{{.Status}}'])
          relevant=[x for x in containers.splitlines() if re.search(r'(?i)(paperless|homeassistant|lifeos)',x)]
          print('RELATED_CONTAINERS='+','.join(relevant))
          check('HOME_ASSISTANT_CONTAINER_RUNNING',any(x.startswith('homeassistant|Up ') for x in relevant))
          check('PAPERLESS_CONTAINER_RUNNING',any('paperless' in x.lower() and '|up ' in x.lower() for x in relevant))

          try:
              username,password=imap_credentials()
              client=imaplib.IMAP4_SSL('imap.gmail.com',993,ssl_context=ssl.create_default_context(),timeout=10)
              try:
                  client.login(username,password)
                  status,_=client.select('INBOX',readonly=True)
                  check('GMAIL_READ_ONLY_ACCESS',status=='OK')
              finally:
                  try: client.logout()
                  except Exception: pass
          except Exception as exc:
              print('GMAIL_READ_ONLY_ACCESS=UNAVAILABLE:'+type(exc).__name__)
              check('GMAIL_READ_ONLY_ACCESS',False)
          try:
              rows=paperless('GET','/api/documents/?query=lifeos&page_size=10')
              rows=rows if isinstance(rows,list) else (rows or {}).get('results',[])
              print('PAPERLESS_READ_ONLY_EVIDENCE_LOOKUP=PASS')
              check('PAPERLESS_READ_ONLY_EVIDENCE_LOOKUP',isinstance(rows,list))
          except Exception as exc:
              print('PAPERLESS_READ_ONLY_EVIDENCE_LOOKUP=UNAVAILABLE:'+type(exc).__name__)
              check('PAPERLESS_READ_ONLY_EVIDENCE_LOOKUP',False)

          source=repo/'homelab/live/home/joshan/automation/lifeos_task_reconciler.py'
          sys.path.insert(0,str(automation))
          installed=automation/'lifeos_task_reconciler.py'
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else ''
          source_hash=digest(source); installed_hash=digest(installed)
          print('RECONCILER_SOURCE_INSTALLED_MATCH='+('YES' if source_hash and source_hash==installed_hash else 'NO'))
          check('RECONCILER_SOURCE_INSTALLED_MATCH',bool(source_hash) and source_hash==installed_hash)
          source_text=source.read_text(errors='ignore') if source.is_file() else ''
          check('PRIVATE_INFERENCE_LOCAL_ONLY','ai_broker._ollama(' in source_text)

          running=[]
          for item in pathlib.Path('/proc').iterdir():
              if not item.name.isdigit(): continue
              try:
                  cmd=(item/'cmdline').read_bytes().replace(bytes([0]),b' ').decode(errors='ignore')
                  if 'lifeos_task_reconciler.py' in cmd and int(item.name)!=os.getpid(): running.append(item.name)
              except (OSError,ValueError): pass
          print('RECONCILER_PROCESS_COUNT='+str(len(running)))
          check('NO_COMPETING_RECONCILER_PROCESS',len(running)<=1)

          check('NO_ACTIVE_TASK_PUBLISHER_PROCESS',len(running)==0)

          payloads={}
          now=time.time()
          for label,path in (('PERSISTED',state_path),('HA_PROJECTION',published)):
              try:
                  data=json.loads(path.read_text())
                  age=max(0,int(now-float(data.get('generated_time',0))))
                  tasks=data.get('tasks') if isinstance(data.get('tasks'),list) else []
                  resolved=data.get('resolved') if isinstance(data.get('resolved'),list) else []
                  counts=Counter(str(x.get('status','INVALID')) for x in tasks+resolved if isinstance(x,dict))
                  payloads[label]=data
                  print(label+'_SCHEMA='+str(data.get('schema')))
                  print(label+'_AGE_SECONDS='+str(age))
                  print(label+'_TASKS='+str(len(tasks)))
                  print(label+'_RESOLVED='+str(len(resolved)))
                  print(label+'_OPEN='+str(counts.get('OPEN',0)))
                  print(label+'_WAITING='+str(counts.get('WAITING',0)))
                  print(label+'_DONE='+str(counts.get('DONE',0)))
                  print(label+'_MESSAGES_CONSIDERED='+str(data.get('messages_considered')))
                  print(label+'_ERRORS='+str(data.get('errors')))
                  check(label+'_SCHEMA_VALID',data.get('schema')=='lifeos_tasks_v3')
                  check(label+'_FRESH_WITHIN_TIMER_WINDOW',0<=now-float(data.get('generated_time',0))<=7*3600)
                  check(label+'_STATUSES_VALID',all(str(x.get('status')) in {'OPEN','WAITING'} for x in tasks if isinstance(x,dict)) and all(str(x.get('status'))=='DONE' for x in resolved if isinstance(x,dict)))
                  check(label+'_NO_RECONCILER_ERRORS',int(data.get('errors',-1))==0)
              except Exception as exc:
                  print(label+'_STATE=UNAVAILABLE:'+type(exc).__name__)
                  check(label+'_STATE_READABLE',False)

          check('PERSISTED_STATE_EQUALS_HA_PROJECTION',len(payloads)==2 and payloads.get('PERSISTED')==payloads.get('HA_PROJECTION'))
          if payloads.get('PERSISTED'):
              count=int(payloads['PERSISTED'].get('messages_considered') or 0)
              classified=int(payloads['PERSISTED'].get('messages_classified') or 0)
              reused=int(payloads['PERSISTED'].get('messages_reused') or 0)
              print('MODEL_CLASSIFICATION_ATTEMPTS_PER_SCAN='+str(classified))
              print('MESSAGES_REUSED_FROM_CACHE='+str(reused))
              print('MODEL_USAGE_EXACT_COUNTER=NOT_EXPOSED_BY_CURRENT_RECONCILER')
          scan_path=automation/'state/lifeos_personal_task_scan.json'
          scan_valid=False
          processed=[]
          try:
              scan=json.loads(scan_path.read_text())
              processed=scan.get('processed_message_ids',[])
              scan_valid=scan.get('schema')=='lifeos_task_scan_v1' and bool(scan.get('uidvalidity')) and int(scan.get('before_uid') or 0)>0 and isinstance(processed,list)
              print('SCAN_CHECKPOINT_SCHEMA='+str(scan.get('schema')))
              print('SCAN_CHECKPOINT_PROCESSED_COUNT='+str(len(processed) if isinstance(processed,list) else 0))
              print('SCAN_CHECKPOINT_CURSOR_PRESENT='+str(int(scan.get('before_uid') or 0)>0))
              check('SCAN_CHECKPOINT_VALID',scan_valid)
          except Exception as exc:
              print('SCAN_CHECKPOINT=UNAVAILABLE:'+type(exc).__name__)
              check('SCAN_CHECKPOINT_VALID',False)
          if payloads.get('PERSISTED'):
              older=sum(1 for x in payloads['PERSISTED'].get('tasks',[])+payloads['PERSISTED'].get('resolved',[]) if isinstance(x,dict) and int(x.get('observed_at') or now)>0 and int(x.get('observed_at') or now)<now-90*86400)
              print('PERSISTED_RECORDS_OUTSIDE_90_DAY_SCAN='+str(older))
              considered=int(payloads['PERSISTED'].get('messages_considered') or 0)
              progressed=scan_valid and len(processed)>considered
              print('BOUNDED_SCAN_PERSISTENCE='+('CHECKPOINTED_ACROSS_RUNS' if progressed else 'INITIAL_CHECKPOINT_ONLY'))
          failures=[name for name,ok in checks if not ok]
          print('GATE_A_RUNTIME_INVENTORY='+('PASS' if not failures else 'FAIL'))
          print('GATE_A_FAILED_CHECKS='+(','.join(failures) if failures else 'NONE'))
          if failures: raise SystemExit(1)
          PY

      - name: Deep acceptance — force fresh reconciler cycle
        id: deep_cycle
        if: ${{ always() && steps.gate_a.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, time
          state=pathlib.Path('/home/joshan/automation/state/lifeos_personal_tasks.json')
          scan=pathlib.Path('/home/joshan/automation/state/lifeos_personal_task_scan.json')
          published=pathlib.Path('/opt/stacks/homeassistant/config/www/lifeos_tasks.json')
          def load(p): return json.loads(p.read_text())
          def digest(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          before=load(state); before_scan=load(scan); before_hash=digest(state)
          before_generated=float(before.get('generated_time') or 0)
          before_processed=len(before_scan.get('processed_message_ids') or [])
          started=time.time()
          cp=subprocess.run(['sudo','-n','systemctl','start','lifeos-task-reconciler.service'],text=True,capture_output=True,timeout=420)
          print('DEEP_RECONCILER_START_RC='+str(cp.returncode))
          if cp.returncode: raise SystemExit(cp.returncode)
          props=subprocess.check_output(['systemctl','show','lifeos-task-reconciler.service','-p','Result','-p','ExecMainStatus'],text=True)
          print('DEEP_RECONCILER_SERVICE_RESULT='+','.join(x for x in props.splitlines() if x))
          after=load(state); after_scan=load(scan); projection=load(published)
          after_generated=float(after.get('generated_time') or 0)
          after_processed=len(after_scan.get('processed_message_ids') or [])
          print('DEEP_CYCLE_DURATION_SECONDS='+str(int(time.time()-started)))
          print('DEEP_GENERATED_TIME_ADVANCED='+str(after_generated>before_generated))
          print('DEEP_SCAN_PROCESSED_BEFORE='+str(before_processed))
          print('DEEP_SCAN_PROCESSED_AFTER='+str(after_processed))
          print('DEEP_STATE_CHANGED='+str(digest(state)!=before_hash))
          print('DEEP_MESSAGES_CONSIDERED='+str(int(after.get('messages_considered') or 0)))
          print('DEEP_MESSAGES_CLASSIFIED='+str(int(after.get('messages_classified') or 0)))
          print('DEEP_MESSAGES_REUSED='+str(int(after.get('messages_reused') or 0)))
          assert after_generated>=started-2 and after_generated>before_generated
          assert after.get('schema')=='lifeos_tasks_v3'
          assert after_scan.get('schema')=='lifeos_task_scan_v1'
          assert after_processed>=before_processed
          assert projection==after
          assert int(after.get('errors') or 0)==0
          print('DEEP_GMAIL_TO_PERSISTED_TO_HA_PROJECTION=PASS')
          PY

      - name: Gates B-E — installed identity and live projection acceptance
        id: gates_be
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n python3 - <<'PY'
          import importlib.util, json, pathlib, sys, time
          automation=pathlib.Path('/home/joshan/automation')
          import sys
          sys.path.insert(0,str(automation))
          installed=automation/'lifeos_task_reconciler.py'
          spec=importlib.util.spec_from_file_location('lifeos_task_reconciler_live',installed)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          def decision(topic,status):
              return {'actionable':True,'title':'Synthetic '+topic,'status':status,'counterparty':'Synthetic Supplier','topic':topic,'severity':'normal'}
          request={'message_id':'<synthetic-request@example.test>','source_ref':'<synthetic-request@example.test>'}
          progress={'message_id':'<synthetic-progress@example.test>','in_reply_to':request['message_id'],'references':request['message_id'],'source_ref':'<synthetic-progress@example.test>'}
          done={'message_id':'<synthetic-done@example.test>','in_reply_to':progress['message_id'],'references':request['message_id']+' '+progress['message_id'],'source_ref':'<synthetic-done@example.test>'}
          messages=[(decision('renewal','OPEN'),request,100),(decision('documents','WAITING'),progress,200),(decision('resolved','DONE'),done,300)]
          state={}
          task_id=None
          for item,msg,observed in messages:
              resolved=module.resolve_task_id(item,msg,state)
              if task_id is None: task_id=resolved
              assert resolved==task_id
              old=state.get(task_id,{})
              if module.observation_is_newer(old,observed):
                  refs=set(old.get('source_message_ids',[]))
                  refs.add(msg['message_id'])
                  state[task_id]={'id':task_id,'identity_semantic':module.key(item),'thread_root_id':module.thread_root(msg),'source_message_ids':sorted(refs),'status':module.effective_status(old,item['status']),'observed_at':observed}
          assert state[task_id]['status']=='DONE'
          unrelated={'message_id':'<synthetic-other@example.test>','source_ref':'<synthetic-other@example.test>'}
          assert module.resolve_task_id(decision('renewal','OPEN'),unrelated,state)!=task_id
          assert module.resolve_task_id(decision('renewal','OPEN'),request,state)==task_id
          assert not module.observation_is_newer(state[task_id],100)
          assert module.effective_status({'status':'DONE'},'OPEN')=='DONE'
          print('GATE_B_RUNTIME_ACCEPTANCE=PASS')
          tasks=pathlib.Path('/opt/stacks/homeassistant/config/www/lifeos_tasks.json')
          data=json.loads(tasks.read_text())
          attention=data.get('attention') or {}
          counts=attention.get('counts') or {}
          count_keys={'needs_me','waiting_on_others','overdue','upcoming','recently_completed','stale_no_progress'}
          print('BE_ATTENTION_SCHEMA='+str(attention.get('schema')))
          print('BE_ATTENTION_COUNT_KEYS='+','.join(sorted(counts)))
          assert attention.get('schema')=='lifeos_attention_projection_v1'
          assert count_keys.issubset(counts)
          assert all(isinstance(counts[k],int) and counts[k]>=0 for k in count_keys)
          required={'id','title','status','source','source_refs','priority_score'}
          assert all(required.issubset(row) for name in ('needs_me','waiting_on_others','due_overdue','upcoming','recently_completed','stale_no_progress') for row in attention.get(name,[]))
          assert attention.get('method')=='deterministic_severity_times_due_urgency'
          assert all(isinstance(row.get('priority_score'),int) for row in attention.get('needs_me',[]))
          print('GATE_C_RUNTIME_ACCEPTANCE=PASS')
          print('GATE_D_RUNTIME_ACCEPTANCE=PASS')
          briefing=data.get('briefing') or {}
          print('BE_BRIEFING_SCHEMA='+str(briefing.get('schema')))
          print('BE_BRIEFING_SOURCE='+str(briefing.get('source')))
          print('BE_BRIEFING_CONFIDENCE='+str(briefing.get('confidence')))
          assert briefing.get('schema')=='lifeos_daily_briefing_v1'
          assert briefing.get('source')=='lifeos_tasks_v3'
          assert briefing.get('confidence')=='structured_state_only'
          assert isinstance(briefing.get('items'),list) and len(briefing['items'])<=5
          assert isinstance(briefing.get('summary'),str) and briefing['summary']
          print('GATE_E_RUNTIME_ACCEPTANCE=PASS')
          print('ATTENTION_COUNTS='+','.join(k+':'+str(counts[k]) for k in sorted(count_keys)))
          print('BRIEFING_ITEMS='+str(len(briefing['items'])))
          print('PRIVATE_TASK_CONTENT=NOT_EMITTED')
          PY

      - name: Gate F — live Home Assistant PA acceptance
        id: gate_f
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n /usr/local/sbin/lifeos-secret exec homeassistant.long_lived_access_token HA_TOKEN python3 - <<'PY'
          import json, os, pathlib, urllib.request
          token=os.environ['HA_TOKEN'].strip()
          assert token
          def state(entity):
              req=urllib.request.Request(
                  'http://127.0.0.1:8123/api/states/'+entity,
                  headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=10) as response:
                  assert response.status==200
                  return json.load(response)
          pa=state('sensor.lifeos_pa_task_attention')
          print('F_PA_STATE='+str(pa.get('state')))
          print('F_PA_ATTRIBUTE_KEYS='+','.join(sorted((pa.get('attributes') or {}).keys())))
          assert pa.get('state') not in {'unknown','unavailable',None}
          attrs=pa.get('attributes') or {}
          for key in ('needs_me','waiting_on_others','overdue','upcoming','recently_completed','stale_no_progress'):
              assert isinstance(attrs.get(key),int) and attrs[key]>=0
          assert attrs.get('source')=='lifeos_tasks_v3'
          assert int(attrs.get('generated_time') or 0)>0
          summary=state('sensor.lifeos_attention_summary')
          print('F_SUMMARY_STATE='+str(summary.get('state')))
          assert summary.get('state') not in {'unknown','unavailable',None}
          dashboard=pathlib.Path('/opt/stacks/homeassistant/config/.storage/lovelace.dashboard_lifeos')
          data=json.loads(dashboard.read_text())
          views=data.get('data',{}).get('config',{}).get('views',[])
          overview=next(v for v in views if v.get('path')=='overview')
          cards=overview.get('cards') or []
          personal=[c for c in cards if isinstance(c,dict) and c.get('title')=='Personal Attention']
          print('F_PERSONAL_ATTENTION_CARD_COUNT='+str(len(personal)))
          assert len(personal)==1
          assert 'sensor.lifeos_pa_task_attention' in json.dumps(personal[0])
          print('GATE_F_RUNTIME_ACCEPTANCE=PASS')
          print('PA_ATTENTION_STATE='+str(pa.get('state')))
          print('PA_ATTENTION_COUNTS='+','.join(k+':'+str(attrs[k]) for k in ('needs_me','waiting_on_others','overdue','upcoming','recently_completed','stale_no_progress')))
          print('LIFEOS_ATTENTION_SUMMARY=AVAILABLE')
          print('LIFEOS_OVERVIEW_PERSONAL_ATTENTION_CARD=PASS')
          PY

      - name: Gate G — live everyday PA retrieval acceptance
        id: gate_g
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, urllib.request
          questions=[
              ('needs_me','What needs me?'),
              ('waiting','What am I waiting for?'),
              ('changed','What changed?'),
              ('due_soon','What is due soon?'),
              ('evidence','What evidence do I have for insurance?'),
          ]
          for name,question in questions:
              body=json.dumps({'messages':[{'role':'user','content':question}],'privacy_domain':'personal-administration'}).encode()
              req=urllib.request.Request('http://127.0.0.1:8791/assist',data=body,headers={'Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=20) as response:
                  assert response.status==200
                  data=json.load(response)
              assert data.get('provider')=='structured_local_state'
              assert data.get('route')=='structured_pa_state'
              assert data.get('source_schema')=='lifeos_tasks_v3'
              assert data.get('privacy')=='local-only'
              assert data.get('ready_to_run') is False
              assert not data.get('proposed_job')
              print('GATE_G_QUERY_'+name.upper()+'=PASS')
          print('GATE_G_RUNTIME_ACCEPTANCE=PASS')
          print('GATE_G_PROVIDER=structured_local_state')
          print('GATE_G_PRIVACY=local-only')
          print('GATE_G_PRIVATE_ANSWER_TEXT=NOT_LOGGED')
          PY

      - name: A-G end-to-end system acceptance
        id: system_acceptance
        if: ${{ always() }}
        shell: bash
        env:
          GATE_A: ${{ steps.gate_a.outcome }}
          GATES_BE: ${{ steps.gates_be.outcome }}
          GATE_F: ${{ steps.gate_f.outcome }}
          GATE_G: ${{ steps.gate_g.outcome }}
        run: |
          set -Eeuo pipefail
          echo "INDIVIDUAL_GATE_A=$GATE_A"
          echo "INDIVIDUAL_GATES_B_E=$GATES_BE"
          echo "INDIVIDUAL_GATE_F=$GATE_F"
          echo "INDIVIDUAL_GATE_G=$GATE_G"
          [[ "$GATE_A" == success ]]
          [[ "$GATES_BE" == success ]]
          [[ "$GATE_F" == success ]]
          [[ "$GATE_G" == success ]]
          curl -fsS --max-time 5 http://127.0.0.1:8791/health >/dev/null
          test -s /opt/stacks/homeassistant/config/www/lifeos_tasks.json
          python3 - <<'PY'
          import json, pathlib, time
          p=json.loads(pathlib.Path('/opt/stacks/homeassistant/config/www/lifeos_tasks.json').read_text())
          assert p.get('schema')=='lifeos_tasks_v3'
          assert (p.get('attention') or {}).get('schema')=='lifeos_attention_projection_v1'
          assert (p.get('briefing') or {}).get('schema')=='lifeos_daily_briefing_v1'
          assert time.time()-float(p.get('generated_time') or 0)<=7*3600
          print('A_G_DATA_CHAIN=PASS')
          PY
          echo "A_G_END_TO_END_SYSTEM_ACCEPTANCE=PASS"

      - name: Record individual gate outcomes
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_A: ${{ steps.gate_a.outcome }}
          GATES_BE: ${{ steps.gates_be.outcome }}
          GATE_F: ${{ steps.gate_f.outcome }}
          GATE_G: ${{ steps.gate_g.outcome }}
          SYSTEM: ${{ steps.system_acceptance.outcome }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          run=os.environ['GITHUB_RUN_ID']
          sha=os.environ['GITHUB_SHA']
          rows={k:os.environ[k] for k in ('GATE_A','GATES_BE','GATE_F','GATE_G','SYSTEM')}
          body="## Automated PA gate test receipt\n\n"
          body+=f"Commit: `{sha}`\nRun: https://github.com/{repo}/actions/runs/{run}\n\n"
          body+="| Test | Outcome |\n|---|---|\n"
          for label,key in (('Gate A','GATE_A'),('Gates B–E','GATES_BE'),('Gate F','GATE_F'),('Gate G','GATE_G'),('A–G system','SYSTEM')):
              body+=f"| {label} | `{rows[key]}` |\n"
          body+="\nSanitized execution receipt only; no private PA content is included."
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/1441/comments",
              data=json.dumps({'body':body}).encode(),
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
              method='POST')
          with urllib.request.urlopen(req,timeout=20) as response:
              assert response.status==201
          print('GATE_OUTCOME_RECEIPT=POSTED')
          PY

      - name: Record A-G live acceptance receipt
        if: ${{ success() && steps.system_acceptance.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['GITHUB_SHA']; run=os.environ['GITHUB_RUN_ID']
          body="## Automated live A-G acceptance receipt\n\n**Result: PASS**\n\n"
          body+=f"All PA Gates A-G passed on canonical main at {sha}.\n\n"
          body+="No private task/email/document/answer content is included.\n\n"
          body+=f"Workflow: https://github.com/{repo}/actions/runs/{run}\nCommit: {sha}"
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/issues/1441/comments",data=json.dumps({'body':body}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=20) as response: assert response.status==201
          print('A_G_PASS_RECEIPT=POSTED')
          PY
