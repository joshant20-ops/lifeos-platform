name: OpenHands Level 2 Issue 935 Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/openhands-level2-935-acceptance.yml'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  accept:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 55
    steps:
      - name: Run clean Level 2 acceptance through stock Canvas
        shell: bash
        env:
          ACCEPTANCE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$(hostname)" == "Docker" ]]
          cd /home/joshan/lifeos-platform
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          docker exec lifeos-agent-canvas sh -c '
            set -eu
            git -C /projects/lifeos-platform fetch origin main
            git -C /projects/lifeos-platform checkout main
            git -C /projects/lifeos-platform reset --hard origin/main
            git -C /projects/lifeos-platform clean -fd
          '

          api_key="$(docker exec lifeos-agent-canvas cat /home/openhands/.openhands/agent-canvas/api-key.txt)"
          test -n "$api_key"

          python3 - "$api_key" <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request
          import uuid

          key = sys.argv[1]
          token = os.environ["ACCEPTANCE_GITHUB_TOKEN"]
          base = "http://127.0.0.1:18000"
          headers = {
              "X-Session-API-Key": key,
              "Content-Type": "application/json",
          }

          def request(path, method="GET", data=None, expose=False, timeout=120):
              body = None if data is None else json.dumps(data).encode()
              request_headers = dict(headers)
              if expose:
                  request_headers["X-Expose-Secrets"] = "encrypted"
              req = urllib.request.Request(
                  base + path,
                  data=body,
                  headers=request_headers,
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  raw = response.read()
                  return response.status, json.loads(raw) if raw else None

          # Make the workflow-scoped GitHub credential available only to this
          # conversation. The persisted value is deleted in finally.
          status, _ = request(
              "/api/settings/secrets",
              "PUT",
              {
                  "name": "GITHUB_TOKEN",
                  "value": token,
                  "description": "ephemeral Level 2 acceptance credential",
              },
          )
          assert status == 200, status

          prompt = """Continue the staged OpenHands autonomous-engineering acceptance testing in joshant20-ops/lifeos-platform.

Start with Level 2 acceptance issue #935.

Read issue #935 and its comments, inspect the repository, diagnose the defect, implement and test the fix, push the branch, create a PR, follow CI, respond to failures if any, and continue autonomously until the task is genuinely complete or a real blocker requires user input.

Use the repository and GitHub tools available to you. Do not merely describe commands or provide a script for someone else to run. Do not invent a different task. Do not ask for permission for routine repository, test, GitHub, PR, CI, or verification actions.

Do not close the acceptance issue yourself. Do not alter the accepted OpenHands architecture. Finish with concise evidence: diagnosis, changed paths, tests, commit/branch, PR URL, and CI state."""
          cid = uuid.uuid4().hex
          try:
              _, settings = request("/api/settings", expose=True)
              agent = settings["agent_settings"]
              suffix = agent["agent_context"]["system_message_suffix"]
              assert "<LIFEOS_REPOSITORY_TASK_GROUNDING_V1>" in suffix
              assert agent["llm"]["model"] == "openai/gpt-oss:20b"
              assert agent["llm"]["native_tool_calling"] is True
              assert agent["enable_switch_llm_tool"] is False
              payload = {
                  "conversation_id": cid,
                  "agent_settings": agent,
                  "secrets_encrypted": True,
                  "workspace": {"working_dir": "/projects/lifeos-platform"},
                  "secrets": {
                      "GITHUB_TOKEN": {
                          "kind": "LookupSecret",
                          "url": "/api/settings/secrets/GITHUB_TOKEN",
                          "description": "workflow-scoped GitHub credential",
                      }
                  },
                  "security_analyzer": None,
                  "initial_message": {
                      "role": "user",
                      "content": [{"type": "text", "text": prompt}],
                      "run": True,
                  },
                  "max_iterations": 120,
                  "stuck_detection": True,
                  "autotitle": False,
              }
              started = time.monotonic()
              _, created = request("/api/conversations", "POST", payload)
              actual = str(created["id"]).replace("-", "")
              assert actual == cid, (actual, cid)
              print("OPENHANDS_LEVEL2_CONVERSATION_ID=" + actual)
              deadline = time.time() + 2700
              status_text = ""
              while time.time() < deadline:
                  _, conversation = request("/api/conversations/" + actual)
                  status_text = str(conversation.get("execution_status", "")).lower()
                  if status_text in {"finished", "paused", "error", "stuck", "idle"}:
                      break
                  time.sleep(10)
              else:
                  raise AssertionError("Level 2 conversation timeout")
              print("OPENHANDS_LEVEL2_STATUS=" + status_text)
              print("OPENHANDS_LEVEL2_WALL_S=" + str(round(time.monotonic() - started, 2)))

              event_root = (
                  "/home/openhands/.openhands/agent-canvas/conversations/"
                  + actual
                  + "/events"
              )
              probe = r'''
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          events = [json.loads(p.read_text()) for p in sorted(root.glob("*.json"))]
          first_agent = next((e for e in events if e.get("source") == "agent"), None)
          action_events = [
              e for e in events
              if e.get("source") == "agent"
              and ("action" in str(e.get("kind", "")).lower()
                   or isinstance(e.get("action"), dict))
          ]
          flat = [json.dumps(e).lower() for e in events]
          result = {
              "events": len(events),
              "first_agent_kind": (first_agent or {}).get("kind"),
              "first_agent_has_action": bool(
                  first_agent and (
                      "action" in str(first_agent.get("kind", "")).lower()
                      or isinstance(first_agent.get("action"), dict)
                  )
              ),
              "agent_actions": len(action_events),
              "terminal_markers": sum(
                  ("terminalaction" in item or "execute_command" in item)
                  for item in flat
              ),
              "file_markers": sum("fileeditoraction" in item for item in flat),
              "finish_markers": sum("finishaction" in item for item in flat),
              "issue_935_present": any("issue #935" in item for item in flat),
              "invented_changelog": any(
                  "quick \\u201cone" in item and "changelog.md" in item
                  for item in flat
              ),
          }
          print(json.dumps(result, sort_keys=True))
          '''
              summary_raw = subprocess.check_output(
                  [
                      "docker", "exec", "-i", "lifeos-agent-canvas",
                      "python", "-c", probe, event_root,
                  ],
                  text=True,
              )
              summary = json.loads(summary_raw)
              print("OPENHANDS_LEVEL2_EVENT_SUMMARY=" + json.dumps(summary, sort_keys=True))
              assert summary["issue_935_present"] is True
              assert summary["first_agent_has_action"] is True, summary
              assert summary["agent_actions"] >= 1, summary
              assert summary["terminal_markers"] >= 1, summary
              assert summary["invented_changelog"] is False, summary
              assert status_text == "finished", status_text

              _, final = request(
                  "/api/conversations/" + actual + "/agent_final_response"
              )
              response = str(final.get("response", ""))
              print("OPENHANDS_LEVEL2_FINAL_RESPONSE_BYTES=" + str(len(response.encode())))
              assert "#935" in response or "935" in response
              print("OPENHANDS_LEVEL2_GROUNDING_REGRESSION=PASS")
          finally:
              try:
                  request("/api/settings/secrets/GITHUB_TOKEN", "DELETE")
              except Exception:
                  pass
          PY

          branch="$(docker exec lifeos-agent-canvas git -C /projects/lifeos-platform branch --show-current)"
          head="$(docker exec lifeos-agent-canvas git -C /projects/lifeos-platform rev-parse HEAD)"
          base_head="$(docker exec lifeos-agent-canvas git -C /projects/lifeos-platform rev-parse origin/main)"
          test "$branch" != main
          test "$head" != "$base_head"
          echo "OPENHANDS_LEVEL2_BRANCH=$branch"
          echo "OPENHANDS_LEVEL2_HEAD=$head"

          pr_json="$(curl -fsS -H "Authorization: Bearer $ACCEPTANCE_GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/joshant20-ops/lifeos-platform/pulls?state=all&head=joshant20-ops:$branch")"
          python3 - "$head" "$pr_json" <<'PY'
          import json, sys
          head, raw = sys.argv[1], sys.argv[2]
          prs = json.loads(raw)
          assert prs, "OpenHands did not create a PR"
          pr = next((item for item in prs if item["head"]["sha"] == head), None)
          assert pr is not None, (head, [(p["number"], p["head"]["sha"]) for p in prs])
          print("OPENHANDS_LEVEL2_PR=" + pr["html_url"])
          print("OPENHANDS_LEVEL2_PR_NUMBER=" + str(pr["number"]))
          print("OPENHANDS_LEVEL2_PR_STATE=" + pr["state"])
          print("OPENHANDS_LEVEL2_ACCEPTANCE=PASS")
          PY
