name: LifeOS Wave B Governor Recovery

on:
  push:
    branches:
      - fix/wave-b-governor-local-tool-routing

permissions:
  contents: write

concurrency:
  group: lifeos-wave-b-governor-recovery
  cancel-in-progress: false

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: fix/wave-b-governor-local-tool-routing
          fetch-depth: 0

      - name: Apply proved Governor tool-routing recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          broker = Path('governor/ai_broker.py')
          s = broker.read_text()

          old = '''    if not mac:\n        return False\n'''
          new = '''    if not mac:\n        raise BrokerError(\n            "TOWER_WAKE_CONFIGURATION_ERROR: "\n            "LIFEOS_LOCAL_AI_MAC is not configured"\n        )\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'TOWER_WAKE_CONFIGURATION_ERROR' not in s:
              raise SystemExit('wake-local-ai anchor missing')

          anchor = '''def _gemini_url(provider: dict, secrets: dict[str, str]) -> str:\n'''
          local_adapter = r'''def _ollama_tool_call_from_content(content, tools: list[dict]) -> dict | None:
              if not isinstance(content, str) or not content.strip():
                  return None
              try:
                  value = json.loads(content)
              except Exception:
                  return None
              if not isinstance(value, dict):
                  return None
              name = value.get("name")
              arguments = value.get("arguments")
              if not isinstance(name, str) or not name or not isinstance(arguments, dict):
                  return None
              allowed = {
                  str((tool.get("function") or {}).get("name") or "")
                  for tool in tools
                  if isinstance(tool, dict) and tool.get("type") == "function"
              }
              if name not in allowed:
                  return None
              return {
                  "id": f"call_ollama_{os.urandom(6).hex()}",
                  "type": "function",
                  "function": {
                      "name": name,
                      "arguments": json.dumps(arguments, separators=(",", ":")),
                  },
              }


          def _ollama_chat_once(messages: list[dict], tools: list[dict], model: str) -> dict:
              ollama_messages: list[dict] = []
              for message in messages:
                  if not isinstance(message, dict):
                      continue
                  role = str(message.get("role") or "user")
                  if role == "assistant":
                      item: dict = {"role": "assistant", "content": str(message.get("content") or "")}
                      calls = []
                      for call in message.get("tool_calls") or []:
                          if not isinstance(call, dict):
                              continue
                          fn = call.get("function") or {}
                          name = str(fn.get("name") or "")
                          if not name:
                              continue
                          raw = fn.get("arguments") or "{}"
                          try:
                              args = json.loads(raw) if isinstance(raw, str) else raw
                          except Exception:
                              args = {}
                          calls.append({"function": {"name": name, "arguments": args if isinstance(args, dict) else {}}})
                      if calls:
                          item["tool_calls"] = calls
                      ollama_messages.append(item)
                      continue
                  if role == "tool":
                      ollama_messages.append({"role": "tool", "content": str(message.get("content") or "")})
                      continue
                  ollama_messages.append({"role": role, "content": str(message.get("content") or "")})

              if not tools:
                  raise BrokerError("tool-aware chat requires function declarations")
              url = OLLAMA_URL.rsplit("/api/", 1)[0] + "/api/chat"
              result = _post_json(url, {
                  "model": model,
                  "messages": ollama_messages,
                  "tools": tools,
                  "stream": False,
                  "keep_alive": "30m",
              }, timeout=HTTP_TIMEOUT)
              raw_message = result.get("message")
              if not isinstance(raw_message, dict):
                  raise BrokerError("ollama returned no tool-aware message")

              content = raw_message.get("content")
              normalized_calls: list[dict] = []
              for index, call in enumerate(raw_message.get("tool_calls") or []):
                  if not isinstance(call, dict):
                      continue
                  fn = call.get("function") or {}
                  name = str(fn.get("name") or "")
                  if not name:
                      continue
                  args = fn.get("arguments") or {}
                  if isinstance(args, str):
                      try:
                          args = json.loads(args)
                      except Exception:
                          args = {}
                  if not isinstance(args, dict):
                      args = {}
                  normalized_calls.append({
                      "id": str(call.get("id") or f"call_ollama_{index}_{os.urandom(4).hex()}"),
                      "type": "function",
                      "function": {
                          "name": name,
                          "arguments": json.dumps(args, separators=(",", ":")),
                      },
                  })

              if not normalized_calls:
                  fallback = _ollama_tool_call_from_content(content, tools)
                  if fallback:
                      normalized_calls.append(fallback)
                      content = None

              message: dict = {"role": "assistant", "content": content or None}
              if normalized_calls:
                  message["tool_calls"] = normalized_calls
              if not normalized_calls and not message["content"]:
                  raise BrokerError("ollama returned empty tool-aware response")
              return {
                  "message": message,
                  "finish_reason": "tool_calls" if normalized_calls else "stop",
              }


          def _ollama_chat(messages: list[dict], tools: list[dict], provider: dict, tool_choice=None) -> dict:
              del tool_choice  # Ollama receives the declared tools; model decides the call.
              model = _provider_model(provider)
              _publish_lease("active")
              try:
                  try:
                      return _ollama_chat_once(messages, tools, model)
                  except BrokerError as first:
                      _wake_local_ai()
                      deadline = time.monotonic() + WAKE_TIMEOUT
                      last: Exception = first
                      while time.monotonic() < deadline:
                          time.sleep(3)
                          _publish_lease("active")
                          try:
                              return _ollama_chat_once(messages, tools, model)
                          except BrokerError as exc:
                              last = exc
                      raise BrokerError("local AI did not become ready after Wake-on-LAN") from last
              finally:
                  _publish_lease("released", required=False)


          '''
          if 'def _ollama_chat_once(' not in s:
              if s.count(anchor) != 1:
                  raise SystemExit('ollama adapter insertion anchor missing')
              s = s.replace(anchor, local_adapter + anchor, 1)

          groq_anchor = '''def _openrouter(prompt: str, provider: dict, secrets: dict[str, str]) -> str:\n'''
          groq_chat = '''def _groq_chat(messages: list[dict], tools: list[dict], provider: dict, secrets: dict[str, str], tool_choice=None) -> dict:\n    return _openai_chat(\n        "https://api.groq.com/openai/v1/chat/completions",\n        messages,\n        tools,\n        _provider_model(provider),\n        secrets["GROQ_API_KEY"],\n        tool_choice=tool_choice,\n    )\n\n\n'''
          if 'def _groq_chat(' not in s:
              if s.count(groq_anchor) != 1:
                  raise SystemExit('groq chat insertion anchor missing')
              s = s.replace(groq_anchor, groq_chat + groq_anchor, 1)

          old = '''    adapters = {"local-builder"} if privacy == "local-only" else {"direct-cloud"}\n'''
          new = '''    adapters = {"local-builder"} if privacy == "local-only" else {"local-builder", "direct-cloud"}\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('candidate adapter anchor missing')

          old = '''    eligible = [p for p in eligible if p.get("id") in {"gemini", "openrouter"}]\n    if not eligible:\n        raise BrokerError("no eligible tool-capable cloud provider")\n'''
          new = '''    eligible = [p for p in eligible if p.get("id") in {"ollama", "gemini", "groq", "openrouter"}]\n    if not eligible:\n        raise BrokerError("no eligible tool-capable provider")\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('tool provider eligibility anchor missing')

          old = '''            if pid == "gemini":\n                response = _gemini_chat(messages, tools or [], provider, secrets, tool_choice=tool_choice)\n            elif pid == "openrouter":\n                response = _openrouter_chat(messages, tools or [], provider, secrets, tool_choice=tool_choice)\n'''
          new = '''            if pid == "ollama":\n                response = _ollama_chat(messages, tools or [], provider, tool_choice=tool_choice)\n            elif pid == "gemini":\n                response = _gemini_chat(messages, tools or [], provider, secrets, tool_choice=tool_choice)\n            elif pid == "groq":\n                response = _groq_chat(messages, tools or [], provider, secrets, tool_choice=tool_choice)\n            elif pid == "openrouter":\n                response = _openrouter_chat(messages, tools or [], provider, secrets, tool_choice=tool_choice)\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('tool dispatch anchor missing')

          old = '''        except (BrokerError, KeyError) as exc:\n            failures.append(f"{pid}:{type(exc).__name__}")\n    raise BrokerError("tool-capable providers exhausted: " + ",".join(failures))\n'''
          new = '''        except (BrokerError, KeyError) as exc:\n            detail = " ".join(str(exc).split())\n            if len(detail) > 300:\n                detail = detail[:297] + "..."\n            failures.append(f"{pid}:{type(exc).__name__}:{detail}")\n    raise BrokerError("tool-capable providers exhausted: " + " | ".join(failures))\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('diagnostic failure anchor missing')

          broker.write_text(s)

          agent = Path('governor/autonomous_agent.py')
          a = agent.read_text()
          old = '''                messages = body.get("messages") or []\n                prompt = "\\n".join(\n                    f"{str(item.get('role') or 'user').upper()}: {str(item.get('content') or '')}"\n                    for item in messages if isinstance(item, dict)\n                ).strip()\n                if not prompt:\n                    raise ValueError("messages_required")\n                result = _AI_BROKER.generate(prompt, privacy="local-only", task_class="normal")\n                self.send_json(200, {\n                    "id": "chatcmpl-" + uuid.uuid4().hex,\n                    "object": "chat.completion",\n                    "created": int(time.time()),\n                    "model": result["model"],\n                    "lifeos_provider": result["provider"],\n                    "choices": [{"index": 0, "message": {"role": "assistant", "content": result["text"]}, "finish_reason": "stop"}],\n                })\n'''
          new = '''                messages = body.get("messages") or []\n                tools = body.get("tools") or []\n                tool_choice = body.get("tool_choice")\n                if not messages:\n                    raise ValueError("messages_required")\n                if tools:\n                    result = _AI_BROKER.chat(\n                        messages,\n                        tools=tools,\n                        tool_choice=tool_choice,\n                        privacy="normal",\n                        task_class="normal",\n                    )\n                    message = result["message"]\n                    finish_reason = result["finish_reason"]\n                else:\n                    prompt = "\\n".join(\n                        f"{str(item.get('role') or 'user').upper()}: {str(item.get('content') or '')}"\n                        for item in messages if isinstance(item, dict)\n                    ).strip()\n                    if not prompt:\n                        raise ValueError("messages_required")\n                    result = _AI_BROKER.generate(prompt, privacy="local-only", task_class="normal")\n                    message = {"role": "assistant", "content": result["text"]}\n                    finish_reason = "stop"\n                self.send_json(200, {\n                    "id": "chatcmpl-" + uuid.uuid4().hex,\n                    "object": "chat.completion",\n                    "created": int(time.time()),\n                    "model": result["model"],\n                    "lifeos_provider": result["provider"],\n                    "choices": [{"index": 0, "message": message, "finish_reason": finish_reason}],\n                })\n'''
          if old in a:
              a = a.replace(old, new, 1)
          elif '_AI_BROKER.chat(' not in a:
              raise SystemExit('agent tool endpoint anchor missing')
          agent.write_text(a)
          PY

      - name: Add regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > tests/test_governor_local_tool_routing.py <<'PY'
          import importlib.util
          import json
          import pathlib
          import sys
          from unittest import mock

          ROOT = pathlib.Path(__file__).resolve().parents[1]
          spec = importlib.util.spec_from_file_location('lifeos_ai_broker_test', ROOT / 'governor' / 'ai_broker.py')
          broker = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(broker)


          def test_normal_candidates_expose_local_builder_adapter():
              with mock.patch.object(broker.ROUTER, 'load_policy', return_value={'providers': []}), \
                   mock.patch.object(broker.ROUTER, 'load_secret_names', return_value=set()), \
                   mock.patch.object(broker.ROUTER, 'eligible_providers', return_value=([], [])) as eligible:
                  broker.candidates(privacy='normal', task_class='normal')
              assert eligible.call_args.kwargs['available_adapters'] == {'local-builder', 'direct-cloud'}


          def test_ollama_json_content_is_normalized_only_for_declared_tool():
              tools = [{'type': 'function', 'function': {'name': 'report_test_value'}}]
              call = broker._ollama_tool_call_from_content(
                  json.dumps({'name': 'report_test_value', 'arguments': {'value': 'OK'}}),
                  tools,
              )
              assert call['function']['name'] == 'report_test_value'
              assert json.loads(call['function']['arguments']) == {'value': 'OK'}
              assert broker._ollama_tool_call_from_content(
                  json.dumps({'name': 'undeclared', 'arguments': {}}), tools
              ) is None


          def test_chat_prefers_policy_order_and_dispatches_ollama():
              provider = {'id': 'ollama', 'api_model': 'qwen2.5-coder:7b-instruct'}
              response = {
                  'message': {
                      'role': 'assistant',
                      'content': None,
                      'tool_calls': [{
                          'id': 'call_test',
                          'type': 'function',
                          'function': {'name': 'x', 'arguments': '{}'},
                      }],
                  },
                  'finish_reason': 'tool_calls',
              }
              with mock.patch.object(broker, 'candidates', return_value=([provider], [])), \
                   mock.patch.object(broker, '_strict_env', return_value={}), \
                   mock.patch.object(broker, '_ollama_chat', return_value=response) as local:
                  result = broker.chat(
                      [{'role': 'user', 'content': 'call x'}],
                      tools=[{'type': 'function', 'function': {'name': 'x'}}],
                  )
              local.assert_called_once()
              assert result['provider'] == 'ollama'
              assert result['finish_reason'] == 'tool_calls'
          PY

      - name: Validate recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile governor/ai_broker.py governor/autonomous_agent.py
          python3 -m pytest -q tests/test_governor_local_tool_routing.py
          git diff --check
          grep -q 'def _ollama_chat_once' governor/ai_broker.py
          grep -q 'def _groq_chat' governor/ai_broker.py
          grep -q '_AI_BROKER.chat' governor/autonomous_agent.py

      - name: Commit validated recovery to branch
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'RECOVERY_ALREADY_APPLIED=PASS'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governor/ai_broker.py governor/autonomous_agent.py tests/test_governor_local_tool_routing.py
          git commit -m 'Restore local tool-capable Governor routing'
          git push origin HEAD:fix/wave-b-governor-local-tool-routing
