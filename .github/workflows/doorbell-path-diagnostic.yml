name: Doorbell Path Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/doorbell-path-diagnostic.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe Doorbell path read-only
        run: |
          set -Eeuo pipefail
          sudo -n python3 - <<'PY'
          import json, pathlib, sqlite3, urllib.request, urllib.parse
          B=pathlib.Path('/opt/stacks/homeassistant/config')
          BASE='http://127.0.0.1:8123'
          entity='camera.front_door_live_view'

          # 1. Ring integration and enabled entity.
          reg=json.loads((B/'.storage/core.entity_registry').read_text())['data']['entities']
          entry=next((x for x in reg if x.get('entity_id')==entity),None)
          if not entry or entry.get('disabled_by') or entry.get('platform')!='ring':
            raise SystemExit('STEP1_RING_ENTITY=FAIL')
          print('STEP1_RING_ENTITY=PASS')

          # 2. Recorder state plus the camera's image path, without logging URL/token data.
          db=B/'home-assistant_v2.db'
          con=sqlite3.connect(f'file:{db}?mode=ro',uri=True)
          row=con.execute("""select s.state,a.shared_attrs
            from states s join states_meta m on m.metadata_id=s.metadata_id
            left join state_attributes a on a.attributes_id=s.attributes_id
            where m.entity_id=? order by s.state_id desc limit 1""",(entity,)).fetchone()
          if not row:
            raise SystemExit('STEP2_CAMERA_STATE=FAIL')
          state,raw_attrs=row
          attrs=json.loads(raw_attrs) if raw_attrs else {}
          image_path=attrs.get('entity_picture')
          print('STEP2_CAMERA_STATE=PASS:'+str(state))
          if not image_path:
            raise SystemExit('STEP3_CAMERA_IMAGE_PATH=FAIL')
          print('STEP3_CAMERA_IMAGE_PATH=PASS')

          # 3. Fetch and validate the actual current image. Keep URL, token, and image bytes private.
          image_url=urllib.parse.urljoin(BASE+'/',str(image_path))
          try:
            with urllib.request.urlopen(image_url,timeout=20) as response:
              content_type=response.headers.get('Content-Type','').split(';',1)[0].lower()
              image=response.read()
              status=response.status
          except Exception as exc:
            raise SystemExit('STEP3_CAMERA_IMAGE_FETCH=FAIL:'+type(exc).__name__)
          if status!=200 or not content_type.startswith('image/') or len(image)<256:
            raise SystemExit('STEP3_CAMERA_IMAGE_FETCH=FAIL:status='+str(status)+',type='+content_type+',bytes='+str(len(image)))
          print('STEP3_CAMERA_IMAGE_FETCH=PASS:'+content_type+':'+str(len(image))+'bytes')

          # 4. Confirm the live isolated native Lovelace view is exactly one stock live camera card.
          dash=json.loads((B/'.storage/lovelace.dashboard_house_status').read_text())
          views=dash.get('data',{}).get('config',{}).get('views',[])
          view=next((v for v in views if v.get('path')=='doorbell'),None)
          cards=(view or {}).get('cards',[])
          ok=(len(cards)==1 and cards[0].get('type')=='picture-entity'
              and cards[0].get('entity')==entity and cards[0].get('camera_view')=='live')
          if not ok:
            raise SystemExit('STEP4_NATIVE_CAMERA_CARD=FAIL')
          print('STEP4_NATIVE_CAMERA_CARD=PASS')

          # 5. Confirm native dashboard ownership and its actual live route.
          regs=json.loads((B/'.storage/lovelace_dashboards').read_text()).get('data',{}).get('items',[])
          native=next((x for x in regs if x.get('id')=='dashboard_house_status'),None)
          if not native or native.get('url_path')!='house-status-native':
            raise SystemExit('STEP5_NATIVE_DASHBOARD=FAIL')
          try:
            with urllib.request.urlopen(BASE+'/house-status-native/doorbell',timeout=10) as response:
              if response.status!=200: raise SystemExit('STEP5_NATIVE_ROUTE=FAIL:'+str(response.status))
          except Exception as exc:
            raise SystemExit('STEP5_NATIVE_ROUTE=FAIL:'+type(exc).__name__)
          print('STEP5_NATIVE_DASHBOARD_ROUTE=PASS:200')

          # 6. Confirm House Status navigation points directly to the tested native view.
          shell=B/'www/house-status/lifeos-house-status-v28.js'
          source=shell.read_text()
          if "history.pushState(null,'','/house-status-native/doorbell')" not in source:
            raise SystemExit('STEP6_HOUSE_STATUS_NAVIGATION=FAIL')
          print('STEP6_HOUSE_STATUS_NAVIGATION=PASS')
          PY
