name: Doorbell Path Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/doorbell-path-diagnostic.yml'
      - 'homeassistant/www/house-status/lifeos-house-status-doorbell.js'
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe Doorbell path read-only
        run: |
          set -Eeuo pipefail
          sudo -n python3 - <<'PY'
          import json, pathlib, sqlite3, urllib.request, urllib.parse
          B=pathlib.Path('/opt/stacks/homeassistant/config')
          BASE='http://127.0.0.1:8123'
          entity='camera.front_door_live_view'

          # 1. Ring integration and enabled entity.
          reg=json.loads((B/'.storage/core.entity_registry').read_text())['data']['entities']
          entry=next((x for x in reg if x.get('entity_id')==entity),None)
          if not entry or entry.get('disabled_by') or entry.get('platform')!='ring':
            raise SystemExit('STEP1_RING_ENTITY=FAIL')
          print('STEP1_RING_ENTITY=PASS')

          # 2. Recorder state and stream capability, without logging camera URLs or IDs.
          db=B/'home-assistant_v2.db'
          con=sqlite3.connect(f'file:{db}?mode=ro',uri=True)
          row=con.execute("""select s.state,a.shared_attrs
            from states s join states_meta m on m.metadata_id=s.metadata_id
            left join state_attributes a on a.attributes_id=s.attributes_id
            where m.entity_id=? order by s.state_id desc limit 1""",(entity,)).fetchone()
          if not row:
            raise SystemExit('STEP2_CAMERA_STATE=FAIL')
          state,raw_attrs=row
          attrs=json.loads(raw_attrs) if raw_attrs else {}
          print('STEP2_CAMERA_STATE=PASS:'+str(state))
          feature_value=attrs.get('supported_features')
          stream_type=attrs.get('frontend_stream_type')
          safe_stream_type=stream_type if stream_type in ('hls','webrtc','web_rtc','mjpeg') else 'not_recorded'
          if feature_value is None:
            print('STEP3_STREAM_CAPABILITY=NOT_IN_RECORDER'
                  +':frontend_type='+safe_stream_type
                  +':video_url_present='+str(bool(attrs.get('video_url'))))
          else:
            try:
              stream_supported=bool(int(feature_value) & 2)
            except (TypeError,ValueError):
              stream_supported=False
            print('STEP3_STREAM_CAPABILITY='
                  +('RECORDED_SUPPORTED' if stream_supported else 'RECORDED_UNSUPPORTED')
                  +':frontend_type='+safe_stream_type
                  +':video_url_present='+str(bool(attrs.get('video_url'))))

          # 4. Fetch the current image if recorder exposes its camera URL. Otherwise
          # try the local camera proxy anonymously and report its authentication boundary.
          image_path=attrs.get('entity_picture')
          image_url=(urllib.parse.urljoin(BASE+'/',str(image_path)) if image_path
                     else BASE+'/api/camera_proxy/'+entity)
          if not image_path:
            print('STEP4_CAMERA_IMAGE_PATH=NOT_IN_RECORDER')
          try:
            with urllib.request.urlopen(image_url,timeout=20) as response:
              content_type=response.headers.get('Content-Type','').split(';',1)[0].lower()
              image=response.read()
              status=response.status
          except urllib.error.HTTPError as exc:
            if exc.code in (401,403):
              print('STEP4_CAMERA_IMAGE_FETCH=AUTH_REQUIRED:'+str(exc.code))
            else:
              raise SystemExit('STEP4_CAMERA_IMAGE_FETCH=FAIL:HTTP:'+str(exc.code))
          except Exception as exc:
            raise SystemExit('STEP4_CAMERA_IMAGE_FETCH=FAIL:'+type(exc).__name__)
          else:
            if status!=200 or not content_type.startswith('image/') or len(image)<256:
              raise SystemExit('STEP4_CAMERA_IMAGE_FETCH=FAIL:status='+str(status)+',type='+content_type+',bytes='+str(len(image)))
            print('STEP4_CAMERA_IMAGE_FETCH=PASS:'+content_type+':'+str(len(image))+'bytes')

          # 5. Confirm the live isolated native Lovelace view is exactly one stock live camera card.
          dash=json.loads((B/'.storage/lovelace.dashboard_house_status').read_text())
          views=dash.get('data',{}).get('config',{}).get('views',[])
          view=next((v for v in views if v.get('path')=='doorbell'),None)
          cards=(view or {}).get('cards',[])
          ok=(len(cards)==1 and cards[0].get('type')=='picture-entity'
              and cards[0].get('entity')==entity and cards[0].get('camera_view')=='live')
          if not ok:
            raise SystemExit('STEP5_NATIVE_CAMERA_CARD=FAIL')
          print('STEP5_NATIVE_CAMERA_CARD=PASS')

          # 6. Confirm native dashboard ownership and its actual live route.
          regs=json.loads((B/'.storage/lovelace_dashboards').read_text()).get('data',{}).get('items',[])
          native=next((x for x in regs if x.get('id')=='dashboard_house_status'),None)
          if not native or native.get('url_path')!='house-status-native':
            raise SystemExit('STEP6_NATIVE_DASHBOARD=FAIL')
          try:
            with urllib.request.urlopen(BASE+'/house-status-native/doorbell',timeout=10) as response:
              if response.status!=200: raise SystemExit('STEP6_NATIVE_ROUTE=FAIL:'+str(response.status))
          except Exception as exc:
            raise SystemExit('STEP6_NATIVE_ROUTE=FAIL:'+type(exc).__name__)
          print('STEP6_NATIVE_DASHBOARD_ROUTE=PASS:200')

          # 7. Confirm House Status navigation points directly to the tested native view.
          shell=B/'www/house-status/lifeos-house-status-v28.js'
          source=shell.read_text()
          if "history.pushState(null,'','/house-status-native/doorbell')" not in source:
            raise SystemExit('STEP7_HOUSE_STATUS_NAVIGATION=FAIL')
          print('STEP7_HOUSE_STATUS_NAVIGATION=PASS')

          # 8. Report the active panel config and installed asset versions.
          cfg=(B/'configuration.yaml').read_text()
          checks={
            'v27_panel_name':'name: lifeos-house-status-v27',
            'v28_panel_name':'name: lifeos-house-status-v28',
            'house_status_path':'url_path: house-status',
            'v28_module_url':'module_url: /local/house-status/lifeos-house-status-v28.js',
          }
          for label,marker in checks.items():
            print('STEP8_'+label.upper()+'='+str(cfg.count(marker)))
          v28=B/'www/house-status/lifeos-house-status-v28.js'
          v27=B/'www/house-status/lifeos-house-status-v27.js'
          print('STEP8_V28_FILE='+('PRESENT' if v28.is_file() else 'ABSENT'))
          print('STEP8_V27_FILE='+('PRESENT' if v27.is_file() else 'ABSENT'))
          if v28.is_file():
            print('STEP8_V28_FILE_MARKER='+('PASS' if 'Doorbell v28' in v28.read_text() else 'MISMATCH'))
          if v27.is_file():
            print('STEP8_V27_FILE_MARKER='+('PRESENT' if 'Doorbell v27' in v27.read_text() else 'OTHER'))
            print('STEP9_V27_RUNTIME_SOURCE_BEGIN')
            print(v27.read_text())
            print('STEP9_V27_RUNTIME_SOURCE_END')
          resources=json.loads((B/'.storage/lovelace_resources').read_text()).get('data',{}).get('items',[])
          v27_resources=[x for x in resources if 'v27' in str(x.get('url','')) and 'house-status' in str(x.get('url',''))]
          print('STEP8_V27_LOVELACE_RESOURCE_COUNT='+str(len(v27_resources)))
          try:
            with urllib.request.urlopen(BASE+'/local/house-status/lifeos-house-status-v28.js',timeout=10) as response:
              body=response.read().decode('utf-8','replace')
              print('STEP8_SERVED_V28='+('PASS' if response.status==200 and 'Doorbell v28' in body else 'MISMATCH'))
          except Exception as exc:
            print('STEP8_SERVED_V28=FAIL:'+type(exc).__name__)
          PY