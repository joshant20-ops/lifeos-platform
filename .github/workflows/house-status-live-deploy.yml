name: House Status Live Deploy
on:
  workflow_dispatch:
concurrency:
  group: house-status-panel-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy-verify:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile canonical checkout to main
        run: |
          git show HEAD:scripts/reconcile-canonical-checkout.py | python3 - /home/joshan/lifeos-platform
      - name: Deploy House Status
        run: sudo -n bash /home/joshan/lifeos-platform/scripts/lifeos-deploy-house-status-dashboard.sh
      - name: Discover live House Status runtime
        run: |
          sudo -n python3 /home/joshan/lifeos-platform/homeassistant/discover-house-status-entities.py | tee /tmp/house-status-discovery.json
          grep -q 'camera.front_door_live_view' /tmp/house-status-discovery.json
      - name: Live asset acceptance
        run: |
          set -Eeuo pipefail
          target=/opt/stacks/homeassistant/config/www/house-status/lifeos-house-status-v28.js
          legacy=/opt/stacks/homeassistant/config/www/house-status/lifeos-house-status-v27.js
          doorbell=/opt/stacks/homeassistant/config/www/house-status/lifeos-house-status-doorbell.js
          require_marker() {
            label=$1
            marker=$2
            file=$3
            if grep -Fq "$marker" "$file"; then
              echo "$label=PASS"
            else
              echo "$label=FAIL"
              exit 1
            fi
          }
          test -s "$doorbell"
          require_marker DOORBELL_DISK_SLOT 'data-doorbell-card' "$doorbell"
          require_marker DOORBELL_DISK_CAMERA 'camera.front_door_live_view' "$doorbell"
          require_marker DOORBELL_DISK_LIVE_VIEW "camera_view:'live'" "$doorbell"
          require_marker DOORBELL_DISK_HELPERS 'window.loadCardHelpers()' "$doorbell"
          require_marker DOORBELL_DISK_HEADER 'class="hanav"' "$target"
          require_marker HOUSE_STATUS_DISK_FREE_BAND 'band-free' "$target"
          require_marker HOUSE_STATUS_DISK_POWERDOWN_BAND 'band-powerdown' "$target"
          require_marker HOUSE_STATUS_DISK_JOINED_EVENTS 'joined_events' "$target"
          require_marker HOUSE_STATUS_DISK_FREE_LABEL 'Free electricity' "$target"
          served=$(mktemp)
          trap 'rm -f "$served"' EXIT
          curl -fsS --max-time 10 http://127.0.0.1:8123/local/house-status/lifeos-house-status-v28.js -o "$served"
          require_marker HOUSE_STATUS_LIVE_FREE_BAND 'band-free' "$served"
          require_marker HOUSE_STATUS_LIVE_POWERDOWN_BAND 'band-powerdown' "$served"
          echo HOUSE_STATUS_ENERGY_BANDS_LIVE=PASS
          curl -fsS --max-time 10 http://127.0.0.1:8123/local/house-status/lifeos-house-status-doorbell.js -o "$served"
          require_marker DOORBELL_LIVE_SLOT 'data-doorbell-card' "$served"
          require_marker DOORBELL_LIVE_CAMERA 'camera.front_door_live_view' "$served"
          require_marker DOORBELL_LIVE_LIVE_VIEW "camera_view:'live'" "$served"
          require_marker DOORBELL_LIVE_HELPERS 'createCardElement' "$served"
          curl -fsS --max-time 10 http://127.0.0.1:8123/local/house-status/lifeos-house-status-v27.js -o "$served"
          require_marker DOORBELL_V27_DISK_VERSION "Doorbell v27" "$legacy"
          require_marker DOORBELL_V27_LIVE_VERSION "Doorbell v27" "$served"
          require_marker DOORBELL_V27_LIVE_NAV 'this._mode=el.dataset.mode;this.render();' "$served"
          require_marker DOORBELL_V27_LIVE_TAG "lifeos-house-status-v27" "$served"
          require_marker DOORBELL_V27_CACHE_BUST_IMPORT "import './lifeos-house-status-doorbell.js?v=20261004-1';" "$legacy"
          curl -fsS --max-time 10 'http://127.0.0.1:8123/local/house-status/lifeos-house-status-doorbell.js?v=20261003-3' -o "$served"
          require_marker DOORBELL_V27_MODULE_LIVE_RENDER 'data-doorbell-card' "$served"
          require_marker DOORBELL_V27_MODULE_LIVE_CAMERA "camera_view:'live'" "$served"
          require_marker DOORBELL_V27_MODULE_LIVE_HELPERS 'createCardElement' "$served"
          require_marker DOORBELL_V27_MODULE_LIVE_FALLBACK 'Camera view could not load' "$served"
          echo DOORBELL_V27_ASSET_LIVE=PASS
          curl -fsS --max-time 10 'http://127.0.0.1:8123/local/house-status/lifeos-house-status-v28.js?v=doorbell-shell-20261004-1' -o "$served"
          require_marker HOUSE_STATUS_V28_CACHE_BUSTED_LIVE "Doorbell v28" "$served"
          echo HOUSE_STATUS_V28_ENTRYPOINT_CACHE_BUST=PASS
          echo DOORBELL_SHARED_HEADER_CAMERA_LIVE=PASS