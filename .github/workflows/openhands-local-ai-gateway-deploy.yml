name: Deploy OpenHands Local AI Gateway
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lifeos-pi5-control
  cancel-in-progress: false
jobs:
  deploy-and-accept:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 60
    steps:
      - name: Reconcile canonical checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo 'CANONICAL_CHECKOUT_NOT_READY=dirty'
            git status --short
            exit 20
          fi
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'CANONICAL_CHECKOUT_READY=PASS'

      - name: Deploy stable Pi inference endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          mkdir -p "$HOME/.config/systemd/user"
          cat >"$HOME/.config/systemd/user/lifeos-openhands-local-ai.service" <<'UNIT'
          [Unit]
          Description=LifeOS wake-aware stable AI endpoint
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=simple
          WorkingDirectory=/home/joshan/lifeos-platform
          ExecStart=/usr/bin/python3 /home/joshan/lifeos-platform/governor/openhands_local_ai_gateway.py
          Restart=on-failure
          RestartSec=3
          StandardOutput=append:%t/lifeos-openhands-local-ai.log
          StandardError=inherit
          [Install]
          WantedBy=default.target
          UNIT
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          gateway_log="$XDG_RUNTIME_DIR/lifeos-openhands-local-ai.log"
          if [[ -n "$(ss -Htn state established '( sport = :18114 )')" ]]; then
            echo 'DEPLOYMENT_BLOCKED=active_gateway_connections'
            exit 20
          fi
          install -m 0600 /dev/null "$gateway_log"
          systemctl --user daemon-reload
          systemctl --user enable lifeos-openhands-local-ai.service
          systemctl --user restart lifeos-openhands-local-ai.service
          for _ in $(seq 1 20); do curl -fsS --max-time 3 http://127.0.0.1:18114/health && break; sleep 1; done
          curl -fsS --max-time 5 http://127.0.0.1:18114/v1/models | grep -q 'gpt-oss:20b'
          curl -fsS --max-time 5 http://127.0.0.1:18114/v1/models | grep -q 'qwen2.5-coder:7b-instruct'
          curl -fsS --max-time 5 http://ai.lan:18114/v1/models | grep -q 'gpt-oss:20b'
          echo 'STABLE_AI_ENDPOINT_DEPLOY=PASS'


      - name: Verify stable gateway capabilities
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS --max-time 10 http://ai.lan:18114/api/tags |
            python3 -c 'import json,sys; names={m["name"] for m in json.load(sys.stdin)["models"]}; assert {"gpt-oss:20b","nomic-embed-text"} <= names'
          echo 'GATEWAY_MODEL_DISCOVERY=PASS'

      - name: Capture endpoint diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user status lifeos-openhands-local-ai.service --no-pager --full
          journalctl --user -u lifeos-openhands-local-ai.service -n 160 --no-pager -o short-iso
          tail -n 160 "$XDG_RUNTIME_DIR/lifeos-openhands-local-ai.log" || true
          curl -fsS --max-time 5 http://127.0.0.1:18114/health || true
          timeout 5 getent ahostsv4 ai.lan || true
          timeout 5 mosquitto_sub -h 127.0.0.1 -C 1 -t lifeos/tower/state
          systemctl status lifeos-tower-control.service lifeos-autonomous-agent.service lifeos-ha-issue-queue-bridge.service --no-pager --full
          journalctl -u lifeos-tower-control.service -n 120 --no-pager -o short-iso
