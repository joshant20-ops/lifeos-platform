name: LifeOS Direct OpenHands Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/test-direct-openhands.sh'
      - '.github/workflows/lifeos-openhands-action-smoke.yml'
  workflow_run:
    workflows: ['LifeOS Governor Broker Deploy']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: lifeos-direct-openhands-proof
  cancel-in-progress: true

jobs:
  direct-openhands:
    # Adapter changes deploy first. Never test repository source against an older
    # installed /usr/local/libexec runtime; that produced false 900s diagnostics
    # in runs 35528958465 and 35530512633.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 30
    steps:
      - name: Reconcile canonical checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git show origin/main:scripts/reconcile-canonical-checkout.py | python3 - /home/joshan/lifeos-platform
          echo "CANONICAL_HEAD=$(git rev-parse HEAD)"
          if ! cmp -s governor/scripts/lifeos-local-builder /usr/local/libexec/lifeos-local-builder; then
            echo 'INSTALLED_LOCAL_BUILDER_ALIGNMENT=FAIL'
            exit 1
          fi
          echo 'INSTALLED_LOCAL_BUILDER_ALIGNMENT=PASS'
      - name: Probe Engineer to Governor broker boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          bash scripts/test-engineer-governor-broker.sh
          # Fail-closed policy assertion: this acceptance probe must prove the private route stayed local.
          probe=$(curl -fsS --max-time 20 -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"Reply with exactly OK"}],"privacy":"local-only","task_class":"normal","max_tokens":8}' \
            http://127.0.0.1:8788/v1/chat/completions)
          PROBE_JSON="$probe" python3 -c "import json,os; j=json.loads(os.environ['PROBE_JSON']); assert j.get('lifeos_provider') == 'ollama', j; assert j.get('lifeos_privacy') == 'local-only', j; print('lifeos-local-only-normal=PASS')"
      - name: Run direct OpenHands isolation proof
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          bash scripts/test-direct-openhands.sh
      - name: Release Tower
        if: always()
        shell: bash
        run: |
          set +e
          mosquitto_pub -h 127.0.0.1 -t lifeos/tower/power/set -m OFF
          echo 'TOWER_RELEASE_REQUESTED=PASS'
