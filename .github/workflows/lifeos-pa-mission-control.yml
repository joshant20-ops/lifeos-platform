name: LifeOS PA Mission Control

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-pa-mission-control.yml'
      - 'deploy-triggers/issue-935-level2'
  workflow_dispatch:
    inputs:
      target_issue:
        description: 'GitHub issue number (759 keeps the legacy benchmark)'
        required: false
        default: '759'
        type: string
      target_objective:
        description: 'Trusted issue-derived objective for non-759 targeted runs'
        required: false
        default: ''
        type: string
      canonical_assertions:
        description: 'Optional JSON canonical assertions for Governor'
        required: false
        default: ''
        type: string
      mode:
        description: 'Runner mode'
        required: true
        default: 'run'
        type: choice
        options: [run, resume, audit, status]

permissions:
  contents: read

concurrency:
  group: lifeos-pa-mission-control
  cancel-in-progress: false

jobs:
  control:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 25
    steps:
      - name: Safely synchronize canonical Pi checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          test -z "$(git status --porcelain --untracked-files=all)" || { echo RESULT=BLOCKED; echo REASON=canonical_checkout_dirty; exit 20; }
          current=$(git rev-parse HEAD); target=$(git rev-parse origin/main)
          if [[ "$current" != "$target" ]]; then
            git merge-base --is-ancestor "$current" "$target" || { echo RESULT=BLOCKED; echo REASON=canonical_checkout_not_fast_forwardable; exit 21; }
            git merge --ff-only origin/main
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo CANONICAL_SYNC=PASS

      - name: Ensure runner is current
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          SRC=governor/scripts/lifeos-pa-mission; DEST=/home/joshan/.local/bin/lifeos-pa-mission
          python3 -m py_compile "$SRC"
          install -d -m 0755 /home/joshan/.local/bin
          install -d -m 0700 /home/joshan/.local/state/lifeos-pa-autonomy
          if [[ ! -x "$DEST" ]] || ! cmp -s "$SRC" "$DEST"; then install -m 0755 "$SRC" "$DEST"; fi
          echo "RUNNER_SHA256=$(sha256sum "$DEST" | awk '{print $1}')"

      - name: Preflight mission controller
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e; /home/joshan/.local/bin/lifeos-pa-mission audit; rc=$?; set -e
          echo "AUDIT_RUNNER_RC=$rc"; [[ "$rc" == 0 || "$rc" == 20 ]]

      - name: Run governed issue mission
        shell: bash
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'run' }}
          DISPATCH_TARGET_ISSUE: ${{ inputs.target_issue }}
          DISPATCH_TARGET_OBJECTIVE: ${{ inputs.target_objective }}
          DISPATCH_CANONICAL_ASSERTIONS: ${{ inputs.canonical_assertions }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            export LIFEOS_PA_TARGET_ISSUE="$DISPATCH_TARGET_ISSUE"
            export LIFEOS_PA_TARGET_OBJECTIVE="$DISPATCH_TARGET_OBJECTIVE"
            export LIFEOS_PA_CANONICAL_ASSERTIONS="$DISPATCH_CANONICAL_ASSERTIONS"
          else
            export LIFEOS_PA_TARGET_ISSUE=935
            export LIFEOS_PA_TARGET_OBJECTIVE='Diagnose and fix the tiny real hardware-inventory status-contract bug described by issue #935. A deterministic failing acceptance test has been supplied by the harness. Inspect the repository and test failure yourself, determine the cause, make the smallest appropriate repository change, and run focused regression verification. Do not add issue-specific Governor logic.'
            export LIFEOS_PA_CANONICAL_ASSERTIONS='[{"id":"inventory-status-contract","kind":"tracked_text_contains","path":"docs/operations/available-hardware.md","value":"| laptop-board-01 | Candidate / details required |"}]'
          fi
          STATE=/home/joshan/.local/state/lifeos-pa-autonomy
          mkdir -p "$STATE"; rm -f "$STATE/github-mission.log" "$STATE/github-mission.rc"
          set +e
          timeout --signal=TERM --kill-after=30s 20m /home/joshan/.local/bin/lifeos-pa-mission "$MODE" 2>&1 | tee "$STATE/github-mission.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" >"$STATE/github-mission.rc"
          echo "MISSION_RUNNER_RC=$rc"
          if [[ "$rc" == 124 || "$rc" == 137 || "$rc" == 143 ]]; then echo RESULT=BLOCKED; echo REASON=governed_issue_mission_timeout; exit 40; fi
          case "$rc" in 0) echo GOVERNOR_TERMINAL_CONTRACT=PASS ;; 20|30|40) exit "$rc" ;; *) exit "$rc" ;; esac

      - name: Verify archived disposition evidence
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'run' || inputs.mode == 'resume')
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          STATE=/home/joshan/.local/state/lifeos-pa-autonomy
          grep -q 'RESULT=PASS' "$STATE/github-mission.log"
          grep -q 'TARGETED_ISSUE_ACCEPTANCE=PASS' "$STATE/github-mission.log"
          target_issue=$(grep '^TARGET_ISSUE=' "$STATE/github-mission.log" | tail -1 | cut -d= -f2); test -n "$target_issue"
          grep -q "ISSUE_DISPOSITIONS=#$target_issue ready_for_evidence_backed_closure" "$STATE/github-mission.log"
          job_id=$(grep '^GOVERNOR_JOB_ID=' "$STATE/github-mission.log" | tail -1 | cut -d= -f2); test -n "$job_id"
          LIFEOS_JOB_ID_FILTER="$job_id" bash governor/scripts/export-lifeos-job-records.sh
          git -C /home/joshan/lifeos-jobs fetch origin refs/heads/main >/dev/null
          remote_main=$(git -C /home/joshan/lifeos-jobs rev-parse FETCH_HEAD)
          python3 - "$job_id" /home/joshan/lifeos-jobs "$remote_main" <<'PY'
          import json, subprocess, sys
          job_id, repo, remote_main = sys.argv[1:]
          record=json.loads(subprocess.check_output(["git","-C",repo,"show",f"{remote_main}:jobs/{job_id}.json"],text=True))
          assert record["id"] == job_id and record["status"] == "PASS" and record["stage"] == "complete"
          assert record["privacy"] == "local-only" and record["request"] == "[LOCAL-ONLY REQUEST REDACTED]"
          assert record["started_at"] and record["completed_at"]
          iterations=record.get("iterations") or []; assert iterations and iterations[-1]["verdict"] == "PASS"
          assert all(item.get("iteration") == index for index,item in enumerate(iterations,start=1))
          PY
          git -C /home/joshan/lifeos-jobs cat-file -e "$remote_main:jobs/$job_id.json"
          echo "ARCHIVED_JOB_RECORD=$job_id"; echo ARCHIVED_DISPOSITION_CONTRACT=PASS

      - name: Surface consolidated bundle
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          STATE=/home/joshan/.local/state/lifeos-pa-autonomy
          [[ ! -f "$STATE/WORK_BUNDLE.md" ]] || { echo '--- WORK_BUNDLE.md ---'; cat "$STATE/WORK_BUNDLE.md"; }
          [[ ! -f "$STATE/SUMMARY.md" ]] || { echo '--- SUMMARY.md ---'; cat "$STATE/SUMMARY.md"; }
