name: Mosquitto verified retained copy reclaim
on:
  pull_request:
    paths:
      - .github/workflows/storage-mqtt-verified-reclaim.yml
      - governor/mqtt_live_disposal.py
      - governor/mqtt_retained_log_disposal.py
      - tests/test_mqtt_retained_log_disposal.py
      - scripts/lifeos-mqtt-verified-reclaim.sh
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          set -Eeuo pipefail
          bash -n scripts/lifeos-mqtt-verified-reclaim.sh
          python3 -B -c 'from tests.test_lifeos_deploy_gateway import test_mqtt_reclaim_scope_rejects_arguments as check; check()'
          python3 -B -m unittest -v tests.test_mqtt_retained_log_disposal tests.test_mqtt_retained_rotation tests.test_storage_health_gate
