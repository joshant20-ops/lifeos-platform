name: Repair Important Info Paperless credential
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lifeos-important-info-credential-repair.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    steps:
      - name: Rotate service credential and verify
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          docker exec paperless-paperless-1 python3 manage.py shell -c '
          from django.contrib.auth import get_user_model
          from rest_framework.authtoken.models import Token
          u=get_user_model().objects.filter(is_superuser=True,is_active=True).order_by("id").first()
          assert u
          Token.objects.filter(user=u).delete()
          print(Token.objects.create(user=u).key)
          ' | tail -n 1 > "$tmp"
          test -s "$tmp"
          sudo -n install -o root -g root -m 0600 "$tmp" /etc/lifeos/secrets/paperless-api-token
          sudo -n systemctl reset-failed lifeos-important-info-refresh.service || true
          sudo -n systemctl start lifeos-important-info-refresh.service
          test "$(systemctl show -p Result --value lifeos-important-info-refresh.service)" = success
          echo IMPORTANT_INFO_REFRESH=PASS
