name: OpenHands Canvas File Trace

on:
  push:
    branches: [main]
    paths: ['.github/workflows/openhands-canvas-trace.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 5
    steps:
      - name: Trace acceptance file end to end
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes Engineer 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cid32="9a36222cb4d34973a8f54da325026c8c"
          cid_uuid="${cid32:0:8}-${cid32:8:4}-${cid32:12:4}-${cid32:16:4}-${cid32:20:12}"
          echo '=== CONTAINER / IMAGE ==='
          docker inspect lifeos-agent-canvas --format 'image={{.Config.Image}} status={{.State.Status}}'
          echo '=== WORKSPACE PATHS ==='
          docker exec lifeos-agent-canvas sh -c "for p in /home/openhands/workspace/project/$cid32 /home/openhands/workspace/project/$cid_uuid /workspace/project/$cid32 /workspace/project/$cid_uuid; do echo PATH=\$p; if test -e \"\$p\"; then ls -la \"\$p\"; else echo MISSING; fi; done"
          echo '=== FIND FILE ==='
          docker exec lifeos-agent-canvas sh -c "find /home/openhands /workspace /projects -name canvas-acceptance.txt -print 2>/dev/null || true"
          echo '=== RESTORE ACCEPTANCE FILE ==='
          docker exec lifeos-agent-canvas sh -c "printf '%s\\n' 'Agent Canvas functional acceptance PASS' > '/home/openhands/workspace/project/$cid32/canvas-acceptance.txt'"
          restored="$(docker exec lifeos-agent-canvas cat "/home/openhands/workspace/project/$cid32/canvas-acceptance.txt")"
          test "$restored" = 'Agent Canvas functional acceptance PASS'
          echo ACCEPTANCE_FILE_RESTORED=PASS
          echo '=== WORKSPACE SESSION COOKIE ==='
          api_key="$(docker exec lifeos-agent-canvas sh -c 'cat /home/openhands/.openhands/agent-server/api_key 2>/dev/null || true')"
          if test -n "$api_key"; then
            curl -sS -D /tmp/ws_headers -o /tmp/ws_body -X POST \
              -H 'Host: 192.168.0.204:8000' \
              -H 'Origin: http://192.168.0.204:8000' \
              -H "X-Session-API-Key: $api_key" \
              http://127.0.0.1:8000/api/auth/workspace-session >/dev/null
            grep -i '^set-cookie:' /tmp/ws_headers | sed -E 's/(oh_workspace_session_key=)[^;]+/\\1<redacted>/I' || true
          else
            echo 'API_KEY_PATH_NOT_FOUND'
          fi
          echo '=== ROUTES WITHOUT AUTH ==='
          for cid in "$cid32" "$cid_uuid"; do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' "http://127.0.0.1:8000/api/conversations/$cid/workspace/canvas-acceptance.txt" || true)
            echo "cid=$cid status=$code bytes=$(wc -c </tmp/body)"
            head -c 300 /tmp/body | tr '\n' ' '; echo
          done
          echo '=== CONVERSATION RUNTIME TRACE ==='
          docker logs --since 30m lifeos-agent-canvas 2>&1 | grep -E '9a36222c|execute_bash_command|workspace|working_dir' | tail -300 || true
          echo '=== PERSISTED STATE LOCATIONS ==='
          docker exec lifeos-agent-canvas sh -c "find /home/openhands/.openhands -maxdepth 5 -type f -print 2>/dev/null | sort | head -300"
          echo '=== RECENT ROUTE LOGS ==='
          docker logs --since 30m lifeos-agent-canvas 2>&1 | grep -Ei 'workspace|canvas-acceptance|401|404|422|500|workspace-session' | tail -200 || true
          REMOTE
