name: LifeOS Level3 Diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lifeos-level3-diagnostic.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    steps:
      - name: Surface sanitized failed Level3 evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          job=json.load(urllib.request.urlopen("http://127.0.0.1:8790/jobs/d312bf8bd7c9", timeout=10))
          print("JOB", job.get("id"), job.get("status"), job.get("stage"), job.get("blocked_reason"))
          for it in job.get("iterations") or []:
              print("ITERATION", it.get("iteration"), "RC", it.get("builder_rc"), "RESULT", it.get("iteration_result"))
              print("VERIFICATION", json.dumps(it.get("verification"), sort_keys=True))
              print("EVIDENCE_BEGIN")
              print((it.get("evidence") or "")[-20000:])
              print("EVIDENCE_END")
          PY
