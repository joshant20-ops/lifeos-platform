name: Live audit batch 061-078 runtime ownership
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lifeos-live-audit-061-078.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 12
    steps:
      - name: Align canonical
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          test -z "$(git status --porcelain --untracked-files=all)"
          git merge --ff-only origin/main
          echo "AUDIT_HEAD=$(git rev-parse HEAD)"
      - name: Live runtime ownership
        run: |
          set -Eeuo pipefail
          echo '=== CURRENT CONTROL PLANE ==='
          systemctl is-active lifeos-autonomous-agent.service
          systemctl is-active lifeos-engineer.service
          systemctl is-active lifeos-ha-issue-queue-bridge.service
          systemctl is-active lifeos-tower-control.service
          echo '=== RETIRED RELAY ABSENCE ==='
          ! systemctl list-unit-files --no-legend | awk '{print $1}' | grep -Eq '^lifeos-(pi-control|job-publisher)\.(service|timer)$'
          test ! -e /etc/systemd/system/lifeos-pi-control.service
          test ! -e /etc/systemd/system/lifeos-job-publisher.service
          echo RETIRED_RELAY=ABSENT
          echo '=== CANONICAL CHECKOUT ==='
          cd /home/joshan/lifeos-platform
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo CANONICAL_CHECKOUT=PASS
          echo '=== RUNTIME STATE ==='
          test -d /var/lib/lifeos-agent
          find /var/lib/lifeos-agent -maxdepth 2 -type d -printf '%p\n' | sort | head -80
          echo RUNTIME_STATE_OUTSIDE_GIT=PASS
      - name: Current contract tests
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          python3 -m unittest -v             tests.test_job_publisher_fifo             tests.test_github_sync_protection             tests.test_snapshot_protected_drift             tests.test_control_runtime_ownership_migration             tests.test_legacy_residue_cleaner             tests.test_historical_stale_activation_wrapper             tests.test_current_engineer_activation             tests.test_engineer_source_safety_diagnostic             tests.test_engineer_runtime_health_diagnostic             tests.test_engineer_runtime_contracts             tests.test_canonical_checkout_reconcile             tests.test_engineer_terminal_policy             tests.test_step11_live_terminal_policy_diagnostic             tests.test_step11_live_closure
          echo BATCH_061_078_CONTRACTS=PASS
      - name: Final current-state gate
        run: |
          set -Eeuo pipefail
          ! systemctl --failed --no-legend | grep -E 'lifeos-(pi-control|job-publisher)'
          echo BATCH_061_078_LIVE=PASS
