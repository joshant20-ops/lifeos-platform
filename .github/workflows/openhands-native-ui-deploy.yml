name: OpenHands Native UI Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/openhands-native-ui-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 20
    steps:
      - name: Migrate accepted Canvas state from Engineer to Pi5
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname)" == "Docker" ]]
          image="ghcr.io/openhands/agent-canvas:1.23.0"
          cid32="9a36222cb4d34973a8f54da325026c8c"
          expected="Agent Canvas functional acceptance PASS"

          docker version >/dev/null
          docker pull "$image"

          # Engineer remains the rollback source. Quiesce it before taking the
          # final state copy so conversation metadata and workspace are coherent.
          ssh -o BatchMode=yes -o ConnectTimeout=4 Engineer true
          ssh Engineer 'systemctl --user stop lifeos-openhands-tls.service lifeos-openhands-ui.service || true'

          rollback_source() {
            ssh Engineer 'systemctl --user start lifeos-openhands-ui.service lifeos-openhands-tls.service || true' || true
          }
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then rollback_source; fi; exit "$rc"' EXIT

          # Keep any pre-existing Pi state as a timestamped rollback snapshot.
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="$HOME/openhands-pre-migration-$stamp"
          mkdir -p "$backup"
          for d in .openhands workspace lifeos-projects lifeos-canvas-tls; do
            if test -e "$HOME/$d"; then cp -a "$HOME/$d" "$backup/$d"; fi
          done

          mkdir -p "$HOME/.openhands" "$HOME/workspace" "$HOME/lifeos-projects" "$HOME/.config/systemd/user" "$HOME/lifeos-canvas-tls"

          # Copy the accepted persistent state without sudo and without modifying
          # the Engineer source. TLS is regenerated for the Pi identity below.
          for d in .openhands workspace lifeos-projects; do
            rm -rf "$HOME/$d"
            mkdir -p "$HOME/$d"
            # Mounts are container-owned; read through a one-shot stock container.
            ssh Engineer "docker run --rm --user root -v \$HOME/$d:/source:ro --entrypoint /bin/tar $image -C /source -cf - ." | tar -C "$HOME/$d" -xf -
          done

          test -f "$HOME/workspace/project/$cid32/canvas-acceptance.txt"
          test "$(cat "$HOME/workspace/project/$cid32/canvas-acceptance.txt")" = "$expected"

          # Repair bind ownership using the stock image; no host sudo and no
          # OpenHands application patching.
          docker run --rm --user root \
            -v "$HOME/.openhands:/state" \
            -v "$HOME/lifeos-projects:/projects" \
            -v "$HOME/workspace:/workspace" \
            --entrypoint /bin/sh "$image" \
            -c 'chown -R openhands:openhands /state /projects /workspace'

          cat >"$HOME/.config/systemd/user/lifeos-openhands-ui.service" <<'UNIT'
          [Unit]
          Description=LifeOS OpenHands Agent Canvas (stock upstream, Pi5)
          After=network-online.target docker.service
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStartPre=-/usr/bin/docker rm -f lifeos-agent-canvas
          ExecStart=/usr/bin/docker run --name lifeos-agent-canvas --network host -v %h/.openhands:/home/openhands/.openhands -v %h/workspace:/home/openhands/workspace -v %h/lifeos-projects:/projects ghcr.io/openhands/agent-canvas:1.23.0
          ExecStop=/usr/bin/docker stop -t 20 lifeos-agent-canvas
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=default.target
          UNIT

          pi_ip="$(hostname -I | tr ' ' '\n' | grep -E '^192\.168\.' | head -1)"
          test -n "$pi_ip"
          rm -f "$HOME/lifeos-canvas-tls/cert.pem" "$HOME/lifeos-canvas-tls/key.pem"
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 825 \
            -keyout "$HOME/lifeos-canvas-tls/key.pem" \
            -out "$HOME/lifeos-canvas-tls/cert.pem" \
            -subj "/CN=$pi_ip" \
            -addext "subjectAltName=IP:$pi_ip"
          chmod 600 "$HOME/lifeos-canvas-tls/key.pem"

          cat >"$HOME/.config/systemd/user/lifeos-openhands-tls.service" <<'UNIT'
          [Unit]
          Description=LifeOS Agent Canvas HTTPS ingress (Pi5)
          After=network-online.target docker.service lifeos-openhands-ui.service
          Wants=network-online.target lifeos-openhands-ui.service

          [Service]
          Type=simple
          ExecStartPre=-/usr/bin/docker rm -f lifeos-agent-canvas-tls
          ExecStart=/usr/bin/docker run --name lifeos-agent-canvas-tls --network host -v %h/lifeos-canvas-tls:/tls:ro nginx:1.29-alpine sh -c 'printf "server { listen 8443 ssl; ssl_certificate /tls/cert.pem; ssl_certificate_key /tls/key.pem; location / { proxy_pass http://127.0.0.1:8000; proxy_http_version 1.1; proxy_set_header Host \\$host; proxy_set_header X-Forwarded-Host \\$host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For \\$proxy_add_x_forwarded_for; proxy_set_header Upgrade \\$http_upgrade; proxy_set_header Connection \"upgrade\"; } }" > /etc/nginx/conf.d/default.conf && exec nginx -g "daemon off;"'
          ExecStop=/usr/bin/docker stop -t 20 lifeos-agent-canvas-tls
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=default.target
          UNIT

          # GitHub runner has no login-session environment. Point systemctl at
          # the Pi user's persistent user manager explicitly.
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          test -S "$XDG_RUNTIME_DIR/bus"
          systemctl --user daemon-reload
          systemctl --user enable lifeos-openhands-ui.service lifeos-openhands-tls.service
          systemctl --user restart lifeos-openhands-ui.service
          systemctl --user restart lifeos-openhands-tls.service

          for _ in $(seq 1 60); do
            curl -fsS --connect-timeout 2 http://127.0.0.1:8000/canvas/ >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/canvas/ >/dev/null
          curl -fsS http://127.0.0.1:18000/alive >/dev/null
          curl -kfsS https://127.0.0.1:8443/canvas/ >/dev/null

          # Acceptance before restart.
          test "$(cat "$HOME/workspace/project/$cid32/canvas-acceptance.txt")" = "$expected"
          grep -R -q '"'"'"execution_status"'"'"'.*'"'"'"finished"'"'"' "$HOME/.openhands/agent-canvas/conversations" || {
            echo "accepted conversation metadata no longer contains execution_status=finished"
            exit 31
          }

          mounts="$(docker inspect lifeos-agent-canvas --format '{{range .Mounts}}{{println .Destination}}{{end}}')"
          printf '%s\n' "$mounts" | grep -qx '/home/openhands/.openhands'
          printf '%s\n' "$mounts" | grep -qx '/home/openhands/workspace'
          printf '%s\n' "$mounts" | grep -qx '/projects'
          test "$(printf '%s\n' "$mounts" | wc -l)" -eq 3

          # Required persistence proof: restart/redeploy once and re-check the
          # accepted conversation's exact workspace content.
          systemctl --user restart lifeos-openhands-ui.service
          systemctl --user restart lifeos-openhands-tls.service
          for _ in $(seq 1 60); do
            curl -kfsS --connect-timeout 2 https://127.0.0.1:8443/canvas/ >/dev/null 2>&1 && break
            sleep 2
          done
          curl -kfsS https://127.0.0.1:8443/canvas/ >/dev/null
          test "$(cat "$HOME/workspace/project/$cid32/canvas-acceptance.txt")" = "$expected"

          echo "OPENHANDS_PI5_MIGRATION=PASS"
          echo "OPENHANDS_STOCK_UPSTREAM_DEPLOYMENT=PASS"
          echo "OPENHANDS_ACCEPTANCE_PERSISTENCE=PASS"
          echo "OPENHANDS_UI_URL=https://$pi_ip:8443/canvas/"
          echo "ENGINEER_OPENHANDS=DISABLED_ROLLBACK_RETAINED"

          # Success: leave Engineer Canvas stopped but intact for rollback.
          trap - EXIT
