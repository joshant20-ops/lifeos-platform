name: OpenHands Native UI Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/openhands-native-ui-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 15
    steps:
      - name: Ensure Engineer reachable
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! ssh -o BatchMode=yes -o ConnectTimeout=4 Engineer true 2>/dev/null; then
            for helper in /usr/local/sbin/lifeos-engineer-wake /usr/local/sbin/lifeos-tower-wake /usr/local/bin/lifeos-engineer-wake; do
              if test -x "$helper"; then "$helper"; break; fi
            done
            mosquitto_pub -h 127.0.0.1 -t lifeos/tower/power/set -m ON || true
            for _ in $(seq 1 90); do ssh -o BatchMode=yes -o ConnectTimeout=4 Engineer true 2>/dev/null && exit 0; sleep 5; done
            exit 20
          fi

      - name: Deploy stock Agent Canvas
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes Engineer 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          image="ghcr.io/openhands/agent-canvas:1.23.0"
          docker version >/dev/null
          docker pull "$image"

          # Persist Canvas state, projects, and the OpenHands workspace on the Engineer VM.
          mkdir -p "$HOME/.openhands" "$HOME/lifeos-projects" "$HOME/workspace" "$HOME/.config/systemd/user"
          test -d "$HOME/lifeos-platform/.git" && ln -sfn "$HOME/lifeos-platform" "$HOME/lifeos-projects/lifeos-platform" || true

          # Repair legacy bind-mount ownership once; no application files are patched.
          docker run --rm --user root             -v "$HOME/.openhands:/state"             -v "$HOME/lifeos-projects:/projects"             -v "$HOME/workspace:/workspace"             --entrypoint /bin/sh "$image"             -c 'chown -R openhands:openhands /state /projects /workspace'

          cat >"$HOME/.config/systemd/user/lifeos-openhands-ui.service" <<'UNIT'
          [Unit]
          Description=LifeOS OpenHands Agent Canvas (stock upstream)
          After=network-online.target docker.service
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStartPre=-/usr/bin/docker rm -f lifeos-agent-canvas
          ExecStart=/usr/bin/docker run --name lifeos-agent-canvas --network host -v %h/.openhands:/home/openhands/.openhands -v %h/workspace:/home/openhands/workspace -v %h/lifeos-projects:/projects ghcr.io/openhands/agent-canvas:1.23.0
          ExecStop=/usr/bin/docker stop -t 20 lifeos-agent-canvas
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=default.target
          UNIT

          systemctl --user daemon-reload
          systemctl --user enable lifeos-openhands-ui.service
          systemctl --user restart lifeos-openhands-ui.service

          for _ in $(seq 1 60); do
            curl -fsS --connect-timeout 2 http://127.0.0.1:8000/canvas/ >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/canvas/ >/dev/null
          curl -fsS http://127.0.0.1:18000/alive >/dev/null

          # Remove superseded runtime-patch artifacts; stock container does not mount them.
          rm -rf "$HOME/lifeos-canvas-frontend" "$HOME/lifeos-canvas-overrides"
          # The retired workspace was owned by the container UID. Remove it via
          # a one-shot root container (scripts-only policy; no host sudo).
          if test -d "$HOME/lifeos-canvas-workspace"; then
            docker run --rm --user root -v "$HOME:/host-home" --entrypoint /bin/sh "$image" -c 'rm -rf /host-home/lifeos-canvas-workspace'
          fi
          # Prove there are no LifeOS runtime overlays left.
          mounts="$(docker inspect lifeos-agent-canvas --format '{{range .Mounts}}{{println .Destination}}{{end}}')"
          printf '%s\n' "$mounts" | grep -qx '/home/openhands/.openhands'
          printf '%s\n' "$mounts" | grep -qx '/home/openhands/workspace'
          printf '%s\n' "$mounts" | grep -qx '/projects'
          test "$(printf '%s\n' "$mounts" | wc -l)" -eq 3
          test ! -e "$HOME/lifeos-canvas-frontend"
          test ! -e "$HOME/lifeos-canvas-overrides"
          echo OPENHANDS_STOCK_UPSTREAM_DEPLOYMENT=PASS
          echo OPENHANDS_AGENT_CANVAS_UI=PASS
          REMOTE

      - name: Verify UI from Pi LAN
        shell: bash
        run: |
          set -Eeuo pipefail
          code=$(curl -sS -o /tmp/openhands-ui.html -w '%{http_code}' --connect-timeout 3 http://192.168.0.204:8000/canvas/)
          [[ "$code" =~ ^(200|302|307)$ ]]
          echo "OPENHANDS_UI_URL=http://192.168.0.204:8000/canvas/"
          echo "OPENHANDS_UI_HTTP=$code"
