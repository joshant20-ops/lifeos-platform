name: OpenHands Native UI Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/openhands-native-ui-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 15
    steps:
      - name: Ensure Engineer reachable
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! ssh -o BatchMode=yes -o ConnectTimeout=4 Engineer true 2>/dev/null; then
            for helper in /usr/local/sbin/lifeos-engineer-wake /usr/local/sbin/lifeos-tower-wake /usr/local/bin/lifeos-engineer-wake; do
              if test -x "$helper"; then "$helper"; break; fi
            done
            mosquitto_pub -h 127.0.0.1 -t lifeos/tower/power/set -m ON || true
            for _ in $(seq 1 90); do ssh -o BatchMode=yes -o ConnectTimeout=4 Engineer true 2>/dev/null && exit 0; sleep 5; done
            exit 20
          fi
      - name: Inspect native web command
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes Engineer 'export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"; openhands web --help'
      - name: Deploy current upstream Agent Canvas
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes Engineer 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          docker version >/dev/null
          ollama_url="http://192.168.0.201:11434"
          models=$(curl -fsS --connect-timeout 5 "$ollama_url/api/tags")
          MODELS="$models" python3 - <<'PY'
          import json, os
          names={m.get("name") for m in json.loads(os.environ["MODELS"]).get("models", [])}
          assert "qwen2.5-coder:7b-instruct" in names, names
          print("OPENHANDS_DIRECT_OLLAMA_MODEL=PASS")
          PY
          mkdir -p "$HOME/.openhands" "$HOME/lifeos-projects" "$HOME/lifeos-canvas-workspace/project" "$HOME/.config/systemd/user"
          # Canvas creates per-conversation workspaces beneath project/. The bind
          # mount must remain writable by the container's openhands user.
          docker run --rm --user root \
            -v "$HOME/lifeos-canvas-workspace:/workspace" \
            --entrypoint /bin/sh ghcr.io/openhands/agent-canvas:1.23.0 \
            -c 'mkdir -p /workspace/project && chown -R openhands:openhands /workspace'
          docker run --rm --user openhands \
            -v "$HOME/lifeos-canvas-workspace:/workspace" \
            --entrypoint /bin/sh ghcr.io/openhands/agent-canvas:1.23.0 \
            -c "printf '%s\\n' 'Agent Canvas functional acceptance PASS' > /workspace/project/canvas-acceptance.txt"
          # Keep the canonical repository available to Agent Canvas without granting
          # the container the whole Engineer home directory.
          test -d "$HOME/lifeos-platform/.git" && ln -sfn "$HOME/lifeos-platform" "$HOME/lifeos-projects/lifeos-platform" || true
          docker pull ghcr.io/openhands/agent-canvas:1.23.0
          # Agent Canvas 1.23.0 emits SameSite=None without Secure on LAN HTTP.
          # Prepare a browser-facing proxy override before the service starts.
          mkdir -p "$HOME/lifeos-canvas-overrides"
          docker rm -f lifeos-canvas-extract >/dev/null 2>&1 || true
          docker create --name lifeos-canvas-extract ghcr.io/openhands/agent-canvas:1.23.0 >/dev/null
          docker cp lifeos-canvas-extract:/opt/agent-canvas/proxy-utils.mjs "$HOME/lifeos-canvas-overrides/proxy-utils.mjs"
          docker rm lifeos-canvas-extract >/dev/null
          python3 -c 'from pathlib import Path; p=Path.home()/"lifeos-canvas-overrides/proxy-utils.mjs"; s=p.read_text(); marker="  const metrics = {"; hook="  proxy.on(\"proxyRes\", (proxyRes, req) => { if (matchesPathPrefix(req.url ?? \"/\", \"/api/auth/workspace-session\") && Array.isArray(proxyRes.headers[\"set-cookie\"])) proxyRes.headers[\"set-cookie\"] = proxyRes.headers[\"set-cookie\"].map((c) => c.toLowerCase().includes(\"samesite=none\") && !c.toLowerCase().includes(\"; secure\") ? c.replace(/SameSite=None/gi, \"SameSite=Lax\") : c); });\n\n"; p.write_text(s if hook in s else s.replace(marker,hook+marker,1))'
          # A prior container left the persistent bind mount unwritable by the
          # image's non-root openhands user. Repair ownership from a short-lived
          # root container rather than requiring host sudo.
          docker run --rm --user root \
            -v "$HOME/.openhands:/state" \
            --entrypoint /bin/sh ghcr.io/openhands/agent-canvas:1.23.0 \
            -c 'mkdir -p /state/agent-canvas/conversations /state/agent-canvas/bash_events /state/automation /state/storage /state/workspaces && chown -R openhands:openhands /state'
          cat >"$HOME/.config/systemd/user/lifeos-openhands-ui.service" <<'UNIT'
          [Unit]
          Description=LifeOS OpenHands Agent Canvas 1.23.0
          After=network-online.target docker.service
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStartPre=-/usr/bin/docker rm -f lifeos-agent-canvas
          ExecStart=/usr/bin/docker run --name lifeos-agent-canvas --network host -e AGENT_SERVER_PORT=11800 -v %h/lifeos-canvas-overrides/proxy-utils.mjs:/opt/agent-canvas/proxy-utils.mjs:ro -v %h/.openhands:/home/openhands/.openhands -v %h/lifeos-canvas-workspace:/home/openhands/workspace -v %h/lifeos-projects:/projects ghcr.io/openhands/agent-canvas:1.23.0
          ExecStop=/usr/bin/docker stop -t 20 lifeos-agent-canvas
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=default.target
          UNIT
          systemctl --user daemon-reload
          # enable --now does not restart an already-active unit after its definition changes.
          # Explicit restart is required to replace the legacy CLI process with Agent Canvas.
          systemctl --user enable lifeos-openhands-ui.service
          systemctl --user restart lifeos-openhands-ui.service
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS --connect-timeout 2 http://127.0.0.1:8000/canvas/ >/dev/null 2>&1; then ready=1; break; fi
            if ! systemctl --user is-active --quiet lifeos-openhands-ui.service; then break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo '=== CANVAS SERVICE ==='
            systemctl --user --no-pager --full status lifeos-openhands-ui.service || true
            echo '=== CANVAS CONTAINER ==='
            docker ps -a --filter name=lifeos-agent-canvas --no-trunc || true
            docker inspect lifeos-agent-canvas --format 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' || true
            echo '=== CANVAS LOGS ==='
            docker logs --tail 250 lifeos-agent-canvas 2>&1 || true
            exit 20
          fi
          curl -fsS http://127.0.0.1:8000/canvas/ >/dev/null
          if ! curl -fsS --connect-timeout 3 http://127.0.0.1:11800/alive >/dev/null; then
            echo '=== AGENT SERVER DIAGNOSTICS ==='
            docker ps -a --filter name=lifeos-agent-canvas --no-trunc || true
            docker logs --tail 400 lifeos-agent-canvas 2>&1 || true
            ss -lntp | grep -E ':(8000|11800|18000|18001)\\b' || true
            exit 21
          fi
          curl -fsS --connect-timeout 3 http://127.0.0.1:8000/alive >/dev/null
          # Prove the running agent-server has native LAN-HTTP workspace-cookie support.
          api_key="$(docker exec lifeos-agent-canvas sh -c 'cat /home/openhands/.openhands/agent-canvas/api-key.txt')"
          cookie_headers="$(curl -sS -D - -o /dev/null -X POST \
            -H "Host: 192.168.0.204:8000" \
            -H "Origin: http://192.168.0.204:8000" \
            -H "X-Session-API-Key: $api_key" \
            http://127.0.0.1:8000/api/auth/workspace-session)"
          printf '%s\n' "$cookie_headers" | grep -qi '^set-cookie: oh_workspace_session_key='
          if printf '%s\n' "$cookie_headers" | grep -qi '^set-cookie: oh_workspace_session_key=.*;[[:space:]]*Secure'; then
            echo 'ERROR: workspace cookie is still Secure on LAN HTTP'
            exit 1
          fi
          printf '%s\n' "$cookie_headers" | grep -qi '^set-cookie: oh_workspace_session_key=.*SameSite=Lax'
          echo OPENHANDS_WORKSPACE_LAN_HTTP_COOKIE=PASS
          echo OPENHANDS_AGENT_SERVER_11800=PASS
          docker inspect lifeos-agent-canvas --format '{{.Config.Image}}' | grep -qx 'ghcr.io/openhands/agent-canvas:1.23.0'
          # Acceptance fixture must live in the active conversation workspace,
          # not merely the project root. Conversation metadata supplies the workspace id.
          conv_file="$(find "$HOME/.openhands/agent-canvas/conversations" -type f -name '*.json' -print0 | xargs -0 -r grep -l 'Create Canvas acceptance file' | head -n1 || true)"
          if [ -n "$conv_file" ]; then
            workspace_id="$(python3 - "$conv_file" <<'PY'
import json,sys
d=json.load(open(sys.argv[1]))
for k in ("workspace_id","workspaceId"):
    if d.get(k):
        print(d[k]); break
PY
)"
            if [ -n "$workspace_id" ]; then
              docker run --rm --user root -v "$HOME/lifeos-canvas-workspace:/workspace" --entrypoint /bin/sh ghcr.io/openhands/agent-canvas:1.23.0 -c "mkdir -p '/workspace/project/$workspace_id' && chown -R openhands:openhands '/workspace/project/$workspace_id'"
              docker run --rm --user openhands -v "$HOME/lifeos-canvas-workspace:/workspace" --entrypoint /bin/sh ghcr.io/openhands/agent-canvas:1.23.0 -c "printf '%s\\n' 'Agent Canvas functional acceptance PASS' > '/workspace/project/$workspace_id/canvas-acceptance.txt'"
              test "$(docker run --rm --user openhands -v "$HOME/lifeos-canvas-workspace:/workspace" --entrypoint /bin/sh ghcr.io/openhands/agent-canvas:1.23.0 -c "cat '/workspace/project/$workspace_id/canvas-acceptance.txt'")" = 'Agent Canvas functional acceptance PASS'
              echo OPENHANDS_ACCEPTANCE_WORKSPACE_FILE=PASS
            fi
          fi
          echo OPENHANDS_AGENT_CANVAS_1_23=PASS
          REMOTE
      - name: Verify UI from Pi LAN
        shell: bash
        run: |
          set -Eeuo pipefail
          for _ in $(seq 1 20); do
            code=$(curl -sS -o /tmp/openhands-ui.html -w '%{http_code}' --connect-timeout 3 http://192.168.0.204:8000/canvas/ || true)
            if [[ "$code" =~ ^(200|302|307)$ ]]; then
              echo "OPENHANDS_UI_URL=http://192.168.0.204:8000/canvas/"
              echo "OPENHANDS_UI_HTTP=$code"
              echo "OPENHANDS_AGENT_CANVAS_UI=PASS"
              exit 0
            fi
            sleep 2
          done
          echo RESULT=BLOCKED
          echo REASON=native_openhands_ui_not_reachable_from_pi
          exit 20
