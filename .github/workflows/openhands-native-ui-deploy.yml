name: OpenHands Native UI Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/openhands-native-ui-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 15
    steps:
      - name: Preserve and verify stock Agent Canvas on Pi5
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname)" == "Docker" ]]
          image="ghcr.io/openhands/agent-canvas:1.23.0"

          docker version >/dev/null
          docker pull "$image"

          # Preserve accepted Pi state on all subsequent deploys.
          systemctl --user stop lifeos-openhands-tls.service lifeos-openhands-ui.service 2>/dev/null || true
          docker rm -f lifeos-agent-canvas lifeos-agent-canvas-tls 2>/dev/null || true
          mkdir -p "$HOME/.openhands" "$HOME/workspace" "$HOME/lifeos-projects" "$HOME/lifeos-canvas-tls"

          # Keep a real persistent LifeOS checkout inside /projects. Do not use the
          # historical host symlink: its target is not valid inside Agent Canvas.
          # The stock-image ownership normalization below runs first because an
          # earlier Canvas chown may leave this host directory owned by its UID.
          docker run --rm --user root \
            -v "$HOME/.openhands:/state" -v "$HOME/workspace:/workspace" -v "$HOME/lifeos-projects:/projects" \
            --entrypoint /bin/sh "$image" -c 'chown -R openhands:openhands /state /workspace /projects'
          # The host runner must create/update the checkout, so restore the
          # top-level projects directory to the invoking host UID/GID after the
          # stock-container normalization. The checkout itself is normalized
          # for Canvas again below.
          docker run --rm --user root -v "$HOME/lifeos-projects:/projects" \
            --entrypoint /bin/sh "$image" -c "chown $(id -u):$(id -g) /projects"
          if [[ -L "$HOME/lifeos-projects/lifeos-platform" ]]; then
            rm "$HOME/lifeos-projects/lifeos-platform"
          fi
          if [[ ! -d "$HOME/lifeos-projects/lifeos-platform/.git" ]]; then
            rm -rf "$HOME/lifeos-projects/lifeos-platform"
            git clone --no-local "$HOME/lifeos-platform" "$HOME/lifeos-projects/lifeos-platform"
          fi
          # Canvas persists the checkout as its own UID. Restore host ownership
          # before runner-side Git operations, then normalize it for Canvas below.
          docker run --rm --user root -v "$HOME/lifeos-projects:/projects" \
            --entrypoint /bin/sh "$image" -c "chown -R $(id -u):$(id -g) /projects/lifeos-platform"
          git config --global --add safe.directory "$HOME/lifeos-projects/lifeos-platform"
          git -C "$HOME/lifeos-projects/lifeos-platform" remote set-url origin https://github.com/joshant20-ops/lifeos-platform.git
          git -C "$HOME/lifeos-projects/lifeos-platform" fetch origin main
          git -C "$HOME/lifeos-projects/lifeos-platform" checkout main
          git -C "$HOME/lifeos-projects/lifeos-platform" reset --hard origin/main
          docker run --rm --user root \
            -v "$HOME/.openhands:/state" -v "$HOME/workspace:/workspace" -v "$HOME/lifeos-projects:/projects" \
            --entrypoint /bin/sh "$image" -c 'chown -R openhands:openhands /state /workspace /projects'

          cat >"$HOME/.config/systemd/user/lifeos-openhands-ui.service" <<'UNIT'
          [Unit]
          Description=LifeOS OpenHands Agent Canvas (stock upstream, Pi5)
          After=network-online.target docker.service
          Wants=network-online.target
          [Service]
          Type=simple
          ExecStartPre=-/usr/bin/docker rm -f lifeos-agent-canvas
          ExecStart=/usr/bin/docker run --name lifeos-agent-canvas --network host -v %h/.openhands:/home/openhands/.openhands -v %h/workspace:/home/openhands/workspace -v %h/lifeos-projects:/projects ghcr.io/openhands/agent-canvas:1.23.0
          ExecStop=/usr/bin/docker stop -t 20 lifeos-agent-canvas
          Restart=on-failure
          RestartSec=5
          [Install]
          WantedBy=default.target
          UNIT

          pi_ip="$(hostname -I | tr ' ' '\n' | grep -E '^192\.168\.' | head -1)"
          test -n "$pi_ip"
          rm -rf "$HOME/lifeos-canvas-tls"
          mkdir -p "$HOME/lifeos-canvas-tls"
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 825 \
            -keyout "$HOME/lifeos-canvas-tls/key.pem" -out "$HOME/lifeos-canvas-tls/cert.pem" \
            -subj "/CN=$pi_ip" -addext "subjectAltName=IP:$pi_ip"
          chmod 600 "$HOME/lifeos-canvas-tls/key.pem"

          cat >"$HOME/.config/systemd/user/lifeos-openhands-tls.service" <<'UNIT'
          [Unit]
          Description=LifeOS Agent Canvas HTTPS ingress (Pi5)
          After=network-online.target docker.service lifeos-openhands-ui.service
          Wants=network-online.target lifeos-openhands-ui.service
          [Service]
          Type=simple
          ExecStartPre=-/usr/bin/docker rm -f lifeos-agent-canvas-tls
          ExecStart=/usr/bin/docker run --name lifeos-agent-canvas-tls --network host -v %h/lifeos-canvas-tls:/tls:ro nginx:1.29-alpine sh -c 'printf "server { listen 8443 ssl; ssl_certificate /tls/cert.pem; ssl_certificate_key /tls/key.pem; location / { proxy_pass http://127.0.0.1:8000; proxy_http_version 1.1; proxy_set_header Host \\$host; proxy_set_header X-Forwarded-Host \\$host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For \\$proxy_add_x_forwarded_for; proxy_set_header Upgrade \\$http_upgrade; proxy_set_header Connection \"upgrade\"; } }" > /etc/nginx/conf.d/default.conf && exec nginx -g "daemon off;"'
          ExecStop=/usr/bin/docker stop -t 20 lifeos-agent-canvas-tls
          Restart=on-failure
          RestartSec=5
          [Install]
          WantedBy=default.target
          UNIT

          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          test -S "$XDG_RUNTIME_DIR/bus"
          systemctl --user daemon-reload
          systemctl --user enable lifeos-openhands-ui.service lifeos-openhands-tls.service
          systemctl --user restart lifeos-openhands-ui.service
          systemctl --user restart lifeos-openhands-tls.service

          for _ in $(seq 1 60); do curl -kfsS --connect-timeout 2 https://127.0.0.1:8443/canvas/ >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:18000/alive >/dev/null
          curl -kfsS https://127.0.0.1:8443/canvas/ >/dev/null

          mounts="$(docker inspect lifeos-agent-canvas --format '{{range .Mounts}}{{println .Destination}}{{end}}')"
          printf '%s\n' "$mounts" | grep -qx '/home/openhands/.openhands'
          printf '%s\n' "$mounts" | grep -qx '/home/openhands/workspace'
          printf '%s\n' "$mounts" | grep -qx '/projects'
          test "$(printf '%s\n' "$mounts" | wc -l)" -eq 3
          docker exec lifeos-agent-canvas test -d /projects/lifeos-platform/.git
          docker exec lifeos-agent-canvas git -C /projects/lifeos-platform rev-parse --is-inside-work-tree | grep -qx true
          docker exec lifeos-agent-canvas git -C /projects/lifeos-platform remote get-url origin | grep -qx 'https://github.com/joshant20-ops/lifeos-platform.git'
          echo "OPENHANDS_LIFEOS_PERSISTENT_REPO=PASS"

          # Enforce the accepted GPT-OSS profile on every Canvas deployment.  The
          # persisted profile is the source used by the UI selector, so a stale
          # Qwen profile must not survive a redeploy.
          docker exec -i lifeos-agent-canvas python - <<'PY'
          import json,pathlib
          root=pathlib.Path("/home/openhands/.openhands/profiles")
          root.mkdir(parents=True,exist_ok=True)
          def load_profile(p):
              raw=p.read_text()
              # Repair the legacy workflow bug that wrote a literal \\n after JSON.
              if raw.endswith("\\n"):
                  raw=raw[:-2]
              return json.loads(raw)
          old=root/"qwen25coder7b-instruct.json"
          new=root/"gptoss20b.json"
          if new.exists():
              o=load_profile(new)
          elif old.exists():
              o=load_profile(old)
          else:
              o={}
          o["model"]="openai/gpt-oss:20b"
          o["base_url"]="http://127.0.0.1:18114/v1"
          o["api_key"]=o.get("api_key") or "local-lifeos-gateway"
          o["native_tool_calling"]=True
          if "name" in o:
              o["name"]="gptoss20b"
          new.write_text(json.dumps(o,indent=2)+"\n")
          if old.exists(): old.unlink()
          print("OPENHANDS_DEPLOY_GPT_OSS_PROFILE=PASS")
          PY
          api_key="$(docker exec lifeos-agent-canvas sh -c 'cat /home/openhands/.openhands/agent-canvas/api-key.txt')"
          test -n "$api_key"
          curl -fsS -X PATCH -H "X-Session-API-Key: $api_key" -H 'Content-Type: application/json' \
            --data '{"agent_settings_diff":{"llm":{"model":"openai/gpt-oss:20b","base_url":"http://127.0.0.1:18114/v1","native_tool_calling":true},"enable_switch_llm_tool":false}}' \
            http://127.0.0.1:18000/api/settings >/tmp/openhands-deploy-gptoss.json
          python3 - <<'PY'
          import json
          o=json.load(open("/tmp/openhands-deploy-gptoss.json"))["agent_settings"]
          assert o["llm"]["model"]=="openai/gpt-oss:20b"
          assert o["llm"]["base_url"]=="http://127.0.0.1:18114/v1"
          assert o["llm"]["native_tool_calling"] is True
          assert o["enable_switch_llm_tool"] is False
          print("OPENHANDS_DEPLOY_GPT_OSS_ACTIVE=PASS")
          PY

          # Create and activate the named Canvas profile through the supported API.
          # Deployment owns desired state; audits remain read-only.
          python3 - "$api_key" <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.request

          key = sys.argv[1]
          base = "http://127.0.0.1:18000"
          headers = {
              "X-Session-API-Key": key,
              "Content-Type": "application/json",
          }

          def request(path, method="GET", data=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(
                  base + path,
                  data=body,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  raw = error.read()
                  return error.code, json.loads(raw) if raw else None

          payload = {
              "llm": {
                  "model": "openai/gpt-oss:20b",
                  "base_url": "http://127.0.0.1:18114/v1",
                  "api_key": "local-lifeos-gateway",
                  "native_tool_calling": True,
              }
          }
          status, output = request(
              "/api/profiles/gpt-oss-20b", "POST", payload
          )
          assert status in (200, 201), (status, output)
          status, output = request(
              "/api/profiles/gpt-oss-20b/activate", "POST", {}
          )
          assert status in (200, 201, 204), (status, output)

          # GPT-OSS needs a short, high-priority repository-task contract in the
          # stock Canvas prompt. The full upstream prompt and native tools remain
          # unchanged; this suffix prevents a repository instruction from being
          # answered as a generic tutorial and names the persistent checkout that
          # Canvas cannot infer from its isolated per-conversation working dir.
          grounding_marker = "<LIFEOS_REPOSITORY_TASK_GROUNDING_V1>"
          grounding = """<LIFEOS_REPOSITORY_TASK_GROUNDING_V1>
          For an explicit repository engineering task, your first response must invoke the native terminal tool. Inspect the current working directory, then inspect /projects/lifeos-platform when the named LifeOS repository is not present there. Ground every path and claim in tool output. Do not invent a different task, propose a script for the user to run, or finish with instructions instead of performing the requested investigation, edit, and deterministic verification. Continue autonomously until complete or an actual external blocker is observed through a tool.
          </LIFEOS_REPOSITORY_TASK_GROUNDING_V1>"""
          status, settings = request("/api/settings")
          assert status == 200, (status, settings)
          context = settings["agent_settings"].get("agent_context") or {}
          suffix = context.get("system_message_suffix") or ""
          if grounding_marker in suffix:
              suffix = suffix.split(grounding_marker, 1)[0].rstrip()
          desired_suffix = (suffix + "\n\n" + grounding).strip()
          status, output = request(
              "/api/settings",
              "PATCH",
              {
                  "agent_settings_diff": {
                      "agent_context": {
                          "system_message_suffix": desired_suffix
                      }
                  }
              },
          )
          assert status == 200, (status, output)
          active = output["agent_settings"]
          assert grounding_marker in active["agent_context"]["system_message_suffix"]
          print("OPENHANDS_DEPLOY_REPOSITORY_TASK_GROUNDING=PASS")
          print("OPENHANDS_DEPLOY_GPT_OSS_PROFILE_ACTIVATED=PASS")
          PY

          # Verify accepted Pi state survives a full service restart; do not invoke an LLM.
          test "$(cat "$HOME/workspace/pi5-persistence.txt")" = "Agent Canvas Pi5 persistence PASS"
          acceptance_file="$(find "$HOME/workspace/project" -name canvas-acceptance.txt -type f -print -quit)"
          test -n "$acceptance_file"
          test "$(cat "$acceptance_file")" = "Agent Canvas Pi5 functional acceptance PASS"
          systemctl --user restart lifeos-openhands-ui.service
          systemctl --user restart lifeos-openhands-tls.service
          for _ in $(seq 1 60); do curl -kfsS --connect-timeout 2 https://127.0.0.1:8443/canvas/ >/dev/null 2>&1 && break; sleep 2; done
          test "$(cat "$acceptance_file")" = "Agent Canvas Pi5 functional acceptance PASS"

          api_key="$(docker exec lifeos-agent-canvas             cat /home/openhands/.openhands/agent-canvas/api-key.txt)"
          test -n "$api_key"
          python3 - "$api_key" <<'PY'
          import json
          import sys
          import urllib.request

          key = sys.argv[1]
          base = "http://127.0.0.1:18000"
          headers = {"X-Session-API-Key": key}

          def get(path):
              req = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None

          profiles = get("/api/profiles")
          names = [
              item.get("name") if isinstance(item, dict) else item
              for item in profiles.get("profiles", [])
          ]
          assert "gpt-oss-20b" in names, names
          assert profiles.get("active_profile") == "gpt-oss-20b", profiles

          settings = get("/api/settings")
          agent = settings["agent_settings"]
          llm = agent["llm"]
          assert llm["model"] == "openai/gpt-oss:20b"
          assert llm["base_url"] == "http://127.0.0.1:18114/v1"
          assert llm["native_tool_calling"] is True
          assert agent["enable_switch_llm_tool"] is False
          suffix = agent["agent_context"]["system_message_suffix"]
          assert "<LIFEOS_REPOSITORY_TASK_GROUNDING_V1>" in suffix
          assert "/projects/lifeos-platform" in suffix
          assert "first response must invoke the native terminal tool" in suffix
          print("OPENHANDS_DEPLOY_REPOSITORY_TASK_GROUNDING_PERSISTENCE=PASS")
          print("OPENHANDS_DEPLOY_GPT_OSS_PROFILE_PERSISTENCE=PASS")
          PY

          # One-time legacy cleanup is intentionally not part of normal deploys.
          # Engineer OpenHands runtime/state was retired after verified Pi5 cutover.
          echo "OPENHANDS_PI5_PRESERVING_DEPLOY=PASS"
          echo "OPENHANDS_ENGINEER_RUNTIME_RETIRED=PASS"
          echo "OPENHANDS_STOCK_UPSTREAM_DEPLOYMENT=PASS"
          echo "OPENHANDS_PI5_PERSISTENCE=PASS"
          echo "OPENHANDS_UI_URL=https://$pi_ip:8443/canvas/"
