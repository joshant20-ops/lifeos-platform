name: Storage maintenance safety tests
on:
  pull_request:
    paths:
      - governor/mqtt_retained_rotation.py
      - governor/storage_health_gate.py
      - tests/test_mqtt_retained_rotation.py
      - tests/test_storage_health_gate.py
      - tests/test_mqtt_rotation_broker.py
      - .github/workflows/storage-maintenance-safety.yml
permissions:
  contents: read
jobs:
  synthetic-safety:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -B -m unittest -v tests.test_mqtt_retained_rotation tests.test_storage_health_gate
      - name: Pull the pinned disposable broker
        run: docker pull eclipse-mosquitto@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
      - name: Prove retained rotation and subscriber continuity
        run: python3 -B -m unittest -v tests.test_mqtt_rotation_broker
