name: LifeOS #801 Retired Runtime Cleanup
on:
  push:
    branches: [main]
    paths:
      - 'scripts/lifeos-cleanup-retired-backlog-runtime.sh'
      - 'homelab/live/usr/local/sbin/lifeos-deploy-gateway'
      - '.github/workflows/lifeos-801-retired-runtime-cleanup.yml'
permissions:
  contents: read
concurrency:
  group: lifeos-801-retired-runtime-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 8
    steps:
      - name: Sync canonical checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git merge --ff-only origin/main
          test -z "$(git status --porcelain)"
      - name: Refresh bounded deployment gateway
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          sudo -n bash scripts/lifeos-install-github-runner-gateway.sh
      - name: Remove only retired backlog runtime artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n /usr/local/sbin/lifeos-deploy-gateway cleanup-retired-backlog-runtime
      - name: Live verify absence and Governor health
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e /var/lib/lifeos-backlog-runner/state.json
          test ! -e /etc/systemd/system/lifeos-autonomous-agent.service.d/backlog-dispatcher.conf
          ! systemctl show lifeos-autonomous-agent.service -p DropInPaths --value | grep -q backlog-dispatcher.conf
          curl -fsS --max-time 3 http://127.0.0.1:8790/health >/dev/null
          echo '801_RUNTIME_CLEANUP_LIVE_PROOF=PASS'
