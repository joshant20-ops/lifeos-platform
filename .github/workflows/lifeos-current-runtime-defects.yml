name: Audit current runtime defects
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lifeos-current-runtime-defects.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 10
    steps:
      - name: Align
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          test -z "$(git status --porcelain --untracked-files=all)"
          git merge --ff-only origin/main
      - name: Inspect current defects
        run: |
          set -u
          echo '=== FAILED ==='
          systemctl --failed --no-pager || true
          for u in lifeos-important-info-refresh.service lifeos-jobs-export.service; do
            echo "=== $u ==="
            systemctl status "$u" --no-pager -l || true
            systemctl cat "$u" || true
            journalctl -u "$u" -n 80 --no-pager || true
          done
          echo '=== EXPORT TIMERS ==='
          systemctl list-timers --all --no-pager | grep -E 'jobs-export|snapshot|lifeos' || true
          echo '=== ROOT BROKER FAILED INSTANCES ==='
          systemctl --failed --no-legend | grep 'lifeos-root-broker@' || true
          echo '=== ROOT BROKER BASE ==='
          systemctl cat 'lifeos-root-broker@.service' 2>/dev/null || true
