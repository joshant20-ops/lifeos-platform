name: LifeOS Stage 3 Gateway Refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-stage3-gateway-refresh.yml'
      - 'homelab/live/usr/local/sbin/lifeos-deploy-gateway'
      - 'scripts/lifeos-step11-live-closure.sh'
      - 'scripts/diagnose-step11-live-terminal-policy.sh'
      - 'governor/job_records.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifeos-stage3-gateway-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 20
    steps:
      - name: Synchronize canonical Pi checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Refresh gateway through existing allow-listed operation
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n /usr/local/sbin/lifeos-deploy-gateway deploy-ha-control-bridge

      - name: Prove new allow-list is installed
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          out=$(sudo -n /usr/local/sbin/lifeos-deploy-gateway 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 64
          grep -q 'capability-stage3-systemd-cleanup' <<<"$out"
          grep -q 'step11-live-closure' <<<"$out"
          echo 'STAGE3_GATEWAY_REFRESH=PASS'

      - name: Complete Step 11 live terminal policy
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          out=$(sudo -n /usr/local/sbin/lifeos-deploy-gateway step11-live-closure 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          echo "STEP11_GATEWAY_RC=$rc"
          test "$rc" -eq 0
          grep -qx 'STEP_11=PASS' <<<"$out"
          grep -qx 'LIVE_MODULE_SYNC=PASS' <<<"$out"
          grep -qx 'PASS_STOP=PASS' <<<"$out"
          grep -qx 'GENUINE_BLOCKED_STOP=PASS' <<<"$out"
          grep -qx 'REPEATED_FAILURE_STOP=PASS' <<<"$out"
          grep -qx 'ITERATION_LIMIT_STOP=PASS' <<<"$out"
          grep -qx 'NON_TERMINAL_RETRY=PASS' <<<"$out"
          grep -qx 'AUTONOMOUS_AGENT_HEALTH=PASS' <<<"$out"
          grep -qx 'NEXT_REQUIRED=step11_closed' <<<"$out"
          echo 'STEP11_WORKFLOW_ACCEPTANCE=PASS'

      - name: Prove canonical LifeOS dashboard survived deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          sudo -n python3 homeassistant/verify-lifeos-dashboard.py
