name: LifeOS Governed Pipeline Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-governed-pipeline-smoke.yml'
      - 'governor/autonomous_agent.py'
      - 'governor/scripts/lifeos-cloud-builder'
      - 'governor/scripts/lifeos-local-builder'
      - 'governor/scripts/lifeos-remote-agent-builder'
      - 'governor/ai_broker.py'
      - 'engineer/provider_router.py'
      - 'scripts/test-direct-openhands.sh'
      - 'scripts/test-engineer-governor-broker.sh'
      - 'tests/test_governor_local_tool_routing.py'

permissions:
  contents: read

concurrency:
  group: lifeos-pi5-control
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 25
    steps:
      - name: Sync and static validation
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main; echo "SMOKE_SYNC_FETCH_RC=$?"
          git merge --ff-only origin/main; echo "SMOKE_SYNC_MERGE_RC=$?"
          python3 -m py_compile governor/autonomous_agent.py governor/scripts/lifeos-pa-mission; echo "SMOKE_COMPILE_RC=$?"
          bash -n governor/scripts/lifeos-local-builder; echo "SMOKE_LOCAL_BUILDER_SYNTAX_RC=$?"
          bash -n governor/scripts/lifeos-remote-agent-builder; echo "SMOKE_REMOTE_BUILDER_SYNTAX_RC=$?"

      - name: Governor API health
        continue-on-error: true
        shell: bash
        run: |
          set +e
          curl -fsS --max-time 10 http://127.0.0.1:8790/health
          echo
          echo "SMOKE_GOVERNOR_HEALTH_RC=$?"

      - name: Local-only broker and Tower lifecycle
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd /home/joshan/lifeos-platform
          bash governor/scripts/lifeos-local-builder --self-test
          echo "SMOKE_LOCAL_ROUTE_RC=$?"

      - name: Engineer reachability and capabilities
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd /home/joshan/lifeos-platform
          # Use the governed lifecycle path before probing Engineer. A direct SSH
          # probe while Tower is intentionally asleep is not a pipeline failure.
          python3 - <<'PY'
          import importlib.util, pathlib
          p=pathlib.Path('governor/ai_broker.py')
          s=importlib.util.spec_from_file_location('smoke_ai_broker',p)
          m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          m._publish_lease('active'); m._wake_local_ai()
          PY
          ready=0
          for i in $(seq 1 100); do
            if ssh -o BatchMode=yes -o ConnectTimeout=3 Engineer true >/dev/null 2>&1; then ready=1; echo "SMOKE_ENGINEER_WAKE_ATTEMPT=$i"; break; fi
            sleep 3
          done
          if (( ready == 0 )); then echo 'SMOKE_ENGINEER_WAKE_RC=1'; else echo 'SMOKE_ENGINEER_WAKE_RC=0'; fi
          ssh -o BatchMode=yes -o ConnectTimeout=8 Engineer 'bash -s' <<'REMOTE'
          set +e
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          echo "ENGINEER_HOST=$(hostname)"
          if command -v openhands >/dev/null 2>&1 || test -x "$HOME/.local/bin/openhands"; then
            echo "SMOKE_OPENHANDS_RC=0"
          else
            echo "SMOKE_OPENHANDS_RC=1"
          fi
          test -f "$HOME/.config/lifeos/governor-broker.env"; echo "SMOKE_BROKER_CONFIG_EXISTS_RC=$?"
          test "$(stat -c '%a' "$HOME/.config/lifeos/governor-broker.env" 2>/dev/null)" = 600; echo "SMOKE_BROKER_CONFIG_MODE_RC=$?"
          test -d /home/joshan/workspace/lifeos-platform/.git; echo "SMOKE_ENGINEER_REPO_RC=$?"
          REMOTE
          echo "SMOKE_ENGINEER_SSH_RC=$?"

      - name: Direct OpenHands governed routing proof
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd /home/joshan/lifeos-platform
          timeout 900 bash scripts/test-direct-openhands.sh
          echo "SMOKE_DIRECT_OPENHANDS_RC=$?"
          timeout 300 bash scripts/test-engineer-governor-broker.sh
          echo "SMOKE_ENGINEER_BROKER_RC=$?"
          python3 -m pytest -q tests/test_governor_local_tool_routing.py
          echo "SMOKE_LOCAL_TOOL_ROUTING_RC=$?"

      - name: Capture M7 canonical checkout baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          test -z "$(git status --porcelain --untracked-files=all)"
          git rev-parse HEAD > /tmp/lifeos-m7-head
          git status --porcelain=v1 --untracked-files=all > /tmp/lifeos-m7-status
          git diff --binary HEAD > /tmp/lifeos-m7-diff
          git ls-files -s > /tmp/lifeos-m7-index
          echo "M7_BASELINE_HEAD=$(cat /tmp/lifeos-m7-head)"
          echo 'M7_BASELINE_CLEAN=PASS'

      - name: M6 cloud and fallback acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'engineer')
          from provider_router import load_policy, route
          p=load_policy(Path('governor/policy.json'))
          normal=route(p,'normal',set(),available_adapters={'openhands','codex','local-builder'})
          private=route(p,'normal',set(),privacy='local-only',available_adapters={'openhands','codex','local-builder'})
          assert normal['selected_provider']=='codex', normal
          assert private['selected_provider']=='ollama', private
          assert next(x for x in normal['considered'] if x['provider']=='ollama')['status']=='PRIVACY_FORBIDDEN'
          assert next(x for x in private['considered'] if x['provider']=='codex')['status']=='PRIVACY_FORBIDDEN'
          print('M6_SANITIZED_CLOUD_ROUTE=codex')
          print('M6_LOCAL_ONLY_ROUTE=ollama')
          print('M6_PRIVACY_FAIL_CLOSED=PASS')
          PY
          cloud=governor/scripts/lifeos-cloud-builder
          set +e
          reject="$(LIFEOS_JOB_PRIVACY=local-only LIFEOS_JOB_ID=878-m6-local-escape bash "$cloud" 'M6 local-only cloud escape probe' 1 2>&1)"
          reject_rc=$?
          set -e
          printf '%s\\n' "$reject"
          test "$reject_rc" = 42
          grep -q 'RESULT=BLOCKED' <<<"$reject"
          grep -q 'REASON=cloud_builder_forbidden_for_local_only_job' <<<"$reject"
          echo 'M6_LOCAL_ONLY_CLOUD_ESCAPE=PASS'
          grep -q 'CLOUD_AGENTS_EXHAUSTED=YES' "$cloud"
          grep -q 'FALLBACK_ROUTE=Tower_Ollama' "$cloud"
          grep -q 'LIFEOS_JOB_PRIVACY=local-only' "$cloud"
          grep -q 'LOCAL_BUILDER_CLOUD_FALLBACK=DISABLED' governor/scripts/lifeos-local-builder
          echo 'M6_CLOUD_EXHAUSTION_FALLBACK_CONTRACT=PASS'
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'M6_REPOSITORY_CLEAN=PASS'
          echo 'M6_LIVE_ACCEPTANCE=PASS'

      - name: Prove M7 canonical checkout immutability
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          test "$(git rev-parse HEAD)" = "$(cat /tmp/lifeos-m7-head)"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git status --porcelain=v1 --untracked-files=all)" = "$(cat /tmp/lifeos-m7-status)"
          git diff --binary HEAD > /tmp/lifeos-m7-diff-after
          git ls-files -s > /tmp/lifeos-m7-index-after
          cmp -s /tmp/lifeos-m7-diff /tmp/lifeos-m7-diff-after
          cmp -s /tmp/lifeos-m7-index /tmp/lifeos-m7-index-after
          runtime_real="$(readlink -f /var/lib/lifeos-agent/runtime_jobs)"
          repo_real="$(readlink -f /home/joshan/lifeos-platform)"
          case "$runtime_real" in "$repo_real"/*) echo 'M7_RUNTIME_OUTSIDE_GIT=FAIL'; exit 1;; esac
          echo "M7_RUNTIME_OUTSIDE_GIT=PASS:$runtime_real"
          echo 'M7_HEAD_UNCHANGED=PASS'
          echo 'M7_WORKTREE_UNCHANGED=PASS'
          echo 'M7_INDEX_UNCHANGED=PASS'
          echo 'M7_DIFF_UNCHANGED=PASS'
          echo 'M7_CHECKOUT_IMMUTABILITY=PASS'

      - name: Prove M8 retired Git runtime launchers
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          test ! -d governor/runtime_jobs || test -z "$(find governor/runtime_jobs -type f -name '*.sh' -print -quit)"
          test -z "$(git ls-files 'governor/runtime_jobs/*.sh')"
          runtime_real="$(readlink -f /var/lib/lifeos-agent/runtime_jobs)"
          repo_real="$(readlink -f /home/joshan/lifeos-platform)"
          case "$runtime_real" in "$repo_real"/*) echo 'M8_RUNTIME_ROOT=FAIL'; exit 1;; esac
          test -d "$runtime_real"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'M8_GIT_RUNTIME_LAUNCHERS=0'
          echo "M8_ACTIVE_RUNTIME_ROOT=PASS:$runtime_real"
          echo 'M8_JOB_RECORDS_DEFERRED_TO_M9=PASS'
          echo 'M8_REPOSITORY_CLEAN=PASS'
          echo 'M8_RETIREMENT_ACCEPTANCE=PASS'

      - name: Agent contract regression
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd /home/joshan/lifeos-platform
          python3 -m pytest -q tests/test_governor_*.py 2>&1
          rc=$?
          # Direct OpenHands routing is exercised above; retain aggregate contract evidence here.
          echo "SMOKE_GOVERNOR_TESTS_RC=$rc"

      - name: Mission audit without execution
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd /home/joshan/lifeos-platform
          out=$(mktemp)
          python3 governor/scripts/lifeos-pa-mission audit 2>&1 | tee "$out"
          rc=${PIPESTATUS[0]}
          if grep -q '^MISSION_PHASE=audit_passed' "$out" && { [[ "$rc" == 0 ]] || [[ "$rc" == 20 ]]; }; then
            echo "SMOKE_MISSION_AUDIT_RC=0"
          else
            echo "SMOKE_MISSION_AUDIT_RC=$rc"
          fi
          rm -f "$out"

      - name: Collect all smoke findings
        if: always()
        shell: bash
        run: |
          echo 'SMOKE_COMPLETE=YES'
          echo 'NOTE=All probes use continue-on-error so later stages run even when earlier probes fail.'
          echo 'NOTE=This smoke deliberately does not submit/close a GitHub issue; it validates the pipeline components without mutating issue state.'
