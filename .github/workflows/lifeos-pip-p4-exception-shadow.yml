name: LifeOS P4 Paperless Exception Shadow

on:
  push:
    branches: [main]
    paths:
      - 'scripts/lifeos-pip-p4-exception-selector.py'
      - 'tests/test_pip_p4_exception_semantics.py'
      - 'homelab/live/home/joshan/automation/lifeos_paperless_local_ai.py'
  workflow_dispatch:

jobs:
  p4-shadow:
    runs-on: [self-hosted, lifeos-pi5]
    steps:
      - uses: actions/checkout@v4
      - name: Contract tests
        run: python3 -m pytest -q tests/test_pip_p4_exception_semantics.py
      - name: Reconcile canonical checkout
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          repo=/home/joshan/lifeos-platform
          git -C "$repo" fetch origin main
          test -z "$(git -C "$repo" status --porcelain)"
          git -C "$repo" merge --ff-only origin/main
          test "$(git -C "$repo" rev-parse HEAD)" = "$(git -C "$repo" rev-parse origin/main)"
      - name: Read-only native exception shadow
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          repo=/home/joshan/lifeos-platform
          container=paperless-paperless-1
          docker inspect -f '{{.State.Running}}' "$container" | grep -qx true
          docker cp "$repo/scripts/lifeos-pip-p2-paperless-shadow.py" "$container:/tmp/lifeos-pip-p2-lib.py"\n          docker cp "$repo/scripts/lifeos-pip-p4-exception-selector.py" "$container:/tmp/lifeos-pip-p4-exception-selector.py"
          docker exec -i "$container" python3 manage.py shell < "$repo/scripts/lifeos-pip-p4-exception-selector.py" > /tmp/lifeos-p4-shadow.txt
          grep -q '^P4_SELECTOR=PAPERLESS_NATIVE_EXCEPTION_ONLY$' /tmp/lifeos-p4-shadow.txt
          grep -q '^P4_DOCUMENT_MUTATION=NONE$' /tmp/lifeos-p4-shadow.txt
          grep -q '^P4_PRIVATE_CONTENT_EMITTED=NONE$' /tmp/lifeos-p4-shadow.txt
          grep -q '^RESULT=PASS$' /tmp/lifeos-p4-shadow.txt
          cat /tmp/lifeos-p4-shadow.txt
      - name: Verify canonical clean
        if: always()
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test -z "$(git -C /home/joshan/lifeos-platform status --porcelain)"
          echo CANONICAL_CLEAN=PASS
