name: LifeOS Broker 502 Diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lifeos-broker-502-diagnostic.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    steps:
      - name: Inspect broker and Tower readiness safely
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "BROKER_SERVICE=$(systemctl is-active lifeos-ai-broker.service 2>/dev/null || true)"
          echo "AUTONOMOUS_SERVICE=$(systemctl is-active lifeos-autonomous-agent.service 2>/dev/null || true)"
          python3 - <<'PY'
          import json, urllib.request
          try:
              job=json.load(urllib.request.urlopen("http://127.0.0.1:8790/jobs/96ac48a54534",timeout=10))
              print("JOB",job.get("status"),job.get("stage"),job.get("blocked_reason"))
              for it in job.get("iterations") or []:
                  print("ITER",it.get("iteration"),"RC",it.get("builder_rc"),"RESULT",it.get("iteration_result"))
                  ev=str(it.get("evidence") or "")
                  for line in ev.splitlines():
                      if line.startswith(("OPENHANDS_","LOCAL_BUILDER_","AGENT_RESULT","HANDOFF_","CANONICAL_","AI_","TOWER_")):
                          print(line[:1000])
          except Exception as exc:
              print("JOB_READ_ERROR",type(exc).__name__)
          for url,label in [("http://192.168.0.201:11434/api/tags","TOWER_OLLAMA"),("http://127.0.0.1:8788/v1/models","BROKER")]:
              try:
                  with urllib.request.urlopen(url,timeout=5) as r:
                      print(label+"_HTTP",r.status)
              except Exception as exc:
                  print(label+"_ERROR",type(exc).__name__,getattr(exc,"code",""))
          PY
