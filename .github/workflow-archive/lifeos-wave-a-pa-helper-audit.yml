name: LifeOS Wave A PA Helper Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-wave-a-pa-helper-audit.yml'
      - 'scripts/audit-pa-lifecycle-helper.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifeos-pi5-control
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 10
    steps:
      - name: Sync canonical checkout
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Inspect live helper structure
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          python3 scripts/audit-pa-lifecycle-helper.py
      - name: Prove repository non-mutation
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo PA_HELPER_AUDIT_REPOSITORY=PASS
