name: LifeOS Capability Stage 3 Ops Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'governor/capability-roadmap/stage3-production-operations.json'
      - 'scripts/run-capability-stage3-ops-audit.py'
      - '.github/workflows/lifeos-capability-stage3.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: lifeos-capability-stage3
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize canonical Pi checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Run Capability Stage 3 OTS audit
        id: audit
        shell: bash
        run: |
          set -o pipefail
          cd /home/joshan/lifeos-platform
          mkdir -p "$RUNNER_TEMP/lifeos-stage3"
          set +e
          python3 scripts/run-capability-stage3-ops-audit.py 2>&1 | tee "$RUNNER_TEMP/lifeos-stage3/audit.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cp -f "$HOME/.local/state/lifeos/capability-stage3-ops-report.json" "$RUNNER_TEMP/lifeos-stage3/report.json" 2>/dev/null || true
          exit "$rc"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-stage3-${{ github.run_id }}
          path: ${{ runner.temp }}/lifeos-stage3/
          if-no-files-found: warn
          retention-days: 30

      - name: Update Stage 3 issue
        if: always()
        uses: actions/github-script@v7
        env:
          AUDIT_RC: ${{ steps.audit.outputs.rc }}
        with:
          script: |
            const ok = process.env.AUDIT_RC === '0';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 53,
              body: `Capability Stage 3 automatic Pi audit: **${ok ? 'PASS' : 'FAIL'}**\n\nRun: ${run}\n\n${ok ? 'Base OTS operations audit is green. Remaining work is backup freshness/restore cadence, certificate-expiry monitoring and update-awareness coverage.' : 'See workflow artifact/log for the first failing gate and diagnostics.'}`
            });
