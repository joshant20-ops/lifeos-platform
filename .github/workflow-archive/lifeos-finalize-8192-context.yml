name: LifeOS Finalize Validated 8192 Context

on:
  push:
    branches: [main]
    paths:
      - 'governor/ai_broker.py'
      - '.github/workflows/lifeos-finalize-8192-context.yml'

permissions:
  contents: read

concurrency:
  group: lifeos-finalize-8192-context
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 10
    steps:
      - name: Preserve and reconcile validated dirty change
        shell: bash
        run: |
          set -Eeuo pipefail
          repo=/home/joshan/lifeos-platform
          cd "$repo"
          test "$(git status --porcelain --untracked-files=all)" = ' M governor/ai_broker.py'
          backup=$(mktemp)
          cp --preserve=mode,timestamps governor/ai_broker.py "$backup"
          recover() {
            rc=$?
            if (( rc != 0 )); then
              cp --preserve=mode,timestamps "$backup" governor/ai_broker.py
              echo 'VALIDATED_DIRTY_CHANGE_RECOVERED=PASS'
            fi
            rm -f "$backup"
            exit "$rc"
          }
          trap recover EXIT INT TERM

          git fetch --prune origin main
          current=$(git rev-parse HEAD)
          target=$(git rev-parse origin/main)
          git merge-base --is-ancestor "$current" "$target"
          git show origin/main:governor/ai_broker.py | cmp - "$backup"

          git restore --worktree -- governor/ai_broker.py
          git merge --ff-only origin/main
          cmp -s "$backup" governor/ai_broker.py
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 -m py_compile governor/ai_broker.py
          grep -F 'LIFEOS_LOCAL_AI_CONTEXT_LENGTH", "8192"' governor/ai_broker.py >/dev/null

          trap - EXIT INT TERM
          rm -f "$backup"
          echo 'CANONICAL_8192_FINALIZED=PASS'
          echo "PI_HEAD=$(git rev-parse HEAD)"

      - name: Verify Pi-local Ollama remains absent
        shell: bash
        run: |
          set -Eeuo pipefail
          ! command -v ollama >/dev/null 2>&1
          ! ss -ltn | awk '{print $4}' | grep -Eq '(^|:)11434$'
          echo 'PI_LOCAL_OLLAMA_ABSENT=PASS'
