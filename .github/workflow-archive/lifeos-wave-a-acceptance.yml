name: LifeOS Energy Opportunity Acceptance

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: lifeos-pi5-control
  cancel-in-progress: false

jobs:
  accept:
    runs-on: [self-hosted, linux, ARM64, lifeos-pi5]
    timeout-minutes: 15
    steps:
      - name: Synchronize canonical checkout
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          git fetch --prune origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Run Energy Opportunity live acceptance
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          python3 scripts/audit-wave-a-live-acceptance.py
      - name: Final canonical proof
        run: |
          set -Eeuo pipefail
          cd /home/joshan/lifeos-platform
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo ENERGY_OPPORTUNITY_REPOSITORY_FINAL=PASS

# 2026-09-06: live acceptance rerun after governed Wave A deployment and deploy-workflow repair.
