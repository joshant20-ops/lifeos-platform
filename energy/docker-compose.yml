services:
  lifeos-energy:
    build:
      context: .
    image: lifeos-energy:0.1.0-dev
    container_name: lifeos-energy
    restart: unless-stopped
    ports:
      - "8110:8110"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8110/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
