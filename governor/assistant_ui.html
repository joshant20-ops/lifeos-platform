<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LifeOS Assistant</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;background:#0b0f14;color:#e8edf4}*{box-sizing:border-box}body{margin:0;background:#0b0f14}.app{min-height:100vh;display:flex;flex-direction:column;max-width:900px;margin:auto}.top{padding:18px 20px 10px;border-bottom:1px solid #202934;position:sticky;top:0;background:#0b0f14ee;backdrop-filter:blur(10px);z-index:2}.title{font-size:1.05rem;font-weight:700}.sub{font-size:.82rem;color:#8e9aaa;margin-top:3px}.chat{flex:1;padding:18px 16px 150px;display:flex;flex-direction:column;gap:14px}.msg{max-width:82%;padding:11px 13px;border-radius:16px;line-height:1.45;white-space:pre-wrap;word-break:break-word}.user{align-self:flex-end;background:#2b5faa;color:#fff;border-bottom-right-radius:5px}.assistant{align-self:flex-start;background:#151d27;border:1px solid #253140;border-bottom-left-radius:5px}.meta{align-self:flex-start;width:min(82%,720px);background:#101720;border:1px solid #263241;border-radius:14px;padding:12px}.meta h3{font-size:.88rem;margin:0 0 7px}.meta p,.meta li{font-size:.85rem;color:#c5ced9}.meta ul{margin:6px 0 0 18px;padding:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:10px;padding:9px 12px;font:inherit;font-weight:700;cursor:pointer;background:#6ea8fe;color:#08111f}button.secondary{background:#222d3a;color:#e8edf4;border:1px solid #344253}button:disabled{opacity:.45;cursor:not-allowed}.composer{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,transparent,#0b0f14 20%);padding:28px 16px max(14px,env(safe-area-inset-bottom))}.composer-inner{max-width:900px;margin:auto;background:#121923;border:1px solid #2b3747;border-radius:18px;padding:10px}.row{display:flex;gap:8px;align-items:flex-end}textarea{flex:1;resize:none;min-height:46px;max-height:160px;border:0;outline:0;background:transparent;color:#fff;font:inherit;padding:10px}.send{min-width:72px}.status{font-size:.76rem;color:#8e9aaa;padding:0 10px 6px}.job{margin-top:8px;padding:10px;border-radius:10px;background:#0c131b;border:1px solid #263241;font-size:.84rem}.badge{display:inline-block;padding:2px 7px;border-radius:999px;background:#263241;font-size:.72rem;font-weight:700}.PASS{background:#185238}.RUNNING{background:#5b4812}.QUEUED{background:#314568}.BLOCKED,.FAIL{background:#6c3039}@media(max-width:700px){.msg,.meta{max-width:92%;width:auto}.top{padding-left:16px}.chat{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="title">LifeOS Assistant</div><div class="sub">Understands first. Improves the plan. Runs only what you approve.</div></div>
  <div id="chat" class="chat">
    <div class="msg assistant">What do you want to change or improve?</div>
  </div>
</div>
<div class="composer"><div class="composer-inner"><div id="status" class="status">Local assistant · engineering jobs run through Pi5 → Codex → Qwen</div><div class="row"><textarea id="input" rows="1" placeholder="Message LifeOS…"></textarea><button id="send" class="send">Send</button></div></div></div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input'),send=document.getElementById('send'),statusEl=document.getElementById('status');
let messages=[];let proposal='';let activeJob=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function addMsg(role,text){const d=document.createElement('div');d.className='msg '+role;d.textContent=text;chat.appendChild(d);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
async function api(path,opts){const r=await fetch(path,opts);const j=await r.json();if(!r.ok)throw new Error(j.error||j.detail||r.statusText);return j}
function addPlan(a){const d=document.createElement('div');d.className='meta';let html='';if(a.understanding)html+=`<h3>My understanding</h3><p>${esc(a.understanding)}</p>`;if(a.improvements&&a.improvements.length)html+=`<h3>Worth improving</h3><ul>${a.improvements.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;if(a.ready_to_run&&a.proposed_job){proposal=a.proposed_job;html+=`<div class="actions"><button onclick="runProposal()">Run this</button><button class="secondary" onclick="showBrief()">View job brief</button></div>`}d.innerHTML=html;chat.appendChild(d);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
async function sendMessage(){const text=input.value.trim();if(!text)return;input.value='';resize();addMsg('user',text);messages.push({role:'user',content:text});send.disabled=true;statusEl.textContent='Thinking locally…';try{const a=await api('/assist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});const reply=a.reply||a.clarifying_question||'I need a little more detail.';addMsg('assistant',reply);messages.push({role:'assistant',content:reply});addPlan(a);statusEl.textContent=a.ready_to_run?'Ready when you are.':'Local assistant · waiting for your reply';}catch(e){addMsg('assistant','I could not reach the local assistant: '+e.message);statusEl.textContent='Assistant unavailable';}finally{send.disabled=false;input.focus()}}
function showBrief(){if(!proposal)return;addMsg('assistant','Proposed engineering job:\n\n'+proposal)}
async function runProposal(){if(!proposal)return;statusEl.textContent='Submitting approved job…';try{const j=await api('/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request:proposal})});activeJob=j.id;addMsg('assistant','Job '+j.id+' is queued. I’ll track it here.');proposal='';pollJob();}catch(e){addMsg('assistant','I could not submit the job: '+e.message);statusEl.textContent='Submission failed'}}
async function pollJob(){if(!activeJob)return;try{const j=await api('/jobs/'+activeJob);statusEl.textContent=`Job ${j.id}: ${j.status}`;let old=document.getElementById('job-'+j.id);if(!old){old=document.createElement('div');old.id='job-'+j.id;old.className='meta job';chat.appendChild(old)}const last=(j.iterations||[]).slice(-1)[0];let reason=j.blocked_reason||last?.verification?.reason||'';old.innerHTML=`<span class="badge ${esc(j.status)}">${esc(j.status)}</span> <b>${esc(j.id)}</b><br>${(j.iterations||[]).length} iteration(s)${reason?`<br><span style="color:#aeb9c7">${esc(reason)}</span>`:''}`;if(['PASS','BLOCKED','FAIL'].includes(j.status)){addMsg('assistant',j.status==='PASS'?'Done — the job passed independent verification.':'The job stopped as '+j.status+'. '+(reason||''));activeJob=null;return}setTimeout(pollJob,5000)}catch(e){statusEl.textContent='Could not read job status';setTimeout(pollJob,7000)}}
function resize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px'}
input.addEventListener('input',resize);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});send.onclick=sendMessage;window.runProposal=runProposal;window.showBrief=showBrief;input.focus();
</script>
</body>
</html>
