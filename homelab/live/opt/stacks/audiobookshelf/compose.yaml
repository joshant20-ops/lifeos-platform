# Deployment candidate: activate only through the reviewed Pi control plane.
name: lifeos-audiobooks
services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf@sha256:b897c33f05972fb1bf484f7487bc878fa91ec8691335c1db6e2929c3a7658efa
    restart: unless-stopped
    environment:
      TZ: Europe/London
    ports:
      - "127.0.0.1:13378:80"
    volumes:
      - type: bind
        source: /opt/stacks/audiobookshelf/config
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: /opt/stacks/audiobookshelf/metadata
        target: /metadata
        bind:
          create_host_path: false
      - type: bind
        source: /opt/stacks/audiobookshelf/audiobooks
        target: /audiobooks
        bind:
          create_host_path: false
    networks:
      audiobooks_bootstrap:
        aliases:
          - lifeos-audiobooks
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  audiobooks_bootstrap:
    internal: true
