services:
  predbat:
    image: nipar44/predbat_addon:latest
    container_name: predbat
    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - /mnt/docker-data/predbat/config:/config:rw
      - /etc/localtime:/etc/localtime:ro

    ports:
      - "127.0.0.1:5052:5052"

    environment:
      - TZ=Europe/London
