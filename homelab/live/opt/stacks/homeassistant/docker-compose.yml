services:
  homeassistant:
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant@sha256:372d991e58882a1d8c68c07e9aa3f3b509276e695355f73ccdb03baa70407293
    restart: unless-stopped
    network_mode: host
    volumes:
      - /dev/serial/by-id:/dev/serial/by-id
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8123/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    environment:
      - TZ=Europe/London
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
