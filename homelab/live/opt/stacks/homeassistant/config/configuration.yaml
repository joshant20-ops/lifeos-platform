# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - 192.168.0.203
    - 172.16.0.0/12

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
homeassistant:
  packages: !include_dir_named packages


# Predbat recorder policy.
# Keeps the small history subset Predbat requires while avoiding
# high-volume Predbat attributes in the HA recorder.
recorder:
  exclude:
    domains:
      - predbat
      - predheat
    entities:
      - sensor.predbat_load_ml_forecast
      - sensor.predbat_pv_today
      - sensor.predbat_pv_tomorrow
      - sensor.predbat_pv_forecast_raw
      - sensor.predbat_pv_d2
      - sensor.predbat_pv_d3
      - sensor.predbat_temperature
      - sensor.predbat_pv_forecast_h0
  include:
    entities:
      - predbat.cost_today
      - predbat.cost_today_car
      - predbat.cost_yesterday_car
      - predbat.load_ml_stats
      - predbat.load_power
      - predbat.load_energy_actual
      - predbat.load_energy_predicted
      - predbat.load_energy_adjusted
      - predbat.load_inday_adjustment
      - predbat.ppkwh_today
      - predbat.ppkwh_hour
      - predbat.pv_power
      - predbat.rates
      - predbat.rates_export
      - predbat.soc_kw_h0
      - predbat.savings_yesterday_pvbat
      - predbat.status
      - predbat.savings_total_predbat
      - predbat.savings_total_pvbat
      - predheat.external_temperature
      - predheat.heating_energy
      - predheat.internal_temperature
      - predheat.target_temperature
command_line:
  - switch:
      name: Z97 Power
      unique_id: z97_power
      command_on: >-
        sh -c 'LOCK=/config/.z97_power_lock;
        if [ ! -e "$LOCK" ] || [ $(( $(date +%s) - $(cat "$LOCK" 2>/dev/null || echo 0) )) -ge 60 ];
        then date +%s > "$LOCK";
        /usr/local/bin/wakeonlan 40:8d:5c:84:41:64;
        fi'
      command_off: >-
        sh -c 'LOCK=/config/.z97_power_lock;
        if [ ! -e "$LOCK" ] || [ $(( $(date +%s) - $(cat "$LOCK" 2>/dev/null || echo 0) )) -ge 60 ];
        then date +%s > "$LOCK";
        /usr/bin/ssh -o BatchMode=yes -i /config/.ssh/z97_ed25519
        joshan@192.168.0.201 "sudo -n poweroff";
        fi'
      command_state: '/bin/ping -c 1 -W 1 192.168.0.201 >/dev/null 2>&1'
      scan_interval: 10

panel_custom:
  - name: lifeos-house-status-v28
    sidebar_title: House Status
    sidebar_icon: mdi:home-heart
    url_path: house-status
    module_url: /local/house-status/lifeos-house-status-v28.js?v=doorbell-shell-20261004-1
    require_admin: false
    config:
      mode: domestic
  - name: lifeos-house-status-dev
    sidebar_title: House Status Dev
    sidebar_icon: mdi:flask-outline
    url_path: house-status-dev
    module_url: /local/house-status-dev/lifeos-house-status-dev-loader.js?v=dev-loader-2
    require_admin: true
    config:
      mode: domestic
