command_line:
  - sensor:
      name: Power Docker Host State
      unique_id: power_docker_host_state
      command: "python3 -c 'import json;d=json.load(open(\"/config/www/lifeos/lifeos_missing_entity_fallbacks.json\"));print(d[\"fallbacks\"].get(\"sensor.power_docker_host_state\",{}).get(\"state\",\"unknown\"))'"
      scan_interval: 300

