command_line:
  - sensor:
      name: network_effective_visible_count
      unique_id: network_effective_visible_count
      command: >-
        python3 -c "import json; from pathlib import Path; print(json.loads(Path('/config/network_effective_observations.json').read_text())['visible_count'])"
      scan_interval: 60

  - sensor:
      name: network_effective_suppressed_count
      unique_id: network_effective_suppressed_count
      command: >-
        python3 -c "import json; from pathlib import Path; print(json.loads(Path('/config/network_effective_observations.json').read_text())['suppressed_count'])"
      scan_interval: 60
