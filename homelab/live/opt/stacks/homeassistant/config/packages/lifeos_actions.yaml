shell_command:
  lifeos_request_review_pending: "python3 /config/scripts/lifeos_action_request.py request_review_pending"
  lifeos_request_clear_quarantine: "python3 /config/scripts/lifeos_action_request.py request_clear_quarantine"
  lifeos_request_run_watchman_pipeline: "python3 /config/scripts/lifeos_action_request.py request_run_watchman_pipeline"

  lifeos_run_watchman_now: "python3 /config/scripts/lifeos_action_request.py request_run_watchman_pipeline"

  lifeos_pa_user_action: >-
    LIFEOS_PA_USER_STATE_PATH=/config/lifeos-pa-state/user_state.json
    python3 /config/scripts/lifeos_pa_user_action.py
    --action '{{ action | regex_replace('[^a-z_]', '') }}'
    --task-id '{{ task_id | regex_replace('[^a-z0-9-]', '') }}'
    --note '{{ note | urlencode }}'
    --until '{{ until | regex_replace('[^0-9-]', '') }}'
    --severity '{{ severity | lower | regex_replace('[^a-z]', '') }}'
    --due-date '{{ due_date | regex_replace('[^0-9-]', '') }}'
