    to: 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 0
  conditions: []
  actions:
  - type: turn_on
    device_id: 0858c0743e106a2b1b870ce3f4e3bc32
    entity_id: switch.front_door_active
    domain: switch
  mode: single
