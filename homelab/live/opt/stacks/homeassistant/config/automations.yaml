- id: media_sync_synology_stats
  alias: Media Sync - Update Synology stats
  description: ''
  triggers:
  - webhook_id: media_sync_synology_stats
    trigger: webhook
  conditions: []
  actions:
  - data:
      entity_id: input_number.synology_photo_files
      value: '{{ trigger.json.file_count | int(0) }}'
    action: input_number.set_value
  mode: restart
