
version: "3.9"

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
      - WEBUI_PORT=8080
    volumes:
      - /opt/stacks/qbittorrent/config:/config
      - /mnt/synology/LifeOS/Downloads/Complete:/downloads/complete
      - /mnt/synology/LifeOS/Downloads/Incomplete:/downloads/incomplete
      - /mnt/synology/LifeOS/Downloads/Linux_ISOs:/downloads/linux
      - /mnt/synology/LifeOS/Downloads/Public_Datasets:/downloads/data
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
