services:
  zwave-js-ui:
    image: zwavejs/zwave-js-ui@sha256:86f418050ce658cb6b9a5b17c33065b113376f9ccef98b36b3f2c42050b59672
    container_name: zwave-js-ui
    environment:
      NODE_ENV: production
      TAG_NAME: ""
    devices:
      - /dev/ttyACM0:/dev/zwave
    volumes:
      - /opt/stacks/zwave/store:/usr/src/app/store
    ports:
      - "8091:8091"
      - "3100:3000"
    restart: unless-stopped
    networks:
      - reverse_proxy

networks:
  reverse_proxy:
    external: true
