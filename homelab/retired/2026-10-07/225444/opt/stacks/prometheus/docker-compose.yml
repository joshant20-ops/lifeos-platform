services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
    - ./prometheus.yml:/etc/prometheus/prometheus.yml
    - ./alerts.yml:/etc/prometheus/alerts.yml
    - prometheus_data:/prometheus
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://127.0.0.1:9090/-/healthy
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
    - monitoring
    - reverse_proxy
  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node-exporter
    pid: host
    restart: unless-stopped
    networks:
    - monitoring
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://127.0.0.1:9100/metrics
      interval: 30s
      timeout: 5s
      retries: 3
    command:
    - --collector.textfile.directory=/textfile_collector
    volumes:
    - /home/joshan/automation/metrics:/textfile_collector:ro
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /:/rootfs:ro
    - /var/run:/var/run:rw
    - /sys:/sys:ro
    - /mnt/docker-data:/var/lib/docker:ro
    ports:
    - 8080:8080
    restart: unless-stopped
    networks:
    - monitoring
    - reverse_proxy
networks:
  monitoring:
    external: true
  reverse_proxy:
    external: true
volumes:
  prometheus_data: null
