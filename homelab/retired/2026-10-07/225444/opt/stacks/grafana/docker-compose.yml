services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
    - ./data:/var/lib/grafana
    environment:
    - GF_SECURITY_ADMIN_PASSWORD=biteme!
    - GF_SMTP_ENABLED=true
    - GF_SMTP_HOST=smtp.gmail.com:587
    - GF_SMTP_USER=joshant20@gmail.com
    - GF_SMTP_PASSWORD=ysyy cdzd vpyj vkoj
    - GF_SMTP_FROM_ADDRESS=joshant20@gmail.com
    - GF_SMTP_FROM_NAME=Homelab Alerts
    - GF_SMTP_SKIP_VERIFY=true
    restart: unless-stopped
    networks:
    - monitoring
    - reverse_proxy
    healthcheck:
      test:
      - CMD-SHELL
      - wget --spider -q http://127.0.0.1:3000/api/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  monitoring:
    external: true
  reverse_proxy:
    external: true
