[Service]
# Canonical Tower local-AI runtime policy.
# GPU acceleration is a service property; callers provide no per-request GPU flags.
Environment="CUDA_VISIBLE_DEVICES=0"
# Disable the unwanted Vulkan fallback path; use NVIDIA CUDA for local inference.
Environment="OLLAMA_VULKAN=0"
# LifeOS Pi/Engineer must be able to use the Tower worker over the LAN.
Environment="OLLAMA_HOST=0.0.0.0:11434"
# Keep the local model warm for repeated household/engineering requests.
Environment="OLLAMA_KEEP_ALIVE=30m"
